var CC_CSS = `
:root {
  --p900: #0D0520;
  --p800: #1A0A3C;
  --p700: #2D1160;
  --p600: #4A1C7A;
  --p500: #6B2FA0;
  --p400: #9B59B6;
  --p200: #D4B8F0;
  --p100: #EDE6FA;
  --p50:  #F8F4FE;
  --gold: #C8A84B;
  --goldl: #F5EDD0;
  --teal: #0B6E56;
  --tealb: #E6F5F1;
  --white: #FFFFFF;
  --gl: #DDD5EE;
  --tm: #3D2568;
  --tl: #7A6898;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--p900);
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
}

.page {
  width: 820px;
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 32px 80px rgba(0,0,0,0.5);
}

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, var(--p900) 0%, var(--p700) 60%, var(--p600) 100%);
  padding: 32px 40px 28px;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 240px; height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(155,89,182,0.25) 0%, transparent 70%);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.logo-area {
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo-img {
  width: 64px;
  height: 64px;
  object-fit: contain;
  border-radius: 8px;
}
.company-info {}
.company-name {
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--white);
  letter-spacing: 0.05em;
  line-height: 1;
  margin-bottom: 4px;
}
.company-cnpj {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.08em;
}
.doc-badge {
  text-align: right;
}
.doc-label {
  font-family: 'Syne', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 4px;
}
.doc-title {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--white);
  letter-spacing: -0.01em;
}
.doc-period {
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  margin-top: 2px;
}

.header-divider {
  height: 1px;
  background: rgba(255,255,255,0.1);
  margin-bottom: 20px;
}

.employee-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 24px;
}
.emp-field {}
.emp-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 4px;
}
.emp-value {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--white);
}
.emp-value.mono {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.05em;
}

/* ── PROMOTION BANNER ── */
.promotion-banner {
  background: linear-gradient(135deg, #7A5C00, var(--gold), #C8A84B);
  padding: 14px 40px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.promo-icon { font-size: 20px; }
.promo-text {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--p900);
}
.promo-levels {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.promo-from {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: rgba(13,5,32,0.55);
  text-decoration: line-through;
}
.promo-arrow { font-size: 16px; color: var(--p900); }
.promo-to {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 800;
  color: var(--p900);
  background: rgba(255,255,255,0.35);
  padding: 3px 12px;
  border-radius: 99px;
}

/* ── BODY ── */
.body { padding: 32px 40px; background: var(--p50); }

/* ── SECTION TITLE ── */
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--tl);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--gl);
}

/* ── TABLE ── */
.pay-table {
  width: 100%;
  border-collapse: collapse;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 16px rgba(13,5,32,0.07);
  margin-bottom: 24px;
  background: var(--white);
}
.pay-table thead tr {
  background: var(--p800);
}
.pay-table thead th {
  font-family: 'Syne', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  padding: 10px 16px;
  text-align: left;
}
.pay-table thead th:last-child { text-align: right; }
.pay-table tbody tr { border-top: 1px solid var(--gl); }
.pay-table tbody tr:nth-child(even) { background: var(--p50); }
.pay-table tbody td {
  padding: 13px 16px;
  font-size: 13px;
  color: var(--tm);
  vertical-align: middle;
}
.pay-table tbody td:last-child {
  text-align: right;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: var(--p700);
}
.td-label { font-weight: 500; }
.td-detail {
  font-size: 11px;
  color: var(--tl);
  margin-top: 2px;
}
.td-zero { color: var(--tl) !important; }
.td-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 99px;
  margin-left: 8px;
}
.badge-sdr { background: var(--p100); color: var(--p600); }
.badge-ss  { background: var(--tealb); color: var(--teal); }

/* ── SUBTOTAL ROWS ── */
.subtotal-row td {
  background: var(--p100) !important;
  font-family: 'Syne', sans-serif !important;
  font-size: 11px !important;
  font-weight: 700 !important;
  letter-spacing: 0.06em;
  color: var(--p700) !important;
  padding: 10px 16px !important;
}
.subtotal-row td:last-child {
  color: var(--p700) !important;
}

/* ── TOTAL BLOCK ── */
.total-block {
  background: linear-gradient(135deg, var(--p800), var(--p700));
  border-radius: 12px;
  padding: 24px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.total-left {}
.total-label {
  font-family: 'Syne', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  margin-bottom: 6px;
}
.total-breakdown {
  font-size: 12px;
  color: rgba(255,255,255,0.55);
}
.total-breakdown span { color: rgba(255,255,255,0.8); font-weight: 600; }
.total-right {
  text-align: right;
}
.total-value {
  font-family: 'Syne', sans-serif;
  font-size: 36px;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: -0.02em;
  line-height: 1;

function numeroExtenso(val){
  var n = Math.round(val);
  var unidades = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove',
    'dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  var dezenas = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  var centenas = ['','cem','duzentos','trezentos','quatrocentos','quinhentos',
    'seiscentos','setecentos','oitocentos','novecentos'];
  if(n===0) return 'zero reais';
  function grupo(x){
    var s='';
    if(x>=100){ s+=centenas[Math.floor(x/100)]; x=x%100; if(x>0) s+=' e '; }
    if(x>=20){ s+=dezenas[Math.floor(x/10)]; x=x%10; if(x>0) s+=' e '; }
    if(x>0){ s+=unidades[x]; }
    return s;
  }
  var partes=[];
  if(n>=1000){ partes.push(grupo(Math.floor(n/1000))+(Math.floor(n/1000)===1?' mil':' mil')); n=n%1000; }
  if(n>0) partes.push(grupo(n));
  return partes.join(' e ')+' reais';
}

function fmt(v){ return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

async function gerarContracheque(modo){
  // modo = 'closer' (Gustavo) ou 'sdr' (João)
  var sel = document.getElementById('closer-auto-gestor-month') || document.getElementById('sdr-auto-gestor-month');
  var month = sel ? sel.value : getCurrentPeriod();
  var mn = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var parts = month.split('/');
  var mesLabel = mn[parseInt(parts[0])-1]+' / '+parts[1];

  var r;
  try{
    if(modo==='closer'){
      r = await calcCloserFromSheets(_careerLevels.gustavo||0, month);
    } else {
      r = await calcSDRFromSheets(_careerLevels.joao||0, month);
    }
  }catch(e){
    alert('Erro ao calcular salário: '+e.message); return;
  }
  if(r.error){ alert('Erro: '+r.error); return; }

  var html;
  if(modo==='closer'){
    var lv = CLOSER_LEVELS[_careerLevels.gustavo||0];
    var lvNome = lv ? 'Closer '+lv.tier+' '+lv.n : 'Closer';
    html = buildCCCloser(r, mesLabel, lvNome);
  } else {
    var lv2 = SDR_LEVELS[_careerLevels.joao||0];
    var lvNome2 = lv2 ? 'SDR '+lv2.tier+' '+lv2.n : 'SDR';
    html = buildCCSDR(r, mesLabel, lvNome2);
  }

  // Criar blob URL para evitar bloqueio de popup
  var blob = new Blob([html], {type:'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var win = window.open(url, '_blank');
  if(!win){
    // Fallback: download como arquivo
    var a = document.createElement('a');
    a.href = url;
    a.download = 'contracheque-'+(modo==='closer'?'gustavo':'joao')+'-'+month.replace('/','.')+'.html';
    a.click();
  }
}

function renderCalendario(){

  var monthNames=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var firstDow=new Date(y,mo,1).getDay(),daysInMonth=new Date(y,mo+1,0).getDate(),today=now.getDate();
  var mm=String(mo+1).padStart(2,'0');
  var callsByDay={};
  Object.values(calls).forEach(function(c){
    if(!c.data)return;var p=c.data.split('/');
    if(p[1]===mm&&p[2]===String(y))callsByDay[parseInt(p[0])]=(callsByDay[parseInt(p[0])]||0)+1;
  });
  var days='';
  for(var i=0;i<firstDow;i++)days+='<div class="cal-day empty"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var dateObj=new Date(y,mo,d),dow=dateObj.getDay();
    var dds=String(d).padStart(2,'0'),hol=hols[mm+'-'+dds];
    var cls='cal-day';

    else if(hol)cls+=' holiday';
    else if(callsByDay[d])cls+=' has-calls';
    else cls+=' workday';
    if(d===today)cls+=' today-mark';
    days+='<div class="'+cls+'">'+d+(callsByDay[d]?'<div style="width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0.7;"></div>':'')+'</div>';
  }
  return '<div class="page active">'+
  '<div class="page-header"><div><div class="page-title">Calendario</div><div class="page-sub">'+monthNames[mo]+' '+y+'</div></div><div class="date-chip"><i class="ti ti-calendar"></i>'+todayStr()+'</div></div>'+
  '<div class="cb"><div style="padding:20px;">'+
    '<div class="cal-grid">'+['Dom','Seg','Ter','Qua','Qui','Sex','Sab'].map(function(d){return'<div class="cal-head">'+d+'</div>';}).join('')+days+'</div>'+

      '<span><span style="display:inline-block;width:10px;height:10px;background:var(--pglow2);border-radius:2px;margin-right:4px;"></span>Dia util</span>'+
      '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(34,197,94,0.1);border-radius:2px;margin-right:4px;"></span>Com ligacoes</span>'+

// ===== TAREFAS DO DIA (TO-DO LIST) — v2 =====

// Convert pt-BR date string dd/mm/yyyy to comparable string yyyymmdd
function dateToSort(d){
  if(!d) return '';
  var p=d.split('/');
  if(p.length!==3) return d;
  return p[2]+p[1]+p[0];
}

// Get next occurrence date (dd/mm/yyyy) of a recurring task
// If fromDateStr itself is one of the days, returns fromDateStr (today is valid)
function nextRecurrenceAfter(diasSemana, fromDateStr){
  var parts = fromDateStr.split('/');
  var base = new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0]));
  // Check if today itself qualifies
  if(diasSemana.indexOf(base.getDay())!==-1){
    return fromDateStr;
  }
  for(var i=1;i<=14;i++){
    var next = new Date(base);
    next.setDate(base.getDate()+i);
    if(diasSemana.indexOf(next.getDay())!==-1){
      return next.toLocaleDateString('pt-BR');
    }
  }
  return null;
}

// Get all tasks visible for current user today or overdue (and scheduled future ones filtered out)
function getTarefasVisiveis(){
  var hoje = _tarefasData || todayStr();
  var hojeSort = dateToSort(hoje);
  var all = JSON.parse(localStorage.getItem('tarefas_dia')||'[]');
  var userName = CU ? CU.name : '';
  return all.filter(function(t){
    var isMineTarefa = t.atribuido === userName || (!t.atribuido && t.criador === userName) || (CU && CU.role==='gestor' && !t.atribuido);
    if(!isMineTarefa) return false;
    if(t.done) return t.doneDate === hoje;
    if(t.recorrente && t.proximaData){
      return dateToSort(t.proximaData) <= hojeSort;
    }
    return !t.date || dateToSort(t.date) <= hojeSort;
  });
}
function navTarefasData(delta){
  var ref = _tarefasData || todayStr();
  var p = ref.split('/');
  var d = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
  d.setDate(d.getDate()+delta);
  _tarefasData = d.toLocaleDateString('pt-BR');
  showPage('tarefas-dia');
}
function resetTarefasData(){
  _tarefasData = null;
  showPage('tarefas-dia');
}

// For gestor: get all tasks they created assigned to others (to monitor)
function getTarefasAtribuidas(){
  var all = JSON.parse(localStorage.getItem('tarefas_dia')||'[]');
  var userName = CU ? CU.name : '';
  return all.filter(function(t){ return t.criador===userName && t.atribuido && t.atribuido!==userName; });
}

function urgenciaCor(u){
  if(u==='critico') return 'rgba(239,68,68,0.5)';
  if(u==='urgente') return 'rgba(245,158,11,0.45)';
  return 'rgba(138,43,226,0.25)';
}
function urgenciaBadge(u){
  if(u==='critico') return '<span class="badge b-red" style="font-size:10px;">🔴 Crítico</span>';
  if(u==='urgente') return '<span class="badge b-amber" style="font-size:10px;">🟡 Urgente</span>';
  return '<span class="badge b-muted" style="font-size:10px;">Normal</span>';
}
function diasSemanaLabel(dias){
  var nomes=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return dias.map(function(d){return nomes[d];}).join(', ');
}

function renderTarefasDia(){
  var hoje = todayStr();
  var visiveis = getTarefasVisiveis();
  var pendentes = visiveis.filter(function(t){return !t.done;});
  var concluidasHoje = visiveis.filter(function(t){return t.done;});

  // Sort pendentes: critico first, then urgente, then normal; overdue first within group
  var urgOrder = {critico:0, urgente:1, normal:2};
  pendentes.sort(function(a,b){
    var ua = urgOrder[a.urgencia||'normal']||2, ub = urgOrder[b.urgencia||'normal']||2;
    if(ua!==ub) return ua-ub;
    return dateToSort(a.date||a.proximaData||hoje) < dateToSort(b.date||b.proximaData||hoje) ? -1 : 1;
  });

  var listHtml = '';
  if(pendentes.length===0 && concluidasHoje.length===0){
    listHtml = '<div class="empty-st"><i class="ti ti-checkbox"></i><p>Nenhuma tarefa para hoje</p></div>';
  }

  pendentes.forEach(function(t){
    var dataRef = t.recorrente ? t.proximaData : t.date;
    var atrasada = dataRef && dateToSort(dataRef) < dateToSort(hoje);
    var bordaCor = urgenciaCor(t.urgencia||'normal');
    var recTag = t.recorrente ? '<span class="badge b-cyan" style="font-size:10px;"><i class="ti ti-repeat"></i> '+diasSemanaLabel(t.diasSemana||[])+'</span>' : '';

    var dataTag = atrasada ? '<span style="font-size:11px;color:var(--red);">Atrasada · '+dataRef+'</span>' :

    listHtml += '<div style="display:flex;align-items:flex-start;gap:12px;padding:13px 16px;background:var(--bg2);border:1px solid '+bordaCor+';border-radius:10px;margin-bottom:8px;">'+

    concluidasHoje.forEach(function(t){
      listHtml += '<div style="display:flex;align-items:center;gap:12px;padding:10px 16px;opacity:0.45;text-decoration:line-through;font-size:13px;color:var(--muted);">'+

    });
    listHtml += '</div>';
  }

    if(atrib.length>0){

function toggleRecorrente(){

function isoToBR(isoDate){
  if(!isoDate) return todayStr();
  var p = isoDate.split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}

// ---- Firebase helpers for tarefas ----
function saveTarefaFB(tarefa){
  try{ if(fbDb) fbDb.ref('tarefas_dia/'+tarefa.id).set(tarefa); }
  catch(e){ console.error('saveTarefaFB',e); }
}
function deleteTarefaFB(id){
  try{ if(fbDb) fbDb.ref('tarefas_dia/'+id).remove(); }
  catch(e){ console.error('deleteTarefaFB',e); }
}
function getTarefasLocal(){
  return JSON.parse(localStorage.getItem('tarefas_dia')||'[]');
}

var _addTarefaBusy = false;
function addTarefa(){
  if(_addTarefaBusy) return;
  _addTarefaBusy = true;
  setTimeout(function(){ _addTarefaBusy = false; }, 800);
  var txt = document.getElementById('nova-tarefa-txt');
  if(!txt||!txt.value.trim()) return;
  var recChk = document.getElementById('nt-recorrente');
  var recorrente = recChk && recChk.checked;
  var urgEl = document.getElementById('nt-urgencia');
  var urgencia = urgEl ? urgEl.value : 'normal';
  var atribEl = document.getElementById('nt-atribuido');
  var atribuido = atribEl && atribEl.value ? atribEl.value : (CU?CU.name:'');

  var diasSemana = [];
  if(recorrente){
    for(var i=0;i<7;i++){
      var b = document.getElementById('dia-btn-'+i);
      if(b && b.getAttribute('data-ativo')==='1') diasSemana.push(i);
    }
    if(diasSemana.length===0){ alert('Selecione pelo menos um dia da semana.'); return; }
  }

  var dataISO = document.getElementById('nt-data') ? document.getElementById('nt-data').value : '';
  var dataBR = isoToBR(dataISO);

  var nova = {
    id: 't_'+Date.now(),
    texto: txt.value.trim(),
    urgencia: urgencia,
    criador: CU ? CU.name : '',
    atribuido: atribuido,
    done: false,
    doneDate: null,
    recorrente: recorrente,
    diasSemana: recorrente ? diasSemana : [],
    date: recorrente ? null : dataBR,
    proximaData: recorrente ? nextRecurrenceAfter(diasSemana, todayStr()) || todayStr() : null
  };

  // Optimistic local update — Firebase listener will re-render
  var tarefas = getTarefasLocal();
  tarefas.push(nova);
  localStorage.setItem('tarefas_dia', JSON.stringify(tarefas));
  txt.value='';
  showPage('tarefas-dia'); // render immediately
  saveTarefaFB(nova); // then sync to Firebase (listener will NOT re-render since local already matches)
}

function concluirTarefa(id){
  var tarefas = getTarefasLocal();
  tarefas = tarefas.map(function(t){
    if(t.id===id){
      if(t.recorrente){
        t.ultimaConclusao = todayStr();
        t.proximaData = nextRecurrenceAfter(t.diasSemana||[], todayStr()) || todayStr();
      } else {
        t.done = true;
        t.doneDate = todayStr();
      }
      saveTarefaFB(t);
    }
    return t;
  });
  localStorage.setItem('tarefas_dia', JSON.stringify(tarefas));
  showPage('tarefas-dia');
}

function excluirTarefa(id){
  deleteTarefaFB(id);
  var tarefas = getTarefasLocal().filter(function(t){return t.id!==id;});
  localStorage.setItem('tarefas_dia', JSON.stringify(tarefas));
  showPage('tarefas-dia');
}

async function registrarReuniaoSDR(){

  var tel=document.getElementById('sdr-reg-tel').value.trim();

  function fmtDate(iso){

async function criarReuniaoGeral(){

  var closer = document.getElementById('rm-closer').value;

  function fmtDate(iso){if(!iso)return'';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}

async function criarReuniaoCalendario(){

  // Then create Google Meet

    meetings[meeting.id].gcalEventId=result.eventId;meetings[meeting.id].meetLink=result.meetLink;
    saveAll();saveMeetingFB(meeting.id,meetings[meeting.id]);

async function loadReunioesSheet(){
  var el = document.getElementById('reunioes-sheet-view');
  if(!el) return;
  el.innerHTML = '<div style="padding:20px;color:var(--muted);">Carregando...</div>';
  try{
    var rows = await fetchSheetVals(SHEETS_IDS.reunioes, SHEETS_GIDS.reunioes);
    if(!rows||rows.length<2){el.innerHTML='<div style="padding:20px;color:var(--muted);">Sem dados</div>';return;}
    var h = rows[0].map(function(x){return(x||'').trim();});

    // Filtros
    var filterMonth = (document.getElementById('reun-filter-month')||{}).value||'';
    var filterStart = (document.getElementById('reun-filter-start')||{}).value||'';
    var filterEnd = (document.getElementById('reun-filter-end')||{}).value||'';
    var startDt = filterStart ? new Date(filterStart+'T00:00:00') : null;
    var endDt = filterEnd ? new Date(filterEnd+'T23:59:59') : null;

    // Encontrar coluna de data (DATA DE AGENDAMENTO = col 0)
    var dateColIdx = 0;

    var dataRows = rows.slice(1).filter(function(r){
      if(!r.some(function(c){return c;})) return false;
      var dateStr = (r[dateColIdx]||'').trim();
      if(!dateStr) return true; // sem data, não filtrar
      var d = parseBRDate(dateStr);
      if(!d) return true;
      if(filterMonth && periodStr(d)!==filterMonth) return false;
      if(startDt && d<startDt) return false;
      if(endDt && d>endDt) return false;
      return true;
    });

    var trs = dataRows.map(function(row){
      var st=(row[4]||'').toUpperCase();
      var cor2=st==='REALIZADA'?'var(--green)':st.includes('NO')&&st.includes('SHOW')?'var(--red)':'var(--amber)';
      return '<tr>'+row.slice(0,8).map(function(c,i){
        if(i===4) return '<td><span style="padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:'+cor2+'22;color:'+cor2+';">'+(c||'—')+'</span></td>';
        return '<td style="font-size:12px;">'+(c||'—')+'</td>';
      }).join('')+'</tr>';
    }).join('');

    var countBadge = '<div style="padding:10px 16px;font-family:Barlow Condensed,sans-serif;font-size:12px;color:var(--muted);">'+dataRows.length+' reuniões encontradas</div>';
    el.innerHTML=countBadge+'<div style="overflow-x:auto;"><table><thead><tr>'+h.slice(0,8).map(function(x){return'<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+trs+'</tbody></table></div>';
  }catch(e){el.innerHTML='<div style="padding:20px;color:var(--red);">Erro: '+e.message+'</div>';}
}



function trocarSenha(email){
  var fieldId = 'pw-'+email.replace('@','_').replace('.','_');
  var el = document.getElementById(fieldId);
  if(!el||!el.value.trim()){showSheetToast('Digite a nova senha',true);return;}
  var nova = el.value.trim();
  if(nova.length < 6){showSheetToast('Senha precisa ter ao menos 6 caracteres',true);return;}
  if(!USERS[email]){showSheetToast('Usuário não encontrado',true);return;}
  USERS[email].pw = nova;
  // Save to Firebase so it persists across devices
  if(fbDb){
    fbDb.ref('userPasswords/'+email.replace(/[.#$[\]]/g,'_')).set(nova).then(function(){
      showSheetToast('Senha de '+USERS[email].name+' alterada com sucesso!',false);
      el.value='';
    }).catch(function(e){showSheetToast('Erro ao salvar: '+e.message,true);});
  } else {
    showSheetToast('Senha alterada localmente (Firebase offline)',false);
    el.value='';
  }
}

// Load passwords from Firebase on init
async function loadUserPasswords(){
  if(!fbDb) return;
  try{
    var data = await fbGet('userPasswords');
    if(data){
      Object.keys(data).forEach(function(key){
        // Convert back from Firebase key to email
        var email = key.replace(/_/g,function(m,o,s){
          // Try to match emails in USERS
          var match = Object.keys(USERS).find(function(e){
            return e.replace(/[.#$[\]@]/g,'_')===key || e.replace('@','_').replace('.','_')===key;
          });
          return match ? '' : '.';
        });
        // Simpler approach: match by finding the email
        var matchedEmail = Object.keys(USERS).find(function(e){
          return e.replace(/[.@]/g,'_')===key || e.replace('@','_').replace(/\./g,'_')===key;
        });
        if(matchedEmail) USERS[matchedEmail].pw = data[key];
      });
    }
  }catch(e){console.error('loadUserPasswords error',e);}
}

var _careerLevels = {gustavo: 0, joao: 0}; // index into CLOSER_LEVELS / SDR_LEVELS
var _sheetDataCache = {}; // cache fetched sheet data

// Load career levels from Firebase
async function loadCareerLevels(){
  if(!fbDb) initFirebase();
  if(!fbDb){console.warn('Firebase not ready for loadCareerLevels');return;}
  try{
    var data = await fbGet('careerLevels');
    if(data){
      _careerLevels.gustavo = data.gustavo || 0;
      _careerLevels.joao = data.joao || 0;
    }
  }catch(e){console.error('loadCareerLevels error',e);}
}

// Save career level (Lucas only)
async function saveCareerLevel(person, idx){
  try{
    await fbDb.ref('careerLevels/'+person).set(idx);
    _careerLevels[person] = idx;
    showSheetToast('Nível de '+person+' atualizado!', false);
  }catch(e){
    showSheetToast('Erro ao salvar nível: '+e.message, true);
  }
}

// Get current month string YYYY-MM
function currentMonthStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

// Parse Brazilian date formats: DD/MM/YYYY, DD/mmm./YY, etc.
// parseBRDate duplicate removed

function dateToMonthStr(d){
  if(!d) return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

// Fetch sheet data with cache
async function fetchSheetCached(sheetId, gid, cacheKey){
  if(_sheetDataCache[cacheKey]) return _sheetDataCache[cacheKey];
  var rows = await fetchSheetVals(sheetId, gid);
  _sheetDataCache[cacheKey] = rows;
  return rows;
}

// ===== CALCULATE CLOSER SALARY (GUSTAVO) =====
async function calcCloserFromSheets(nivelIdx, month){
  var lv = CLOSER_LEVELS[nivelIdx];
  var result = {base: lv.base, minG: lv.minG, reunioes: 0, incentivReun: 0,
    contratos: 0, tipoContrato: 'Mensal', bonusMeta: 0, comissaoUnit: 0,
    comissaoContratos: 0, comissaoVendas25: 0, valorVendido: 0, total: 0,
    loading: false, error: null};
  try{
    // Load reunioes sheet
    var reunRows = await fetchSheetCached(SHEETS_IDS.reunioes, SHEETS_GIDS.reunioes, 'reunioes');
    // Load clientes sheet
    var cliRows = await fetchSheetCached(SHEETS_IDS.clientes, SHEETS_GIDS.clientes, 'clientes');

    if(reunRows && reunRows.length > 1){
      var rh = reunRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      // Reunioes cols: DATA_AG=0, CLIENTE=1, TEL=2, DATA_REAL=3, STATUS=4, SDR=5, CLOSER=6, ORIGEM=7
      var iStatus = rh.findIndex(function(h){return h.includes('STATUS');});
      var iCloser = rh.findIndex(function(h){return h==='CLOSER'||h.includes('CLOSER');});
      var iData = rh.findIndex(function(h){return h.includes('DATA')&&h.includes('AGEND');});
      var iDataReal = rh.findIndex(function(h){return h.includes('DATA')&&(h.includes('REAL')||h.includes('SERA'));});

      reunRows.slice(1).forEach(function(row){
        var closer = (row[iCloser]||'').trim().toUpperCase();
        var status = (row[iStatus]||'').trim().toUpperCase();
        // Use data real ou data agendamento para filtrar por mês
        var dateStr = row[iDataReal]||row[iData]||'';
        var dt = parseBRDate(dateStr);
        var rowMonth = dateToMonthStr(dt);
        if(!rowMonth) return;
        var closerNorm = normCloserName(closer);
        if(closerNorm==='Gustavo' && status==='REALIZADA' && rowMonth===month){
          result.reunioes++;
        }
      });
    }
    result.incentivReun = result.reunioes * 30;

    if(cliRows && cliRows.length > 1){
      var ch = cliRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      // Clientes cols: DATA_INICIO=0, CLIENTE=1, VALOR_MES=2, GESTOR=3, DATA_CANCEL=4, MOTIVO=5,
      //   PLANO=6, ORIGEM=7, CLOSER=8, SDR=9, VALOR_VENDIDO=10, COMISSAO_CLOSER=11
      var iData2 = ch.findIndex(function(h){return h.includes('DATA')&&h.includes('IN');});
      var iCloser2 = ch.findIndex(function(h){return h==='CLOSER'||h.includes('CLOSER');});
      var iPlano = ch.findIndex(function(h){return h.includes('PLANO');});
      var iValorV = ch.findIndex(function(h){return h.includes('VALOR')&&h.includes('VENDIDO');});

      cliRows.slice(1).forEach(function(row){
        var closer2 = (row[iCloser2]||'').trim().toUpperCase();
        var dateStr2 = row[iData2]||'';
        var dt2 = parseBRDate(dateStr2);
        var rowMonth2 = dateToMonthStr(dt2);
        if(!rowMonth2) return;
        var closerNorm2 = normCloserName(closer2);
        if(closerNorm2==='Gustavo' && rowMonth2===month){
          result.contratos++;
          var plano = (row[iPlano]||'').toUpperCase();
          if(plano.includes('TRIMESTRAL')) result.tipoContrato='Trimestral';
          else if(plano.includes('SEMESTRAL')) result.tipoContrato='Semestral';
          else result.tipoContrato='Mensal';
          // Valor vendido
          var vStr = (row[iValorV]||'').replace(/R\$\s*/,'').replace(/\./g,'').replace(',','.').trim();
          var v = parseFloat(vStr)||0;
          result.valorVendido += v;
        }
      });
    }

    // Calculate bonus meta and commission
    // Commission rules per plano de carreira:
    // - Bonus meta: only if contratos >= meta
    // - Commission: fixed R$ per contract, ONLY on contracts ABOVE the meta (threshold = meta+1)
    // - R$30 per REALIZED meeting (reuniao comparecida)
    // - NO % of valor vendido (that's SDR rule, not Closer)
    var meta = lv.meta;
    result.bonusMeta = result.contratos >= meta ? lv.bonusMeta : 0;
    // Comissao only activates after beating meta - applies to contracts above meta
    var acima = Math.max(0, result.contratos - meta);
    // Use most common plano type for commission unit
    var commUnit = result.tipoContrato==='Trimestral'?lv.commTrim:(result.tipoContrato==='Semestral'?lv.commSem:lv.commMens);
    result.comissaoUnit = commUnit;
    result.comissaoContratos = (result.contratos >= meta && acima > 0) ? acima * commUnit : 0;

    // Cold Call: R$30/reunião realizada (SDR=Gustavo, ORIGEM=Cold Call) + 25% MRR vendas cold call
    var mrrColdCall=0, reunColdCall=0;
    if(reunRows && reunRows.length>1){
      var rh2=reunRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      var riSDR=rh2.findIndex(function(h){return h.includes('SDR')||h.includes('BDR');});
      var riOri=rh2.findIndex(function(h){return h.includes('ORIGEM');});
      var riSt=rh2.findIndex(function(h){return h.includes('STATUS');});
      var riDt=rh2.findIndex(function(h){return(h.includes('DATA')&&(h.includes('REAL')||h.includes('SERA')))||h.includes('DATA QUE');});
      if(riDt<0) riDt=rh2.findIndex(function(h){return h.includes('DATA')&&h.includes('AGEND');});
      reunRows.slice(1).forEach(function(row){
        var sdrR=(riSDR>=0?row[riSDR]||'':'').trim();
        var oriR=(riOri>=0?row[riOri]||'':'').toLowerCase();
        var stR=(riSt>=0?row[riSt]||'':'').toUpperCase();
        var dtR=riDt>=0?row[riDt]||'':'';
        var monthR=dtR?dateToMonthStr(parseBRDate(dtR)):'';
        if(normCloserName(sdrR)==='Gustavo' && oriR.includes('cold') && isRealizada(stR) && monthR===month){
          reunColdCall++;
        }
      });
    }
    if(cliRows && cliRows.length>1){
      // Reuse headers already parsed above
      var ciSDR2=ch.findIndex(function(h){return h==='SDR'||h==='BDR'||h==='SDR/BDR'||h.includes('SDR');});
      var ciOri2=ch.findIndex(function(h){return h==='ORIGEM'||h.includes('ORIGEM');});
      // Use VALOR VENDIDO DO CONTRATO for cold call commission (25% of total contract value)
      var ciValorVendido=ch.findIndex(function(h){return h.includes('VALOR')&&h.includes('VENDIDO');});
      cliRows.slice(1).forEach(function(row){
        var sdrC=(ciSDR2>=0?row[ciSDR2]||'':'').trim();
        var oriC=(ciOri2>=0?row[ciOri2]||'':'').toLowerCase();
        var dateStr3=row[iData2]||'';
        var dt3=parseBRDate(dateStr3);
        var monthC=dateToMonthStr(dt3);
        if(normCloserName(sdrC)==='Gustavo' && (oriC.includes('cold')||oriC.includes('call')) && monthC===month){
          // 25% do MRR mensal (VALOR CONTRATO/MÊS — só o primeiro mês)
          var mrrMensal=parseMoney(row[2]||''); // coluna VALOR CONTRATO/MÊS = col 2
          if(!mrrMensal && ciValorVendido>=0) mrrMensal=parseMoney(row[ciValorVendido]||'');
          mrrColdCall+=mrrMensal;
        }
      });
    }
    result.mrrColdCall=mrrColdCall;
    result.reunColdCall=reunColdCall;
    result.comissaoColdCall=Math.round(mrrColdCall*0.25);
    result.incentivColdCall=reunColdCall*30;

    var totalBruto = result.base + result.bonusMeta + result.comissaoContratos + result.incentivReun + result.comissaoColdCall + result.incentivColdCall;
    result.total = Math.max(totalBruto, result.minG);
    result.totalBruto = totalBruto;

  }catch(e){
    result.error = e.message;
  }
  return result;
}

// ===== CALCULATE SDR SALARY (JOÃO) =====
async function calcSDRFromSheets(nivelIdx, month){
  var lv = SDR_LEVELS[nivelIdx];
  var result = {base: lv.base, minG: lv.minG,
    agendamentos: 0, bonusMeta: 0, acelerador: 0,
    reunioesComp: 0, incentivReun: 0,
    vendas: 0, comissaoVendas: 0,
    ssReun: 0, ssIncentiv: 0, ssVendas: 0, ssComm: 0, ssTotal: 0,
    total: 0, totalSDR: 0, grandTotal: 0, error: null};
  try{
    var reunRows = await fetchSheetCached(SHEETS_IDS.reunioes, SHEETS_GIDS.reunioes, 'reunioes');
    var cliRows = await fetchSheetCached(SHEETS_IDS.clientes, SHEETS_GIDS.clientes, 'clientes');

    if(reunRows && reunRows.length > 1){
      var rh = reunRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      var iStatus = rh.findIndex(function(h){return h.includes('STATUS');});
      var iSDR = rh.findIndex(function(h){return h.includes('SDR')||h.includes('BDR');});
      var iData = rh.findIndex(function(h){return h.includes('DATA')&&h.includes('AGEND');});
      var iDataReal = rh.findIndex(function(h){return h.includes('DATA')&&(h.includes('REAL')||h.includes('SERA'));});
      var iOrigem = rh.findIndex(function(h){return h.includes('ORIGEM');});

      reunRows.slice(1).forEach(function(row){
        var sdr = (row[iSDR]||'').trim().toUpperCase();
        var status = (row[iStatus]||'').trim().toUpperCase();
        var origem = (row[iOrigem]||'').trim().toUpperCase();
        var dateStr = row[iData]||'';
        var dt = parseBRDate(dateStr);
        var rowMonth = dateToMonthStr(dt);
        var dateRealStr = row[iDataReal]||'';
        var dtReal = parseBRDate(dateRealStr);
        var rowMonthReal = dateToMonthStr(dtReal)||rowMonth;
        if(!rowMonth) return;
        if(!sdr.includes('JOÃO')&&!sdr.includes('JOAO')) return;

        var isSS = origem.includes('SOCIAL');

        if(rowMonth === month){
          // Agendamentos (todos, incluindo SS)
          if(!isSS) result.agendamentos++;
          // SS agendamentos (para reuniões comparecidas SS)
          if(isSS && status==='REALIZADA' && rowMonthReal===month) result.ssReun++;
        }
        // Reuniões realizadas no mês real
        if(rowMonthReal === month && status==='REALIZADA'){
          if(!isSS) result.reunioesComp++;
        }
      });
    }

    if(cliRows && cliRows.length > 1){
      var ch = cliRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      var iData2 = ch.findIndex(function(h){return h.includes('DATA')&&h.includes('IN');});
      var iSDR2 = ch.findIndex(function(h){return h.includes('SDR')||h.includes('BDR');});
      var iOrigem2 = ch.findIndex(function(h){return h.includes('ORIGEM');});
      var iValorV = ch.findIndex(function(h){return h.includes('VALOR')&&h.includes('VENDIDO');});

      cliRows.slice(1).forEach(function(row){
        var sdr2 = (row[iSDR2]||'').trim().toUpperCase();
        var dateStr2 = row[iData2]||'';
        var dt2 = parseBRDate(dateStr2);
        var rowMonth2 = dateToMonthStr(dt2);
        var origem2 = (row[iOrigem2]||'').trim().toUpperCase();
        if(!rowMonth2||rowMonth2!==month) return;
        if(!sdr2.includes('JOÃO')&&!sdr2.includes('JOAO')) return;

        var vStr = (row[iValorV]||'').replace(/R\$\s*/,'').replace(/\./g,'').replace(',','.').trim();
        var v = parseFloat(vStr)||0;

        if(origem2.includes('SOCIAL')){
          result.ssVendas++;
          result.ssComm += v * 0.25;
        } else {
          result.vendas++;
        }
      });
    }

    // Calculate SDR
    var meta = lv.meta;
    var threshold = lv.threshold;
    result.bonusMeta = result.agendamentos >= meta ? lv.bonusMeta : 0;
    var agenAcima = Math.max(0, result.agendamentos - meta);
    result.acelerador = result.agendamentos >= meta ? agenAcima * lv.acel : 0;
    result.incentivReun = result.reunioesComp * lv.incentivReun;
    var vendasEfetivas = Math.max(0, result.vendas - (threshold - 1));
    result.comissaoVendas = vendasEfetivas > 0 ? vendasEfetivas * lv.commVenda : 0;
    result.ssIncentiv = result.ssReun * 30;
    result.ssTotal = result.incentivReun + result.ssIncentiv + result.ssComm;
    var totalBrutoSDR = result.base + result.bonusMeta + result.acelerador + result.comissaoVendas;
    result.totalSDR = totalBrutoSDR;
    result.grandTotal = result.totalSDR + result.ssTotal;

  }catch(e){
    result.error = e.message;
  }
  return result;
}

// Month selector helper
function monthOptions(selectedMonth){
  var opts = '';
  var now = new Date();
  for(var i=0; i<6; i++){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    var val = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    var label = meses[d.getMonth()]+'/'+d.getFullYear();
    opts += '<option value="'+val+'"'+(val===selectedMonth?' selected':'')+'>'+label+'</option>';
  }
  return opts;
}

    '</div>'+
    '<div style="background:linear-gradient(135deg,rgba(56,189,248,0.1),rgba(56,189,248,0.03));border:1.5px solid rgba(56,189,248,0.3);border-radius:12px;padding:16px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">'+
      '<div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">TOTAL SDR</div>'+

        '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin-bottom:10px;">SOCIAL SELLING</div>'+

          '<div style="background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:8px;padding:10px;"><div class="m-lbl">Total SS</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:20px;color:var(--purple3);">R$'+r.ssTotal.toFixed(0)+'</div></div>'+
        '</div>'+
      '</div>':'')+
    (r.ssTotal>0?
      '<div style="background:linear-gradient(135deg,rgba(200,168,75,0.15),rgba(200,168,75,0.05));border:2px solid rgba(200,168,75,0.4);border-radius:12px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">'+
        '<div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(200,168,75,0.8);margin-bottom:4px;">TOTAL GERAL (SDR + Social Selling)</div>'+
        '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:48px;letter-spacing:1px;color:#fde047;line-height:1;">R$'+r.grandTotal.toLocaleString('pt-BR',{maximumFractionDigits:0})+'</div></div>'+
        '<div style="text-align:right;font-size:12px;color:var(--muted);font-family:\'Barlow Condensed\',sans-serif;">SDR R$'+r.totalSDR.toLocaleString('pt-BR')+' + SS R$'+r.ssTotal.toFixed(0)+'</div>'+
      '</div>':

}


window.addEventListener('load', function(){
  initFirebase();
  // Check token validity on load
  setTimeout(function(){
    if(gcalToken && gcalToken.expires_at && Date.now() > gcalToken.expires_at){
      gcalToken = null;
      localStorage.removeItem('audens_gcal_token');
      console.log('Expired Google token cleared');
    }
  }, 2000);
});
</script>
