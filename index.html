<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-database-compat.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audens Company · CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#06060e;--bg2:#0c0c1a;--card:#13132a;--card2:#1a1a35;
  --border:rgba(138,43,226,0.25);--border2:rgba(138,43,226,0.45);
  --purple:#7b2fff;--purple2:#9d5cff;--purple3:#c084fc;
  --pglow:rgba(123,47,255,0.15);--pglow2:rgba(123,47,255,0.08);
  --white:#f5f0ff;--muted:#7070a0;
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;--cyan:#38bdf8;
}
body{font-family:Barlow,sans-serif;background:var(--bg);color:var(--white);min-height:100vh;}
.screen{display:none;}.screen.active{display:flex;}
#login-screen{min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#06060e 0%,#0d0818 50%,#06060e 100%);}
#main-screen{flex-direction:row;min-height:100vh;}
.login-box{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:40px 36px;width:400px;max-width:95vw;}
.login-logo{font-family:Bebas Neue,sans-serif;font-size:52px;letter-spacing:6px;color:var(--white);line-height:1;text-align:center;}
.login-sub{font-family:Barlow Condensed,sans-serif;font-size:13px;letter-spacing:5px;color:var(--purple2);text-align:center;margin-bottom:4px;text-transform:uppercase;}
.login-div{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--purple),transparent);margin:16px auto 28px;}
.role-tabs{display:flex;gap:6px;margin-bottom:22px;background:rgba(0,0,0,0.3);border-radius:10px;padding:4px;border:1px solid var(--border);}
.role-tab{flex:1;padding:9px 6px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.role-tab.active{background:var(--purple);color:white;}
.f-label{display:block;font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.f-input{width:100%;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--white);font-family:Barlow,sans-serif;font-size:14px;outline:none;transition:border-color .2s;margin-bottom:16px;}
.f-input:focus{border-color:var(--purple);}
.btn-login{width:100%;padding:14px;background:var(--purple);border:none;border-radius:8px;color:white;font-family:Bebas Neue,sans-serif;font-size:22px;letter-spacing:4px;cursor:pointer;transition:all .2s;margin-top:4px;}
.btn-login:hover{background:var(--purple2);}
.login-err{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:18px;font-family:Barlow Condensed,sans-serif;}
.cred-hint{margin-top:20px;background:rgba(123,47,255,0.08);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.cred-hint-title{font-family:Barlow Condensed,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.cred-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;}
.cred-row:last-child{margin-bottom:0;}
.cred-name{font-family:Barlow Condensed,sans-serif;font-weight:700;color:var(--white);font-size:13px;}
.cred-detail{font-family:monospace;font-size:11px;color:var(--muted);}
.cred-tag{font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:1px;}
.cred-tag.g{background:rgba(123,47,255,0.2);color:var(--purple3);}
.cred-tag.a{background:rgba(56,189,248,0.15);color:var(--cyan);}
.sidebar{width:230px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sb-top{padding:24px 20px 16px;border-bottom:1px solid var(--border);}
.sb-brand{font-family:Bebas Neue,sans-serif;font-size:28px;letter-spacing:4px;color:var(--white);line-height:1;}
.sb-sub{font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:600;letter-spacing:5px;color:var(--purple2);}
.sb-tag{font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-top:5px;font-family:Barlow Condensed,sans-serif;text-transform:uppercase;}
.sb-section{padding:12px 0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;border-left:2px solid transparent;transition:all .15s;}
.nav-item:hover{color:var(--white);background:var(--pglow2);}
.nav-item.active{color:var(--purple3);border-left-color:var(--purple);background:var(--pglow);}
.nav-item i{font-size:18px;}
.nav-badge{background:var(--red);color:white;font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:auto;}
.sb-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border);}
.user-pill{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.u-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--purple3));display:flex;align-items:center;justify-content:center;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;color:white;flex-shrink:0;}
.u-name{font-size:13px;font-weight:600;color:var(--white);font-family:Barlow Condensed,sans-serif;}
.u-role{font-size:11px;color:var(--muted);}
.btn-logout{width:100%;padding:8px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .15s;text-transform:uppercase;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}
.main-content{flex:1;min-height:100vh;background:var(--bg);overflow-y:auto;}
.page{display:none;padding:28px;}.page.active{display:block;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.page-title{font-family:Bebas Neue,sans-serif;font-size:34px;letter-spacing:2px;color:var(--white);line-height:1;}
.page-sub{font-size:12px;color:var(--muted);margin-top:4px;font-family:Barlow Condensed,sans-serif;letter-spacing:1px;text-transform:uppercase;}
.date-chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 14px;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;color:var(--purple2);letter-spacing:1px;white-space:nowrap;}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px;}
.m-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 16px;position:relative;overflow:hidden;}
.m-stripe{position:absolute;top:0;left:0;right:0;height:3px;background:var(--purple);}
.m-stripe.cyan{background:var(--cyan);}.m-stripe.amber{background:var(--amber);}.m-stripe.green{background:var(--green);}
.m-ico{position:absolute;top:14px;right:14px;font-size:22px;opacity:0.13;}
.m-lbl{font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.m-val{font-family:Bebas Neue,sans-serif;font-size:38px;letter-spacing:1px;color:var(--white);line-height:1;}
.m-hint{font-size:12px;color:var(--muted);margin-top:4px;}
.cb{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px;}
.cb-hd{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2);}
.cb-title{font-family:Barlow Condensed,sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--white);}
.meta-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;}
.meta-block::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--purple3));}
.meta-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.meta-title{font-family:Bebas Neue,sans-serif;font-size:18px;letter-spacing:2px;color:var(--white);}
.meta-pct{font-family:Bebas Neue,sans-serif;font-size:28px;letter-spacing:1px;}
.meta-bar-wrap{background:rgba(255,255,255,0.06);border-radius:6px;height:10px;overflow:hidden;margin-bottom:10px;}
.meta-bar-fill{height:100%;border-radius:6px;transition:width .6s ease;}
.meta-nums{display:flex;justify-content:space-between;font-family:Barlow Condensed,sans-serif;font-size:12px;color:var(--muted);}
.meta-nums strong{color:var(--white);}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.badge{font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;letter-spacing:0.5px;text-transform:uppercase;}
.b-purple{background:rgba(123,47,255,0.15);color:var(--purple3);border:1px solid rgba(123,47,255,0.35);}
.b-green{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.3);}
.b-amber{background:rgba(245,158,11,0.12);color:#fbbf24;border:1px solid rgba(245,158,11,0.3);}
.b-red{background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.3);}
.b-cyan{background:rgba(56,189,248,0.12);color:#7dd3fc;border:1px solid rgba(56,189,248,0.3);}
.b-muted{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid rgba(255,255,255,0.08);}
.b-orange{background:rgba(249,115,22,0.12);color:#fb923c;border:1px solid rgba(249,115,22,0.3);}
.b-gold{background:rgba(234,179,8,0.12);color:#fde047;border:1px solid rgba(234,179,8,0.3);}
table{width:100%;border-collapse:collapse;}
thead th{padding:10px 16px;font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);}
tbody td{padding:12px 16px;font-size:13px;color:var(--white);border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--pglow2);}
.t-scroll{overflow-x:auto;}
.btn{padding:7px 14px;border-radius:7px;font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--purple);color:white;}.btn-primary:hover{background:var(--purple2);}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--purple3);}.btn-outline:hover{background:var(--pglow);}
.btn-reg{background:var(--purple);color:white;padding:6px 12px;}
.btn-edit{background:transparent;border:1px solid var(--border);color:var(--muted);}.btn-edit:hover{border-color:var(--purple2);color:var(--purple3);}
.btn-task{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3);padding:6px 12px;}.btn-task:hover{background:rgba(239,68,68,0.25);}
.btn-gcal{background:rgba(66,133,244,0.15);color:#7dd3fc;border:1px solid rgba(66,133,244,0.3);padding:6px 12px;}
.prog-wrap{background:rgba(255,255,255,0.06);border-radius:4px;height:5px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;background:var(--purple);transition:width .4s;}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:300;align-items:center;justify-content:center;}
.modal-ov.open{display:flex;}
.modal-box{background:var(--card2);border:1px solid var(--border2);border-radius:16px;padding:28px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;}
.modal-title{font-family:Bebas Neue,sans-serif;font-size:26px;letter-spacing:2px;color:var(--white);margin-bottom:4px;}
.modal-sub{font-family:Barlow Condensed,sans-serif;font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:20px;}
.modal-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}
.f-select{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--white);font-family:Barlow,sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.f-select:focus{border-color:var(--purple);}
.modal-steps{display:flex;gap:8px;margin-bottom:24px;align-items:center;}
.modal-step{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;flex-shrink:0;}
.modal-step.done{background:var(--green);color:white;}.modal-step.active{background:var(--purple);color:white;}
.modal-step.pending{background:rgba(255,255,255,0.06);color:var(--muted);border:1px solid var(--border);}
.modal-step-line{flex:1;height:1px;background:var(--border);}
.reuniao-card{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.task-alert{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.35);border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:background .2s;}
.task-alert:hover{background:rgba(239,68,68,0.14);}
.offday-banner{border-radius:16px;padding:48px 32px;text-align:center;border:1px solid;}
.goal-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.goal-row:last-child{border-bottom:none;}
.goal-label{flex:1;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;color:var(--white);}
.goal-input{width:100px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--white);font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;outline:none;text-align:center;}
.goal-input:focus{border-color:var(--purple);}
.info-note{padding:11px 14px;background:rgba(123,47,255,0.1);border:1px solid rgba(123,47,255,0.25);border-radius:8px;font-family:Barlow Condensed,sans-serif;font-size:13px;color:var(--purple3);letter-spacing:0.5px;margin-bottom:16px;}
.warn-note{padding:11px 14px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.25);border-radius:8px;font-family:Barlow Condensed,sans-serif;font-size:13px;color:var(--amber);margin-bottom:16px;}
.success-note{padding:11px 14px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:8px;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;color:#4ade80;letter-spacing:1px;}
.empty-st{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-st i{font-size:40px;display:block;margin-bottom:12px;color:rgba(123,47,255,0.3);}
.empty-st p{font-family:Barlow Condensed,sans-serif;font-size:14px;letter-spacing:1px;text-transform:uppercase;}
.funil-step{margin-bottom:14px;}
.funil-row{display:flex;justify-content:space-between;margin-bottom:5px;}
.funil-name{font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;color:var(--white);}
.chart-area{display:flex;align-items:flex-end;gap:8px;height:120px;padding:0 4px;}
.bar-g{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
.bar-stack{display:flex;align-items:flex-end;gap:2px;height:90px;width:100%;}
.bar{width:100%;border-radius:3px 3px 0 0;min-height:2px;}
.bar-l{font-family:Barlow Condensed,sans-serif;font-size:10px;color:var(--muted);margin-top:4px;}
.bar-v{font-family:Bebas Neue,sans-serif;font-size:13px;color:var(--purple3);}
.upload-zone{border:2px dashed var(--border2);border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:8px;}
.upload-zone:hover{border-color:var(--purple);background:var(--pglow);}
.upload-zone i{font-size:40px;color:var(--purple2);margin-bottom:12px;display:block;}
.upload-zone p{color:var(--muted);font-size:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-head{font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 0;}
.cal-day{border-radius:6px;padding:6px 4px;text-align:center;font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:600;min-height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.cal-day.empty{background:transparent;}.cal-day.weekend{background:rgba(112,112,160,0.08);color:var(--muted);}
.cal-day.holiday{background:rgba(249,115,22,0.1);color:#fb923c;border:1px solid rgba(249,115,22,0.2);}
.cal-day.workday{background:var(--pglow2);color:var(--white);border:1px solid var(--border);}
.cal-day.today-mark{border:2px solid var(--purple)!important;color:var(--purple3)!important;}
.cal-day.has-calls{background:rgba(34,197,94,0.1);color:#4ade80;border:1px solid rgba(34,197,94,0.2);}
.bonus-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;}
.bonus-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--amber),#fde047);}
.bonus-total{font-family:Bebas Neue,sans-serif;font-size:42px;letter-spacing:1px;color:#fde047;line-height:1;}
.gcal-status{display:flex;align-items:center;gap:8px;font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;margin-bottom:16px;}
.gcal-status.connected{background:rgba(34,197,94,0.1);color:#4ade80;border:1px solid rgba(34,197,94,0.3);}
.gcal-status.disconnected{background:rgba(245,158,11,0.1);color:var(--amber);border:1px solid rgba(245,158,11,0.3);}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
<div id="login-screen" class="screen active">
  <div class="login-box">
    <div class="login-logo">AUDENS</div>
    <div class="login-sub">Company · CRM Comercial</div>
    <div class="login-div"></div>
    <div class="role-tabs">
      <button class="role-tab active" id="tab-gestor" onclick="selectRole('gestor')"><i class="ti ti-shield-check"></i> Gestor</button>
      <button class="role-tab" id="tab-atendente" onclick="selectRole('atendente')"><i class="ti ti-headset"></i> Atendente</button>
    </div>
    <label class="f-label">E-mail</label>
    <input class="f-input" id="login-email" type="email" placeholder="seu@email.com">
    <label class="f-label">Senha</label>
    <input class="f-input" id="login-senha" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-login" onclick="doLogin()">ENTRAR</button>
    <div class="login-err" id="login-err"></div>
    </div>
    </div>
  </div>
</div>
<div id="main-screen" class="screen">
  <aside class="sidebar">
    <div class="sb-top"><div class="sb-brand">AUDENS</div><div class="sb-sub">COMPANY</div><div class="sb-tag">Transformamos delivery em vendas</div></div>
    <div id="sidebar-nav" class="sb-section"></div>
    <div class="sb-footer">
      <div class="user-pill"><div class="u-av" id="sb-av">LR</div><div><div class="u-name" id="sb-name">Lucas Siqueira</div><div class="u-role" id="sb-role">Gestor</div></div></div>
      <button class="btn-logout" onclick="doLogout()"><i class="ti ti-logout"></i> Sair</button>
    </div>
  </aside>
  <div class="main-content" id="content"></div>
</div>
<!-- MODAL LIGACAO -->
<div class="modal-ov" id="modal-call">
  <div class="modal-box">

var MON_ABR={jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
function parseBRDate(s){
  if(!s)return null;
  s=s.trim();
  var anoAtual=new Date().getFullYear();
  var parts=s.split('/');
  if(parts.length===3){
    var day=parseInt(parts[0]);
    var mpart=parts[1].replace(/\./g,'').toLowerCase().substring(0,3);
    var yr=parseInt(parts[2].replace(/\s.*/,''));
    if(yr<100)yr+=2000;
    var mIdx=MON_ABR[mpart];
    if(mIdx!==undefined)return new Date(yr,mIdx,day);
    var mNum=parseInt(mpart);
    if(!isNaN(mNum))return new Date(yr,mNum-1,day);
  }
  // Aceitar d/m ou m/d sem ano (ex: 9/6, 06/10)
  if(parts.length===2){
    var p1=parseInt(parts[0]);
    var p2=parseInt(parts[1]);
    if(!isNaN(p1)&&!isNaN(p2)){
      // Detect MM/DD (American): if p1 <= 12 and p2 <= 31, ambiguous
      // Heuristic: if p1 <= 12 and p2 > 12, it's MM/DD (month first)
      // if p1 > 12, it's DD/MM (day first)
      // if both <= 12, try DD/MM first (BR standard) but also check context
      var day2,mon2;
      if(p1>12){
        // definitely DD/MM
        day2=p1; mon2=p2;
      } else if(p2>12){
        // definitely MM/DD (month first)
        mon2=p1; day2=p2;
      } else {
        // both <= 12: assume DD/MM (Brazilian standard)
        day2=p1; mon2=p2;
      }
      if(mon2>=1&&mon2<=12&&day2>=1&&day2<=31){
        return new Date(anoAtual,mon2-1,day2);
      }
    }
  }
  var iso=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso)return new Date(parseInt(iso[1]),parseInt(iso[2])-1,parseInt(iso[3]));
  return null;
}
function periodStr(d){if(!d)return'';return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function getCurrentPeriod(){var n=new Date();return String(n.getMonth()+1).padStart(2,'0')+'/'+n.getFullYear();}

// ===== UTILITY =====
function parseFaturamentoLead(row){
  var fat=col(row,['Faturamento','FATURAMENTO','faturamento'])||'';
  if(!fat.trim()) return 0;
  // Se contém "pedido", calcular como pedidos × 50
  if(fat.toLowerCase().includes('pedido')){
    // Pegar o menor número da faixa e multiplicar por 50
    var nums=fat.match(/(\d+(?:[.,]\d+)?)/g);
    if(nums&&nums.length>0){
      var minVal=Math.min.apply(null,nums.map(function(n){return parseFloat(n.replace(',','.'));}));
      return minVal*50;
    }
    return 0;
  }
  return parseFaturamento(fat);
}
function parseFaturamento(s){
  if(!s)return 0;
  s=s.toLowerCase().trim();
  // Handle "acima de X" or "mais de X"
  var acimaMatch=s.match(/(?:acima de|mais de|acima|\+)\s*(\d+(?:[.,]\d+)?)\s*(k|mil)?/);
  if(acimaMatch){
    var v=parseFloat(acimaMatch[1].replace(',','.'));
    var mult=acimaMatch[2]&&acimaMatch[2].includes('k')?1000:acimaMatch[2]&&acimaMatch[2].includes('mil')?1000:1;
    return v*mult;
  }
  // Handle ranges like "40 mil até 60 mil", "10k a 20k", "40k-60k" — return MIN value
  var rangeMatch=s.match(/(\d+(?:[.,]\d+)?)\s*(k|mil)?\s*(?:até|ate|a|-)\s*(\d+(?:[.,]\d+)?)\s*(k|mil)?/);
  if(rangeMatch){
    var v1=parseFloat(rangeMatch[1].replace(',','.'));
    var m1=rangeMatch[2]&&(rangeMatch[2].includes('k')||rangeMatch[2].includes('mil'))?1000:1;
    return v1*m1; // return minimum of range
  }
  // Single value: "40k", "40 mil", "40000"
  var singleMatch=s.match(/(\d+(?:[.,]\d+)?)\s*(k|mil)?/);
  if(singleMatch){
    var v2=parseFloat(singleMatch[1].replace(',','.'));
    var m2=singleMatch[2]&&(singleMatch[2].includes('k')||singleMatch[2].includes('mil'))?1000:1;
    return v2*m2;
  }
  return 0;
}

function isGcalConnected(){
  if(!gcalToken||!gcalToken.expires_at) return false;
  if(Date.now() > gcalToken.expires_at - 300000){
    // Token expires in < 5 min - show warning once
    if(!window._gcalWarnShown){window._gcalWarnShown=true;showSheetToast('Token Google expirando — reconecte em Configuracoes',true);}
    return gcalToken.expires_at > Date.now(); // still valid for now
  }
  return true;
}
function gcalConnect(){
  if(!gcalClientId){alert('Configure o Google Client ID em Configuracoes.');return;}
  var origin=window.location.origin;
  var scope='https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';
  var url='https://accounts.google.com/o/oauth2/v2/auth'+
    '?client_id='+encodeURIComponent(gcalClientId)+
    '&redirect_uri='+encodeURIComponent(origin)+
    '&response_type=token'+
    '&scope='+encodeURIComponent(scope)+
    '&prompt=select_account'+
    '&include_granted_scopes=true';
  var w=window.open(url,'gcal_auth','width=520,height=620,left=200,top=100');
  function onMsg(e){
    if(e.origin!==origin)return;
    if(e.data&&e.data.access_token){
      window.removeEventListener('message',onMsg);
      gcalToken={access_token:e.data.access_token,expires_at:Date.now()+(parseInt(e.data.expires_in)||3600)*1000};
      saveAll();showPage('config');alert('Google conectado!');
    }
  }
  window.addEventListener('message',onMsg);
  var poll=setInterval(function(){
    try{
      if(!w||w.closed){clearInterval(poll);window.removeEventListener('message',onMsg);return;}
      var h=w.location.hash||w.location.search;
      if(h&&h.includes('access_token')){
        clearInterval(poll);window.removeEventListener('message',onMsg);
        var raw=h.startsWith('#')?h.slice(1):h.slice(1);
        var p={};raw.split('&').forEach(function(s){var kv=s.split('=');p[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||'');});
        if(p.access_token){
          gcalToken={access_token:p.access_token,expires_at:Date.now()+(parseInt(p.expires_in)||3600)*1000};
          try{w.close();}catch(e2){}
          saveAll();
          // Compartilhar token com todos via Firebase
          try{if(fbDb)fbDb.ref('gcal_token').set(gcalToken);}catch(e3){}
          showPage('config');alert('Google conectado com sucesso!');
        }
      }
    }catch(e2){}
  },800);
}
function gcalDisconnect(){gcalToken=null;localStorage.removeItem('audens_gcal_token');saveAll();try{if(fbDb)fbDb.ref('gcal_token').remove();}catch(e){}showPage('config');}

function parseSheetUrl(url){
  if(!url)return null;
  var idM=url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  var id=idM?idM[1]:url.trim();
  if(!id)return null;
  var gidM=url.match(/[#&?]gid=(\d+)/);
  var gid=gidM?parseInt(gidM[1]):0;
  return{id:id,gid:gid};
}
function sheetUrl(id,gid){return id?'https://docs.google.com/spreadsheets/d/'+id+'/edit'+(gid?'#gid='+gid:''):'Nao configurada';}

async function fetchSheetVals(sheetId,gid){
  if(!isGcalConnected()) throw new Error('Token do Google expirado. Reconecte em Configurações.');
  try{
    // Step 1: get sheet title from GID
    if(!_sheetsMeta[sheetId+'_fetched']){
      var mr=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'?fields=sheets.properties',
        {headers:{'Authorization':'Bearer '+gcalToken.access_token}});
      var mm=await mr.json();
      if(mm.sheets){
        mm.sheets.forEach(function(s){_sheetsMeta[sheetId+'_'+s.properties.sheetId]=s.properties.title;});
        _sheetsMeta[sheetId+'_fetched']=true;
      }
    }
    var tabName=_sheetsMeta[sheetId+'_'+gid];
    // Fallback: first sheet
    if(!tabName){
      var keys=Object.keys(_sheetsMeta).filter(function(k){return k.startsWith(sheetId+'_')&&k!==sheetId+'_fetched';});
      if(keys.length>0) tabName=_sheetsMeta[keys[0]];
    }
    if(!tabName) tabName='Sheet1';
    // Step 2: fetch values by tab name
    var r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(tabName),
      {headers:{'Authorization':'Bearer '+gcalToken.access_token}});
    var d=await r.json();
    // Step 3: if tab name failed (400), try fetching first sheet by omitting range
    if(d.error){
      console.warn('fetchSheetVals fallback for',sheetId,'gid',gid,'tabName',tabName,'err',d.error.message);
      var r2=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/A1:ZZ10000',
        {headers:{'Authorization':'Bearer '+gcalToken.access_token}});
      d=await r2.json();
    }
    if(d.error){throw new Error('Planilha (gid='+gid+'): '+JSON.stringify(d.error.message||d.error));}
    return d.values||[];
  }catch(e){console.error('fetchSheetVals error',sheetId,gid,e);throw e;}
}
function rawToObjs(raw){
  if(!raw||raw.length<2)return{headers:[],rows:[]};
  var h=raw[0].map(function(x){return(x||'').trim();});
  var rows=raw.slice(1).map(function(row){
    var o={};h.forEach(function(k,i){o[k]=(row[i]||'').trim();});return o;
  }).filter(function(r){return Object.values(r).some(function(v){return v;});});
  return{headers:h,rows:rows};
}

async function appendSheetRow(sheetId, gid, values){
  if(!isGcalConnected()){
    showSheetToast('ERRO: Google nao conectado.',true);
    return false;
  }
  try{
    // Step 1: get spreadsheet info to find tab name by gid
    var metaUrl='https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'?fields=sheets.properties';
    var mr=await fetch(metaUrl,{headers:{'Authorization':'Bearer '+gcalToken.access_token}});
    var mm=await mr.json();
    if(mm.error){
      // Token might lack spreadsheets scope - try to write directly with tab name
      showSheetToast('ERRO meta: '+mm.error.message+' (codigo:'+mm.error.code+')',true);
      return false;
    }
    // Find tab name matching gid
    var tabName=null;
    if(mm.sheets){
      for(var i=0;i<mm.sheets.length;i++){
        var sp=mm.sheets[i].properties;
        if(sp.sheetId===gid||sp.sheetId===parseInt(gid)){tabName=sp.title;break;}
      }
      // fallback: look for tab named Ligação or Ligacao
      if(!tabName){
        for(var i=0;i<mm.sheets.length;i++){
          var t=mm.sheets[i].properties.title;
          if(t.toLowerCase().includes('liga')){tabName=t;break;}
        }
      }
      // last fallback: list all tabs in error
      if(!tabName){
        var allTabs=mm.sheets.map(function(s){return s.properties.title+'('+s.properties.sheetId+')'}).join(', ');
        showSheetToast('ERRO: Aba Ligacao nao encontrada. Abas disponiveis: '+allTabs,true);
        return false;
      }
    }
    // Step 2: append row
    var range=tabName+'!A:I';
    var appendUrl='https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(range)+':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS';
    var resp=await fetch(appendUrl,{
      method:'POST',
      headers:{'Authorization':'Bearer '+gcalToken.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({values:[values]})
    });
    var result=await resp.json();
    if(result.error){
      showSheetToast('ERRO ao gravar: '+result.error.message+' | Status: '+resp.status,true);
      return false;
    }
    showSheetToast('Ligacao gravada na planilha!',false);
    return true;
  }catch(e){
    showSheetToast('ERRO excecao: '+e.message,true);
    return false;
  }
}

// ===== HELPERS =====
function getPendingFollowups(){
  return Object.values(meetings).filter(function(m){
    return m.status==='pending'&&!followups[m.id]&&
      Date.now()>new Date(m.dtISO).getTime()+24*3600*1000&&
      m.responsavel===CU.closer;
  });
}
function calcStats(df){
  var rows=Object.values(calls);if(df)rows=rows.filter(function(r){return r.data===df;});
  var t=rows.length,at=rows.filter(function(r){return r.at==='sim';}).length;
  var re=Object.values(meetings).filter(function(m){return df?calls[m.tel]&&calls[m.tel].data===df:true;}).length;
  var ve=Object.values(followups).filter(function(f){return f.venda==='sim';}).length;
  return{total:t,atendidas:at,reunioes:re,vendas:ve,
    pAt:t?Math.round(at/t*100):0,pRe:at?Math.round(re/at*100):0,pVe:re?Math.round(ve/re*100):0};
}
function calcRevenue(){return Object.values(followups).filter(function(f){return f.venda==='sim';}).reduce(function(s,f){return s+(parseFloat(f.mensalidade)||0);},0);}
function getCallsThisMonth(){
  var mo=new Date(),moStr=String(mo.getMonth()+1).padStart(2,'0')+'/'+mo.getFullYear();
  return Object.values(calls).filter(function(c){if(!c.data)return false;var p=c.data.split('/');return p[1]+'/'+p[2]===moStr;}).length;
}
function getWorkdaysPassed(){
  var now=new Date(),y=now.getFullYear(),mo=now.getMonth(),today=now.getDate(),hols=allHolidays(y),count=0;
  for(var d=1;d<=today;d++){var dobj=new Date(y,mo,d),dow=dobj.getDay();if(dow===0||dow===6)continue;
    var mm=String(mo+1).padStart(2,'0'),dd=String(d).padStart(2,'0');if(hols[mm+'-'+dd])continue;count++;}
  return count;
}
function getWorkdaysInMonth(){
  var now=new Date(),y=now.getFullYear(),mo=now.getMonth(),hols=allHolidays(y),count=0,total=new Date(y,mo+1,0).getDate();
  for(var d=1;d<=total;d++){var dobj=new Date(y,mo,d),dow=dobj.getDay();if(dow===0||dow===6)continue;
    var mm=String(mo+1).padStart(2,'0'),dd=String(d).padStart(2,'0');if(hols[mm+'-'+dd])continue;count++;}
  return count;
}
function renderMetaBlock(label,atual,meta,sublabel){
  var pct=meta>0?Math.min(Math.round(atual/meta*100),100):0,color=metaColor(pct);
  var emoji=pct>=100?'Conquista':pct>=70?'Em alta':pct>=40?'Avancando':'Meta';
  return '<div class="meta-block">'+
    '<div class="meta-header"><div><div class="meta-title">'+emoji+' '+label+'</div>'+
    '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:12px;color:var(--muted);margin-top:2px;">'+sublabel+'</div></div>'+
    '<div class="meta-pct" style="color:'+color+';">'+pct+'%</div></div>'+

    '<div class="meta-nums"><span><strong style="color:'+color+';">'+atual+'</strong> ligacoes</span><span>Meta: <strong>'+meta+'</strong></span></div>'+

function calcBonusForCloser(closerName){
  var comps=Object.values(followups).filter(function(f){var m=meetings[f.meetingId];return m&&m.responsavel===closerName&&f.comparecimento==='sim';}).length;
  var vendas=Object.values(followups).filter(function(f){var m=meetings[f.meetingId];return m&&m.responsavel===closerName&&f.venda==='sim';});
  var bonusV=vendas.reduce(function(s,f){return s+(parseFloat(f.mensalidade)||0)*BONUS_VENDA_PCT;},0);
  return{comparecimentos:comps,vendas:vendas.length,bonusComp:comps*BONUS_COMP,bonusVendas:bonusV,total:comps*BONUS_COMP+bonusV,detalhe:vendas};
}
function getDailyKey(){
  var user = CU ? CU.name.toLowerCase().replace(/\s+/g,'_') : 'default';
  return todayStr()+'_'+user;
}
function getDailyLeads(){
  var key=getDailyKey();
  if(_dailyMap[key])return _dailyMap[key];
  // Fallback: chave antiga sem usuário (migração)
  var oldKey=todayStr();
  if(_dailyMap[oldKey]){
    _dailyMap[key]=_dailyMap[oldKey];
    delete _dailyMap[oldKey];
    saveAll();
    return _dailyMap[key];
  }
  // Fallback 2: reconstruir do histórico de calls de hoje
  // Se o usuário já fez ligações hoje, reconstruir a lista a partir do calls
  var hoje=todayStr();
  var callsHoje=Object.values(calls).filter(function(c){return c.data===hoje;});
  if(callsHoje.length>0){
    // Montar lista com os leads que já foram ligados hoje + completar com novos se necessário
    var telsHoje=callsHoje.map(function(c){return c.tel;});
    var leadsHoje=telsHoje.map(function(tel){
      return allLeads.find(function(l){return l.telefone===tel;})||{telefone:tel,nome:calls[tel]?calls[tel].nome:'',data:hoje};
    }).filter(Boolean);
    // Completar até 50 se ainda não chegou
    if(leadsHoje.length<50){
      var usedSet=new Set(telsHoje.concat(Object.keys(calls)));
      var extra=allLeads.filter(function(l){return !usedSet.has(l.telefone);}).sort(function(){return Math.random()-.5;}).slice(0,50-leadsHoje.length);
      leadsHoje=leadsHoje.concat(extra);
    }
    _dailyMap[key]=leadsHoje;saveAll();return leadsHoje;
  }
  if(!checkDay(new Date()).ok)return null;
  var used=new Set(Object.keys(calls));
  var returns=allLeads.filter(function(l){return l._requeue&&!used.has(l.telefone);});
  var fresh=allLeads.filter(function(l){return !l._requeue&&!used.has(l.telefone);}).sort(function(){return Math.random()-.5;});
  var batch=fresh.slice(0,50-returns.length).concat(returns).slice(0,50);
  if(!batch.length)return[];
  _dailyMap[key]=batch;saveAll();return batch;
}

var _leadsLoading=false;
function reloadLeads(){
  loadLeadsFB().then(function(ok){
    if(ok){showPage('ligar');}
    else{loadLeadsFromSheets().then(function(){showPage('ligar');});}
  });

async function loadLeadsFromSheets(){
  if(_leadsLoading)return;
  if(!isGcalConnected())return;
  _leadsLoading=true;
  try{
    var raw=await fetchSheetVals(SHEETS_IDS.leads, SHEETS_GIDS.leads);
    if(!raw||raw.length<2){_leadsLoading=false;return;}
    var headers=raw[0].map(function(h){return(h||'').trim();});
    // Find column indices - leads sheet: Data|Nome|Faturamento|Telefone|Fonte|Campanha|Posicionamento|Conjunto|Ad
    function fi(opts){
      for(var i=0;i<opts.length;i++){
        var idx=headers.findIndex(function(h){return h.toLowerCase().includes(opts[i].toLowerCase());});
        if(idx>=0)return idx;
      }
      return -1;
    }
    var iNome=fi(['nome','name','cliente','lead']);
    var iTel=fi(['telefone','tel','phone','celular','whatsapp','fone']);
    var iFat=fi(['faturamento','fat','receita']);
    var iFonte=fi(['fonte','source','origem']);
    var iData=fi(['data','date']);
    if(iNome<0||iTel<0){_leadsLoading=false;return;}
    var loaded=[];
    var seen=new Set();
    raw.slice(1).forEach(function(row){
      var nome=(row[iNome]||'').trim();
      var tel=(row[iTel]||'').replace(/\D/g,'');
      if(!nome||!tel||seen.has(tel))return;
      seen.add(tel);
      loaded.push({
        nome:nome,
        telefone:tel,
        cidade:'',
        faturamento:iFat>=0?(row[iFat]||''):'',
        _source:iFonte>=0?(row[iFonte]||''):'Sheets',
        _data:iData>=0?(row[iData]||''):''
      });
    });
    if(loaded.length>0){
      // Merge with existing — don't duplicate
      var existingTels=new Set(allLeads.map(function(l){return(l.telefone||'').replace(/\D/g,'');}));
      var newOnes=loaded.filter(function(l){return !existingTels.has(l.telefone);});
      allLeads=allLeads.concat(newOnes);
      _dailyMap={};// reset daily so new leads can be picked
      saveAll();
    }
  }catch(e){console.error('loadLeadsFromSheets error',e);}
  _leadsLoading=false;
}

function parseCSVText(text,filename){
  var lines=text.split('\n').filter(function(l){return l.trim();});
  if(lines.length<2)return{leads:[],error:'Arquivo vazio: '+filename};
  var rawH=lines[0].split(',').map(function(h){return h.trim().toLowerCase().replace(/['"]/g,'').replace(/\s+/g,'_');});
  function fc(arr,opts){return opts.find(function(o){return arr.includes(o);})||null;}
  var nc=fc(rawH,['nome','name','cliente','lead','contato']);
  var tc=fc(rawH,['telefone','tel','phone','celular','whatsapp','fone']);
  var cc=fc(rawH,['cidade','city','municipio']);
  var fac=fc(rawH,['faturamento','receita','revenue','fat','renda']);
  if(!nc||!tc)return{leads:[],error:'Sem colunas nome/telefone: '+filename};
  var parsed=lines.slice(1).map(function(line){
    var cols=line.split(',').map(function(c){return c.trim().replace(/^["']|["']$/g,'');});
    var o={};rawH.forEach(function(h,i){o[h]=cols[i]||'';});
    return{nome:o[nc]||'',telefone:o[tc]||'',cidade:cc?o[cc]||'':'',faturamento:fac?o[fac]||'':'',_source:filename.replace('.csv','').slice(0,20)};
  }).filter(function(r){return r.nome&&r.telefone;});
  return{leads:parsed,error:null};
}
function handleCSV(e){
  var files=Array.from(e.target.files);if(!files.length)return;
  var log=document.getElementById('import-log');
  log.innerHTML='<div style="margin-top:12px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;color:var(--muted);">Processando '+files.length+' arquivo(s)...</div>';
  var pending=files.length,allParsed=[];
  files.forEach(function(file){
    var r=new FileReader();
    r.onload=function(ev){
      var result=parseCSVText(ev.target.result,file.name);
      allParsed.push({filename:file.name,leads:result.leads,error:result.error});
      pending--;if(pending===0)mergeAndSave(allParsed,log);
    };
    r.readAsText(file,'UTF-8');
  });
  e.target.value='';
}
function mergeAndSave(allParsed,log){
  var seen=new Set(allLeads.map(function(l){return(l.telefone||'').replace(/\D/g,'');}));
  var totalNew=0,totalDups=0,logRows='';
  allParsed.forEach(function(p){
    if(p.error){logRows+='<div style="color:var(--red);">X '+p.error+'</div>';return;}
    var fileNew=0,fileDups=0;
    p.leads.forEach(function(lead){
      var norm=(lead.telefone||'').replace(/\D/g,'');
      if(!norm||seen.has(norm)){fileDups++;totalDups++;return;}
      seen.add(norm);allLeads.push(lead);fileNew++;totalNew++;
    });
    logRows+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">'+
      '<i class="ti ti-file-check" style="color:var(--green);"></i>'+
      '<span style="color:var(--white);font-weight:600;">'+p.filename+'</span>'+
      '<span class="badge b-green">+'+fileNew+'</span>'+(fileDups?'<span class="badge b-muted">'+fileDups+' dupl.</span>':'')+
    '</div>';
  });
  _dailyMap={};saveAll();
  log.innerHTML='<div style="margin-top:14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;">'+
    logRows+'<div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;">'+
    '<span style="color:var(--green);">+'+totalNew+' adicionados</span> · '+
    '<span style="color:var(--muted);">'+totalDups+' dupl.</span> · '+
    '<span style="color:var(--purple3);">Total: '+allLeads.length+'</span></div></div>';
  setTimeout(function(){showPage('leads');},1800);
}

function gerarLeadsExtras(qtd){
  var hoje = todayStr();

  // Buscar leads não usados hoje
  var disponiveis = allLeads.filter(function(l){

  });
  if(!disponiveis.length){
    alert('Não há mais leads disponíveis na base.');
    return;

  var novos = disponiveis.sort(function(){return Math.random()-.5;}).slice(0,qtd);

function updateBonusPreview(){
  var mensEl=document.getElementById('fu-mensalidade');
  var prev=document.getElementById('fu-bonus-preview');
  if(!mensEl||!prev)return;
  var mens=parseFloat(mensEl.value)||0;
  prev.innerHTML='Bonus de venda: $'+(mens*BONUS_VENDA_PCT).toFixed(2)+' ('+Math.round(BONUS_VENDA_PCT*100)+'% da mensalidade)';
}
function selectComp(val){
  window._fuComp=val;
  document.getElementById('fu-comp-sim').style.background=val==='sim'?'rgba(34,197,94,0.2)':'transparent';
  document.getElementById('fu-comp-sim').style.borderColor=val==='sim'?'var(--green)':'var(--border)';
  document.getElementById('fu-comp-nao').style.background=val==='nao'?'rgba(239,68,68,0.2)':'transparent';
  document.getElementById('fu-comp-nao').style.borderColor=val==='nao'?'var(--red)':'var(--border)';
  document.getElementById('fu-venda-section').style.display=val==='sim'?'block':'none';
  if(val==='nao'){document.getElementById('fu-save-btn').disabled=false;window._fuChoice='nao_comp';}
  else{document.getElementById('fu-save-btn').disabled=true;window._fuChoice=null;}
}
function selectFU(val){
  window._fuChoice=val;
  document.getElementById('fu-sim').style.background=val==='sim'?'rgba(34,197,94,0.2)':'transparent';
  document.getElementById('fu-sim').style.borderColor=val==='sim'?'var(--green)':'var(--border)';

function saveFollowup(){
  if(!_fuMeeting||!window._fuChoice)return;
  var fid=_fuMeeting.id,comp=window._fuComp==='sim',venda=window._fuChoice==='sim';
  var contrato=venda?(parseFloat(document.getElementById('fu-contrato').value)||0):0;
  var mensalidade=venda?(parseFloat(document.getElementById('fu-mensalidade').value)||0):0;
  followups[fid]={meetingId:fid,tel:_fuMeeting.tel,nome:_fuMeeting.nome,
    comparecimento:comp?'sim':'nao',venda:venda?'sim':'nao',
    contrato:contrato,mensalidade:mensalidade,
    bonusComp:comp?BONUS_COMP:0,bonusVenda:venda?mensalidade*BONUS_VENDA_PCT:0,
    motivo:!venda&&comp?(document.getElementById('fu-motivo')?document.getElementById('fu-motivo').value:''):'',
    dt:todayStr()};
  meetings[fid].status='done';
  if(!venda&&comp){var lead=allLeads.find(function(l){return l.telefone===_fuMeeting.tel;});if(lead)lead._requeue=true;}
  saveAll();closeModal('modal-followup');
  if(CU.role==='atendente')showPage('ligar');else showPage('dashboard');
}

// ===== DASHBOARD COMERCIAL =====
function renderDashComercial(){
  if(!_dashPeriod)_dashPeriod=getCurrentPeriod();
  var now=new Date(),opts='';
  var mn=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  for(var i=0;i<13;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var p=periodStr(d);
    opts+='<option value="'+p+'"'+(p===_dashPeriod?' selected':'')+'>'+mn[d.getMonth()]+' '+d.getFullYear()+'</option>';
  }
  setTimeout(refreshDashCom,80);
  return '<div class="page active">'+
    '<div class="page-header">'+
      '<div>'+
        '<div class="page-title">Dashboard Comercial</div>'+
        '<div class="page-sub">Leitura em tempo real das planilhas</div>'+
      '</div>'+
      '<div style="display:flex;gap:10px;align-items:center;">'+
        '<select id="dcp-sel" onchange="changeDashPeriod(this.value)" style="background:var(--card);border:1px solid var(--border2);border-radius:8px;color:var(--white);padding:8px 12px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;outline:none;">'+opts+'</select>'+
        '<span style="color:var(--muted);font-family:Barlow Condensed,sans-serif;font-size:11px;letter-spacing:1px;">OU</span>'+
        '<input type="date" id="dash-start" style="background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;color:var(--white);font-size:13px;outline:none;font-family:Barlow Condensed,sans-serif;">'+
        '<span style="color:var(--muted);font-size:11px;">até</span>'+
        '<input type="date" id="dash-end" style="background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;color:var(--white);font-size:13px;outline:none;font-family:Barlow Condensed,sans-serif;">'+
        '<button class="btn btn-outline" onclick="applyDashDateRange()" style="font-size:12px;padding:8px 14px;letter-spacing:1px;"><i class="ti ti-filter"></i></button>'+
        '<button class="btn btn-outline" onclick="clearDashDateRange()" style="font-size:12px;padding:8px 12px;" title="Limpar filtro"><i class="ti ti-x"></i></button>'+
        '<button class="btn btn-primary" onclick="refreshDashCom()" style="font-size:12px;padding:10px 18px;letter-spacing:2px;">'+
          '<i class="ti ti-refresh"></i> ATUALIZAR'+
        '</button>'+
      '</div>'+
    '</div>'+
    (!isGcalConnected()?'<div class="warn-note"><i class="ti ti-alert-triangle"></i> Reconecte o Google em <strong>Configuracoes</strong> para carregar os dados.</div>':'')+
    '<div id="dc-loading" style="text-align:center;padding:80px;color:var(--muted);font-family:\'Barlow Condensed\',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;">'+
      '<i class="ti ti-loader-2" style="font-size:40px;display:block;margin-bottom:16px;color:var(--purple2);animation:spin 1s linear infinite;"></i>'+
      'Carregando planilhas...'+
    '</div>'+
    '<div id="dc-content" style="display:none;"></div>'+
  '</div>';
}
function changeDashPeriod(p){_dashPeriod=p;_dashStart=null;_dashEnd=null;refreshDashCom();}
function applyDashDateRange(){
  var s=document.getElementById('dash-start');
  var e=document.getElementById('dash-end');
  if(s&&e&&s.value&&e.value){
    _dashStart=new Date(s.value+'T00:00:00');
    _dashEnd=new Date(e.value+'T23:59:59');
    _dashPeriod=null; // override period filter with date range
    refreshDashCom();
  }
}
function clearDashDateRange(){
  _dashStart=null;_dashEnd=null;
  _dashPeriod=getCurrentPeriod();
  var s=document.getElementById('dash-start');
  var e=document.getElementById('dash-end');
  if(s)s.value='';if(e)e.value='';
  refreshDashCom();
}
async function refreshDashCom(){
  var loading=document.getElementById('dc-loading');
  var content=document.getElementById('dc-content');
  if(!loading||!content)return;
  if(!isGcalConnected()){
    loading.style.display='none';content.style.display='block';

      var prevA=parseInt(pp2[0])===1?parseInt(pp2[1])-1:parseInt(pp2[1]);

}
function buildDashComHTML(data){
  var period=_dashPeriod||getCurrentPeriod();
  var inv=_investidoMes[period]||0;
  var pp=period.split('/');
  var mlong=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var periodLabel=mlong[parseInt(pp[0])-1]+' '+pp[1];

  // ---- FILTER DATA BY PERIOD OR DATE RANGE ----
  function inRange(d){
    if(!d) return false;
    if(_dashStart&&_dashEnd) return d>=_dashStart&&d<=_dashEnd;
    return periodStr(d)===period;
  }
  var leadsF=data.leads.rows.filter(function(r){
    var d=parseBRDate(col(r,['Data','DATA','data']));return inRange(d);
  });
  var reunioesF=data.reunioes.rows.filter(function(r){
    var d=parseBRDate(col(r,['DATA DE AGENDAMENTO','Data de Agendamento','DataAgendamento','Data Agendamento']));
    return inRange(d);
  });
  var clientesF=data.clientes.rows.filter(function(r){
    var d=parseBRDate(col(r,['DATA DE INICIO','DATA DE INÍCIO','Data de Inicio','Data Inicio','DataInicio']));
    return inRange(d);
  });
  // All clientes for annual metrics
  var todosClientes=data.clientes.rows;

  // ---- BASE METRICS ----
  var totalLeads=leadsF.length;
  var leadsQ=leadsF.filter(function(l){return parseFaturamentoLead(l)>=40000;}).length;

  // ---- TRÁFEGO METRICS (Fonte = Anúncios) ----
  var leadsTrafego=leadsF.filter(function(l){
    var ad=(col(l,['Ad','AD','ad'])||'').trim();
    return ad && ad!=='-';
  });
  var leadsTrafegoCount=leadsTrafego.length;
  var leadsTrafegoQ=leadsTrafego.filter(function(l){return parseFaturamentoLead(l)>=40000;}).length;
  var txQualifTrafego=leadsTrafegoCount>0?Math.round(leadsTrafegoQ/leadsTrafegoCount*100):0;

  // ---- RANKING DE ADS ----
  var adMap={};
  leadsTrafego.filter(function(l){
    return parseFaturamentoLead(l)>=40000;
  }).forEach(function(l){
    var ad=(col(l,['Ad','AD','ad'])||'').trim();
    if(!ad||ad==='-'||ad==='') return;
    adMap[ad]=(adMap[ad]||0)+1;
  });
  var adRanking=Object.keys(adMap).map(function(a){return{ad:a,count:adMap[a]};})
    .sort(function(a,b){return b.count-a.count;}).slice(0,10);

  // Meetings
  var reunAgend=reunioesF.length;
  var reunReal=reunioesF.filter(function(r){
    return isRealizada(col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status']));

  var reunNoShow=reunioesF.filter(function(r){
    var st=(col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status'])||'').toUpperCase().trim();
    return st==='NO-SHOW'||st==='NOSHOW'||st==='NO SHOW';

  var reunPend=reunioesF.filter(function(r){
    var st=(col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status'])||'').toUpperCase().trim();
    return st==='AGENDADA'||st===''||(!isRealizada(st)&&st!=='NO-SHOW'&&st!=='NO SHOW'&&st!=='NOSHOW');
  }).length;

  // Taxa no-show = noshow / (noshow + realizada) - só sobre resolvidas
  var resolvidas=reunReal+reunNoShow;
  var taxaNoShow=resolvidas>0?Math.round(reunNoShow/resolvidas*100):0;

  // Conversions

  // Helper: delta % com seta e cor

  }

  // ---- BY CLOSER ----
  var cData={};
  clientesF.forEach(function(c){
    var nm=normCloserName(col(c,['CLOSER','Closer','closer']))||'Outros';
    if(!cData[nm])cData[nm]={contratos:0,valor:0,rReal:0,rAg:0,noshow:0};

// Calcula evolução mensal: novos clientes, cancelamentos, ativos, churn, MRR
function buildHistoricoMensal(todosClientes){
  if(!todosClientes||todosClientes.length===0) return '';

  // Coletar todos os meses com atividade
  var mesesSet = {};
  todosClientes.forEach(function(c){
    var dInicio = parseBRDate(col(c,['DATA DE INICIO','DATA DE INÍCIO','Data de Inicio','Data Inicio','DataInicio']));
    var dCancel = parseBRDate(col(c,['DATA DE CANCELAMENTO','Data de Cancelamento','DATA CANCELAMENTO','Data Cancelamento']));
    if(dInicio) mesesSet[periodStr(dInicio)] = true;
    if(dCancel) mesesSet[periodStr(dCancel)] = true;
  });

  // Sort meses desc (mais recente primeiro)
  var meses = Object.keys(mesesSet).sort(function(a,b){
    // format: MM/YYYY
    var pa=a.split('/'), pb=b.split('/');
    var da=new Date(parseInt(pa[1]),parseInt(pa[0])-1,1);
    var db=new Date(parseInt(pb[1]),parseInt(pb[0])-1,1);
    return db-da;
  }).slice(0,12); // últimos 12 meses

  if(meses.length===0) return '';

  // Para cada mês calcular métricas
  var rows = meses.map(function(mes){
    var partes = mes.split('/');
    var mesNum = parseInt(partes[0]), ano = parseInt(partes[1]);
    var inicioMes = new Date(ano, mesNum-1, 1);
    var fimMes = new Date(ano, mesNum, 0, 23, 59, 59);

    var novos = 0, cancelamentos = 0, mrr = 0, ativosNoFim = 0;

    todosClientes.forEach(function(c){
      var dInicio = parseBRDate(col(c,['DATA DE INICIO','DATA DE INÍCIO','Data de Inicio','Data Inicio','DataInicio']));
      var dCancel = parseBRDate(col(c,['DATA DE CANCELAMENTO','Data de Cancelamento','DATA CANCELAMENTO','Data Cancelamento']));
      var valorMes = parseMoney(col(c,['VALOR CONTRATO/MÊS','VALOR CONTRATO/MES','Valor Contrato/Mês','Valor Contrato/Mes','VALOR MENSALIDADE','VALOR MÊS','VALOR MES','Valor Mensalidade','Valor Mensal']));

      // Novo neste mês
      if(dInicio && dInicio >= inicioMes && dInicio <= fimMes) novos++;

      // Cancelou neste mês
      if(dCancel && dCancel >= inicioMes && dCancel <= fimMes) cancelamentos++;

      // Ativo no fim do mês = iniciou antes ou durante E (não cancelou OU cancelou depois)
      var ativoNoFim = dInicio && dInicio <= fimMes && (!dCancel || dCancel > fimMes);
      if(ativoNoFim){
        ativosNoFim++;
        mrr += valorMes;
      }
    });

    // Ativos no início do mês
    var ativosNoInicio = ativosNoFim - novos + cancelamentos;
    var churn = ativosNoInicio > 0 ? (cancelamentos / ativosNoInicio * 100) : 0;

    // Label mês
    var nomesMes = ['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
    var label = nomesMes[mesNum-1]+'/'+String(ano).slice(2);

    return {label:label, novos:novos, cancelamentos:cancelamentos, ativos:ativosNoFim, churn:churn, mrr:mrr};
  });

  // Build table
  var tbody = rows.map(function(r){
    var churnCor = r.churn > 25 ? 'var(--red)' : r.churn > 10 ? 'var(--amber)' : 'var(--green)';
    var cancelCor = r.cancelamentos > 10 ? 'rgba(239,68,68,0.25)' : r.cancelamentos > 5 ? 'rgba(245,158,11,0.15)' : 'transparent';
    var novosCor = r.novos >= 20 ? 'rgba(34,197,94,0.2)' : r.novos >= 10 ? 'rgba(34,197,94,0.1)' : 'transparent';
    var mrrFmt = r.mrr >= 1000 ? 'R$ '+r.mrr.toLocaleString('pt-BR',{maximumFractionDigits:0}) : 'R$ '+r.mrr.toFixed(0);
    return '<tr>'+
      '<td style="font-family:Barlow Condensed,sans-serif;font-weight:700;color:var(--white);white-space:nowrap;">'+r.label+'</td>'+
      '<td style="background:'+novosCor+';color:var(--white);font-weight:700;text-align:center;">'+r.novos+'</td>'+
      '<td style="background:'+cancelCor+';color:var(--white);font-weight:700;text-align:center;">'+r.cancelamentos+'</td>'+
      '<td style="color:var(--cyan);font-weight:700;text-align:center;">'+r.ativos+'</td>'+
      '<td style="color:'+churnCor+';font-weight:700;text-align:center;">'+r.churn.toFixed(2).replace('.',',')+'%</td>'+
      '<td style="color:var(--green);font-weight:700;text-align:right;">'+mrrFmt+'</td>'+
    '</tr>';
  }).join('');

  return '<div class="cb" style="margin-bottom:16px;">'+
    '<div class="cb-hd">'+
      '<div class="cb-title"><i class="ti ti-calendar-stats" style="color:var(--purple3);margin-right:6px;"></i>Evolução Mensal · Últimos 12 Meses</div>'+
    '</div>'+
    '<div style="overflow-x:auto;padding:0;">'+
      '<table style="width:100%;border-collapse:collapse;">'+
        '<thead><tr>'+
          '<th style="text-align:left;padding:10px 16px;font-family:Barlow Condensed,sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);">Mês</th>'+
          '<th style="text-align:center;padding:10px 12px;font-family:Barlow Condensed,sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);">Novos Clientes</th>'+
          '<th style="text-align:center;padding:10px 12px;font-family:Barlow Condensed,sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);">Cancelamentos</th>'+
          '<th style="text-align:center;padding:10px 12px;font-family:Barlow Condensed,sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);">Clientes Ativos</th>'+
          '<th style="text-align:center;padding:10px 12px;font-family:Barlow Condensed,sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);">Churn</th>'+
          '<th style="text-align:right;padding:10px 16px;font-family:Barlow Condensed,sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);">MRR Acumulada</th>'+
        '</tr></thead>'+
        '<tbody>'+tbody+'</tbody>'+
      '</table>'+
    '</div>'+
  '</div>';
}

// ===== ANÁLISE DE ADS =====
var _adsPeriod=null, _adsStart=null, _adsEnd=null, _adsCampanha='';
var _tarefasData=null; // data selecionada para visualização de tarefas

function renderAnaliseAds(){
  if(!isGcalConnected()){
    return '<div class="page active"><div class="page-header"><div><div class="page-title">Análise de Ads</div></div></div>'+
      '<div class="warn-note"><i class="ti ti-alert-triangle"></i> Reconecte o Google em <strong>Configuracoes</strong> para carregar os dados.</div></div>';
  }
  if(!_adsPeriod) _adsPeriod=getCurrentPeriod();
  var mn=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  var opts='';
  for(var i=5;i>=0;i--){
    var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
    var p=String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
    opts+='<option value="'+p+'"'+(p===_adsPeriod?' selected':'')+'>'+mn[d.getMonth()]+' '+d.getFullYear()+'</option>';
  }

  var html='<div class="page active">'+
    '<div class="page-header">'+
      '<div><div class="page-title">Análise de Ads</div><div class="page-sub">Cruzamento leads × reuniões × fechamentos por ad</div></div>'+
    '</div>'+
    // Filtros
    '<div class="cb" style="margin-bottom:16px;">'+
      '<div style="padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">'+
        '<select onchange="changeAdsPeriod(this.value)" style="background:var(--card);border:1px solid var(--border2);border-radius:8px;color:var(--white);padding:8px 12px;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;outline:none;">'+opts+'</select>'+
        '<span style="color:var(--muted);font-size:11px;font-family:Barlow Condensed,sans-serif;">OU</span>'+
        '<input type="date" id="ads-start" style="background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;color:var(--white);font-size:13px;outline:none;">'+
        '<span style="color:var(--muted);font-size:11px;">até</span>'+
        '<input type="date" id="ads-end" style="background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;color:var(--white);font-size:13px;outline:none;">'+
        '<button class="btn btn-outline" onclick="applyAdsDateRange()" style="font-size:12px;padding:8px 14px;"><i class="ti ti-filter"></i></button>'+
        '<button class="btn btn-outline" onclick="clearAdsDateRange()" style="font-size:12px;padding:8px 12px;" title="Limpar"><i class="ti ti-x"></i></button>'+
        '<button class="btn btn-primary" onclick="refreshAnaliseAds()" style="font-size:12px;padding:10px 18px;letter-spacing:2px;"><i class="ti ti-refresh"></i> ANALISAR</button>'+
      '</div>'+
    '</div>'+
    '<div id="ads-loading" style="text-align:center;padding:80px;color:var(--muted);font-family:Barlow Condensed,sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;display:none;">'+
      '<i class="ti ti-loader-2" style="font-size:40px;display:block;margin-bottom:16px;color:var(--purple2);animation:spin 1s linear infinite;"></i>Cruzando dados...'+
    '</div>'+
    '<div id="ads-content" style="display:none;"></div>'+
  '</div>';

  setTimeout(refreshAnaliseAds, 80);
  return html;
}

function changeAdsPeriod(p){_adsPeriod=p;_adsStart=null;_adsEnd=null;refreshAnaliseAds();}
function applyAdsDateRange(){
  var s=document.getElementById('ads-start');
  var e=document.getElementById('ads-end');
  if(s&&e&&s.value&&e.value){
    _adsStart=new Date(s.value+'T00:00:00');
    _adsEnd=new Date(e.value+'T23:59:59');
    _adsPeriod=null;
    refreshAnaliseAds();
  }
}
function clearAdsDateRange(){
  _adsStart=null;_adsEnd=null;_adsPeriod=getCurrentPeriod();
  refreshAnaliseAds();
}

async function refreshAnaliseAds(){
  var loading=document.getElementById('ads-loading');
  var cont=document.getElementById('ads-content');
  if(!loading||!cont) return;
  loading.style.display='block'; cont.style.display='none';
  try{
    var data=await loadAllSheets();
    cont.innerHTML=buildAnaliseAdsHTML(data);
    cont.style.display='block'; loading.style.display='none';
  }catch(e){
    loading.style.display='none';
    cont.style.display='block';
    cont.innerHTML='<div class="warn-note"><i class="ti ti-alert-triangle"></i> Erro: '+e.message+'</div>';
  }
}

function buildAnaliseAdsHTML(data){
  var period=_adsPeriod||getCurrentPeriod();
  function inAdsRange(d){
    if(!d) return false;
    if(_adsStart&&_adsEnd) return d>=_adsStart&&d<=_adsEnd;
    return periodStr(d)===period;
  }

  // Filter leads by period — all leads with Ad filled = paid traffic
  var leadsTrafego=data.leads.rows.filter(function(r){
    var d=parseBRDate(col(r,['Data','DATA','data']));
    if(!inAdsRange(d)) return false;
    var ad=(col(r,['Ad','AD','ad'])||'').trim();
    return ad && ad!=='-' && ad!=='(sem ad)';
  });

  // Build phone→reuniao map (normalize phone: digits only, last 9 digits)
  var reunMap={};
  var reunNomeMap={};
  data.reunioes.rows.forEach(function(r){
    var tel=(col(r,['TELEFONE','Telefone','telefone'])||'').replace(/\D/g,'');
    if(tel.length>9) tel=tel.slice(-9);
    if(tel) reunMap[tel]=r;
    // Also index by nome for fallback
    var nome=(col(r,['CLIENTE','Cliente','cliente'])||'').trim().toLowerCase();
    if(nome) reunNomeMap[nome]=r;
  });

  // Build nome→cliente map (reuniao.CLIENTE → clientes.CLIENTE)
  var cliNomeMap={};
  data.clientes.rows.forEach(function(c){
    var nome=(col(c,['CLIENTE','Cliente','cliente'])||'').trim().toLowerCase();
    if(nome) cliNomeMap[nome]=c;
  });

  // Aggregate by ad
  var adData={};
  leadsTrafego.forEach(function(l){
    var ad=(col(l,['Ad','AD','ad'])||'').trim();
    var campanha=(col(l,['Campanha','CAMPANHA','campanha'])||'').trim();
    var conjunto=(col(l,['Conjunto','CONJUNTO','conjunto'])||'').trim();
    var fat=parseFaturamento(col(l,['Faturamento','FATURAMENTO','faturamento']));
    var telRaw=(col(l,['Telefone','TELEFONE','telefone'])||'').replace(/\D/g,'');
    var tel=telRaw.length>9?telRaw.slice(-9):telRaw;
    if(!ad||ad==='-') ad='(sem ad)';
    if(!adData[ad]) adData[ad]={ad:ad,campanha:campanha,conjunto:conjunto,leads:0,qualif:0,reunioes:0,realizadas:0,fechamentos:0,mrr:0,fats:[]};
    var d=adData[ad];
    d.leads++;
    if(fat>=40000) d.qualif++;
    d.fats.push(fat);
    // Lead → Reunião por telefone
    var reun=tel?reunMap[tel]:null;
    if(reun){
      d.reunioes++;
      var st=(col(reun,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status'])||'').toUpperCase();
      if(isRealizada(st)) d.realizadas++;
      // Reunião → Cliente: tenta EMPRESA primeiro, depois CLIENTE como fallback
      var empresaReun=(col(reun,['EMPRESA','Empresa','empresa'])||'').trim().toLowerCase();
      var nomeReun=(col(reun,['CLIENTE','Cliente','cliente'])||'').trim().toLowerCase();
      var cli=cliNomeMap[empresaReun]||cliNomeMap[nomeReun];
      if(cli){
        d.fechamentos++;
        var mrr=parseMoney(col(cli,['VALOR CONTRATO/MÊS','VALOR CONTRATO/MES','Valor Contrato/Mês']));
        d.mrr+=mrr;
      }
    }
  });

  var ads=Object.values(adData).sort(function(a,b){return b.leads-a.leads;});
  if(ads.length===0) return '<div class="empty-st"><i class="ti ti-ad-2"></i><p>Nenhum lead de anúncio encontrado no período</p></div>';

  // ===== SCORING =====
  // Dimensions (weights sum to 100):
  // 1. Taxa qualificação 40k+ (25%) — qualif/leads
  // 2. Taxa reunião agendada (20%) — reunioes/qualif
  // 3. Taxa reunião realizada (20%) — realizadas/reunioes
  // 4. Taxa fechamento (25%) — fechamentos/realizadas
  // 5. Volume (10%) — leads rel. to max
  var maxLeads=Math.max.apply(null,ads.map(function(a){return a.leads;}));

  ads.forEach(function(a){
    var txQ=a.leads>0?a.qualif/a.leads:0;
    var txR=a.qualif>0?a.reunioes/a.qualif:0;
    var txReal=a.reunioes>0?a.realizadas/a.reunioes:0;
    var txF=a.realizadas>0?a.fechamentos/a.realizadas:0;
    var vol=maxLeads>0?a.leads/maxLeads:0;
    a.score=Math.round(txQ*25+txR*20+txReal*20+txF*25+vol*10);
    a.txQ=txQ; a.txR=txR; a.txReal=txReal; a.txF=txF;
  });

  // Sort by score desc
  var adsSorted=[].concat(ads).sort(function(a,b){return b.score-a.score;});

  // ===== SUMMARY CARDS =====
  var totLeads=ads.reduce(function(s,a){return s+a.leads;},0);
  var totQualif=ads.reduce(function(s,a){return s+a.qualif;},0);
  var totReun=ads.reduce(function(s,a){return s+a.reunioes;},0);
  var totReal=ads.reduce(function(s,a){return s+a.realizadas;},0);
  var totFech=ads.reduce(function(s,a){return s+a.fechamentos;},0);
  var totMrr=ads.reduce(function(s,a){return s+a.mrr;},0);

  var html='';

  // Summary cards
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px;">';
  var sumCards=[
    {l:'Leads Tráfego',v:totLeads,c:'var(--purple3)'},
    {l:'Qualificados 40k+',v:totQualif,c:'var(--cyan)'},
    {l:'Reuniões Agend.',v:totReun,c:'var(--amber)'},
    {l:'Reuniões Reais',v:totReal,c:'var(--green)'},
    {l:'Fechamentos',v:totFech,c:'var(--green)'},
    {l:'MRR Gerado',v:'R$'+totMrr.toLocaleString('pt-BR',{maximumFractionDigits:0}),c:'var(--green)'}
  ];
  sumCards.forEach(function(c){
    html+='<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;">'+
      '<div style="font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">'+c.l+'</div>'+
      '<div style="font-family:var(--font-bn),sans-serif;font-size:32px;color:'+c.c+';">'+c.v+'</div>'+
    '</div>';
  });
  html+='</div>';


  // ===== FUNIL VISUAL =====
  if(ads.length>0){
    html+='<div class="cb" style="margin-bottom:16px;">'+
      '<div class="cb-hd"><div class="cb-title"><i class="ti ti-filter" style="color:var(--purple3);margin-right:6px;"></i>Funil de Conversão</div></div>'+
      '<div style="padding:20px 24px;">';
    var etapas=[
      {label:'Leads Tráfego',val:totLeads,cor:'var(--purple3)',icon:'ti-users'},
      {label:'Reuniões Agend.',val:totReun,cor:'var(--amber)',icon:'ti-calendar'},
      {label:'Reuniões Reais',val:totReal,cor:'var(--cyan)',icon:'ti-calendar-check'},
      {label:'Fechamentos',val:totFech,cor:'var(--green)',icon:'ti-trophy'}
    ];
    var maxVal2=totLeads||1;
    html+='<div style="display:flex;flex-direction:column;gap:8px;max-width:600px;margin:0 auto;">';
    etapas.forEach(function(e,i){
      var pct=Math.round(e.val/maxVal2*100);
      var convPct=i>0&&etapas[i-1].val>0?Math.round(e.val/etapas[i-1].val*100):null;
      var w=Math.max(pct,8);
      html+='<div style="text-align:center;">'+
        (convPct!==null?'<div style="font-family:Barlow Condensed,sans-serif;font-size:12px;color:var(--muted);margin-bottom:4px;">↓ '+convPct+'% de conversão</div>':'')+
        '<div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:2px;">'+
          '<div style="width:'+w+'%;margin:0 auto;background:'+e.cor+';border-radius:8px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;min-width:220px;">'+
            '<div style="display:flex;align-items:center;gap:10px;">'+
              '<i class="ti '+e.icon+'" style="font-size:20px;color:rgba(0,0,0,0.5);"></i>'+
              '<span style="font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;color:rgba(0,0,0,0.7);letter-spacing:1px;text-transform:uppercase;">'+e.label+'</span>'+
            '</div>'+
            '<span style="font-family:var(--font-bn),sans-serif;font-size:28px;color:rgba(0,0,0,0.75);">'+e.val+'</span>'+
          '</div>'+
        '</div>'+
      '</div>';
    });
    html+='</div>';
    html+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;">';
    [{l:'Lead → Reunião',v:totLeads>0?Math.round(totReun/totLeads*100):0},
     {l:'Reunião → Fechamento',v:totReal>0?Math.round(totFech/totReal*100):0},
     {l:'Lead → Fechamento',v:totLeads>0?Math.round(totFech/totLeads*100):0}
    ].forEach(function(t){
      html+='<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;">'+
        '<div style="font-family:Barlow Condensed,sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">'+t.l+'</div>'+
        '<div style="font-family:var(--font-bn),sans-serif;font-size:28px;color:var(--white);">'+t.v+'%</div>'+
      '</div>';
    });
    html+='</div></div></div>';
  }

  // ===== SCORE RANKING =====
  html+='<div class="cb" style="margin-bottom:16px;">'+
    '<div class="cb-hd"><div class="cb-title"><i class="ti ti-trophy" style="color:var(--amber);margin-right:6px;"></i>Score Ranking · Top Ads</div>'+
    '<span class="badge b-amber">'+adsSorted.length+' ads</span></div>'+
    '<div style="padding:14px 16px;">';

  adsSorted.slice(0,15).forEach(function(a,i){
    var badge=a.score>=70?'<span style="background:rgba(34,197,94,0.2);color:var(--green);border:1px solid rgba(34,197,94,0.4);border-radius:4px;font-size:10px;font-weight:700;padding:2px 7px;font-family:Barlow Condensed,sans-serif;letter-spacing:1px;">TOP</span>':
              a.score>=40?'<span style="background:rgba(245,158,11,0.2);color:var(--amber);border:1px solid rgba(245,158,11,0.4);border-radius:4px;font-size:10px;font-weight:700;padding:2px 7px;font-family:Barlow Condensed,sans-serif;letter-spacing:1px;">MÉD</span>':
              '<span style="background:rgba(239,68,68,0.15);color:var(--red);border:1px solid rgba(239,68,68,0.3);border-radius:4px;font-size:10px;font-weight:700;padding:2px 7px;font-family:Barlow Condensed,sans-serif;letter-spacing:1px;">FRACO</span>';
    var corScore=a.score>=70?'var(--green)':a.score>=40?'var(--amber)':'var(--red)';
    var medalha=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    html+='<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05);">'+
      '<div style="width:32px;text-align:center;font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;color:var(--muted);flex-shrink:0;">'+(medalha||'#'+(i+1))+'</div>'+
      '<div style="flex:1;min-width:0;">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">'+
          '<span style="font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;">'+a.ad+'</span>'+
          badge+
        '</div>'+
        '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+
          '<span style="font-size:11px;color:var(--muted);font-family:Barlow Condensed,sans-serif;">'+a.leads+' leads</span>'+
          '<span style="font-size:11px;color:var(--cyan);font-family:Barlow Condensed,sans-serif;">'+a.qualif+' qualif.</span>'+
          '<span style="font-size:11px;color:var(--amber);font-family:Barlow Condensed,sans-serif;">'+a.reunioes+' reun.</span>'+
          '<span style="font-size:11px;color:var(--green);font-family:Barlow Condensed,sans-serif;">'+a.fechamentos+' fechou</span>'+
          (a.mrr>0?'<span style="font-size:11px;color:var(--green);font-family:Barlow Condensed,sans-serif;">R$'+a.mrr.toLocaleString('pt-BR',{maximumFractionDigits:0})+' MRR</span>':'')+
        '</div>'+
        // Score bar
        '<div style="margin-top:6px;height:4px;background:var(--border);border-radius:2px;">'+
          '<div style="height:4px;background:'+corScore+';border-radius:2px;width:'+a.score+'%;transition:width .5s;"></div>'+
        '</div>'+
      '</div>'+
      '<div style="font-family:var(--font-bn),sans-serif;font-size:28px;color:'+corScore+';min-width:48px;text-align:right;">'+a.score+'</div>'+
    '</div>';
  });
  html+='</div></div>';

  // ===== TABELA DETALHADA =====
  html+='<div class="cb" style="margin-bottom:16px;">'+
    '<div class="cb-hd"><div class="cb-title"><i class="ti ti-table" style="color:var(--purple3);margin-right:6px;"></i>Tabela Completa</div></div>'+
    '<div style="overflow-x:auto;">'+
    '<table style="width:100%;border-collapse:collapse;font-family:Barlow Condensed,sans-serif;font-size:13px;">'+
    '<thead><tr style="border-bottom:1px solid var(--border);">'+
      '<th style="text-align:left;padding:10px 14px;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;">Ad</th>'+
      '<th style="text-align:center;padding:10px 10px;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;">Leads</th>'+
      '<th style="text-align:center;padding:10px 10px;color:var(--cyan);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;">Qualif.</th>'+
      '<th style="text-align:center;padding:10px 10px;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;">% Qual</th>'+
      '<th style="text-align:center;padding:10px 10px;color:var(--amber);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;">Reun.</th>'+
      '<th style="text-align:center;padding:10px 10px;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;">Realiz.</th>'+
      '<th style="text-align:center;padding:10px 10px;color:var(--green);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;">Fech.</th>'+
      '<th style="text-align:center;padding:10px 10px;color:var(--green);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;">MRR</th>'+
      '<th style="text-align:center;padding:10px 14px;color:var(--amber);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;">Score</th>'+
    '</tr></thead><tbody>';

  ads.sort(function(a,b){return b.score-a.score;}).forEach(function(a){
    var corS=a.score>=70?'var(--green)':a.score>=40?'var(--amber)':'var(--red)';
    html+='<tr style="border-bottom:1px solid rgba(255,255,255,0.04);">'+
      '<td style="padding:10px 14px;color:var(--white);font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+a.ad+'</td>'+
      '<td style="text-align:center;padding:10px;color:var(--white);">'+a.leads+'</td>'+
      '<td style="text-align:center;padding:10px;color:var(--cyan);font-weight:700;">'+a.qualif+'</td>'+
      '<td style="text-align:center;padding:10px;color:var(--muted);">'+Math.round(a.txQ*100)+'%</td>'+
      '<td style="text-align:center;padding:10px;color:var(--amber);">'+a.reunioes+'</td>'+
      '<td style="text-align:center;padding:10px;color:var(--muted);">'+a.realizadas+'</td>'+
      '<td style="text-align:center;padding:10px;color:var(--green);font-weight:700;">'+a.fechamentos+'</td>'+
      '<td style="text-align:center;padding:10px;color:var(--green);">'+(a.mrr>0?'R$'+a.mrr.toLocaleString('pt-BR',{maximumFractionDigits:0}):'—')+'</td>'+
      '<td style="text-align:center;padding:10px 14px;font-weight:700;color:'+corS+';font-size:16px;">'+a.score+'</td>'+
