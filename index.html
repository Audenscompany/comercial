<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-database-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pizzip@3.2.0/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.68.7/build/docxtemplater.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audens Company · CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#06060e;--bg2:#0c0c1a;--card:#13132a;--card2:#1a1a35;
  --border:rgba(138,43,226,0.25);--border2:rgba(138,43,226,0.45);
  --purple:#7b2fff;--purple2:#9d5cff;--purple3:#c084fc;
  --pglow:rgba(123,47,255,0.15);--pglow2:rgba(123,47,255,0.08);
  --white:#f5f0ff;--muted:#7070a0;
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;--cyan:#38bdf8;
}
body{font-family:Barlow,sans-serif;background:var(--bg);color:var(--white);min-height:100vh;}
.screen{display:none;}.screen.active{display:flex;}
#login-screen{min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#06060e 0%,#0d0818 50%,#06060e 100%);}
#main-screen{flex-direction:row;min-height:100vh;}
.login-box{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:40px 36px;width:400px;max-width:95vw;}
.login-logo{font-family:Bebas Neue,sans-serif;font-size:52px;letter-spacing:6px;color:var(--white);line-height:1;text-align:center;}
.login-sub{font-family:Barlow Condensed,sans-serif;font-size:13px;letter-spacing:5px;color:var(--purple2);text-align:center;margin-bottom:4px;text-transform:uppercase;}
.login-div{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--purple),transparent);margin:16px auto 28px;}
.role-tabs{display:flex;gap:6px;margin-bottom:22px;background:rgba(0,0,0,0.3);border-radius:10px;padding:4px;border:1px solid var(--border);}
.role-tab{flex:1;padding:9px 6px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.role-tab.active{background:var(--purple);color:white;}
.f-label{display:block;font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.f-input{width:100%;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--white);font-family:Barlow,sans-serif;font-size:14px;outline:none;transition:border-color .2s;margin-bottom:16px;}
.f-input:focus{border-color:var(--purple);}
.btn-login{width:100%;padding:14px;background:var(--purple);border:none;border-radius:8px;color:white;font-family:Bebas Neue,sans-serif;font-size:22px;letter-spacing:4px;cursor:pointer;transition:all .2s;margin-top:4px;}
.btn-login:hover{background:var(--purple2);}
.login-err{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:18px;font-family:Barlow Condensed,sans-serif;}
.cred-hint{margin-top:20px;background:rgba(123,47,255,0.08);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.cred-hint-title{font-family:Barlow Condensed,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.cred-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;}
.cred-row:last-child{margin-bottom:0;}
.cred-name{font-family:Barlow Condensed,sans-serif;font-weight:700;color:var(--white);font-size:13px;}
.cred-detail{font-family:monospace;font-size:11px;color:var(--muted);}
.cred-tag{font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:1px;}
.cred-tag.g{background:rgba(123,47,255,0.2);color:var(--purple3);}
.cred-tag.a{background:rgba(56,189,248,0.15);color:var(--cyan);}
.sidebar{width:230px;height:100vh;position:sticky;top:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
#sidebar-nav{overflow:hidden;flex:1;display:flex;flex-direction:column;}
/* Nav Groups */
.nav-group-hd{display:flex;align-items:center;gap:10px;padding:8px 20px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-left:2px solid transparent;transition:all .15s;user-select:none;}
.nav-group-hd:hover{color:var(--white);background:var(--pglow2);}
.nav-group-hd.open{color:var(--purple3);}
.nav-group-hd i.nav-g-icon{font-size:16px;}
.nav-group-arr{margin-left:auto;font-size:13px;transition:transform .2s;}
.nav-group-hd.open .nav-group-arr{transform:rotate(90deg);}
.nav-group-items{display:none;background:rgba(0,0,0,0.15);}
.nav-group-items.open{display:block;}
.nav-sub{padding-left:32px!important;font-size:13px!important;}
.nav-sep{height:1px;background:var(--border);margin:4px 0;}
.sb-top{padding:24px 20px 16px;border-bottom:1px solid var(--border);}
.sb-brand{font-family:Bebas Neue,sans-serif;font-size:28px;letter-spacing:4px;color:var(--white);line-height:1;}
.sb-sub{font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:600;letter-spacing:5px;color:var(--purple2);}
.sb-tag{font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-top:5px;font-family:Barlow Condensed,sans-serif;text-transform:uppercase;}
.sb-section{padding:12px 0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;border-left:2px solid transparent;transition:all .15s;}
.nav-item:hover{color:var(--white);background:var(--pglow2);}
.nav-item.active{color:var(--purple3);border-left-color:var(--purple);background:var(--pglow);}
.nav-item i{font-size:18px;}
.nav-badge{background:var(--red);color:white;font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:auto;}
.sb-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border);}
.user-pill{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.u-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--purple3));display:flex;align-items:center;justify-content:center;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;color:white;flex-shrink:0;}
.u-name{font-size:13px;font-weight:600;color:var(--white);font-family:Barlow Condensed,sans-serif;}
.u-role{font-size:11px;color:var(--muted);}
.btn-logout{width:100%;padding:8px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .15s;text-transform:uppercase;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}
.main-content{flex:1;min-height:100vh;background:var(--bg);overflow-y:auto;}
.page{display:none;padding:28px;}.page.active{display:block;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.page-title{font-family:Bebas Neue,sans-serif;font-size:34px;letter-spacing:2px;color:var(--white);line-height:1;}
.page-sub{font-size:12px;color:var(--muted);margin-top:4px;font-family:Barlow Condensed,sans-serif;letter-spacing:1px;text-transform:uppercase;}
.date-chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 14px;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;color:var(--purple2);letter-spacing:1px;white-space:nowrap;}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px;}
.m-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 16px;position:relative;overflow:hidden;}
.m-stripe{position:absolute;top:0;left:0;right:0;height:3px;background:var(--purple);}
.m-stripe.cyan{background:var(--cyan);}.m-stripe.amber{background:var(--amber);}.m-stripe.green{background:var(--green);}
.m-ico{position:absolute;top:14px;right:14px;font-size:22px;opacity:0.13;}
.m-lbl{font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.m-val{font-family:Bebas Neue,sans-serif;font-size:38px;letter-spacing:1px;color:var(--white);line-height:1;}
.m-hint{font-size:12px;color:var(--muted);margin-top:4px;}
.cb{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px;}
.cb-hd{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2);}
.cb-title{font-family:Barlow Condensed,sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--white);}
.meta-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;}
.meta-block::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--purple3));}
.meta-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.meta-title{font-family:Bebas Neue,sans-serif;font-size:18px;letter-spacing:2px;color:var(--white);}
.meta-pct{font-family:Bebas Neue,sans-serif;font-size:28px;letter-spacing:1px;}
.meta-bar-wrap{background:rgba(255,255,255,0.06);border-radius:6px;height:10px;overflow:hidden;margin-bottom:10px;}
.meta-bar-fill{height:100%;border-radius:6px;transition:width .6s ease;}
.meta-nums{display:flex;justify-content:space-between;font-family:Barlow Condensed,sans-serif;font-size:12px;color:var(--muted);}
.meta-nums strong{color:var(--white);}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.badge{font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;letter-spacing:0.5px;text-transform:uppercase;}
.b-purple{background:rgba(123,47,255,0.15);color:var(--purple3);border:1px solid rgba(123,47,255,0.35);}
.b-green{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.3);}
.b-amber{background:rgba(245,158,11,0.12);color:#fbbf24;border:1px solid rgba(245,158,11,0.3);}
.b-red{background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.3);}
.b-cyan{background:rgba(56,189,248,0.12);color:#7dd3fc;border:1px solid rgba(56,189,248,0.3);}
.b-muted{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid rgba(255,255,255,0.08);}
.b-orange{background:rgba(249,115,22,0.12);color:#fb923c;border:1px solid rgba(249,115,22,0.3);}
.b-gold{background:rgba(234,179,8,0.12);color:#fde047;border:1px solid rgba(234,179,8,0.3);}
table{width:100%;border-collapse:collapse;}
thead th{padding:10px 16px;font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);}
tbody td{padding:12px 16px;font-size:13px;color:var(--white);border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--pglow2);}
.t-scroll{overflow-x:auto;}
.btn{padding:7px 14px;border-radius:7px;font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--purple);color:white;}.btn-primary:hover{background:var(--purple2);}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--purple3);}.btn-outline:hover{background:var(--pglow);}
.btn-reg{background:var(--purple);color:white;padding:6px 12px;}
.btn-edit{background:transparent;border:1px solid var(--border);color:var(--muted);}.btn-edit:hover{border-color:var(--purple2);color:var(--purple3);}
.btn-task{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3);padding:6px 12px;}.btn-task:hover{background:rgba(239,68,68,0.25);}
.btn-gcal{background:rgba(66,133,244,0.15);color:#7dd3fc;border:1px solid rgba(66,133,244,0.3);padding:6px 12px;}
.prog-wrap{background:rgba(255,255,255,0.06);border-radius:4px;height:5px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;background:var(--purple);transition:width .4s;}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:300;align-items:center;justify-content:center;}
.modal-ov.open,.modal-ov.active{display:flex;}
.kanban-tel{cursor:pointer;}.kanban-tel:hover{color:var(--cyan);}
.tel-copiado{color:var(--green)!important;}
.modal-box{background:var(--card2);border:1px solid var(--border2);border-radius:16px;padding:28px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;}
.modal-title{font-family:Bebas Neue,sans-serif;font-size:26px;letter-spacing:2px;color:var(--white);margin-bottom:4px;}
.modal-sub{font-family:Barlow Condensed,sans-serif;font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:20px;}
.modal-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}
.f-select{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--white);font-family:Barlow,sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.f-select:focus{border-color:var(--purple);}
.modal-steps{display:flex;gap:8px;margin-bottom:24px;align-items:center;}
.modal-step{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;flex-shrink:0;}
.modal-step.done{background:var(--green);color:white;}.modal-step.active{background:var(--purple);color:white;}
.modal-step.pending{background:rgba(255,255,255,0.06);color:var(--muted);border:1px solid var(--border);}
.modal-step-line{flex:1;height:1px;background:var(--border);}
.reuniao-card{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.task-alert{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.35);border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:background .2s;}
.task-alert:hover{background:rgba(239,68,68,0.14);}
.offday-banner{border-radius:16px;padding:48px 32px;text-align:center;border:1px solid;}
.goal-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.goal-row:last-child{border-bottom:none;}
.goal-label{flex:1;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;color:var(--white);}
.goal-input{width:100px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--white);font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;outline:none;text-align:center;}
.goal-input:focus{border-color:var(--purple);}
.info-note{padding:11px 14px;background:rgba(123,47,255,0.1);border:1px solid rgba(123,47,255,0.25);border-radius:8px;font-family:Barlow Condensed,sans-serif;font-size:13px;color:var(--purple3);letter-spacing:0.5px;margin-bottom:16px;}
.warn-note{padding:11px 14px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.25);border-radius:8px;font-family:Barlow Condensed,sans-serif;font-size:13px;color:var(--amber);margin-bottom:16px;}
.success-note{padding:11px 14px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:8px;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;color:#4ade80;letter-spacing:1px;}
.empty-st{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-st i{font-size:40px;display:block;margin-bottom:12px;color:rgba(123,47,255,0.3);}
.empty-st p{font-family:Barlow Condensed,sans-serif;font-size:14px;letter-spacing:1px;text-transform:uppercase;}
.funil-step{margin-bottom:14px;}
.funil-row{display:flex;justify-content:space-between;margin-bottom:5px;}
.funil-name{font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;color:var(--white);}
.chart-area{display:flex;align-items:flex-end;gap:8px;height:120px;padding:0 4px;}
.bar-g{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
.bar-stack{display:flex;align-items:flex-end;gap:2px;height:90px;width:100%;}
.bar{width:100%;border-radius:3px 3px 0 0;min-height:2px;}
.bar-l{font-family:Barlow Condensed,sans-serif;font-size:10px;color:var(--muted);margin-top:4px;}
.bar-v{font-family:Bebas Neue,sans-serif;font-size:13px;color:var(--purple3);}
.upload-zone{border:2px dashed var(--border2);border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:8px;}
.upload-zone:hover{border-color:var(--purple);background:var(--pglow);}
.upload-zone i{font-size:40px;color:var(--purple2);margin-bottom:12px;display:block;}
.upload-zone p{color:var(--muted);font-size:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-head{font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 0;}
.cal-day{border-radius:6px;padding:6px 4px;text-align:center;font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:600;min-height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.cal-day.empty{background:transparent;}.cal-day.weekend{background:rgba(112,112,160,0.08);color:var(--muted);}
.cal-day.holiday{background:rgba(249,115,22,0.1);color:#fb923c;border:1px solid rgba(249,115,22,0.2);}
.cal-day.workday{background:var(--pglow2);color:var(--white);border:1px solid var(--border);}
.cal-day.today-mark{border:2px solid var(--purple)!important;color:var(--purple3)!important;}
.cal-day.has-calls{background:rgba(34,197,94,0.1);color:#4ade80;border:1px solid rgba(34,197,94,0.2);}
.bonus-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;}
.bonus-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--amber),#fde047);}
.bonus-total{font-family:Bebas Neue,sans-serif;font-size:42px;letter-spacing:1px;color:#fde047;line-height:1;}
.gcal-status{display:flex;align-items:center;gap:8px;font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;margin-bottom:16px;}
.gcal-status.connected{background:rgba(34,197,94,0.1);color:#4ade80;border:1px solid rgba(34,197,94,0.3);}
.gcal-status.disconnected{background:rgba(245,158,11,0.1);color:var(--amber);border:1px solid rgba(245,158,11,0.3);}
@keyframes spin{to{transform:rotate(360deg)}}
.kanban-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scrollbar-width:none;-ms-overflow-style:none;}
.kanban-board::-webkit-scrollbar{display:none;}
.kanban-col{flex:0 0 270px;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;max-height:75vh;}
.kanban-col-hd{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--white);border-radius:12px 12px 0 0;}

.kanban-col-body.drag-over{background:var(--pglow2);border-radius:0 0 12px 12px;}
.kanban-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:grab;transition:border-color .15s,opacity .15s;}
.kanban-card:hover{border-color:var(--border2);}
.kanban-card.dragging{opacity:0.4;}
.kanban-card-name{font-weight:700;font-size:14px;color:var(--white);margin-bottom:4px;}
.kanban-card-sub{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px;}

.kbtn{background:transparent;border:1px solid var(--border2);color:var(--purple3);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px;}

.kanban-empty{text-align:center;padding:24px 8px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:1px;}

.sdr-task-check input{width:19px;height:19px;accent-color:var(--purple);cursor:pointer;}
.sdr-task-icon{width:38px;height:38px;border-radius:10px;background:var(--pglow2);display:flex;align-items:center;justify-content:center;color:var(--purple3);font-size:17px;flex-shrink:0;}
.sdr-task-info{flex:1;min-width:0;}
.sdr-task-lead{font-weight:700;font-size:14px;color:var(--white);}
.sdr-task-tipo{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px;}
.sdr-task-date{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;flex-shrink:0;}

.tarefas-col{flex:1;min-width:280px;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;max-height:75vh;}
.tarefas-col-hd{padding:12px 16px;border-bottom:1px solid var(--border);border-top:3px solid var(--muted);display:flex;align-items:center;justify-content:space-between;background:var(--bg2);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--white);border-radius:12px 12px 0 0;}
.tarefas-col-hd.tarefas-hd-red{border-top-color:var(--red);}
.tarefas-col-hd.tarefas-hd-purple{border-top-color:var(--purple);}
.tarefas-col-hd.tarefas-hd-cyan{border-top-color:var(--cyan);}
.tarefas-col-count{background:var(--pglow2);color:var(--purple3);border-radius:20px;padding:2px 10px;font-size:12px;}
.tarefas-col-body{overflow-y:auto;flex:1;scrollbar-width:none;-ms-overflow-style:none;}
.tarefas-col-body::-webkit-scrollbar{display:none;}
.tarefas-col-body .sdr-task-row{padding:12px 16px;}

<script>
// ===== USERS =====
var USERS={
  'lucas@audens.com':{pw:'audens2025',role:'gestor',name:'Lucas Siqueira',initials:'LS',closer:'Lucas',funcao:'gestor'},
  'gustavo@audens.com':{pw:'closer2025',role:'atendente',name:'Gustavo Pimenta',initials:'GP',closer:'Gustavo',funcao:'closer'},
  'joao@audens.com':{pw:'sdr2025',role:'atendente',name:'João Silva',initials:'JS',closer:'João',funcao:'sdr'}
};
var CLOSERS=['Lucas','Gustavo'];
var SDR_USERS=['João'];
var BONUS_COMP=30,BONUS_VENDA_PCT=0.25;
// Tempo apos o horario marcado da reuniao em que o follow-up (Realizada/No-show) passa a ficar pendente
var MEETING_DURATION_MS=60*60*1000;

// ===== HOLIDAYS =====
var FIXED_HOL={'01-01':'Confraternizacao','04-21':'Tiradentes','05-01':'Dia do Trabalho',
  '09-07':'Independencia','10-12':'N.Sra Aparecida','11-02':'Finados',
  '11-15':'Proclamacao Republica','11-20':'Consciencia Negra','12-25':'Natal'};
function movableHolidays(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
      h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1;
  var easter=new Date(y,mo-1,dy);
  function fmt(d){return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function add(base,n){var d=new Date(base);d.setDate(d.getDate()+n);return d;}
  var r={};r[fmt(add(easter,-48))]='Carnaval';r[fmt(add(easter,-47))]='Carnaval';
  r[fmt(add(easter,-2))]='Sexta Santa';r[fmt(easter)]='Pascoa';r[fmt(add(easter,60))]='Corpus Christi';
  return r;
}
function allHolidays(y){return Object.assign({},FIXED_HOL,movableHolidays(y));}
function checkDay(d){
  var dow=d.getDay();
  if(dow===0)return{ok:false,type:'weekend',label:'Domingo'};
  if(dow===6)return{ok:false,type:'weekend',label:'Sabado'};
  var mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  var h=allHolidays(d.getFullYear())[mm+'-'+dd];
  if(h)return{ok:false,type:'holiday',label:h};
  return{ok:true};
}
function nextBusinessDay(d){
  var nd=new Date(d);
  do{ nd.setDate(nd.getDate()+1); }while(!checkDay(nd).ok);
  return nd;
}

// ===== STATE =====
var CU=null,selRole='gestor';

// Auto-restore session on page load
window.addEventListener('DOMContentLoaded', function(){
  // Link de assinatura de contrato (?sign=<id>) - tela publica, sem login
  var signId=new URLSearchParams(window.location.search).get('sign');
  if(signId){
    if(!fbDb) initFirebase();
    document.getElementById('login-screen').classList.remove('active');
    document.getElementById('sign-screen').classList.add('active');
    renderSignPage(signId);
    return;
  }
  var saved = localStorage.getItem('audens_session');
  if(saved){
    try{
      var s = JSON.parse(saved);
      var u = USERS[s.email];
      if(u){
        if(!fbDb) initFirebase();
        CU = {email:s.email,role:u.role,name:u.name,initials:u.initials,closer:u.closer,funcao:u.funcao||'closer'};
        showMain();
        return;
      }
    }catch(e){}
    localStorage.removeItem('audens_session');
  }
});
// ===== FIREBASE CONFIG =====
var firebaseConfig = {
  apiKey: "AIzaSyD2CC8Sr5ifpJsy6pW0_o7blFshTCdhf8s",
  authDomain: "audens-crm.firebaseapp.com",
  databaseURL: "https://audens-crm-default-rtdb.firebaseio.com",
  projectId: "audens-crm",
  storageBucket: "audens-crm.firebasestorage.app",
  messagingSenderId: "471063273836",
  appId: "1:471063273836:web:fcf4ee7aeaead3a2d95349"
};
var fbDb = null;
function initFirebase(){
  try{
    if(typeof firebase === 'undefined'){
      console.error('Firebase SDK not loaded');
      // Try to load SDK dynamically
      return false;
    }
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
    fbDb = firebase.database();
    return true;
  }catch(e){console.error('Firebase init error',e);return false;}
}

function ensureFirebase(cb){
  if(fbDb){cb();return;}
  if(initFirebase()){cb();return;}
  // SDK not ready yet - wait and retry
  var tries=0;
  var timer=setInterval(function(){
    tries++;
    if(typeof firebase !== 'undefined'){
      clearInterval(timer);
      initFirebase();
      cb();
    } else if(tries>20){
      clearInterval(timer);
      console.error('Firebase failed to load after retries');
    }
  },100);
}

// ===== FIREBASE HELPERS =====
function fbSet(path, data){ if(!fbDb&&!initFirebase())return Promise.resolve(null); return fbDb.ref(path).set(data); }
function fbPush(path, data){ if(!fbDb&&!initFirebase())return Promise.resolve(null); return fbDb.ref(path).push(data); }
function fbGet(path){ if(!fbDb&&!initFirebase())return Promise.resolve(null); return fbDb.ref(path).once('value').then(function(s){return s.val();}); }
function fbOn(path, cb){ if(!fbDb&&!initFirebase())return; fbDb.ref(path).on('value', function(s){cb(s.val());}); }

// ===== REALTIME SYNC =====
var _fbSyncActive = false;

function startRealtimeSync(){
  if(_fbSyncActive) return;
  _fbSyncActive = true;

  // Sync calls (ligações registradas)
  if(!fbDb){console.warn('fbDb null in startRealtimeSync');return;}
  fbDb.ref('calls').on('value', function(snap){
    var fbCalls = snap.val();
    if(!fbCalls) return;
    var prev = JSON.stringify(calls);
    Object.assign(calls, fbCalls);
    if(JSON.stringify(calls) !== prev){
      saveAll();
      var area = document.getElementById('content');
      var pg = area ? area.getAttribute('data-page') : null;
      if(pg==='ligar'||pg==='meu-hist'||pg==='historico'||pg==='dashboard') showPage(pg);
    }
  });

  // Sync meetings
  fbDb.ref('meetings').on('value', function(snap){
    var fbMeetings = snap.val();
    if(!fbMeetings) return;
    var prev = JSON.stringify(meetings);
    Object.assign(meetings, fbMeetings);
    if(JSON.stringify(meetings) !== prev){
      saveAll();
      var area = document.getElementById('content');
      var pg = area ? area.getAttribute('data-page') : null;
      if(pg==='reunioes'||pg==='dashboard'||pg==='dash-comercial') showPage(pg);
    }
    // Sync planilha→Firebase uma vez por sessão após meetings carregarem
    setTimeout(syncReunioesFBFromSheet, 2000);
  });

  // Sync leads (Módulo 1 — webhook LP -> /leads grava aqui em tempo real)
  fbDb.ref('leads').on('value', function(snap){
    var fbLeads = snap.val();
    if(!fbLeads) return;
    var loaded = [];
    Object.values(fbLeads).forEach(function(l){
      // só pega leads criados pelo webhook da LP (têm _createdAt) — ignora a base antiga
      if(l && l.nome && l.telefone && l._createdAt) loaded.push(l);
    });
    var existingTels = new Set(allLeads.map(function(l){return(l.telefone||'').replace(/\D/g,'');}));
    var newOnes = loaded.filter(function(l){return !existingTels.has((l.telefone||'').replace(/\D/g,''));});
    if(newOnes.length){
      allLeads = allLeads.concat(newOnes);
      _dailyMap = {};
      saveAll();
      var area = document.getElementById('content');
      var pg = area ? area.getAttribute('data-page') : null;
      if(pg==='ligar'||pg==='leads'||pg==='dashboard') showPage(pg);
    }
    // Garante que todo lead novo entre no Kanban (coluna "Novo Lead")
    loaded.forEach(function(l){ ensureKanbanEntry(l); });
  });

  // Sync kanban (Funil de Leads) em tempo real
  var _kanbanFirstLoad = true;
  fbDb.ref('kanban').on('value', function(snap){
    var fbKanban = snap.val() || {};
    var prev = JSON.stringify(kanbanData);
    kanbanData = fbKanban;
    var changed = JSON.stringify(kanbanData) !== prev;
    if(changed){
      localStorage.setItem('audens_kanban', JSON.stringify(kanbanData));
      var area = document.getElementById('content');
      var pg = area ? area.getAttribute('data-page') : null;
      if(pg==='kanban') showPage('kanban');
    }
    if(_kanbanFirstLoad){
      _kanbanFirstLoad = false;
      // Na primeira carga: sync de pendentes após Google auth estar pronto
      setTimeout(syncPendingLeadsToSheets, 2000);
    } else if(changed && isGcalConnected()){
      // Kanban atualizou em tempo real: verifica se há entradas novas sem _sheetSynced
      Object.keys(fbKanban).forEach(function(key){
        var e = fbKanban[key];
        if(!e._sheetSynced && e.nome && e.telefone && !_syncingLeads[key]){
          // Marca imediatamente em memória (update otimista) para evitar re-disparo
          _syncingLeads[key] = true;
          if(kanbanData[key]) kanbanData[key]._sheetSynced = true;
          appendLeadToSheets(e, key).then(function(ok){
            if(!ok) delete _syncingLeads[key]; // libera para retry futuro se falhou
          });
        }
      });
    }
  });

  // Sync tarefas de cadencia (SDR - Joao) em tempo real
  var _sdrFirstLoad = true;
  fbDb.ref('sdr_tarefas').on('value', function(snap){
    var fbTarefas = snap.val() || {};
    var prev = JSON.stringify(sdrTarefas);
    sdrTarefas = fbTarefas;
    if(JSON.stringify(sdrTarefas) !== prev){
      localStorage.setItem('audens_sdr_tarefas', JSON.stringify(sdrTarefas));
      var area = document.getElementById('content');
      var pg = area ? area.getAttribute('data-page') : null;
      if(pg==='minhas-tarefas'||pg==='desempenho-sdr') showPage(pg);
      var tnav=document.getElementById('nav-minhas-tarefas');
      if(tnav){
        var p=getPendingSdrTarefas().length;var ex=tnav.querySelector('.nav-badge');
        if(p>0){if(ex)ex.textContent=p;else tnav.insertAdjacentHTML('beforeend','<span class="nav-badge">'+p+'</span>');}
        else if(ex)ex.remove();
      }
    }
    // Na primeira carga: conclui tarefas de leads que ja estao em reuniao agendada
    if(_sdrFirstLoad){
      _sdrFirstLoad = false;
      setTimeout(concluirTarefasLeadsEmReuniao, 1500);
    }
  });

  // Percorre kanban e conclui automaticamente tarefas pendentes de leads ja em status 'reuniao'
  function concluirTarefasLeadsEmReuniao(){
    if(!fbDb && !initFirebase()) return;
    var batch = {};
    var agora = Date.now();
    // Coleta as keys de leads que ja estao com reuniao agendada
    Object.keys(kanbanData).forEach(function(leadKey){
      var k = kanbanData[leadKey];
      if(k.status !== 'reuniao' && k.status !== 'proposta' && k.status !== 'fechado' &&
         k.status !== 'contrato' && k.status !== 'venda') return;
      // Marca como done todas as tarefas pendentes desse lead
      Object.keys(sdrTarefas).forEach(function(tid){
        var t = sdrTarefas[tid];
        if(t.leadKey === leadKey && !t.done){
          sdrTarefas[tid].done = true;
          sdrTarefas[tid].doneAt = agora;
          batch[tid+'/done'] = true;
          batch[tid+'/doneAt'] = agora;
        }
      });
    });
    if(Object.keys(batch).length){
      fbDb.ref('sdr_tarefas').update(batch);
      localStorage.setItem('audens_sdr_tarefas', JSON.stringify(sdrTarefas));
      // Atualiza badge
      var tnav=document.getElementById('nav-minhas-tarefas');
      if(tnav){var p=getPendingSdrTarefas().length;var ex=tnav.querySelector('.nav-badge');
        if(p>0){if(ex)ex.textContent=p;else tnav.insertAdjacentHTML('beforeend','<span class="nav-badge">'+p+'</span>');}
        else if(ex)ex.remove();}
      // Rerenderiza se a pagina de tarefas estiver aberta
      var area=document.getElementById('content');
      if(area && area.getAttribute('data-page')==='minhas-tarefas') showPage('minhas-tarefas');
    }
  }

  // Sync followups in realtime
  fbDb.ref('followups').on('value', function(snap){
    var fbFU = snap.val();
    if(!fbFU) return;
    var prev = JSON.stringify(followups);
    Object.assign(followups, fbFU);
    if(JSON.stringify(followups) !== prev){
      localStorage.setItem('audens_followups', JSON.stringify(followups));
      var area = document.getElementById('content');
      var pg = area ? area.getAttribute('data-page') : null;
      if(pg==='tarefas'||pg==='meu-hist') showPage(pg);
    }
    // Corrige em background os meetings com status desatualizado no Firebase
    setTimeout(migrateStaleStatuses, 500);
    // Sincroniza status da planilha Reuniões → Firebase (roda uma vez por sessão)
    setTimeout(syncReunioesFBFromSheet, 1500);
  });

  // Sync tarefas_dia in realtime
  fbDb.ref('tarefas_dia').on('value', function(snap){
    var fbTarefas = snap.val();
    var arr = fbTarefas ? Object.values(fbTarefas) : [];
    var localArr = JSON.parse(localStorage.getItem('tarefas_dia')||'[]');
    // Compare by IDs+done state to avoid false positives from JSON ordering
    var fbIds = arr.map(function(t){return t.id+'|'+t.done+'|'+t.doneDate;}).sort().join(',');
    var lcIds = localArr.map(function(t){return t.id+'|'+t.done+'|'+t.doneDate;}).sort().join(',');
    if(fbIds !== lcIds){
      localStorage.setItem('tarefas_dia', JSON.stringify(arr));
      var area = document.getElementById('content');
      var pg = area ? area.getAttribute('data-page') : null;
      if(pg==='tarefas-dia') showPage('tarefas-dia');
    }
  });

  // Sync daily_map por usuário — cada um tem sua própria chave
  var _userDailyRef = 'daily_map/'+(CU?CU.name.toLowerCase().replace(/\s+/g,'_'):'default');
  fbDb.ref(_userDailyRef).on('value', function(snap){
    var fbUserDaily = snap.val();
    if(!fbUserDaily) return;
    // Merge apenas as chaves deste usuário
    var changed = false;
    Object.keys(fbUserDaily).forEach(function(k){
      var fullKey = k; // já é a chave completa (data_usuario)
      if(JSON.stringify(_dailyMap[fullKey]) !== JSON.stringify(fbUserDaily[k])){
        _dailyMap[fullKey] = fbUserDaily[k];
        changed = true;
      }
    });
    if(changed){
      localStorage.setItem('audens_daily', JSON.stringify(_dailyMap));
      var area = document.getElementById('content');
      var pg = area ? area.getAttribute('data-page') : null;
      if(pg==='ligar') showPage('ligar');
    }
  });

  // Sync config (goals, investido, meta_comercial, sheets)
  fbDb.ref('config').on('value', function(snap){
    var cfg = snap.val();
    if(!cfg) return;
    if(cfg.goals){ goals=cfg.goals; localStorage.setItem('audens_goals',JSON.stringify(goals)); }
    if(cfg.investido){ _investidoMes=cfg.investido; localStorage.setItem('audens_inv',JSON.stringify(_investidoMes)); }
    if(cfg.meta_comercial){ _metaComercial=cfg.meta_comercial; localStorage.setItem('audens_mcom',JSON.stringify(_metaComercial)); }
    if(cfg.sheets_ids){ SHEETS_IDS=Object.assign(SHEETS_IDS,cfg.sheets_ids); localStorage.setItem('audens_sheets_ids',JSON.stringify(SHEETS_IDS)); }
    if(cfg.sheets_gids){ SHEETS_GIDS=Object.assign(SHEETS_GIDS,cfg.sheets_gids); localStorage.setItem('audens_sheets_gids',JSON.stringify(SHEETS_GIDS)); }
    if(cfg.gcalClientId){ gcalClientId=cfg.gcalClientId; localStorage.setItem('audens_gcal_id',gcalClientId); }
  });

  // Sync gcal_token in realtime (per usuario)
  fbDb.ref('gcal_token/'+gcalUserKey()).on('value', function(snap){
    var fbGcal = snap.val();
    if(!fbGcal) return;
    if(!gcalToken || gcalToken.expires_at <= Date.now()){
      gcalToken = fbGcal;
      localStorage.setItem('audens_gcal_token', JSON.stringify(gcalToken));
    }
    // Google auth confirmado — tenta sync planilha→Firebase
    setTimeout(syncReunioesFBFromSheet, 1000);
  });

  // Sync meta token — shared across devices (gestor only writes, all can read)
  fbDb.ref('meta_token').on('value', function(snap){
    var fbMeta = snap.val();
    if(!fbMeta) return;
    // Only load if we don't have a valid token locally
    if(!metaToken || metaToken.expires_at <= Date.now()){
      metaToken = fbMeta;
      localStorage.setItem('audens_meta_token', JSON.stringify(metaToken));
    }
  });
}

// Garante que o lead recebido pela LP entre no Kanban na coluna "Novo Lead"
function ensureKanbanEntry(lead){
  if(!fbDb && !initFirebase()) return;
  var tel=(lead.telefone||'').replace(/\D/g,'');
  var key=(tel||'lead_'+(lead._createdAt||Date.now())).replace(/[.#$\[\]]/g,'_');
  fbDb.ref('kanban/'+key).once('value').then(function(snap){
    if(!snap.exists()){
      fbDb.ref('kanban/'+key).set({
        nome:lead.nome||'',
        telefone:tel,
        faturamento:lead.faturamento||'',
        empresa:lead.empresa||'',
        cidade:lead.cidade||'',
        email:lead.email||'',
        ad:lead.ad||'',
        campanha:lead.campanha||'',
        conjunto:lead.conjunto||'',
        _source:lead._source||'',
        _createdAt:lead._createdAt||Date.now(),
        status:'novo',
        statusAt:Date.now(),
        origem:'Tráfego'
      });
      // Lead qualificado (>= R$20 mil) -> gera cadencia de tarefas para o Joao
      generateCadenciaTasks(lead,key);
      // Salvar na planilha de leads (substitui Make.com)
      // Marca imediatamente para evitar re-sync pelo listener enquanto a chamada está em andamento
      _syncingLeads[key] = true;
      appendLeadToSheets(lead, key).then(function(ok){
        if(ok){
          delete _syncingLeads[key];
        } else {
          // Retry: só se ainda não foi sincronizado por outro caminho
          setTimeout(function(){
            if(kanbanData[key]&&kanbanData[key]._sheetSynced){delete _syncingLeads[key];return;}
            appendLeadToSheets(lead, key).then(function(ok2){
              if(ok2){delete _syncingLeads[key];}
              else{
                setTimeout(function(){
                  if(kanbanData[key]&&kanbanData[key]._sheetSynced){delete _syncingLeads[key];return;}
                  appendLeadToSheets(lead, key).then(function(){delete _syncingLeads[key];});
                }, 10000);
              }
            });
          }, 4000);
        }
      });
    }
  }).catch(function(e){console.error('ensureKanbanEntry error',e);});
}

// Sync Firebase → Planilha: busca telefones já presentes na sheet e só envia os que faltam
async function syncFirebaseToSheets(btn){
  if(!isGcalConnected()){alert('Conecte o Google Calendar primeiro em Configuracoes.');return;}
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> Verificando planilha...';}
  try{
    // 1. Resolve nome da aba
    var tabName=_sheetTabNameCache[String(SHEETS_GIDS.leads)];
    if(!tabName){
      var mr=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEETS_IDS.leads+'?fields=sheets.properties',
        {headers:{'Authorization':'Bearer '+gcalToken.access_token}});
      var mm=await mr.json();
      if(mm.error) throw new Error('Erro ao acessar planilha: '+mm.error.message);
      for(var i=0;i<(mm.sheets||[]).length;i++){
        var sp=mm.sheets[i].properties;
        if(sp.sheetId===SHEETS_GIDS.leads||sp.sheetId===parseInt(SHEETS_GIDS.leads)){tabName=sp.title;break;}
      }
      if(!tabName) throw new Error('Aba nao encontrada');
      _sheetTabNameCache[String(SHEETS_GIDS.leads)]=tabName;
    }
    // 2. Busca coluna D (Telefone) da planilha para ver o que já existe
    var dr=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEETS_IDS.leads+'/values/'+encodeURIComponent(tabName+'!D:D'),
      {headers:{'Authorization':'Bearer '+gcalToken.access_token}});
    var dj=await dr.json();
    var existingPhones=new Set();
    (dj.values||[]).forEach(function(row){if(row[0])existingPhones.add(row[0].replace(/\D/g,''));});
    // 3. Filtra leads do Firebase que não estão na planilha (por telefone)
    var missing=Object.entries(kanbanData).filter(function(a){
      var v=a[1];
      if(!v.nome||!v.telefone) return false;
      return !existingPhones.has((v.telefone||'').replace(/\D/g,''));
    });
    if(!missing.length){
      if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-table-export"></i> Sync → Planilha';}
      showSheetToast('Todos os leads ja estao na planilha ✓');
      return;
    }
    if(btn){btn.innerHTML='<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> Enviando '+missing.length+' lead(s)...';}
    // 4. Escreve apenas os que faltam
    var ok=0,fail=0;
    for(var j=0;j<missing.length;j++){
      var key=missing[j][0],lead=missing[j][1];
      lead._sheetSynced=false; // força appendLeadToSheets a rodar
      var success=await appendLeadToSheets(lead,key);
      if(success)ok++;else fail++;
    }
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-table-export"></i> Sync → Planilha';}
    showSheetToast(ok+' lead(s) adicionado(s) na planilha'+(fail?' · '+fail+' falhou':'')+'  ✓');
    showPage('kanban');
  }catch(e){
    console.error('syncFirebaseToSheets',e);
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-table-export"></i> Sync → Planilha';}
    showSheetToast('Erro: '+e.message);
  }
}

// Appenda uma linha na planilha de leads (colunas A-H) e marca _sheetSynced no Firebase
async function appendLeadToSheets(lead, kanbanKey){
  if(!isGcalConnected()) return false;
  try{
    // Prefere dados do kanban (tem UTMs) mas se não houver usa o lead como fallback
    var kb = (kanbanKey && kanbanData[kanbanKey]) ? kanbanData[kanbanKey] : null;
    // Se o kanban ainda não estava em memória, tenta buscar do Firebase direto
    if(!kb && kanbanKey && fbDb){
      try{
        var kbSnap = await fbDb.ref('kanban/'+kanbanKey).once('value');
        if(kbSnap.exists()) kb = kbSnap.val();
      }catch(ignored){}
    }
    var src = kb || lead; // fonte preferida
    var d = new Date(src._createdAt || lead._createdAt || Date.now());
    var dataFmt = d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
    var row = [
      dataFmt,                                                   // A: Data
      src.nome||lead.nome||'',                                   // B: Nome
      src.faturamento||lead.faturamento||'',                     // C: Faturamento
      (src.telefone||lead.telefone||'').replace(/\D/g,''),       // D: Telefone
      src._source||lead._source||'',                             // E: Fonte
      src.campanha||lead.campanha||'',                           // F: Campanha
      '',                                                        // G: Posicionamento (não capturado via UTM)
      src.conjunto||lead.conjunto||'',                           // H: Conjunto (adset)
      src.ad||lead.ad||''                                        // I: Ad
    ];
    // Chamada silenciosa — sem toast de erro (background sync)
    var ok = await appendSheetRowSilent(SHEETS_IDS.leads, SHEETS_GIDS.leads, row, 'I');
    if(ok && kanbanKey && (fbDb || initFirebase())){
      fbDb.ref('kanban/'+kanbanKey).update({_sheetSynced: true});
      if(kanbanData[kanbanKey]) kanbanData[kanbanKey]._sheetSynced = true;
    }
    return !!ok;
  }catch(e){ console.error('appendLeadToSheets error', e); return false; }
}

// Versão silenciosa do appendSheetRow (sem showSheetToast, para background sync)
async function appendSheetRowSilent(sheetId, gid, values, lastCol){
  if(!isGcalConnected()) return false;
  try{
    var lc = lastCol || 'Z';
    var cached = _sheetTabNameCache[String(gid)];
    if(!cached){
      var mr = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'?fields=sheets.properties',
        {headers:{'Authorization':'Bearer '+gcalToken.access_token}});
      var mm = await mr.json();
      if(mm.error) return false;
      if(mm.sheets){
        for(var i=0;i<mm.sheets.length;i++){
          var sp=mm.sheets[i].properties;
          if(sp.sheetId===gid||sp.sheetId===parseInt(gid)){cached=sp.title;break;}
        }
      }
      if(!cached) return false;
      _sheetTabNameCache[String(gid)] = cached;
    }
    var range = cached+'!A:'+lc;
    var url = 'https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(range)+':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS';
    var resp = await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+gcalToken.access_token,'Content-Type':'application/json'},body:JSON.stringify({range:range,majorDimension:'ROWS',values:[values]})});
    var result = await resp.json();
    return !result.error;
  }catch(e){ console.error('appendSheetRowSilent error',e); return false; }
}

// Ao abrir o CRM, tenta sincronizar leads do kanban que ainda não foram salvos na planilha
var _syncLeadsSheetDone = false;
var _LEADS_SHEET_MIGRATION_KEY = 'audens_leads_sheet_migrated_v1';
var _syncingLeads = {}; // guarda chaves de leads atualmente sendo sincronizados com a planilha
async function syncPendingLeadsToSheets(){
  if(_syncLeadsSheetDone || !isGcalConnected()) return;
  _syncLeadsSheetDone = true;

  // Migração única: na primeira vez que roda com esse código,
  // marca TODOS os leads existentes como já sincronizados (evita duplicatas com Make.com)
  var migrated = localStorage.getItem(_LEADS_SHEET_MIGRATION_KEY);
  if(!migrated){
    var batch = {};
    Object.keys(kanbanData).forEach(function(k){
      if(kanbanData[k].nome && !kanbanData[k]._sheetSynced){
        batch[k+'/_sheetSynced'] = true;
        kanbanData[k]._sheetSynced = true;
      }
    });
    if(Object.keys(batch).length && (fbDb || initFirebase())){
      fbDb.ref('kanban').update(batch);
    }
    localStorage.setItem(_LEADS_SHEET_MIGRATION_KEY, '1');
    return; // Para aqui — novos leads a partir daqui serão sincronizados normalmente
  }

  // Sync normal: só leads novos sem _sheetSynced e que não estejam sendo sincronizados
  var entries = Object.entries(kanbanData);
  for(var i=0; i<entries.length; i++){
    var key = entries[i][0];
    var e   = entries[i][1];
    if(!e._sheetSynced && e.nome && e.telefone && !_syncingLeads[key]){
      _syncingLeads[key] = true;
      var ok = await appendLeadToSheets(e, key);
      if(!ok) delete _syncingLeads[key];
    }
  }
}

var _confirmarAgendamentoBusy=false;
async function confirmarAgendamentoReuniao(key){
  if(_confirmarAgendamentoBusy) return;
  _confirmarAgendamentoBusy=true;
  try{
  var dt=document.getElementById('ar-date').value, hr=document.getElementById('ar-time').value;
  var email=document.getElementById('ar-email').value.trim();
  var respEl=document.getElementById('ar-resp');
  var responsavel=respEl?respEl.value:(CLOSERS&&CLOSERS[0])||'';
  if(!dt||!hr){alert('Preencha a data e o horario da reuniao.');_confirmarAgendamentoBusy=false;return;}
  var dtObj=new Date(dt+'T'+hr+':00');
  var meetingISO=dtObj.toISOString();
  var meetingDisplay=dtObj.toLocaleDateString('pt-BR')+' '+hr;
  if(!kanbanData[key]){_confirmarAgendamentoBusy=false;return;}
  kanbanData[key].status='reuniao';
  kanbanData[key].statusAt=Date.now();
  kanbanData[key].meetingISO=meetingISO;
  kanbanData[key].meetingDisplay=meetingDisplay;
  kanbanData[key].responsavel=responsavel;
  kanbanData[key].lembretes={h2:false,h1:false,m10:false};
  if(email) kanbanData[key].email=email;
  localStorage.setItem('audens_kanban', JSON.stringify(kanbanData));
  if(fbDb || initFirebase()){
    fbDb.ref('kanban/'+key).update({
      status:'reuniao',
      statusAt:Date.now(),
      meetingISO:meetingISO,
      meetingDisplay:meetingDisplay,
      responsavel:responsavel,
      lembretes:{h2:false,h1:false,m10:false},
      email:kanbanData[key].email||''
    });
  }
  // Detecta a última tarefa SDR desse lead (a etapa mais avançada na cadência — done ou pending)
  // Feito ANTES de marcar as pendentes como concluídas para capturar a tarefa em execução
  var ultimaTarefaSDR = getUltimaTarefaSDR(key, kanbanData[key]&&kanbanData[key].telefone);
  // Marca todas as tarefas pendentes desse lead como concluidas (reuniao agendada = cadencia encerrada)
  var batchDone = {};
  Object.keys(sdrTarefas||{}).forEach(function(tid){
    var t = sdrTarefas[tid];
    if(t.leadKey===key && !t.done){
      sdrTarefas[tid].done = true;
      sdrTarefas[tid].doneAt = Date.now();
      batchDone[tid+'/done'] = true;
      batchDone[tid+'/doneAt'] = Date.now();
    }
  });
  if(Object.keys(batchDone).length && (fbDb || initFirebase())){
    fbDb.ref('sdr_tarefas').update(batchDone);
    localStorage.setItem('audens_sdr_tarefas', JSON.stringify(sdrTarefas));
    // Atualiza badge do menu
    var tnav=document.getElementById('nav-minhas-tarefas');
    if(tnav){var p=getPendingSdrTarefas().length;var ex=tnav.querySelector('.nav-badge');

      else if(ex)ex.remove();}
  }
  // Cria a tarefa de follow-up pos-reuniao para o responsavel (Realizada / No-show / Venda / Retorno)
  var mid='km_'+key+'_'+Date.now();
  var meetingObj={id:mid,tel:kanbanData[key].telefone,nome:kanbanData[key].nome,dtISO:meetingISO,dtDisplay:meetingDisplay,
    status:'pending',responsavel:responsavel,guestEmail:email||'',faturamentoLead:kanbanData[key].faturamento||'',
    origem:(kanbanData[key].origem||'Tráfego'),ad:kanbanData[key].ad||'',kanbanKey:key,
    sdrName:((CU&&CU.closer)||'João').toUpperCase(),
    scheduledAt:Date.now(),
    tarefaOrigem: ultimaTarefaSDR ? ultimaTarefaSDR.tipo : '',
    tarefaOrigemDia: ultimaTarefaSDR ? 'Dia '+ultimaTarefaSDR.dia : ''};
  meetings[mid]=meetingObj;
  kanbanData[key].meetingId=mid;
  localStorage.setItem('audens_kanban', JSON.stringify(kanbanData));
  saveAll();saveMeetingFB(mid,meetingObj);
  if(fbDb || initFirebase()){ fbDb.ref('kanban/'+key).update({meetingId:mid}); }
  // Preenche a planilha de reunioes e salva o número da linha no meeting para updates futuros
  // Só grava se tiver dados mínimos (evita linhas em branco por double-click ou corrida)
  if(kanbanData[key]&&kanbanData[key].nome&&meetingDisplay){
    try{
      var _shRow=await appendSheetRow(SHEETS_IDS.reunioes, SHEETS_GIDS.reunioes,
        [todayStr(), kanbanData[key].nome, kanbanData[key].telefone||'', meetingDisplay, 'AGENDADA', ((CU&&CU.closer)||'João').toUpperCase(), (responsavel||'').toUpperCase(), (kanbanData[key].origem||'Tráfego').toUpperCase()]);
      if(_shRow&&typeof _shRow==='number'){meetings[mid].sheetRow=_shRow;saveMeetingFB(mid,meetings[mid]);}
    }catch(e){}
  }
  cancelarAgendamentoReuniao();
  var area=document.getElementById('content');
  if(area && area.getAttribute('data-page')==='kanban') showPage('kanban');
  // Cria o evento no Google Agenda PRIMEIRO (precisamos do meetLink antes de enviar WA)
  var meetLinkFinal = '';
  try{
    var gcalResult=await createGcalEvent({
      id:key, nome:kanbanData[key].nome, tel:kanbanData[key].telefone,
      dtISO:meetingISO, responsavel:responsavel||(CU&&CU.name)||'', guestEmail:email
    });
    if(gcalResult && gcalResult.success){
      meetLinkFinal = gcalResult.meetLink||'';
      kanbanData[key].gcalEventId=gcalResult.eventId;
      kanbanData[key].meetLink=meetLinkFinal;
      kanbanData[key].gcalLink=gcalResult.htmlLink||'';
      localStorage.setItem('audens_kanban', JSON.stringify(kanbanData));
      if(fbDb || initFirebase()){
        fbDb.ref('kanban/'+key).update({gcalEventId:gcalResult.eventId,meetLink:meetLinkFinal,gcalLink:kanbanData[key].gcalLink});
      }
      if(meetings[mid]){
        meetings[mid].gcalEventId=gcalResult.eventId;
        meetings[mid].meetLink=meetLinkFinal;
        meetings[mid].gcalLink=gcalResult.htmlLink||'';
        saveAll();saveMeetingFB(mid,meetings[mid]);
      }
      var area2=document.getElementById('content');
      if(area2 && area2.getAttribute('data-page')==='kanban') showPage('kanban');
    }
  }catch(e){console.error('createGcalEvent error',e);}
  // Agora dispara WA com meetLink (e mensagem de escassez) — nao bloqueia a UI
  enviarConfirmacaoReuniaoWA(kanbanData[key].telefone, kanbanData[key].nome, meetingDisplay, responsavel, meetLinkFinal);
  }finally{_confirmarAgendamentoBusy=false;}
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function waLink(tel){
  var d=(tel||'').replace(/\D/g,'');
  if(d && d.length<=11) d='55'+d;
  return 'https://wa.me/'+d;
}
function copiarTelefoneKanban(ev,tel){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  var txt=(tel||'').replace(/\D/g,'');
  function done(){
    var el=ev&&ev.currentTarget;
    if(!el) return;
    var orig=el.getAttribute('data-orig')||el.innerHTML;
    el.setAttribute('data-orig',orig);
    el.classList.add('tel-copiado');
    el.innerHTML='<i class="ti ti-check"></i> Copiado!';
    setTimeout(function(){el.classList.remove('tel-copiado');el.innerHTML=orig;},1200);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(done);
  }else{
    var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);done();
  }
}

async function enviarLinkAssinaturaWA(telefone, nome, link){

      method:'POST',

// Chama o endpoint /agendar da Cloud Function receberlead para disparar a
// mensagem de confirmacao de reuniao (texto + imagens de resultado) via Z-API
async function enviarConfirmacaoReuniaoWA(telefone, nome, meetingDisplay, responsavel, meetLink){
  if(!telefone){console.warn('[WA] Confirmação não enviada: lead sem telefone (nome='+nome+')');return;}
  try{
    var payload={telefone:telefone, nome:nome, meetingDisplay:meetingDisplay};
    if(responsavel) payload.responsavel=responsavel;
    if(meetLink) payload.meetLink=meetLink;
    var resp=await fetch(RECEBERLEAD_URL+'/agendar?secret='+WEBHOOK_SECRET,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    if(!resp.ok) console.warn('[WA] /agendar retornou',resp.status,'para',nome);
    else console.log('[WA] Confirmação enviada para',nome,telefone);
  }catch(e){console.error('enviarConfirmacaoReuniaoWA error',e);}
}

// ===== LEMBRETE DE VÉSPERA (21h) — notifica SDR e closers via WhatsApp =====
// Chama o endpoint /vespera do Cloud Run com as reuniões do dia seguinte.
// Lucas e Gustavo recebem apenas as próprias reuniões; João recebe todas.
async function enviarLembreteVespera(){
  var amanhaD = new Date(); amanhaD.setDate(amanhaD.getDate()+1);
  var amanhaISO = amanhaD.toISOString().split('T')[0];
  var reunioesAmanha = Object.values(meetings).filter(function(m){
    if(m._hidden) return false;
    var iso = m.dtISO || m.meetingISO || '';
    return iso && iso.startsWith(amanhaISO);
  }).map(function(m){
    var display = m.dtDisplay || m.meetingDisplay || '';
    return {
      nome: m.nome||'',
      horario: display.split(' ')[1]||'',
      responsavel: m.responsavel||'',
      meetLink: m.meetLink||''
    };
  });
  if(!_contatosEquipe.lucas && !_contatosEquipe.gustavo && !_contatosEquipe.joao){
    console.warn('[Vespera] Contatos da equipe não configurados. Acesse Configurações → Contatos da Equipe.');
    return;
  }
  try{
    var resp=await fetch(RECEBERLEAD_URL+'/lembrete-vespera?secret='+WEBHOOK_SECRET,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contatosEquipe:_contatosEquipe,
        reunioesAmanha:reunioesAmanha,
        dataAmanha:amanhaISO
      })
    });
    if(resp.ok) console.log('[Vespera] Notificação enviada:',reunioesAmanha.length,'reuniões para amanhã');
    else console.warn('[Vespera] /vespera retornou',resp.status);
  }catch(e){
    console.error('[Vespera] Erro ao notificar equipe:',e);
    // Remove flag para tentar novamente
    localStorage.removeItem('_vespera_'+amanhaISO);
  }
}

// Verifica a cada minuto se chegou 21h para disparar o lembrete de véspera
function tickVespera(){
  var now = new Date();
  if(now.getHours() !== 21) return;
  var amanhaISO = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1).toISOString().split('T')[0];
  var flagKey = '_vespera_'+amanhaISO;
  if(localStorage.getItem(flagKey)) return; // já enviado hoje
  localStorage.setItem(flagKey, '1');
  console.log('[Vespera] São 21h — enviando lembrete da equipe...');
  enviarLembreteVespera();
}
setInterval(tickVespera, 60000); // verifica a cada 1 minuto

// ===== LEMBRETES AUTOMÁTICOS (2h, 1h e 10min antes da reunião) =====

function slugify(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_');
}
// Retorna a data (Date, 00:00) correspondente ao "Dia N" da cadencia, contando
// apenas dias uteis (seg-sex, sem feriados) a partir de hoje (Dia 1).
function kanbanBusinessDay(baseDate,n){
  var d=new Date(baseDate);
  d.setHours(0,0,0,0);
  if(!checkDay(d).ok) d=nextBusinessDay(d);
  for(var i=1;i<n;i++){ d=nextBusinessDay(d); }
  return d;
}
// Gera as tarefas de cadencia para o Joao quando um lead qualificado (>= R$20 mil) entra no funil
function generateCadenciaTasks(lead,leadKey){
  if(!fbDb && !initFirebase()) return;
  var fatVal=parseFaturamentoValue(lead.faturamento);
  if(fatVal<KANBAN_TASK_FAT_MIN) return;
  var base=new Date();
  // Se o lead chegou após as 17h (ou em fim de semana), tarefas começam no próximo dia útil
  if(base.getHours()>=17 || !checkDay(base).ok){
    base=nextBusinessDay(base);
  }
  CADENCIA_SDR.forEach(function(item){
    var d=kanbanBusinessDay(base,item.dia);
    var iso=d.toISOString().split('T')[0];
    var taskId=leadKey+'_d'+item.dia+'_'+item.periodo+'_'+slugify(item.tipo);
    fbDb.ref('sdr_tarefas/'+taskId).once('value').then(function(snap){
      if(!snap.exists()){
        fbDb.ref('sdr_tarefas/'+taskId).set({
          leadKey:leadKey,nome:lead.nome||'',telefone:(lead.telefone||''),
          empresa:lead.empresa||'',faturamento:lead.faturamento||'',
          tipo:item.tipo,icon:item.icon,dia:item.dia,periodo:item.periodo,
          dataISO:iso,done:false,doneAt:null,createdAt:Date.now()
        });
      }
    }).catch(function(e){console.error('generateCadenciaTasks error',e);});
  });
}
// Marca/desmarca uma tarefa de cadencia como concluida
function toggleSdrTarefa(taskId,doneVal){
  if(!sdrTarefas[taskId]) return;
  sdrTarefas[taskId].done=!!doneVal;
  sdrTarefas[taskId].doneAt=doneVal?Date.now():null;

    else if(ex)ex.remove();

// Tarefas pendentes (atrasadas + hoje) - usado pro badge do menu
function getPendingSdrTarefas(){
  var hojeISO=new Date().toISOString().split('T')[0];
  return Object.keys(sdrTarefas||{}).map(function(k){return sdrTarefas[k];})
    .filter(function(t){return t && !t.done && t.dataISO<=hojeISO;});
}
// Retorna a tarefa da cadência SDR que originou o agendamento:
// 1. Se há tarefas concluídas → retorna a última executada (doneAt mais recente)
// 2. Se não há nenhuma concluída → retorna a próxima pendente (menor dia = 1ª a executar)
// Usa leadKey se disponível, senão busca por telefone
function getUltimaTarefaSDR(leadKey, telefone){
  var tel = (telefone||'').replace(/\D/g,'');
  var done = [], pending = [];
  Object.keys(sdrTarefas||{}).forEach(function(tid){
    var t = sdrTarefas[tid];
    if(!t) return;
    var matches = leadKey
      ? (t.leadKey === leadKey)
      : (tel && (t.telefone||'').replace(/\D/g,'') === tel);
    if(!matches) return;
    if(t.done && t.doneAt) done.push(t);
    else pending.push(t);
  });
  if(done.length){
    // Última tarefa concluída (doneAt mais recente)
    return done.reduce(function(a,b){ return b.doneAt > a.doneAt ? b : a; });
  }
  if(pending.length){
    // Próxima a ser executada (menor dia na cadência)
    return pending.reduce(function(a,b){ return b.dia < a.dia ? b : a; });
  }
  return null;
}
// Extrai um valor numerico aproximado de strings de faturamento ("60 mil até 100 mil", "R$ 50.000", etc.)
function parseFaturamentoValue(str){
  if(!str) return 0;
  var s=String(str).toLowerCase();
  var matches=s.match(/[\d.,]+/g);
  if(!matches) return 0;
  var nums=matches.map(function(m){
    var clean=m.replace(/\./g,'').replace(/,/g,'.');
    return parseFloat(clean)||0;
  });
  var val=nums[0]||0;
  if(s.indexOf('mil')!==-1 && val<1000) val=val*1000;
  if(s.indexOf('milh')!==-1) val=val*1000000;
  return val;
}
// Tag do lead de acordo com a faixa de faturamento:
// < 20 mil = VDH (vermelho) | 20-40 mil = Marketplaces (amarelo) | 40 mil+ = Assessoria de Marketing (verde)
function getLeadTag(faturamento){
  if(!faturamento) return null;
  var v=parseFaturamentoValue(faturamento);
  if(v<20000) return {label:'VDH',cls:'b-red'};
  if(v<40000) return {label:'Marketplaces',cls:'b-amber'};
  return {label:'Assessoria de Marketing',cls:'b-green'};
}

// ===== DATE HELPERS =====
var MON_ABR={jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
function parseBRDate(s){
  if(!s)return null;
  s=s.trim();
  var anoAtual=new Date().getFullYear();
  var parts=s.split('/');
  if(parts.length===3){
    var day=parseInt(parts[0]);
    var mpart=parts[1].replace(/\./g,'').toLowerCase().substring(0,3);
    var yr=parseInt(parts[2].replace(/\s.*/,''));
    if(yr<100)yr+=2000;
    var mIdx=MON_ABR[mpart];
    if(mIdx!==undefined)return new Date(yr,mIdx,day);
    var mNum=parseInt(mpart);
    if(!isNaN(mNum))return new Date(yr,mNum-1,day);
  }
  // Aceitar d/m ou m/d sem ano (ex: 9/6, 06/10)
  if(parts.length===2){
    var p1=parseInt(parts[0]);
    var p2=parseInt(parts[1]);
    if(!isNaN(p1)&&!isNaN(p2)){
      // Detect MM/DD (American): if p1 <= 12 and p2 <= 31, ambiguous
      // Heuristic: if p1 <= 12 and p2 > 12, it's MM/DD (month first)
      // if p1 > 12, it's DD/MM (day first)
      // if both <= 12, try DD/MM first (BR standard) but also check context
      var day2,mon2;
      if(p1>12){
        // definitely DD/MM
        day2=p1; mon2=p2;
      } else if(p2>12){
        // definitely MM/DD (month first)
        mon2=p1; day2=p2;
      } else {
        // both <= 12: assume DD/MM (Brazilian standard)
        day2=p1; mon2=p2;
      }
      if(mon2>=1&&mon2<=12&&day2>=1&&day2<=31){
        return new Date(anoAtual,mon2-1,day2);
      }
    }
  }
  var iso=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso)return new Date(parseInt(iso[1]),parseInt(iso[2])-1,parseInt(iso[3]));
  return null;
}
function periodStr(d){if(!d)return'';return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function getCurrentPeriod(){var n=new Date();return String(n.getMonth()+1).padStart(2,'0')+'/'+n.getFullYear();}

// ===== UTILITY =====
function parseFaturamentoLead(row){
  var fat=col(row,['Faturamento','FATURAMENTO','faturamento'])||'';
  if(!fat.trim()) return 0;
  // Se contém "pedido", calcular como pedidos × 50
  if(fat.toLowerCase().includes('pedido')){
    // Pegar o menor número da faixa e multiplicar por 50
    var nums=fat.match(/(\d+(?:[.,]\d+)?)/g);
    if(nums&&nums.length>0){
      var minVal=Math.min.apply(null,nums.map(function(n){return parseFloat(n.replace(',','.'));}));
      return minVal*50;
    }
    return 0;
  }
  return parseFaturamento(fat);
}
function parseFaturamento(s){
  if(!s)return 0;
  s=s.toLowerCase().trim();
  // Handle "acima de X" or "mais de X"
  var acimaMatch=s.match(/(?:acima de|mais de|acima|\+)\s*(\d+(?:[.,]\d+)?)\s*(k|mil)?/);
  if(acimaMatch){
    var v=parseFloat(acimaMatch[1].replace(',','.'));
    var mult=acimaMatch[2]&&acimaMatch[2].includes('k')?1000:acimaMatch[2]&&acimaMatch[2].includes('mil')?1000:1;
    return v*mult;
  }
  // Handle ranges like "40 mil até 60 mil", "10k a 20k", "40k-60k" — return MIN value
  var rangeMatch=s.match(/(\d+(?:[.,]\d+)?)\s*(k|mil)?\s*(?:até|ate|a|-)\s*(\d+(?:[.,]\d+)?)\s*(k|mil)?/);
  if(rangeMatch){
    var v1=parseFloat(rangeMatch[1].replace(',','.'));
    var m1=rangeMatch[2]&&(rangeMatch[2].includes('k')||rangeMatch[2].includes('mil'))?1000:1;
    return v1*m1; // return minimum of range
  }
  // Single value: "40k", "40 mil", "40000"
  var singleMatch=s.match(/(\d+(?:[.,]\d+)?)\s*(k|mil)?/);
  if(singleMatch){
    var v2=parseFloat(singleMatch[1].replace(',','.'));
    var m2=singleMatch[2]&&(singleMatch[2].includes('k')||singleMatch[2].includes('mil'))?1000:1;
    return v2*m2;
  }
  return 0;
}
function isRealizada(s){
  if(!s)return false;
  var l=s.toLowerCase();
  return l.includes('realiz')||l.includes('comparec')||l.includes('feita')||l.includes('ok')||l.includes('conclu')||l.includes('venda');
}
function normalizeStr(s){
  return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function categorizeOrigem(o){
  if(!o)return'Indicacoes / Outros';
  var l=normalizeStr(o);
  if(l.includes('trafego')||l.includes('pago')||l.includes('ads')||l.includes('meta')||l.includes('anun'))return'Trafego Pago';
  if(l.includes('organico')||l.includes('organic')||l.includes('organik'))return'Trafego Organico';
  return'Indicacoes / Outros';
}
function normCloserName(n){
  if(!n)return null;
  var l=n.toLowerCase();
  if(l.includes('lucas'))return'Lucas';
  if(l.includes('gustavo'))return'Gustavo';
  return n.trim();
}
function fmtBRL(v){
  if(!v||v===0)return'R$ 0';
  if(v>=1000000)return'R$ '+(v/1000000).toFixed(2).replace('.',',')+' mi';
  if(v>=1000)return'R$ '+(v/1000).toFixed(2).replace('.',',')+' mil';
  return'R$ '+Math.round(v).toLocaleString('pt-BR');
}

function gcalUserKey(){return CU?CU.name.toLowerCase().replace(/\s+/g,'_'):'default';}
function isGcalConnected(){
  if(!gcalToken||!gcalToken.expires_at) return false;
  if(Date.now() > gcalToken.expires_at - 300000){
    // Token expires in < 5 min - show warning once
    if(!window._gcalWarnShown){window._gcalWarnShown=true;showSheetToast('Token Google expirando — reconecte em Configuracoes',true);}
    return gcalToken.expires_at > Date.now(); // still valid for now
  }
  return true;
}
function gcalConnect(){
  if(!gcalClientId){
    if(CU&&CU.role==='gestor'){alert('Configure o Google Client ID em Configuracoes.');}
    else{alert('O Google Client ID ainda nao foi configurado pelo administrador. Peca para o Lucas configurar em Configuracoes > Google Calendar.');}
    return;
  }
  var origin=window.location.origin;
  var scope='https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';
  var url='https://accounts.google.com/o/oauth2/v2/auth'+
    '?client_id='+encodeURIComponent(gcalClientId)+
    '&redirect_uri='+encodeURIComponent(origin)+
    '&response_type=token'+
    '&scope='+encodeURIComponent(scope)+
    '&prompt=select_account'+
    '&include_granted_scopes=true';
  var w=window.open(url,'gcal_auth','width=520,height=620,left=200,top=100');
  function onMsg(e){
    if(e.origin!==origin)return;
    if(e.data&&e.data.access_token){
      window.removeEventListener('message',onMsg);
      gcalToken={access_token:e.data.access_token,expires_at:Date.now()+(parseInt(e.data.expires_in)||3600)*1000};
      saveAll();showPage('config');alert('Google conectado!');
    }
  }
  window.addEventListener('message',onMsg);
  var poll=setInterval(function(){
    try{
      if(!w||w.closed){clearInterval(poll);window.removeEventListener('message',onMsg);return;}
      var h=w.location.hash||w.location.search;
      if(h&&h.includes('access_token')){
        clearInterval(poll);window.removeEventListener('message',onMsg);
        var raw=h.startsWith('#')?h.slice(1):h.slice(1);
        var p={};raw.split('&').forEach(function(s){var kv=s.split('=');p[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||'');});
        if(p.access_token){
          gcalToken={access_token:p.access_token,expires_at:Date.now()+(parseInt(p.expires_in)||3600)*1000};
          try{w.close();}catch(e2){}
          saveAll();
          // Salvar token deste usuario no Firebase (cada um com o seu)
          try{if(fbDb)fbDb.ref('gcal_token/'+gcalUserKey()).set(gcalToken);}catch(e3){}
          showPage('config');alert('Google conectado com sucesso!');
        }
      }
    }catch(e2){}
  },800);
}
function gcalDisconnect(){gcalToken=null;localStorage.removeItem('audens_gcal_token');saveAll();try{if(fbDb)fbDb.ref('gcal_token/'+gcalUserKey()).remove();}catch(e){}showPage('config');}

function asaasBase(){
  return asaasEnv==='sandbox'
    ?'https://sandbox.asaas.com/api/v3'
    :'https://api.asaas.com/v3';
}
async function asaasRequest(endpoint,method,body){
  if(!asaasApiKey) return null;
  try{
    var payload={endpoint:endpoint,method:method||'GET',apiKey:asaasApiKey,env:asaasEnv};
    if(body) payload.body=body;
    var r=await fetch(RECEBERLEAD_URL+'/asaas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok){console.error('Asaas proxy',method,endpoint,r.status);return null;}
    return await r.json();
  }catch(e){console.error('Asaas proxy',method,endpoint,e);return null;}
}
async function asaasGet(endpoint){return asaasRequest(endpoint,'GET',null);}
async function asaasPost(endpoint,body){return asaasRequest(endpoint,'POST',body);}
async function asaasDelete(endpoint){return asaasRequest(endpoint,'DELETE',null);}

async function criarCobrancaAsaas(leadInfo,vendaData,kanbanKey,assinaturaId){
  if(!asaasApiKey){showSheetToast('⚠️ API Key do Asaas não configurada — veja Configurações');return;}
  // 1. Buscar ou criar cliente
  var cpfCnpj=(leadInfo.cnpj||vendaData.cnpj||'').replace(/\D/g,'');
  var customerId=null;
  if(cpfCnpj){
    var found=await asaasGet('/customers?cpfCnpj='+cpfCnpj+'&limit=1');
    if(found&&found.data&&found.data.length>0) customerId=found.data[0].id;
  }
  if(!customerId){
    var nomeCliente=(leadInfo.empresa||leadInfo.nome||'Cliente');
    var newCust=await asaasPost('/customers',{
      name:nomeCliente,
      cpfCnpj:cpfCnpj||undefined,
      mobilePhone:(leadInfo.telefone||'').replace(/\D/g,'')
    });
    if(newCust&&newCust.id) customerId=newCust.id;
    else{console.error('Asaas: falha ao criar cliente',newCust);showSheetToast('Asaas: erro ao criar cliente');return;}
  }
  // 2. Criar assinatura recorrente (ou cobrança avulsa se TCV)
  var nextDueDate=vendaData.dataInicio||new Date().toISOString().split('T')[0];
  var desc='Contrato '+(vendaData.plano||'')+(vendaData.duracao?' ('+vendaData.duracao+'m)':'')+' — '+(leadInfo.empresa||leadInfo.nome||'');
  var result=null;
  if(vendaData.tipoValor==='tcv'){
    // Valor total: cobrança única
    result=await asaasPost('/payments',{
      customer:customerId,
      billingType:asaasBillingType,
      value:parseFloat(vendaData.contrato)||0,
      dueDate:nextDueDate,
      description:desc
    });
  } else {
    // Mensalidade: assinatura recorrente mensal
    var freqMap={'semanal':'WEEKLY','mensal':'MONTHLY','bimestral':'BIMONTHLY','trimestral':'QUARTERLY','semestral':'SEMIANNUALLY','anual':'YEARLY'};
    var cycle=freqMap[(vendaData.frequencia||'mensal').toLowerCase()]||'MONTHLY';
    result=await asaasPost('/subscriptions',{
      customer:customerId,
      billingType:asaasBillingType,
      value:parseFloat(vendaData.mensalidade)||0,
      nextDueDate:nextDueDate,
      cycle:cycle,
      description:desc
    });
  }
  if(result&&result.id){
    var isSub=!!result.cycle; // subscriptions têm cycle, payments não
    if(kanbanKey&&(fbDb||initFirebase())){
      fbDb.ref('kanban/'+kanbanKey).update({asaasCustomerId:customerId,asaasChargeId:result.id,asaasStatus:'ACTIVE'});
    }
    if(kanbanKey&&kanbanData[kanbanKey]){
      kanbanData[kanbanKey].asaasCustomerId=customerId;
      kanbanData[kanbanKey].asaasChargeId=result.id;
      kanbanData[kanbanKey].asaasStatus='ACTIVE';
      localStorage.setItem('audens_kanban',JSON.stringify(kanbanData));
    }
    if(assinaturaId&&(fbDb||initFirebase())){
      fbDb.ref('assinaturas/'+assinaturaId).update({asaasCustomerId:customerId,asaasChargeId:result.id,asaasStatus:'ACTIVE'});
    }
    showSheetToast(isSub?'✅ Assinatura criada no Asaas':'✅ Cobrança criada no Asaas');
  }else{
    console.error('Asaas: falha ao criar',result);
    showSheetToast('⚠️ Asaas: erro ao criar cobrança — verifique o console');
  }
}

async function loadAsaasPage(){
  if(!asaasApiKey) return;
  if(!_asaasPeriod) _asaasPeriod=getCurrentPeriod();
  var pp=_asaasPeriod.split('/');
  var month=parseInt(pp[0]),year=parseInt(pp[1]);
  var firstISO=year+'-'+String(month).padStart(2,'0')+'-01';
  var lastISO=year+'-'+String(month).padStart(2,'0')+'-'+String(new Date(year,month,0).getDate()).padStart(2,'0');
  var kpis=document.getElementById('asaas-kpis');
  var el=document.getElementById('asaas-body');
  if(el) el.innerHTML='<div style="color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;padding:40px;"><i class="ti ti-loader-2" style="font-size:18px;animation:spin 1s linear infinite;"></i> Carregando...</div>';
  // Busca pagamentos e clientes em paralelo
  var [dataRec1,dataRec2,dataRec3,dataPend,dataVenc,dataCusts]=await Promise.all([
    asaasGet('/payments?limit=100&status=RECEIVED&paymentDate[ge]='+firstISO+'&paymentDate[le]='+lastISO+'&sort=paymentDate&order=desc'),
    asaasGet('/payments?limit=100&status=CONFIRMED&paymentDate[ge]='+firstISO+'&paymentDate[le]='+lastISO),
    asaasGet('/payments?limit=100&status=RECEIVED_IN_CASH&paymentDate[ge]='+firstISO+'&paymentDate[le]='+lastISO),
    asaasGet('/payments?limit=100&status=PENDING&dueDate[ge]='+firstISO+'&dueDate[le]='+lastISO+'&sort=dueDate&order=asc'),
    asaasGet('/payments?limit=100&status=OVERDUE&dueDate[ge]='+firstISO+'&dueDate[le]='+lastISO+'&sort=dueDate&order=desc'),
    asaasGet('/customers?limit=100')
  ]);
  // Monta mapa de clientes
  if(dataCusts&&dataCusts.data){
    dataCusts.data.forEach(function(c){if(c.id&&c.name) _asaasCustomerMap[c.id]=c.name;});
  }
  // Mescla recebidas deduplicando
  var seenR={};
  var recebidas=[];
  [(dataRec1&&dataRec1.data)||[],(dataRec2&&dataRec2.data)||[],(dataRec3&&dataRec3.data)||[]].forEach(function(arr){
    arr.forEach(function(p){if(!seenR[p.id]){seenR[p.id]=true;recebidas.push(p);}});
  });
  var aguardando=(dataPend&&dataPend.data)||[];
  var vencidas=(dataVenc&&dataVenc.data)||[];
  _asaasPayments={recebidas:recebidas,aguardando:aguardando,vencidas:vencidas};
  // KPI cards
  var totalRec=recebidas.reduce(function(s,p){return s+(p.value||0);},0);
  var totalAg=aguardando.reduce(function(s,p){return s+(p.value||0);},0);
  var totalVenc=vencidas.reduce(function(s,p){return s+(p.value||0);},0);
  if(kpis){
    kpis.innerHTML=
      finKpiCard('Recebidas','R$ '+fmtMoeda(totalRec),'var(--green)',recebidas.length+' cobrança(s) — '+finMesLabelCurto(_asaasPeriod),'ti-check')+
      finKpiCard('Aguardando','R$ '+fmtMoeda(totalAg),'var(--amber)',aguardando.length+' cobrança(s)','ti-clock')+
      finKpiCard('Vencidas','R$ '+fmtMoeda(totalVenc),'var(--red)',vencidas.length+' cobrança(s)','ti-alert-circle');
  }
  renderAsaasTable();
}

async function fetchMetaSpend(period){
  if(!isMetaConnected()||!metaAccountId)return null;
  var pp=period.split('/');
  var month=parseInt(pp[0]),year=parseInt(pp[1]);
  var since=year+'-'+String(month).padStart(2,'0')+'-01';
  // Para o mês atual, usa hoje como until (igual ao Ads Manager "this month to date")
  var now=new Date();
  var isCurrent=(month===now.getMonth()+1&&year===now.getFullYear());
  var until;
  if(isCurrent){
    until=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  }else{
    var lastDay=new Date(year,month,0).getDate();
    until=year+'-'+String(month).padStart(2,'0')+'-'+String(lastDay).padStart(2,'0');
  }
  // Suporta múltiplas contas separadas por vírgula — soma o spend de todas
  var ids=metaAccountId.split(',').map(function(s){return s.trim().replace(/^act_/,'');}).filter(Boolean);
  var totalSpend=0;
  var anyOk=false;
  for(var i=0;i<ids.length;i++){
    try{
      var url='https://graph.facebook.com/v20.0/act_'+ids[i]+'/insights'+
        '?fields=spend'+
        '&time_range='+encodeURIComponent('{"since":"'+since+'","until":"'+until+'"}')+''+
        '&level=account'+
        '&access_token='+metaToken.access_token;
      var resp=await fetch(url);
      var data=await resp.json();
      if(data.error){console.error('Meta API err acc '+ids[i],data.error);continue;}
      var spend=(data.data&&data.data.length>0)?parseFloat(data.data[0].spend)||0:0;
      totalSpend+=spend;
      anyOk=true;
    }catch(e){console.error('fetchMetaSpend acc '+ids[i],e);}
  }
  return anyOk?totalSpend:null;
}

}
async function fetchMetaAdAccounts(){
  if(!isMetaConnected()){alert('Conecte o Meta Ads primeiro.');return;}
  var btn=document.getElementById('btn-meta-buscar-contas');
  if(btn){btn.disabled=true;btn.textContent='Buscando...';}

    var data=await resp.json();
    if(data.error){alert('Erro: '+data.error.message);return;}
    var accounts=(data.data||[]);
    if(!accounts.length){alert('Nenhuma conta encontrada.');return;}
    var lines=accounts.map(function(a){
      var st=a.account_status===1?'Ativa':a.account_status===2?'Desativada':'Status '+a.account_status;
      return (a.id||'')+'  →  '+(a.name||'')+'  ['+st+']';
    });
    var msg='Contas de Anúncio vinculadas ao token:\n\n'+lines.join('\n')+'\n\nCopie os IDs desejados para o campo Account ID (separe por vírgula para múltiplas contas).';
    alert(msg);

}

function parseSheetUrl(url){
  if(!url)return null;
  var idM=url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  var id=idM?idM[1]:url.trim();
  if(!id)return null;
  var gidM=url.match(/[#&?]gid=(\d+)/);
  var gid=gidM?parseInt(gidM[1]):0;
  return{id:id,gid:gid};
}
function sheetUrl(id,gid){return id?'https://docs.google.com/spreadsheets/d/'+id+'/edit'+(gid?'#gid='+gid:''):'Nao configurada';}
function saveSheetConfig(type){
