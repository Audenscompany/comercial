var CONTRATO_TEMPLATES={
  marketplaces:'assets/contratos/contrato-marketplaces.docx',
  premium:'assets/contratos/contrato-premium.docx',
  elite:'assets/contratos/contrato-elite.docx'
};
function addMonthsISO(dateISO,months){
  var d=new Date(dateISO+'T00:00:00');
  d.setMonth(d.getMonth()+(parseInt(months,10)||0));
  return d;
}
function fmtDataBR(d){return d.toLocaleDateString('pt-BR');}
function fmtMoeda(v){return (v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}

// ===== PLANILHA DE CLIENTES (preenchida automaticamente ao fechar uma venda) =====
// Formata data ISO (YYYY-MM-DD) no padrao "DD/mmm./AA" usado na planilha de Clientes
function fmtDataClientes(dateISO){
  if(!dateISO) return '';
  var d=new Date(dateISO+'T00:00:00');
  var meses=['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
  return String(d.getDate()).padStart(2,'0')+'/'+meses[d.getMonth()]+'/'+String(d.getFullYear()).slice(2);
}
// Formata valor monetario no padrao "R$ X.XXX,XX" usado na planilha de Clientes
function fmtBRLPlanilha(v){
  return 'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
// Monta o texto "Plano X - Frequencia" conforme padrao da coluna PLANO da planilha de Clientes
function buildPlanoLabel(plano,duracao,tipoValor){
  var nomes={marketplaces:'Marketplaces',premium:'Premium',elite:'Elite'};
  var nome=nomes[plano]||(plano?(plano.charAt(0).toUpperCase()+plano.slice(1)):'');
  var freq;
  if(tipoValor==='mmr') freq='Recorrente';
  else if(duracao===3) freq='Trimestral';
  else if(duracao===6) freq='Semestral';
  else if(duracao===12) freq='Anual';
  else if(duracao===1) freq='Mensal';
  else freq=(duracao||0)+' meses';
  return 'Plano '+nome+' - '+freq;
}
// Adiciona uma linha na planilha de Clientes ao fechar uma venda, mantendo o
// padrao de colunas: DATA DE INICIO | CLIENTE | VALOR CONTRATO/MES | GESTOR |
// DATA DE CANCELAMENTO | MOTIVO | PLANO | ORIGEM | CLOSER | SDR/BDR |
// VALOR VENDIDO DO CONTRATO | COMISSAO CLOSER
async function appendClienteRow(dados){
  var duracao=dados.duracao||0;
  var contrato=dados.contrato||0;
  var valorMes=dados.tipoValor==='mmr'?(dados.mensalidade||0):(duracao>0?(contrato/duracao):0);
  var row=[
    fmtDataClientes(dados.dataInicio),
    dados.nomeCliente||'',
    fmtBRLPlanilha(valorMes),
    '',
    '',
    '',
    buildPlanoLabel(dados.plano,duracao,dados.tipoValor),
    dados.origem||'',
    dados.closer||'',
    dados.sdr||'',
    fmtBRLPlanilha(contrato),
    ''
  ];
  // Salva no Firebase (fonte de verdade) além da planilha
  fbPush('clientes',{
    nomeCliente:dados.nomeCliente||'',
    dataInicio:dados.dataInicio||'',
    plano:buildPlanoLabel(dados.plano,duracao,dados.tipoValor),
    duracaoMeses:dados.duracao||12,
    tipoValor:dados.tipoValor||'',
    valorMensalidade:valorMes,
    valorContrato:contrato,
    origem:dados.origem||'',
    closer:dados.closer||'',
    sdr:dados.sdr||'',
    createdAt:Date.now()
  });
  return await appendSheetRow(SHEETS_IDS.clientes, SHEETS_GIDS.clientes, row, 'L');
}
// Gera e baixa o .docx do contrato preenchido com os dados do fechamento
// Envia o .docx do contrato para o Google Drive, converte para Google Doc,
// exporta como PDF, sobe o PDF como arquivo separado com link publico de
// leitura ("qualquer pessoa com o link") e retorna esse link.
// Retorna null se o Google nao estiver conectado ou se algo falhar.
async function uploadContratoToDrive(blob, nomeArquivo){
  if(!isGcalConnected()) return null;
  try{
    // 1) Upload do .docx convertendo para Google Doc
    var metaDoc={name:nomeArquivo, mimeType:'application/vnd.google-apps.document'};
    var formDoc=new FormData();
    formDoc.append('metadata', new Blob([JSON.stringify(metaDoc)], {type:'application/json'}));
    formDoc.append('file', blob);
    var up1=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method:'POST',
      headers:{'Authorization':'Bearer '+gcalToken.access_token},
      body:formDoc
    });
    if(!up1.ok){
      var errBody='';try{var j=await up1.json();errBody=j.error&&j.error.message?j.error.message:JSON.stringify(j);}catch(e){}
      throw new Error('Drive HTTP '+up1.status+(errBody?' — '+errBody:''));
    }
    var docId=(await up1.json()).id;

    // 2) Exporta o Google Doc como PDF
    var exp=await fetch('https://www.googleapis.com/drive/v3/files/'+docId+'/export?mimeType=application/pdf', {
      headers:{'Authorization':'Bearer '+gcalToken.access_token}
    });
    if(!exp.ok) throw new Error('Exportacao PDF falhou: HTTP '+exp.status);
    var pdfBlob=await exp.blob();

    // 3) Sobe o PDF como arquivo proprio no Drive
    var nomePdf=nomeArquivo.replace(/\.docx?$/i,'')+'.pdf';
    var formPdf=new FormData();
    formPdf.append('metadata', new Blob([JSON.stringify({name:nomePdf})], {type:'application/json'}));
    formPdf.append('file', pdfBlob);
    var up2=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method:'POST',
      headers:{'Authorization':'Bearer '+gcalToken.access_token},
      body:formPdf
    });
    if(!up2.ok) throw new Error('Upload Drive (pdf) falhou: HTTP '+up2.status);
    var pdfId=(await up2.json()).id;

    // 4) Permissao publica de leitura ("qualquer pessoa com o link")
    await fetch('https://www.googleapis.com/drive/v3/files/'+pdfId+'/permissions', {
      method:'POST',
      headers:{'Authorization':'Bearer '+gcalToken.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({role:'reader',type:'anyone'})
    });

    // 5) Remove o Google Doc intermediario (mantemos so o PDF)
    try{
      await fetch('https://www.googleapis.com/drive/v3/files/'+docId, {
        method:'DELETE',
        headers:{'Authorization':'Bearer '+gcalToken.access_token}
      });
    }catch(e){}

    return 'https://drive.google.com/file/d/'+pdfId+'/preview';
  }catch(err){
    console.error('Erro ao enviar contrato para o Drive:',err);
    throw err; // propaga para o caller mostrar o erro real ao usuario
  }
}

async function reenviarAssinaturaContrato(btn){
  if(!window._lastContratoDados){alert('Nenhum contrato em espera.');return;}
  if(!isGcalConnected()){alert('Google ainda nao conectado. Reconecte em Configurações → Google Calendar.');return;}
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i> Enviando...';}
  var d=window._lastContratoDados;
  try{
    var pdfUrl=await uploadContratoToDrive(d.blob, d.nomeArquivo);
    if(!pdfUrl){alert('Nao foi possivel enviar o PDF para o Drive.');if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-refresh"></i> Tentar novamente';}return;}
    // Cria no Asaas e registra cliente se ainda não foi feito
    if(!d._asaasFeito){
      var dd=d.dados||{};
      var vd={plano:dd.plano,duracao:dd.duracaoMeses,dataInicio:dd.dataInicio,
        tipoValor:dd.tipoValor,contrato:dd.valorTotal,mensalidade:dd.valorParcela,cnpj:dd.cnpjCliente||''};
      setTimeout(function(){criarCobrancaAsaas({nome:dd.nomeCliente,telefone:dd.telefone,cnpj:dd.cnpjCliente||''},vd,null);},300);
      appendClienteRow({nomeCliente:dd.nomeCliente,plano:dd.plano,duracao:dd.duracaoMeses,
        dataInicio:dd.dataInicio,tipoValor:dd.tipoValor,contrato:dd.valorTotal,mensalidade:dd.valorParcela});
      d._asaasFeito=true;
    }
    var ref=await fbPush('assinaturas',{
      cliente:d.dados.nomeCliente||'',
      contratoNome:d.nomeArquivo.replace(/\.docx$/i,''),
      pdfUrl:pdfUrl,
      telefone:d.dados.telefone||'',
      status:'pendente',
      createdAt:Date.now()
    });
    var signId=ref&&ref.key;
    if(signId){
      var signLink=signLinkFor(signId);
      var waOk=await enviarLinkAssinaturaWA(d.dados.telefone, d.dados.nomeCliente, signLink);
      var old=document.getElementById('modal-assin-erro');if(old)old.remove();
      mostrarModalLinkAssinatura(signLink, waOk);
      window._lastContratoDados=null;
    }
  }catch(e){
    console.error('Retry assinatura erro:',e);
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-refresh"></i> Tentar novamente';}
    alert('Erro: '+e.message);
  }
}
async function generateContratoDocx(dados){
  try{
    var url=CONTRATO_TEMPLATES[dados.plano];
    if(!url){alert('Modelo de contrato nao encontrado para o plano: '+dados.plano);return;}
    var resp=await fetch(url);
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var arrayBuffer=await resp.arrayBuffer();
    var zip=new PizZip(arrayBuffer);
    var doc=new window.docxtemplater(zip,{paragraphLoop:true,linebreaks:true});

    var dataInicio=new Date((dados.dataInicio||new Date().toISOString().split('T')[0])+'T00:00:00');
    var dataFim=addMonthsISO(dados.dataInicio,dados.duracaoMeses);

    var formaPagamento;
    if(dados.tipoValor==='mmr'){
      formaPagamento='o valor mensal de R$ '+fmtMoeda(dados.valorParcela)+', durante o prazo de '+dados.duracaoMeses+' meses, totalizando o valor global de R$ '+fmtMoeda(dados.valorTotal)+'.';
    }else{
      formaPagamento='o valor total de R$ '+fmtMoeda(dados.valorTotal)+', correspondente ao plano contratado, com vigência de '+dados.duracaoMeses+' meses.';
    }

    var FREQ_LABEL={mensal:'mensal',quinzenal:'quinzenal',semanal:'semanal'};
    if(dados.frequencia){
      formaPagamento+=' O pagamento será realizado de forma '+(FREQ_LABEL[dados.frequencia]||dados.frequencia)+', por meio de PIX, cartão de crédito ou outro meio previamente acordado entre as partes';
      if(dados.vencimento){
        formaPagamento+=', com vencimento '+dados.vencimento+'.';
      }else{
        formaPagamento+='.';
      }
    }

    doc.render({
      nome_cliente:dados.nomeCliente||'',
      cnpj_cliente:dados.cnpjCliente||'',
      duracao_meses:String(dados.duracaoMeses||''),
      data_inicio:fmtDataBR(dataInicio),
      data_fim:fmtDataBR(dataFim),
      forma_pagamento:formaPagamento,
      mmr:dados.tipoValor==='mmr'
    });

    var out=doc.getZip().generate({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    var nomeArquivo='Contrato - '+(dados.nomeCliente||'Cliente')+'.docx';
    var link=document.createElement('a');
    link.href=URL.createObjectURL(out);
    link.download=nomeArquivo;
    document.body.appendChild(link);link.click();document.body.removeChild(link);

    // Salva dados do contrato para retry caso Google nao esteja conectado
    window._lastContratoDados={dados:dados, nomeArquivo:nomeArquivo, blob:out,
      _asaasFeito:false // flag para evitar duplicar cobrança no Asaas no retry
    };

    // Envia o contrato para o Google Drive (PDF) e cria o link de assinatura eletronica
    if(isGcalConnected()){
      try{
        var pdfUrl=await uploadContratoToDrive(out, nomeArquivo);
        var ref=await fbPush('assinaturas',{
          cliente:dados.nomeCliente||'',
          contratoNome:nomeArquivo.replace(/\.docx$/i,''),
          pdfUrl:pdfUrl,
          telefone:dados.telefone||'',
          status:'pendente',
          createdAt:Date.now()
        });
        var signId=ref&&ref.key;
        if(signId){
          var signLink=signLinkFor(signId);
          var waOk=await enviarLinkAssinaturaWA(dados.telefone, dados.nomeCliente, signLink);
          mostrarModalLinkAssinatura(signLink, waOk);
        }
      }catch(e2){
        console.error('Erro ao criar link de assinatura:',e2);
        mostrarModalErroAssinatura('Erro ao enviar para o Drive: '+e2.message);
      }
    }else{
      // Google nao conectado — avisa e oferece retry após reconectar
      mostrarModalErroAssinatura('Token Google expirado ou nao conectado.');
    }
  }catch(err){
    console.error('Erro ao gerar contrato:',err);
    alert('Nao foi possivel gerar o contrato automaticamente (verifique se os modelos foram publicados em assets/contratos/ no GitHub Pages). Erro: '+err.message);
  }
}

function saveFollowup(){
  if(window._fuEditMode) return saveFollowupEdit();
  if(!_fuMeeting||!window._fuChoice)return;
  var fid=_fuMeeting.id;
  if(window._fuChoice==='noshow'){
    followups[fid]={meetingId:fid,tel:_fuMeeting.tel,nome:_fuMeeting.nome,
      comparecimento:'nao',venda:'nao',resultado:'noshow',
      bonusComp:0,bonusVenda:0,contrato:0,mensalidade:0,motivo:'',dt:todayStr()};
    meetings[fid].status='noshow';
    saveMeetingFB(fid, meetings[fid]);
    updateReuniaoSheetStatus(fid,'NO-SHOW');
    saveAll();closeModal('modal-followup');
    // Envia o lead para o fluxo de recontato de no-shows
    saveReativacaoStatus(_fuMeeting.tel,'nao-atendeu');
    if(_fuMeeting.kanbanKey) moveKanbanCard(_fuMeeting.kanbanKey,'recuperacao');
    if(CU.role==='atendente')showPage('ligar');else showPage('dashboard');
    return;
  }
  var choice=window._fuChoice; // 'sim' (venda) | 'retorno' | 'perdida'
  var venda=choice==='sim';
  var plano=venda?document.getElementById('fu-plano').value:'';
  var duracao=venda?(parseInt(document.getElementById('fu-duracao').value,10)||0):0;
  var dataInicio=venda?document.getElementById('fu-data-inicio').value:'';
  var tipoValor=venda?document.getElementById('fu-tipo-valor').value:'';
  var contrato=venda?(parseFloat(document.getElementById('fu-contrato').value)||0):0;
  var mensalidade=venda?(parseFloat(document.getElementById('fu-mensalidade').value)||0):0;
  var frequencia=(venda&&tipoValor!=='tcv')?document.getElementById('fu-frequencia').value:'';
  var vencimento=(venda&&tipoValor!=='tcv')?document.getElementById('fu-vencimento').value.trim():'';
  var cnpj=venda?document.getElementById('fu-cnpj').value.trim():'';
  var mensBase=venda?calcMensalidadeBase():0;
  var retornoData='';
  var motivo=(choice==='perdida')?(document.getElementById('fu-motivo')?document.getElementById('fu-motivo').value:''):'';
  var retornoTime='09:00';
  if(venda){
    if(!dataInicio){alert('Informe a data de inicio do contrato.');return;}
    if(!contrato){alert('Informe o valor do contrato.');return;}
    if(tipoValor==='mmr'&&!mensalidade){alert('Informe o valor da mensalidade.');return;}
  }
  if(choice==='retorno'){
    retornoData=document.getElementById('fu-retorno-date')?document.getElementById('fu-retorno-date').value:'';
    retornoTime=(document.getElementById('fu-retorno-time')?document.getElementById('fu-retorno-time').value:'')||'09:00';
    if(!retornoData){alert('Informe a data do retorno.');return;}
  }
  followups[fid]={meetingId:fid,tel:_fuMeeting.tel,nome:_fuMeeting.nome,
    comparecimento:'sim',venda:venda?'sim':'nao',
    resultado:venda?'venda':choice,
    plano:plano,duracao:duracao,dataInicio:dataInicio,tipoValor:tipoValor,
    contrato:contrato,mensalidade:mensalidade,frequencia:frequencia,vencimento:vencimento,
    bonusComp:BONUS_COMP,bonusVenda:venda?mensBase*BONUS_VENDA_PCT:0,
    motivo:motivo,
    retornoData:retornoData,retornoTime:retornoTime,
    dt:todayStr()};
  meetings[fid].status='done';
  saveMeetingFB(fid, meetings[fid]);
  updateReuniaoSheetStatus(fid, venda?'VENDA':choice==='retorno'?'RETORNO':'PERDIDA');
  if(choice==='retorno'){
    var lead=allLeads.find(function(l){return l.telefone===_fuMeeting.tel;});if(lead)lead._requeue=true;
    // Agenda o retorno: lead vai para Recuperacao com a data marcada
    saveReativacaoStatus(_fuMeeting.tel,'retorno',{retornoData:retornoData});
    var retornoDisplay=new Date(retornoData+'T00:00:00').toLocaleDateString('pt-BR');
    if(_fuMeeting.kanbanKey && kanbanData[_fuMeeting.kanbanKey]){
      var kk=_fuMeeting.kanbanKey;
      kanbanData[kk].status='recuperacao';
      kanbanData[kk].statusAt=Date.now();
      kanbanData[kk].retornoData=retornoData;
      kanbanData[kk].retornoDisplay=retornoDisplay;
      localStorage.setItem('audens_kanban', JSON.stringify(kanbanData));
      if(fbDb || initFirebase()){
        fbDb.ref('kanban/'+kk).update({status:'recuperacao',statusAt:Date.now(),retornoData:retornoData,retornoDisplay:retornoDisplay});
      }
    }
    // Avisa o lead via WhatsApp sobre o retorno agendado
    (function(tel, nome, display){
      fetch(RECEBERLEAD_URL+'/retorno?secret='+WEBHOOK_SECRET, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({telefone:tel, nome:nome, retornoDisplay:display})
      }).catch(function(){});
    })(_fuMeeting.tel, _fuMeeting.nome, retornoDisplay+' às '+retornoTime);
    // Cria automaticamente uma nova tarefa de follow-up pro mesmo responsavel,
    // que vence na data/hora do retorno e abre o mesmo modal (Venda/Retorno/Perdida)
    var newMid='retorno_'+fid+'_'+Date.now();
    var retornoDtISO=new Date(retornoData+'T'+retornoTime+':00').toISOString();
    var newMeeting={id:newMid,tel:_fuMeeting.tel,nome:_fuMeeting.nome,
      dtISO:retornoDtISO,dtDisplay:retornoDisplay+' '+retornoTime,
      status:'pending',responsavel:_fuMeeting.responsavel,
      // Copia SDR do meeting original — retorno é do mesmo SDR
      sdr:_fuMeeting.sdr||'',sdrName:_fuMeeting.sdrName||'',
      meetLink:_fuMeeting.meetLink||'',gcalLink:_fuMeeting.gcalLink||'',
      kanbanKey:_fuMeeting.kanbanKey||'',origem:_fuMeeting.origem||'Retorno',
      _retorno:true,_retornoDe:fid};
    meetings[newMid]=newMeeting;
    saveMeetingFB(newMid,newMeeting);
  }
  if(choice==='perdida'){
    // Venda perdida definitivamente: arquiva o lead no Funil
    if(_fuMeeting.kanbanKey) moveKanbanCard(_fuMeeting.kanbanKey,'arquivado');
  }
  if(venda){
    // Venda fechada: move o lead pra coluna "Fechado" no Funil
    if(_fuMeeting.kanbanKey) moveKanbanCard(_fuMeeting.kanbanKey,'fechado');
  }
  saveAll();closeModal('modal-followup');
  if(venda){
    var kk2=_fuMeeting.kanbanKey;
    var leadInfo=(kk2&&kanbanData[kk2])?kanbanData[kk2]:null;
    if(kk2) persistLeadCnpj(kk2, cnpj);
    generateContratoDocx({
      plano:plano,
      nomeCliente:(leadInfo&&leadInfo.empresa)?leadInfo.empresa:_fuMeeting.nome,
      cnpjCliente:cnpj||(leadInfo?(leadInfo.cnpj||''):''),
      telefone:_fuMeeting.tel,
      duracaoMeses:duracao,
      dataInicio:dataInicio,
      tipoValor:tipoValor,
      valorTotal:contrato,
      valorParcela:mensalidade,
      frequencia:frequencia,
      vencimento:vencimento
    });
    // Cria cobrança no Asaas (se API key configurada)
    (function(kk2,leadInfo,vd){
      setTimeout(function(){criarCobrancaAsaas(leadInfo||{nome:_fuMeeting.nome,telefone:_fuMeeting.tel,cnpj:cnpj},vd,kk2);},500);
    })(kk2,leadInfo,{plano:plano,duracao:duracao,dataInicio:dataInicio,tipoValor:tipoValor,contrato:contrato,mensalidade:mensalidade,cnpj:cnpj});
    // Registra a venda na planilha de Clientes (computa em todo o sistema)
    appendClienteRow({
      nomeCliente:(leadInfo&&leadInfo.empresa)?leadInfo.empresa:_fuMeeting.nome,
      plano:plano,
      duracao:duracao,
      dataInicio:dataInicio,
      tipoValor:tipoValor,
      contrato:contrato,
      mensalidade:mensalidade,
      origem:(leadInfo&&leadInfo.origem)?leadInfo.origem:(_fuMeeting.origem||''),
      closer:_fuMeeting.responsavel||'',
      sdr:_fuMeeting.sdr||''
    });
    // Salva contrato no Firebase para cálculo de comissão
    (function(){
      var _planoDur=duracao||1;
      var _planoNome=plano==='premium'?'Plano Premium':plano==='elite'?'Plano Elite':'Plano 3';
      var _planoSufixo=_planoDur>=6?' - Semestral':_planoDur>=3?' - Trimestral':' - Mensal';
      var _mrr=tipoValor==='tcv'?Math.round(contrato/_planoDur):(mensalidade||contrato);
      var _tcv=tipoValor==='tcv'?contrato:(_mrr*_planoDur);
      saveContrato(null,{
        cliente:(leadInfo&&leadInfo.empresa)?leadInfo.empresa:_fuMeeting.nome,
        dataInicio:dataInicio,
        valorMes:_mrr,
        valorVendido:_tcv,
        planoDuracao:_planoDur,
        plano:_planoNome+_planoSufixo,
        gestor:(leadInfo&&leadInfo.gestor)?leadInfo.gestor:'',
        origem:(leadInfo&&leadInfo.origem)?leadInfo.origem:(_fuMeeting.origem||''),
        closer:_fuMeeting.responsavel||'',
        sdr:_fuMeeting.sdr||'',
        kanbanKey:kk2||'',
        ativo:true
      }).catch(function(e){console.warn('Firebase contrato:',e);});
    })();
  }
  if(CU.role==='atendente')showPage('ligar');else showPage('dashboard');
}
// Salva/atualiza o CNPJ do lead no Kanban (preenchido na hora de gerar o contrato)
function persistLeadCnpj(kk, cnpj){
  if(!kk || !cnpj || !kanbanData[kk]) return;
  if(kanbanData[kk].cnpj === cnpj) return;
  kanbanData[kk].cnpj = cnpj;
  localStorage.setItem('audens_kanban', JSON.stringify(kanbanData));
  if(fbDb || initFirebase()){ fbDb.ref('kanban/'+kk).update({cnpj:cnpj}); }
}

}

        '<button class="btn btn-outline" onclick="applyDashDateRange()" style="font-size:12px;padding:8px 14px;letter-spacing:1px;"><i class="ti ti-filter"></i></button>'+
        '<button class="btn btn-outline" onclick="clearDashDateRange()" style="font-size:12px;padding:8px 12px;" title="Limpar filtro"><i class="ti ti-x"></i></button>'+

      '<i class="ti ti-loader-2" style="font-size:40px;display:block;margin-bottom:16px;color:var(--purple2);animation:spin 1s linear infinite;"></i>'+
      'Carregando planilhas...'+
    '</div>'+
    '<div id="dc-content" style="display:none;"></div>'+

function changeDashPeriod(p){_dashPeriod=p;_dashStart=null;_dashEnd=null;refreshDashCom();}
function applyDashDateRange(){
  var s=document.getElementById('dash-start');
  var e=document.getElementById('dash-end');
  if(s&&e&&s.value&&e.value){
    _dashStart=new Date(s.value+'T00:00:00');
    _dashEnd=new Date(e.value+'T23:59:59');
    _dashPeriod=null; // override period filter with date range
    refreshDashCom();
  }
}
function clearDashDateRange(){
  _dashStart=null;_dashEnd=null;
  _dashPeriod=getCurrentPeriod();
  var s=document.getElementById('dash-start');
  var e=document.getElementById('dash-end');
  if(s)s.value='';if(e)e.value='';
  refreshDashCom();
}
async function refreshDashCom(){
  var loading=document.getElementById('dc-loading');
  var content=document.getElementById('dc-content');
  if(!loading||!content)return;
  if(!isGcalConnected()){
    loading.style.display='none';content.style.display='block';
    content.innerHTML='<div class="empty-st"><i class="ti ti-plug-connected-x"></i><p>Conecte o Google em Configuracoes</p></div>';
    return;
  }
  loading.style.display='block';
  loading.innerHTML='<i class="ti ti-loader-2" style="font-size:40px;display:block;margin-bottom:16px;color:var(--purple2);animation:spin 1s linear infinite;"></i><span style="font-family:\'Barlow Condensed\',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);">Carregando...</span>';
  content.style.display='none';
  try{
    var data=await loadDataHybrid();
    // Auto-fetch Meta Ads spend (só se não houver valor manual definido)
    _metaFetchErr=false;
    if(isMetaConnected()&&metaAccountId){
      var period=_dashPeriod||getCurrentPeriod();
      var spend=await fetchMetaSpend(period);
      if(spend!==null){_investidoMes[period]=spend;saveAll();}
      else{_metaFetchErr=true;}
      // Buscar mês anterior também para comparação
      var pp2=period.split('/');
      var prevM=parseInt(pp2[0])===1?12:parseInt(pp2[0])-1;
      var prevA=parseInt(pp2[0])===1?parseInt(pp2[1])-1:parseInt(pp2[1]);
      var prevP=String(prevM).padStart(2,'0')+'/'+prevA;
      if(!_investidoMes[prevP]){
        var spendPrev=await fetchMetaSpend(prevP);
        if(spendPrev!==null){_investidoMes[prevP]=spendPrev;saveAll();}
      }
    }
    content.innerHTML=buildDashComHTML(data);
    content.style.display='block';loading.style.display='none';
    var syncBtn=document.getElementById('dc-inv-sync');
    if(syncBtn)syncBtn.addEventListener('click',async function(){
      var p=_dashPeriod||getCurrentPeriod();
      this.disabled=true;this.textContent='...';
      var spend=await fetchMetaSpend(p);
      if(spend!==null){_investidoMes[p]=spend;saveAll();}
      refreshDashCom();
    });
    var mc=document.getElementById('dc-mc-input');
    if(mc)mc.addEventListener('change',function(){_metaComercial.contratos=parseFloat(this.value)||40000;saveAll();refreshDashCom();});
    var mcc=document.getElementById('dc-mcc-input');
    if(mcc)mcc.addEventListener('change',function(){_metaComercial.clientes=parseFloat(this.value)||20;saveAll();refreshDashCom();});
  }catch(e){
    loading.style.display='block';
    loading.innerHTML='<div class="warn-note"><i class="ti ti-alert-triangle"></i> Erro: '+e.message+'<br><button class="btn btn-outline" onclick="refreshDashCom()" style="margin-top:12px;">Tentar novamente</button></div>';
  }
}
function buildDashComHTML(data){
  var period=_dashPeriod||getCurrentPeriod();
  var inv=_investidoMes[period]||0;
  var pp=period.split('/');
  var mlong=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var periodLabel=mlong[parseInt(pp[0])-1]+' '+pp[1];

  // ---- FILTER DATA BY PERIOD OR DATE RANGE ----
  function inRange(d){
    if(!d) return false;
    if(_dashStart&&_dashEnd) return d>=_dashStart&&d<=_dashEnd;
    return periodStr(d)===period;
  }
  var leadsF=data.leads.rows.filter(function(r){
    var d=parseBRDate(col(r,['Data','DATA','data']));return inRange(d);
  });
  var reunioesF=data.reunioes.rows.filter(function(r){
    var d=parseBRDate(col(r,['DATA DE AGENDAMENTO','Data de Agendamento','DataAgendamento','Data Agendamento']));
    return inRange(d);
  });
  var clientesF=data.clientes.rows.filter(function(r){
    var d=parseBRDate(col(r,['DATA DE INICIO','DATA DE INÍCIO','Data de Inicio','Data Inicio','DataInicio']));
    return inRange(d);
  });
  // All clientes for annual metrics
  var todosClientes=data.clientes.rows;

  // ---- BASE METRICS ----
  var totalLeads=leadsF.length;
  var leadsQ=leadsF.filter(function(l){return parseFaturamentoLead(l)>=40000;}).length;

  // ---- TRÁFEGO METRICS (Fonte = Anúncios) ----
  var leadsTrafego=leadsF.filter(function(l){
    var ad=(col(l,['Ad','AD','ad'])||'').trim();
    return ad && ad!=='-';
  });
  var leadsTrafegoCount=leadsTrafego.length;
  var leadsTrafegoQ=leadsTrafego.filter(function(l){return parseFaturamentoLead(l)>=40000;}).length;
  var txQualifTrafego=leadsTrafegoCount>0?Math.round(leadsTrafegoQ/leadsTrafegoCount*100):0;

  // ---- TRÁFEGO: reuniões e clientes atribuídos a Tráfego Pago (via ORIGEM) ----
  var reunRealTrafego=reunioesF.filter(function(r){
    var o=categorizeOrigem(col(r,['ORIGEM','Origem','origem']));
    return o==='Trafego Pago'&&isRealizada(col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status']));
  }).length;
  var clientesTrafego=clientesF.filter(function(c){
    return categorizeOrigem(col(c,['ORIGEM','Origem','origem']))==='Trafego Pago';
  });
  var novosClientesTrafego=clientesTrafego.length;
  var valorVendidoTrafego=clientesTrafego.reduce(function(s,c){
    var mrr=parseMoney(col(c,['VALOR CONTRATO/MÊS','VALOR CONTRATO/MES','Valor Contrato/Mês','Valor Contrato/Mes']));
    if(!mrr) mrr=parseMoney(col(c,['VALOR VENDIDO DO CONTRATO','Valor Vendido do Contrato','VALOR VENDIDO','Valor Vendido']));
    return s+mrr;
  },0);
  var ticketMedioTrafego=novosClientesTrafego>0?valorVendidoTrafego/novosClientesTrafego:0;
  // Receita TCV-aware para ROAS (MRR se mensal, TCV total se trimestral/semestral)
  var revenueTrafego=clientesTrafego.reduce(function(s,c){
    var plano=(col(c,['PLANO','Plano','plano'])||'').toUpperCase();
    var isTCV=plano.includes('TRIMESTRAL')||plano.includes('SEMESTRAL');
    if(isTCV) return s+parseMoney(col(c,['VALOR VENDIDO DO CONTRATO','Valor Vendido do Contrato','VALOR VENDIDO','Valor Vendido']));
    var mrr=parseMoney(col(c,['VALOR CONTRATO/MÊS','VALOR CONTRATO/MES','Valor Contrato/Mês','Valor Contrato/Mes']));
    if(!mrr) mrr=parseMoney(col(c,['VALOR VENDIDO DO CONTRATO','Valor Vendido do Contrato','VALOR VENDIDO','Valor Vendido']));
    return s+mrr;
  },0);
  var roasDash=inv>0&&revenueTrafego>0?revenueTrafego/inv:null;

  // ---- RANKING DE ADS ----
  var adMap={};
  leadsTrafego.filter(function(l){
    return parseFaturamentoLead(l)>=40000;
  }).forEach(function(l){
    var ad=(col(l,['Ad','AD','ad'])||'').trim();
    if(!ad||ad==='-'||ad==='') return;
    adMap[ad]=(adMap[ad]||0)+1;
  });
  var adRanking=Object.keys(adMap).map(function(a){return{ad:a,count:adMap[a]};})
    .sort(function(a,b){return b.count-a.count;}).slice(0,10);

  // Meetings
  var reunAgend=reunioesF.length;
  var reunReal=reunioesF.filter(function(r){
    return isRealizada(col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status']));
  }).length;
  var reunNoShow=reunioesF.filter(function(r){
    var st=(col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status'])||'').toUpperCase().trim();
    return st==='NO-SHOW'||st==='NOSHOW'||st==='NO SHOW';
  }).length;
  var reunPend=reunioesF.filter(function(r){
    var st=(col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status'])||'').toUpperCase().trim();
    return st==='AGENDADA'||st===''||(!isRealizada(st)&&st!=='NO-SHOW'&&st!=='NO SHOW'&&st!=='NOSHOW');
  }).length;

  // Taxa no-show = noshow / (noshow + realizada) - só sobre resolvidas
  var resolvidas=reunReal+reunNoShow;
  var taxaNoShow=resolvidas>0?Math.round(reunNoShow/resolvidas*100):0;
  var taxaComp=resolvidas>0?Math.round(reunReal/resolvidas*100):0;

  // Conversions
  var novosClientes=clientesF.length;
  var taxaConvReun=reunReal>0?Math.round(novosClientes/reunReal*100):0;
  var taxaConvLead=totalLeads>0?Math.round(novosClientes/totalLeads*100):0;
  var taxaReunLead=totalLeads>0?Math.round(reunAgend/totalLeads*100):0;

  // Revenue
  var valorVendido=clientesF.reduce(function(s,c){
    // MRR = soma do VALOR CONTRATO/MÊS dos fechamentos do período
    var mrr=parseMoney(col(c,['VALOR CONTRATO/MÊS','VALOR CONTRATO/MES','Valor Contrato/Mês','Valor Contrato/Mes']));
    if(!mrr) mrr=parseMoney(col(c,['VALOR VENDIDO DO CONTRATO','Valor Vendido do Contrato','VALOR VENDIDO','Valor Vendido']));
    return s+mrr;
  },0);

  // ---- ANNUAL METRICS ----
  var anoAtual=new Date().getFullYear();
  // Clientes ativos = no cancellation date
  var clientesAtivos=todosClientes.filter(function(c){
    var cancel=col(c,['DATA DE CANCELAMENTO','Data de Cancelamento','DATA CANCELAMENTO','Data Cancelamento'])||'';
    return !cancel.trim();
  }).length;
  // Novos clientes no ano
  var clientesAno=todosClientes.filter(function(c){
    var d=parseBRDate(col(c,['DATA DE INICIO','DATA DE INÍCIO','Data de Inicio','Data Inicio','DataInicio']));
    return d&&d.getFullYear()===anoAtual;
  }).length;

  // ---- METAS ----
  var metaMes1=20, metaMes2=25, metaMes3=30;
  var metaAnual=170;
  var pctMes1=Math.min(100,Math.round(novosClientes/metaMes1*100));
  var pctMes2=Math.min(100,Math.round(novosClientes/metaMes2*100));
  var pctMes3=Math.min(100,Math.round(novosClientes/metaMes3*100));
  var pctAnual=Math.min(100,Math.round(clientesAtivos/metaAnual*100));

  function metaCol(pct){return pct>=100?'var(--green)':pct>=70?'var(--amber)':'var(--red)';}
  function barColor(pct){return pct>=100?'#22c55e':pct>=70?'#f59e0b':'#ef4444';}
  function metaBar(pct,col){
    return '<div style="background:rgba(255,255,255,0.08);border-radius:99px;height:6px;margin-top:8px;">'+
      '<div style="width:'+pct+'%;background:'+col+';border-radius:99px;height:6px;transition:width .5s;"></div></div>';
  }

  // ---- COST METRICS (Tráfego Pago) ----
  var cpl=inv>0&&leadsTrafegoCount>0?inv/leadsTrafegoCount:0;
  var cplq=inv>0&&leadsTrafegoQ>0?inv/leadsTrafegoQ:0;
  var cpr=inv>0&&reunRealTrafego>0?inv/reunRealTrafego:0;
  var cpa=inv>0&&novosClientesTrafego>0?inv/novosClientesTrafego:0;

  // Ticket médio = valorVendido / novosClientes
  var ticketMedio=novosClientes>0?valorVendido/novosClientes:0;

  // ---- PERÍODO ANTERIOR (para comparação) ----
  var ppNum=parseInt(pp[0]), ppAno=parseInt(pp[1]);
  var prevMes=ppNum===1?12:ppNum-1;
  var prevAno=ppNum===1?ppAno-1:ppAno;
  var prevPeriod=String(prevMes).padStart(2,'0')+'/'+prevAno;
  var invPrev=_investidoMes[prevPeriod]||0;

  function inPrevRange(d){
    if(!d) return false;
    return periodStr(d)===prevPeriod;
  }
  var leadsFP=data.leads.rows.filter(function(r){
    var d=parseBRDate(col(r,['Data','DATA','data']));return inPrevRange(d);
  });
  var reunioesFP=data.reunioes.rows.filter(function(r){
    var d=parseBRDate(col(r,['DATA DE AGENDAMENTO','Data de Agendamento','DataAgendamento','Data Agendamento']));
    return inPrevRange(d);
  });
  var clientesFP=data.clientes.rows.filter(function(r){
    var d=parseBRDate(col(r,['DATA DE INICIO','DATA DE INÍCIO','Data de Inicio','Data Inicio','DataInicio']));
    return inPrevRange(d);
  });

  var leadsTrafegoP=leadsFP.filter(function(l){
    var ad=(col(l,['Ad','AD','ad'])||'').trim();
    return ad && ad!=='-';

  // ===== POR SDR =====
  var sdrCols=Object.keys(sData);

// Calcula evolução mensal: novos clientes, cancelamentos, ativos, churn, MRR
function buildHistoricoMensal(todosClientes){
  if(!todosClientes||todosClientes.length===0) return '';

  // Coletar todos os meses com atividade
  var mesesSet = {};
  todosClientes.forEach(function(c){
    var dInicio = parseBRDate(col(c,['DATA DE INICIO','DATA DE INÍCIO','Data de Inicio','Data Inicio','DataInicio']));
    var dCancel = parseBRDate(col(c,['DATA DE CANCELAMENTO','Data de Cancelamento','DATA CANCELAMENTO','Data Cancelamento']));
    if(dInicio) mesesSet[periodStr(dInicio)] = true;
    if(dCancel) mesesSet[periodStr(dCancel)] = true;
  });

  // Sort meses desc (mais recente primeiro)
  var meses = Object.keys(mesesSet).sort(function(a,b){
    // format: MM/YYYY
    var pa=a.split('/'), pb=b.split('/');
    var da=new Date(parseInt(pa[1]),parseInt(pa[0])-1,1);
    var db=new Date(parseInt(pb[1]),parseInt(pb[0])-1,1);
    return db-da;
  }).slice(0,12); // últimos 12 meses

  if(meses.length===0) return '';

  // Para cada mês calcular métricas
  var rows = meses.map(function(mes){
    var partes = mes.split('/');
    var mesNum = parseInt(partes[0]), ano = parseInt(partes[1]);
    var inicioMes = new Date(ano, mesNum-1, 1);
    var fimMes = new Date(ano, mesNum, 0, 23, 59, 59);

    var novos = 0, cancelamentos = 0, mrr = 0, ativosNoFim = 0;

    todosClientes.forEach(function(c){
      var dInicio = parseBRDate(col(c,['DATA DE INICIO','DATA DE INÍCIO','Data de Inicio','Data Inicio','DataInicio']));
      var dCancel = parseBRDate(col(c,['DATA DE CANCELAMENTO','Data de Cancelamento','DATA CANCELAMENTO','Data Cancelamento']));
      var valorMes = parseMoney(col(c,['VALOR CONTRATO/MÊS','VALOR CONTRATO/MES','Valor Contrato/Mês','Valor Contrato/Mes','VALOR MENSALIDADE','VALOR MÊS','VALOR MES','Valor Mensalidade','Valor Mensal']));

      // Novo neste mês
      if(dInicio && dInicio >= inicioMes && dInicio <= fimMes) novos++;

      // Cancelou neste mês
      if(dCancel && dCancel >= inicioMes && dCancel <= fimMes) cancelamentos++;

      // Ativo no fim do mês = iniciou antes ou durante E (não cancelou OU cancelou depois)
      var ativoNoFim = dInicio && dInicio <= fimMes && (!dCancel || dCancel > fimMes);
      if(ativoNoFim){
        ativosNoFim++;
        mrr += valorMes;
      }
    });

    // Ativos no início do mês
    var ativosNoInicio = ativosNoFim - novos + cancelamentos;
    var churn = ativosNoInicio > 0 ? (cancelamentos / ativosNoInicio * 100) : 0;

    // Label mês
    var nomesMes = ['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
    var label = nomesMes[mesNum-1]+'/'+String(ano).slice(2);

    return {label:label, novos:novos, cancelamentos:cancelamentos, ativos:ativosNoFim, churn:churn, mrr:mrr};
  });

  // Build table
  var tbody = rows.map(function(r){
    var churnCor = r.churn > 25 ? 'var(--red)' : r.churn > 10 ? 'var(--amber)' : 'var(--green)';
    var cancelCor = r.cancelamentos > 10 ? 'rgba(239,68,68,0.25)' : r.cancelamentos > 5 ? 'rgba(245,158,11,0.15)' : 'transparent';
    var novosCor = r.novos >= 20 ? 'rgba(34,197,94,0.2)' : r.novos >= 10 ? 'rgba(34,197,94,0.1)' : 'transparent';
    var mrrFmt = r.mrr >= 1000 ? 'R$ '+r.mrr.toLocaleString('pt-BR',{maximumFractionDigits:0}) : 'R$ '+r.mrr.toFixed(0);
    return '<tr>'+
      '<td style="font-family:Barlow Condensed,sans-serif;font-weight:700;color:var(--white);white-space:nowrap;">'+r.label+'</td>'+
      '<td style="background:'+novosCor+';color:var(--white);font-weight:700;text-align:center;">'+r.novos+'</td>'+
      '<td style="background:'+cancelCor+';color:var(--white);font-weight:700;text-align:center;">'+r.cancelamentos+'</td>'+
      '<td style="color:var(--cyan);font-weight:700;text-align:center;">'+r.ativos+'</td>'+
      '<td style="color:'+churnCor+';font-weight:700;text-align:center;">'+r.churn.toFixed(2).replace('.',',')+'%</td>'+
      '<td style="color:var(--green);font-weight:700;text-align:right;">'+mrrFmt+'</td>'+
    '</tr>';
  }).join('');

  return '<div class="cb" style="margin-bottom:16px;">'+
    '<div class="cb-hd">'+
      '<div class="cb-title"><i class="ti ti-calendar-stats" style="color:var(--purple3);margin-right:6px;"></i>Evolução Mensal · Últimos 12 Meses</div>'+
    '</div>'+
    '<div style="overflow-x:auto;padding:0;">'+
      '<table style="width:100%;border-collapse:collapse;">'+
        '<thead><tr>'+

async function refreshAnaliseAds(){
  var loading=document.getElementById('ads-loading');
  var cont=document.getElementById('ads-content');
  if(!loading||!cont) return;
  loading.style.display='block'; cont.style.display='none';
  try{
    // Atualiza gasto do Meta antes de construir o HTML
    if(isMetaConnected()&&metaAccountId){
      var period=_adsPeriod||getCurrentPeriod();
      var spend=await fetchMetaSpend(period);
      if(spend!==null){_investidoMes[period]=spend;saveAll();}
    }
    // Ads: lê leads e reuniões da planilha (histórico preciso) + Firebase apenas para novos leads
    var dataAds=await loadDataHybrid();
    try{
      var [_lRaw,_rRaw]=await Promise.all([
        fetchSheetVals(SHEETS_IDS.leads,SHEETS_GIDS.leads),
        fetchSheetVals(SHEETS_IDS.reunioes,SHEETS_GIDS.reunioes)
      ]);
      if(_lRaw&&_lRaw.length>1) dataAds.leads=rawToObjs(_lRaw);
      if(_rRaw&&_rRaw.length>1) dataAds.reunioes=rawToObjs(_rRaw);
    }catch(_e2){ console.warn('[Ads] Planilha indisponível, usando Firebase',_e2); }
    cont.innerHTML=buildAnaliseAdsHTML(dataAds);
    cont.style.display='block'; loading.style.display='none';
  }catch(e){
    loading.style.display='none';
    cont.style.display='block';
    cont.innerHTML='<div class="warn-note"><i class="ti ti-alert-triangle"></i> Erro: '+e.message+'</div>';
  }
}

function buildAnaliseAdsHTML(data){
  var period=_adsPeriod||getCurrentPeriod();
  function inAdsRange(d){
    if(!d) return false;
    if(_adsStart&&_adsEnd) return d>=_adsStart&&d<=_adsEnd;
    return periodStr(d)===period;
  }

  // Filter leads by period — all leads with Ad filled = paid traffic
  var leadsTrafego=data.leads.rows.filter(function(r){
    var d=parseBRDate(col(r,['Data','DATA','data']));
    if(!inAdsRange(d)) return false;
    var ad=(col(r,['Ad','AD','ad'])||'').trim();
    return ad && ad!=='-' && ad!=='(sem ad)';
  });

  // ===== FUNIL DIRETO: conta da planilha de reuniões por ORIGEM = TRÁFEGO no período =====
  // Mais preciso que agregar via leads, pois não depende do campo Ad estar preenchido
  var funilReunTrafego=(data.reunioes&&data.reunioes.rows?data.reunioes.rows:[]).filter(function(r){
    var d=parseBRDate(col(r,['DATA','Data','data','DATA DE AGENDAMENTO','Data de Agendamento']));
    if(!inAdsRange(d)) return false;
    var ori=(col(r,['ORIGEM','Origem','origem'])||'').toLowerCase();
    return ori.includes('tr') || ori.includes('traffic') || ori.includes('tráfego') || ori.includes('trafego');
  });
  var funilAgend=funilReunTrafego.length;
  var funilReal=funilReunTrafego.filter(function(r){
    return isRealizada(col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status']));
  }).length;
  var funilFech=funilReunTrafego.filter(function(r){
    var st=(col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status'])||'').toUpperCase();
    return st==='VENDA';
  }).length;
  // Fechamentos e MRR direto da aba clientes (fonte de verdade — mais completa que cadeia lead→ad→reunião)
  var _clientesTrafegoPeriodo=(data.clientes&&data.clientes.rows?data.clientes.rows:[]).filter(function(c){
    var d=parseBRDate(col(c,['DATA DE INICIO','DATA DE INÍCIO','Data de Inicio','Data Inicio']));
    if(!inAdsRange(d)) return false;
    return categorizeOrigem(col(c,['ORIGEM','Origem','origem']))==='Trafego Pago';
  });
  var funilFechCli=_clientesTrafegoPeriodo.length;
  // MRR calculado na mesma fonte dos fechamentos (aba clientes filtrada)
  var funilMrr=_clientesTrafegoPeriodo.reduce(function(s,c){
    var mrr=parseMoney(col(c,['VALOR CONTRATO/MÊS','VALOR CONTRATO/MES','Valor Contrato/Mês','Valor Contrato/Mes']));
    if(!mrr) mrr=parseMoney(col(c,['VALOR VENDIDO DO CONTRATO','Valor Vendido do Contrato','VALOR VENDIDO','Valor Vendido']));
    return s+mrr;
  },0);
  // Receita para ROAS: MRR para mensais, TCV para trimestral/semestral
  var funilRevenue=_clientesTrafegoPeriodo.reduce(function(s,c){
    var plano=(col(c,['PLANO','Plano','plano'])||'').toUpperCase();
    var isTCV=plano.includes('TRIMESTRAL')||plano.includes('SEMESTRAL');
    if(isTCV){
      var tcv=parseMoney(col(c,['VALOR VENDIDO DO CONTRATO','Valor Vendido do Contrato','VALOR VENDIDO','Valor Vendido']));
      return s+tcv;
    } else {
      var mrr2=parseMoney(col(c,['VALOR CONTRATO/MÊS','VALOR CONTRATO/MES','Valor Contrato/Mês','Valor Contrato/Mes']));
      if(!mrr2) mrr2=parseMoney(col(c,['VALOR VENDIDO DO CONTRATO','Valor Vendido do Contrato','VALOR VENDIDO','Valor Vendido']));
      return s+mrr2;
    }
  },0);
  // Usa gasto do Meta API (mesmo período da dash) se disponível; fallback para input manual
  var _metaSpendAds=(_investidoMes&&period)?(_investidoMes[period]||0):0;
  var gastoAds=_metaSpendAds||_adsGasto||0;
  var _gastoViaFacebook=_metaSpendAds>0;
  var roas=gastoAds>0?(funilRevenue/gastoAds):null;
  if(funilFechCli>funilFech) funilFech=funilFechCli;
  // Realizadas novas (Firebase) que ainda não estão na planilha — adiciona ao funil
  // Só conta meetings que TÊM ad atribuído no kanbanData (= leads novos via kanban)
  // para não inflar com meetings antigas que foram importadas via console
  var _sheetPhones=new Set();
  funilReunTrafego.forEach(function(r){
    var t=(col(r,['TELEFONE','Telefone','telefone'])||'').replace(/\D/g,'');
    if(t.length>9) t=t.slice(-9);
    if(t) _sheetPhones.add(t);
  });
  var funilRealFB=0;
  Object.values(meetings).forEach(function(m){
    if(m._hidden) return;
    var bookTs=m.scheduledAt||0;
    if(!bookTs) return;
    var bd=new Date(bookTs);
    if(!inAdsRange(bd)) return;
    if(m.status!=='done'&&m.status!=='noshow') return;
    // Só meetings com ad vinculado (lead novo que entrou pelo kanban)
    var kb=m.kanbanKey?kanbanData[m.kanbanKey]:null;
    if(!kb||!kb.ad) return;
    var orig=(m.origem||(kb&&kb.origem)||'Tráfego').toLowerCase();
    if(!orig.includes('tr')&&!orig.includes('traffic')&&!orig.includes('tráfego')&&!orig.includes('trafego')) return;
    // Ignora se já está na planilha (evita dupla contagem)
    var mTel=(m.tel||'').replace(/\D/g,'');
    if(mTel.length>9) mTel=mTel.slice(-9);
    if(_sheetPhones.has(mTel)) return;
    funilRealFB++;
  });
  funilReal+=funilRealFB;

  // Build phone→reuniao map (normalize phone: digits only, last 9 digits)
  var reunMap={};
  var reunNomeMap={};
  data.reunioes.rows.forEach(function(r){
    var tel=(col(r,['TELEFONE','Telefone','telefone'])||'').replace(/\D/g,'');
    if(tel.length>9) tel=tel.slice(-9);
    if(tel) reunMap[tel]=r;
    // Also index by nome for fallback
    var nome=(col(r,['CLIENTE','Cliente','cliente'])||'').trim().toLowerCase();
    if(nome) reunNomeMap[nome]=r;
  });

  // Build nome→cliente map (reuniao.CLIENTE → clientes.CLIENTE)
  // Normaliza: remove espaços extras, acentos, caracteres especiais para matching robusto
  function normNome(s){return(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();}
  var cliNomeMap={};
  var cliNomeList=[]; // para fuzzy matching
  data.clientes.rows.forEach(function(c){
    var nome=(col(c,['CLIENTE','Cliente','cliente'])||'').trim().toLowerCase();
    var nomeNorm=normNome(nome);
    if(nome){cliNomeMap[nome]=c;}
    if(nomeNorm&&nomeNorm!==nome){cliNomeMap[nomeNorm]=c;}
    if(nomeNorm) cliNomeList.push({norm:nomeNorm,c:c});
  });
  // Fuzzy lookup: tenta exact, depois normalized, depois containment
  function cliLookup(rawNome){
    if(!rawNome) return null;
    var lo=rawNome.trim().toLowerCase();
    var norm=normNome(rawNome);
    if(cliNomeMap[lo]) return cliNomeMap[lo];
    if(cliNomeMap[norm]) return cliNomeMap[norm];
    // Containment: verifica se um contém o outro (mínimo 5 chars)
    if(norm.length>=5){
      for(var _i=0;_i<cliNomeList.length;_i++){
        var cn=cliNomeList[_i].norm;
        if(cn.length>=5&&(cn.includes(norm)||norm.includes(cn))) return cliNomeList[_i].c;
      }
    }
    return null;
  }

  // Aggregate by ad
  var adData={};

  // Step 1: seed ads from leads with 'ad' field (for leads/qualif count)
  leadsTrafego.forEach(function(l){
    var ad=(col(l,['Ad','AD','ad'])||'').trim();
    var campanha=(col(l,['Campanha','CAMPANHA','campanha'])||'').trim();
    var conjunto=(col(l,['Conjunto','CONJUNTO','conjunto'])||'').trim();
    var fat=parseFaturamento(col(l,['Faturamento','FATURAMENTO','faturamento']));
    if(!ad||ad==='-') ad='(sem ad)';
    if(!adData[ad]) adData[ad]={ad:ad,campanha:campanha,conjunto:conjunto,leads:0,qualif:0,reunioes:0,realizadas:0,fechamentos:0,mrr:0,fats:[]};
    var d=adData[ad];
    d.leads++;
    if(fat>=40000) d.qualif++;
    d.fats.push(fat);
  });

  // Step 2: build phone→ad lookup
  // Fonte 1: kanbanData do Firebase (foi sincronizado via console com ad/campanha/conjunto)
  var telAdMap={};
  Object.values(kanbanData).forEach(function(k){
    if(!k.ad) return;
    var tel=(k.telefone||'').replace(/\D/g,'');
    if(tel.length>9) tel=tel.slice(-9);
    if(tel) telAdMap[tel]={ad:k.ad,campanha:k.campanha||'',conjunto:k.conjunto||''};
  });
  // Fonte 2: planilha de leads (tem Telefone + Ad — complementa/sobrescreve Firebase se mais recente)
  (data.leads&&data.leads.rows?data.leads.rows:[]).forEach(function(l){
    var ad=(col(l,['Ad','AD','ad'])||'').trim();
    if(!ad||ad==='-'||ad==='(sem ad)') return;
    var tel=(col(l,['Telefone','TELEFONE','telefone'])||'').replace(/\D/g,'');
    if(tel.length>9) tel=tel.slice(-9);
    if(!tel) return;
    var campanha=(col(l,['Campanha','CAMPANHA','campanha'])||'').trim();
    var conjunto=(col(l,['Conjunto','CONJUNTO','conjunto'])||'').trim();
    telAdMap[tel]={ad:ad,campanha:campanha,conjunto:conjunto};
  });

  // Mapa phone → followup (para pegar vendas registradas no Firebase mesmo que planilha mostre REALIZADA)
  var phoneFuMap={};
  Object.values(followups).forEach(function(fu){
    if(!fu||!fu.tel) return;
    var fuTel=(fu.tel||'').replace(/\D/g,'');
    if(fuTel.length>9) fuTel=fuTel.slice(-9);
    if(fuTel) phoneFuMap[fuTel]=fu;
  });

  // Step 3a: attribute sheet reuniões to ads via phone→telAdMap
  // Usa a planilha de reuniões (mesma fonte do Funil) para atribuição histórica
  var _step3Phones=new Set(); // controle de dupla contagem
  (data.reunioes&&data.reunioes.rows?data.reunioes.rows:[]).forEach(function(r){
    var d=parseBRDate(col(r,['DATA','Data','data','DATA DE AGENDAMENTO','Data de Agendamento']));
    if(!inAdsRange(d)) return;
    var ori=(col(r,['ORIGEM','Origem','origem'])||'').toLowerCase();
    var isTrafego=ori.includes('tr')||ori.includes('traffic')||ori.includes('tráfego')||ori.includes('trafego');
    if(!isTrafego) return;
    var rTel=(col(r,['TELEFONE','Telefone','telefone'])||'').replace(/\D/g,'');
    if(rTel.length>9) rTel=rTel.slice(-9);
    var adInfo=rTel?telAdMap[rTel]:null;
    if(!adInfo||!adInfo.ad) return;
    _step3Phones.add(rTel);
    var adKey=adInfo.ad;
    if(!adData[adKey]) adData[adKey]={ad:adKey,campanha:adInfo.campanha,conjunto:adInfo.conjunto,leads:0,qualif:0,reunioes:0,realizadas:0,fechamentos:0,mrr:0,fats:[]};
    var entry=adData[adKey];
    entry.reunioes++;
    var status=(col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status'])||'').toUpperCase().trim();
    if(status==='REALIZADA'||status==='VENDA'||status==='NO-SHOW'||status==='NOSHOW') entry.realizadas++;
    // Verifica fechamento cruzando reuniões.EMPRESA → clientes (planilha operacional)
    // Prioridade: coluna EMPRESA da reunião (empresa que fechou), depois CLIENTE (nome da pessoa)
    var fuMatch=rTel?phoneFuMap[rTel]:null;
    var empresaRaw=col(r,['EMPRESA','Empresa','empresa','NOME DA EMPRESA','Nome da Empresa'])||'';
    var nomeRaw=col(r,['CLIENTE','Cliente','cliente'])||'';
    // Tenta empresa primeiro (mais preciso), depois nome da pessoa
    var cliMatch=empresaRaw?cliLookup(empresaRaw):(nomeRaw?cliLookup(nomeRaw):null);
    // cliMatch: verifica se assinou após a reunião (aceita até 7 dias antes para cadastros retroativos)
    var cliMatchInPeriod=false;
    if(cliMatch){
      var cliD=parseBRDate(col(cliMatch,['DATA DE INICIO','DATA DE INÍCIO','Data de Inicio','Data Inicio']));
      var diffMs=cliD&&d?cliD.getTime()-d.getTime():-Infinity;
      cliMatchInPeriod=!!cliD&&diffMs>=-(7*24*60*60*1000);
    }
    var isVenda=status==='VENDA'

var CC_CSS = `
:root {
  --p900: #0D0520;
  --p800: #1A0A3C;
  --p700: #2D1160;
  --p600: #4A1C7A;
  --p500: #6B2FA0;
  --p400: #9B59B6;
  --p200: #D4B8F0;
  --p100: #EDE6FA;
  --p50:  #F8F4FE;
  --gold: #C8A84B;
  --goldl: #F5EDD0;
  --teal: #0B6E56;
  --tealb: #E6F5F1;
  --white: #FFFFFF;
  --gl: #DDD5EE;
  --tm: #3D2568;
  --tl: #7A6898;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--p900);
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
}

.page {
  width: 820px;
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 32px 80px rgba(0,0,0,0.5);
}

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, var(--p900) 0%, var(--p700) 60%, var(--p600) 100%);
  padding: 32px 40px 28px;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 240px; height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(155,89,182,0.25) 0%, transparent 70%);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.logo-area {
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo-img {
  width: 64px;
  height: 64px;
  object-fit: contain;
  border-radius: 8px;
}
.company-info {}
.company-name {
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--white);
  letter-spacing: 0.05em;
  line-height: 1;
  margin-bottom: 4px;
}
.company-cnpj {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.08em;
}
.doc-badge {
  text-align: right;
}
.doc-label {
  font-family: 'Syne', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 4px;
}
.doc-title {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--white);
  letter-spacing: -0.01em;
}
.doc-period {
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  margin-top: 2px;
}

.header-divider {
  height: 1px;
  background: rgba(255,255,255,0.1);
  margin-bottom: 20px;
}

.employee-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 24px;
}
.emp-field {}
.emp-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 4px;
}
.emp-value {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--white);
}
.emp-value.mono {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.05em;
}

/* ── PROMOTION BANNER ── */
.promotion-banner {
  background: linear-gradient(135deg, #7A5C00, var(--gold), #C8A84B);
  padding: 14px 40px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.promo-icon { font-size: 20px; }
.promo-text {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--p900);
}
.promo-levels {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.promo-from {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: rgba(13,5,32,0.55);
  text-decoration: line-through;
}
.promo-arrow { font-size: 16px; color: var(--p900); }
.promo-to {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 800;
  color: var(--p900);
  background: rgba(255,255,255,0.35);
  padding: 3px 12px;
  border-radius: 99px;
}

/* ── BODY ── */
.body { padding: 32px 40px; background: var(--p50); }

/* ── SECTION TITLE ── */
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--tl);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--gl);
}

/* ── TABLE ── */
.pay-table {
  width: 100%;
  border-collapse: collapse;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 16px rgba(13,5,32,0.07);
  margin-bottom: 24px;
  background: var(--white);
}
.pay-table thead tr {
  background: var(--p800);
}
.pay-table thead th {
  font-family: 'Syne', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  padding: 10px 16px;
  text-align: left;
}
.pay-table thead th:last-child { text-align: right; }
.pay-table tbody tr { border-top: 1px solid var(--gl); }
.pay-table tbody tr:nth-child(even) { background: var(--p50); }
.pay-table tbody td {
  padding: 13px 16px;
  font-size: 13px;
  color: var(--tm);
  vertical-align: middle;
}
.pay-table tbody td:last-child {
  text-align: right;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: var(--p700);
}
.td-label { font-weight: 500; }
.td-detail {
  font-size: 11px;
  color: var(--tl);
  margin-top: 2px;
}
.td-zero { color: var(--tl) !important; }
.td-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 99px;
  margin-left: 8px;
}
.badge-sdr { background: var(--p100); color: var(--p600); }
.badge-ss  { background: var(--tealb); color: var(--teal); }

/* ── SUBTOTAL ROWS ── */
.subtotal-row td {
  background: var(--p100) !important;
  font-family: 'Syne', sans-serif !important;
  font-size: 11px !important;
  font-weight: 700 !important;
  letter-spacing: 0.06em;
  color: var(--p700) !important;
  padding: 10px 16px !important;
}
.subtotal-row td:last-child {
  color: var(--p700) !important;
}

/* ── TOTAL BLOCK ── */
.total-block {
  background: linear-gradient(135deg, var(--p800), var(--p700));
  border-radius: 12px;
  padding: 24px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.total-left {}
.total-label {
  font-family: 'Syne', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  margin-bottom: 6px;
}
.total-breakdown {
  font-size: 12px;
  color: rgba(255,255,255,0.55);
}
.total-breakdown span { color: rgba(255,255,255,0.8); font-weight: 600; }
.total-right {
  text-align: right;
}
.total-value {
  font-family: 'Syne', sans-serif;
  font-size: 36px;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: -0.02em;
  line-height: 1;

function numeroExtenso(val){
  var n = Math.round(val);
  var unidades = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove',
    'dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  var dezenas = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  var centenas = ['','cem','duzentos','trezentos','quatrocentos','quinhentos',
    'seiscentos','setecentos','oitocentos','novecentos'];
  if(n===0) return 'zero reais';
  function grupo(x){
    var s='';
    if(x>=100){ s+=centenas[Math.floor(x/100)]; x=x%100; if(x>0) s+=' e '; }
    if(x>=20){ s+=dezenas[Math.floor(x/10)]; x=x%10; if(x>0) s+=' e '; }
    if(x>0){ s+=unidades[x]; }
    return s;
  }
  var partes=[];
  if(n>=1000){ partes.push(grupo(Math.floor(n/1000))+(Math.floor(n/1000)===1?' mil':' mil')); n=n%1000; }
  if(n>0) partes.push(grupo(n));
  return partes.join(' e ')+' reais';
}

function fmt(v){ return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

async function gerarContracheque(modo){
  // modo = 'closer' (Gustavo) ou 'sdr' (João)
  var sel = document.getElementById('closer-auto-gestor-month') || document.getElementById('sdr-auto-gestor-month');
  var month = sel ? sel.value : getCurrentPeriod();
  var mn = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var parts = month.split('/');
  var mesLabel = mn[parseInt(parts[0])-1]+' / '+parts[1];

  var r;
  try{
    if(modo==='closer'){
      r = await calcCloserFromSheets(_careerLevels.gustavo||0, month);
    } else {
      r = await calcSDRFromSheets(_careerLevels.joao||0, month);
    }
  }catch(e){
    alert('Erro ao calcular salário: '+e.message); return;
  }
  if(r.error){ alert('Erro: '+r.error); return; }

  var html;
  if(modo==='closer'){
    var lv = CLOSER_LEVELS[_careerLevels.gustavo||0];
    var lvNome = lv ? 'Closer '+lv.tier+' '+lv.n : 'Closer';
    html = buildCCCloser(r, mesLabel, lvNome);
  } else {
    var lv2 = SDR_LEVELS[_careerLevels.joao||0];
    var lvNome2 = lv2 ? 'SDR '+lv2.tier+' '+lv2.n : 'SDR';
    html = buildCCSDR(r, mesLabel, lvNome2);
  }

  // Criar blob URL para evitar bloqueio de popup
  var blob = new Blob([html], {type:'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var win = window.open(url, '_blank');
  if(!win){
    // Fallback: download como arquivo
    var a = document.createElement('a');
    a.href = url;
    a.download = 'contracheque-'+(modo==='closer'?'gustavo':'joao')+'-'+month.replace('/','.')+'.html';
    a.click();
  }
}

function renderCalendario(){

  var monthNames=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var firstDow=new Date(y,mo,1).getDay(),daysInMonth=new Date(y,mo+1,0).getDate(),today=now.getDate();
  var mm=String(mo+1).padStart(2,'0');
  var callsByDay={};
  Object.values(calls).forEach(function(c){
    if(!c.data)return;var p=c.data.split('/');
    if(p[1]===mm&&p[2]===String(y))callsByDay[parseInt(p[0])]=(callsByDay[parseInt(p[0])]||0)+1;
  });
  var days='';
  for(var i=0;i<firstDow;i++)days+='<div class="cal-day empty"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var dateObj=new Date(y,mo,d),dow=dateObj.getDay();
    var dds=String(d).padStart(2,'0'),hol=hols[mm+'-'+dds];
    var cls='cal-day';

    else if(hol)cls+=' holiday';
    else if(callsByDay[d])cls+=' has-calls';
    else cls+=' workday';
    if(d===today)cls+=' today-mark';
    days+='<div class="'+cls+'">'+d+(callsByDay[d]?'<div style="width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0.7;"></div>':'')+'</div>';
  }
  return '<div class="page active">'+
  '<div class="page-header"><div><div class="page-title">Calendario</div><div class="page-sub">'+monthNames[mo]+' '+y+'</div></div><div class="date-chip"><i class="ti ti-calendar"></i>'+todayStr()+'</div></div>'+
  '<div class="cb"><div style="padding:20px;">'+
    '<div class="cal-grid">'+['Dom','Seg','Ter','Qua','Qui','Sex','Sab'].map(function(d){return'<div class="cal-head">'+d+'</div>';}).join('')+days+'</div>'+

      '<span><span style="display:inline-block;width:10px;height:10px;background:var(--pglow2);border-radius:2px;margin-right:4px;"></span>Dia util</span>'+
      '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(34,197,94,0.1);border-radius:2px;margin-right:4px;"></span>Com ligacoes</span>'+
      '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(249,115,22,0.1);border-radius:2px;margin-right:4px;"></span>Feriado</span>'+

// Convert pt-BR date string dd/mm/yyyy to comparable string yyyymmdd
function dateToSort(d){
  if(!d) return '';
  var p=d.split('/');
  if(p.length!==3) return d;
  return p[2]+p[1]+p[0];
}

// Get next occurrence date (dd/mm/yyyy) of a recurring task
// If fromDateStr itself is one of the days, returns fromDateStr (today is valid)
function nextRecurrenceAfter(diasSemana, fromDateStr){
  var parts = fromDateStr.split('/');
  var base = new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0]));
  // Check if today itself qualifies
  if(diasSemana.indexOf(base.getDay())!==-1){
    return fromDateStr;
  }
  for(var i=1;i<=14;i++){
    var next = new Date(base);
    next.setDate(base.getDate()+i);
    if(diasSemana.indexOf(next.getDay())!==-1){
      return next.toLocaleDateString('pt-BR');
    }
  }
  return null;
}

// Get all tasks visible for current user today or overdue (and scheduled future ones filtered out)
function getTarefasVisiveis(){
  var hoje = _tarefasData || todayStr();
  var hojeSort = dateToSort(hoje);
  var all = JSON.parse(localStorage.getItem('tarefas_dia')||'[]');
  var userName = CU ? CU.name : '';
  return all.filter(function(t){
    var isMineTarefa = t.atribuido === userName || (!t.atribuido && t.criador === userName) || (CU && CU.role==='gestor' && !t.atribuido);
    if(!isMineTarefa) return false;
    if(t.done) return t.doneDate === hoje;
    if(t.recorrente && t.proximaData){
      return dateToSort(t.proximaData) <= hojeSort;
    }
    return !t.date || dateToSort(t.date) <= hojeSort;
  });
}
function navTarefasData(delta){
  var ref = _tarefasData || todayStr();
  var p = ref.split('/');
  var d = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
  d.setDate(d.getDate()+delta);
  _tarefasData = d.toLocaleDateString('pt-BR');
  showPage('tarefas-dia');
}
function resetTarefasData(){
  _tarefasData = null;
  showPage('tarefas-dia');
}

// For gestor: get all tasks they created assigned to others (to monitor)
function getTarefasAtribuidas(){
  var all = JSON.parse(localStorage.getItem('tarefas_dia')||'[]');
  var userName = CU ? CU.name : '';
  return all.filter(function(t){ return t.criador===userName && t.atribuido && t.atribuido!==userName; });
}

function urgenciaCor(u){
  if(u==='critico') return 'rgba(239,68,68,0.5)';
  if(u==='urgente') return 'rgba(245,158,11,0.45)';
  return 'rgba(138,43,226,0.25)';
}
function urgenciaBadge(u){
  if(u==='critico') return '<span class="badge b-red" style="font-size:10px;">🔴 Crítico</span>';
  if(u==='urgente') return '<span class="badge b-amber" style="font-size:10px;">🟡 Urgente</span>';
  return '<span class="badge b-muted" style="font-size:10px;">Normal</span>';
}
function diasSemanaLabel(dias){
  var nomes=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return dias.map(function(d){return nomes[d];}).join(', ');
}

function renderTarefasDia(){
  var hoje = todayStr(); // dd/mm/yyyy
  var hojeSort = dateToSort(hoje);

  // Calculate tomorrow
  var hp = hoje.split('/');
  var dAmanha = new Date(parseInt(hp[2]), parseInt(hp[1])-1, parseInt(hp[0]));
  dAmanha.setDate(dAmanha.getDate()+1);
  var amanha = dAmanha.toLocaleDateString('pt-BR');
  var amanhaSort = dateToSort(amanha);

  var all = JSON.parse(localStorage.getItem('tarefas_dia')||'[]');
  var userName = CU ? CU.name : '';
  var urgOrd = {critico:0, urgente:1, normal:2};

  function getDataRef(t){ return t.recorrente ? (t.proximaData||hoje) : (t.date||hoje); }
  function getDateSort(t){ return dateToSort(getDataRef(t)); }
  function urgSort(a,b){
    var ua=urgOrd[a.urgencia||'normal']||0, ub=urgOrd[b.urgencia||'normal']||0;
    if(ua!==ub) return ua-ub;
    return getDateSort(a)<getDateSort(b)?-1:1;
  }

  var minhas = all.filter(function(t){
    if(t.done) return false;
    return t.atribuido===userName || (!t.atribuido&&t.criador===userName) || (CU&&CU.role==='gestor'&&!t.atribuido);
  });

  var amanhaWeekday = dAmanha.getDay(); // 0=Dom ... 6=Sab

  var atrasadas = minhas.filter(function(t){ return getDateSort(t)<hojeSort; }).sort(urgSort);
  var hojeT    = minhas.filter(function(t){ return getDateSort(t)===hojeSort; }).sort(urgSort);
  var amanhaT  = minhas.filter(function(t){
    if(t.recorrente && t.diasSemana && t.diasSemana.length){
      // Recurring: show in Amanhã if tomorrow's weekday is in the schedule
      return t.diasSemana.indexOf(amanhaWeekday) !== -1;
    }
    return getDateSort(t) === amanhaSort;
  }).sort(urgSort);
  var concluidasAll = all.filter(function(t){ return t.done; }).slice(-30);

  function tarefaDiaRowHtml(t){
    var dataRef = getDataRef(t);
    var atrasada = getDateSort(t) < hojeSort;
    var bordaCor = urgenciaCor(t.urgencia||'normal');
    var recTag = t.recorrente ? '<span class="badge b-cyan" style="font-size:10px;"><i class="ti ti-repeat"></i> '+diasSemanaLabel(t.diasSemana||[])+'</span>' : '';
    var atribTag = (t.atribuido&&t.atribuido!==userName) ? '<span class="badge b-purple" style="font-size:10px;"><i class="ti ti-user"></i> '+t.atribuido+'</span>' : '';
    var dataTag = atrasada ? '<div style="font-size:11px;color:var(--red);margin-top:3px;"><i class="ti ti-alert-triangle"></i> Atrasada · '+dataRef+'</div>' :
                  (dataRef&&dataRef!==hoje ? '<div style="font-size:11px;color:var(--muted);margin-top:3px;">'+dataRef+'</div>' : '');

        'style="width:20px;height:20px;border-radius:50%;border:2px solid '+bordaCor+';background:transparent;cursor:pointer;flex-shrink:0;margin-top:2px;transition:background .2s;" '+
        'onmouseover="this.style.background=\'rgba(123,47,255,0.25)\'" onmouseout="this.style.background=\'transparent\'"></button>'+

        (items.length ? items.map(tarefaDiaRowHtml).join('') : '<div class="kanban-empty">'+emptyMsg+'</div>')+

  // Nova Tarefa form (collapsible)
  var atribOpts = '';

    atribOpts = '<div style="margin-top:10px;">'+
      '<label style="font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px;">Atribuir para</label>'+
      '<select id="nt-atribuido" style="width:100%;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--white);font-size:14px;outline:none;">'+
        '<option value="">Eu mesmo</option>'+
        Object.values(USERS).filter(function(u){return u.name!==(CU?CU.name:'');}).map(function(u){return '<option value="'+u.name+'">'+u.name+'</option>';}).join('')+
      '</select></div>';
  }

  var diasBtns = '<div style="margin-top:10px;display:none;" id="rec-dias-wrap">'+
    '<label style="font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px;">Dias da semana</label>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;">'+
    ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(function(d,i){
      return '<button type="button" id="dia-btn-'+i+'" onclick="toggleDiaBtn('+i+')" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;">'+d+'</button>';
    }).join('')+

  var formHtml = '<details style="margin-bottom:16px;">'+
    '<summary style="cursor:pointer;user-select:none;padding:13px 16px;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--purple3);background:var(--bg2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:8px;list-style:none;outline:none;"><i class="ti ti-plus"></i> Nova Tarefa</summary>'+
    '<div style="background:var(--bg2);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;padding:16px;">'+
      '<input id="nova-tarefa-txt" type="text" placeholder="Descreva a tarefa..." class="f-input" style="margin-bottom:10px;" onkeydown="if(event.key===\'Enter\')addTarefa()">'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'+

          '<label style="font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px;">Urgência</label>'+

            '<option value="normal">Normal</option>'+
            '<option value="urgente">🟡 Urgente</option>'+
            '<option value="critico">🔴 Crítico</option>'+
          '</select>'+
        '</div>'+
      '</div>'+
      '<div style="margin-top:10px;display:flex;align-items:center;gap:10px;">'+
        '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;color:var(--muted);">'+
          '<input type="checkbox" id="nt-recorrente" onchange="toggleRecorrente()" style="width:16px;height:16px;accent-color:var(--purple);cursor:pointer;">'+
          '<i class="ti ti-repeat" style="color:var(--cyan);"></i> Tarefa Recorrente'+
        '</label>'+

      diasBtns+
      atribOpts+
      '<div style="margin-top:14px;">'+
        '<button class="btn btn-primary" onclick="addTarefa()" style="width:100%;padding:12px;font-size:15px;"><i class="ti ti-plus"></i> Adicionar Tarefa</button>'+
      '</div>'+
    '</div>'+
  '</details>';

  var totalPend = atrasadas.length + hojeT.length;
  var html = '<div class="page active">'+
    '<div class="page-header"><div><div class="page-title">Tarefas do Dia</div><div class="page-sub">'+hoje+' · '+totalPend+' pendentes</div></div></div>'+
    formHtml+
    '<div class="tarefas-board">'+
      colHtml('Atrasadas', atrasadas, 'tarefas-hd-red',    'Sem tarefas atrasadas')+
      colHtml('Hoje',      hojeT,     'tarefas-hd-purple', 'Tudo em dia!')+
      colHtml('Amanhã',   amanhaT,   'tarefas-hd-cyan',   'Sem tarefas amanhã')+
    '</div>';

  // Concluídas
  if(concluidasAll.length){
    html += '<div class="cb" style="margin-top:16px;"><div class="cb-hd"><span class="cb-title"><i class="ti ti-circle-check" style="color:var(--green);margin-right:6px;"></i>Concluídas recentemente</span><span class="badge b-green">'+concluidasAll.length+'</span></div>'+
      '<div style="padding:8px 16px;">'+
      concluidasAll.map(function(t){

          '<i class="ti ti-circle-check" style="color:var(--green);font-size:16px;flex-shrink:0;"></i>'+

  // Tarefas atribuídas (gestor only)

        '<span class="badge b-cyan">'+atribPend.length+' pendentes</span></div>'+
        '<div style="padding:14px 16px;">';
      atrib.forEach(function(t){
        var cor = t.done ? 'rgba(34,197,94,0.3)' : urgenciaCor(t.urgencia||'normal');
        var dataRef = t.recorrente ? t.proximaData : t.date;
        html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border:1px solid '+cor+';border-radius:8px;margin-bottom:6px;'+(t.done?'opacity:0.5;':'')+'">'+
          '<i class="ti '+(t.done?'ti-circle-check" style="color:var(--green)':'ti-clock" style="color:var(--muted)')+';font-size:16px;flex-shrink:0;"></i>'+
          '<div style="flex:1;"><div style="font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;color:var(--white);'+(t.done?'text-decoration:line-through;':'')+'">'+t.texto+'</div>'+

              '<span class="badge b-purple" style="font-size:10px;">'+t.atribuido+'</span>'+
              urgenciaBadge(t.urgencia||'normal')+
              (dataRef?'<span style="font-size:11px;color:var(--muted);">'+dataRef+'</span>':'')+
            '</div>'+
          '</div>'+
          '<button onclick="excluirTarefa(\''+t.id+'\')" style="background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px;" title="Excluir"><i class="ti ti-x"></i></button>'+
        '</div>';
      });
      html += '</div></div>';
    }
  }

  html += '</div>';
  return html;
}

function toggleDiaBtn(idx){
  var btn = document.getElementById('dia-btn-'+idx);
  if(!btn) return;
  var ativo = btn.getAttribute('data-ativo')==='1';
  if(ativo){
    btn.setAttribute('data-ativo','0');
    btn.style.background='transparent';
    btn.style.color='var(--muted)';
    btn.style.borderColor='var(--border)';
  } else {
    btn.setAttribute('data-ativo','1');
    btn.style.background='var(--purple)';
    btn.style.color='white';
    btn.style.borderColor='var(--purple)';
  }
}

function toggleRecorrente(){
  var chk = document.getElementById('nt-recorrente');
  var wrap = document.getElementById('rec-dias-wrap');
  var dataInp = document.getElementById('nt-data');
  if(!wrap) return;
  if(chk && chk.checked){
    wrap.style.display='block';
    if(dataInp) dataInp.parentElement.parentElement.style.display='none';
  } else {
    wrap.style.display='none';
    if(dataInp) dataInp.parentElement.parentElement.style.display='grid';
  }
}

function isoToBR(isoDate){
  if(!isoDate) return todayStr();
  var p = isoDate.split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}

// ---- Firebase helpers for tarefas ----
function saveTarefaFB(tarefa){
  try{ if(fbDb) fbDb.ref('tarefas_dia/'+tarefa.id).set(tarefa); }
  catch(e){ console.error('saveTarefaFB',e); }
}
function deleteTarefaFB(id){
  try{ if(fbDb) fbDb.ref('tarefas_dia/'+id).remove(); }
  catch(e){ console.error('deleteTarefaFB',e); }
}
function getTarefasLocal(){
  return JSON.parse(localStorage.getItem('tarefas_dia')||'[]');
}

var _addTarefaBusy = false;
function addTarefa(){
  if(_addTarefaBusy) return;
  _addTarefaBusy = true;
  setTimeout(function(){ _addTarefaBusy = false; }, 800);
  var txt = document.getElementById('nova-tarefa-txt');
  if(!txt||!txt.value.trim()) return;
  var recChk = document.getElementById('nt-recorrente');
  var recorrente = recChk && recChk.checked;
  var urgEl = document.getElementById('nt-urgencia');
  var urgencia = urgEl ? urgEl.value : 'normal';
  var atribEl = document.getElementById('nt-atribuido');
  var atribuido = atribEl && atribEl.value ? atribEl.value : (CU?CU.name:'');

  var diasSemana = [];
  if(recorrente){
    for(var i=0;i<7;i++){
      var b = document.getElementById('dia-btn-'+i);
      if(b && b.getAttribute('data-ativo')==='1') diasSemana.push(i);
    }
    if(diasSemana.length===0){ alert('Selecione pelo menos um dia da semana.'); return; }
  }

  var dataISO = document.getElementById('nt-data') ? document.getElementById('nt-data').value : '';
  var dataBR = isoToBR(dataISO);

  var nova = {
    id: 't_'+Date.now(),
    texto: txt.value.trim(),
    urgencia: urgencia,
    criador: CU ? CU.name : '',
    atribuido: atribuido,
    done: false,
    doneDate: null,
    recorrente: recorrente,
    diasSemana: recorrente ? diasSemana : [],
    date: recorrente ? null : dataBR,
    proximaData: recorrente ? nextRecurrenceAfter(diasSemana, todayStr()) || todayStr() : null
  };

  // Optimistic local update — Firebase listener will re-render
  var tarefas = getTarefasLocal();
  tarefas.push(nova);
  localStorage.setItem('tarefas_dia', JSON.stringify(tarefas));
  txt.value='';
  showPage('tarefas-dia'); // render immediately
  saveTarefaFB(nova); // then sync to Firebase (listener will NOT re-render since local already matches)
}

function concluirTarefa(id){
  var tarefas = getTarefasLocal();
  tarefas = tarefas.map(function(t){
    if(t.id===id){
      if(t.recorrente){
        t.ultimaConclusao = todayStr();
        // Advance from tomorrow so task doesn't stay stuck on today
        var hp2 = todayStr().split('/');
        var dTom = new Date(parseInt(hp2[2]), parseInt(hp2[1])-1, parseInt(hp2[0]));
        dTom.setDate(dTom.getDate()+1);
        var tomorrowStr = dTom.toLocaleDateString('pt-BR');
        t.proximaData = nextRecurrenceAfter(t.diasSemana||[], tomorrowStr) || tomorrowStr;
      } else {
        t.done = true;
        t.doneDate = todayStr();
      }
      saveTarefaFB(t);
    }
    return t;
  });
  localStorage.setItem('tarefas_dia', JSON.stringify(tarefas));
  showPage('tarefas-dia');
}

function excluirTarefa(id){
  deleteTarefaFB(id);
  var tarefas = getTarefasLocal().filter(function(t){return t.id!==id;});
  localStorage.setItem('tarefas_dia', JSON.stringify(tarefas));
  showPage('tarefas-dia');
}

// Traduz o status salvo em reativacoes/ para um rotulo + classe de badge legiveis
function reativacaoStatusInfo(rec){
  switch(rec&&rec.status){
    case 'agendou': return {label:'Reagendou reuniao',cls:'b-green'};
    case 'retorno': return {label:'Pediu retorno'+(rec.retornoData?(' ('+fmtDateBR(rec.retornoData)+')'):''),cls:'b-amber'};
    case 'nao-atendeu': return {label:'Nao atendeu',cls:'b-red'};
    case 'sem-interesse': return {label:'Sem interesse',cls:'b-muted'};
    default: return {label:rec&&rec.status||'-',cls:'b-muted'};
  }
}
function _reunRowToLead(r){

    cidade: col(r,['CIDADE','Cidade','cidade'])||'',

  };
}
