async function loadReativacao(){
  var elNS=document.getElementById('reativ-noshow-body'), elFR=document.getElementById('reativ-frios-body'), elHist=document.getElementById('reativ-historico-body');
  if(!elNS||!elFR) return;
  if(typeof isGcalConnected!=='function' || !isGcalConnected()){
    var msgg='<div style="color:var(--muted);font-size:13px;">Conecte o Google em Configuracoes para carregar.</div>';
    elNS.innerHTML=msgg;elFR.innerHTML=msgg;if(elHist)elHist.innerHTML=msgg;return;
  }
  try{
    var data=await loadDataHybrid();
    var reativ=await fbGet('reativacoes')||{};
    var rows=(data.reunioes&&data.reunioes.rows)?data.reunioes.rows:[];
    var hoje=new Date();hoje.setHours(0,0,0,0);
    var trintaAtras=new Date();trintaAtras.setDate(trintaAtras.getDate()-30);trintaAtras.setHours(0,0,0,0);

    function isJoao(r){
      var sdr=(col(r,['SDR/BDR','SDR','BDR','Sdr'])||'').toLowerCase();
      return sdr.includes('joão')||sdr.includes('joao');
    }
    function dataAg(r){
      return parseBRDate(col(r,['DATA DE AGENDAMENTO','Data de Agendamento','DataAgendamento','Data Agendamento']));
    }

    var noshows=rows.filter(function(r){
      var st=(col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status'])||'').toUpperCase().trim();
      if(st!=='NO-SHOW'&&st!=='NO SHOW'&&st!=='NOSHOW') return false;
      if(!isJoao(r)) return false;
      var d=dataAg(r);if(!d) return false;
      var nbd=nextBusinessDay(d);nbd.setHours(0,0,0,0);
      if(nbd.getTime()!==hoje.getTime()) return false;
      var tel=(col(r,['TELEFONE','Telefone','telefone'])||'').replace(/\D/g,'');
      return reativacaoVisible(reativ,tel);
    });

    var frios=rows.filter(function(r){
      var st=col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status'])||'';
      if(!isRealizada(st)) return false;
      var emp=(col(r,['EMPRESA','Empresa','empresa'])||'').trim();
      if(emp) return false;
      if(!isJoao(r)) return false;
      var d=dataAg(r);if(!d) return false;
      if(d.getTime()>trintaAtras.getTime()) return false;
      var tel=(col(r,['TELEFONE','Telefone','telefone'])||'').replace(/\D/g,'');
      return reativacaoVisible(reativ,tel);
    }).sort(function(a,b){
      var da=dataAg(a),db=dataAg(b);
      return (da?da.getTime():0)-(db?db.getTime():0);
    });

    window._reativNoshowRows=noshows;
    window._reativFriosRows=frios;

    function renderList(list,emptyMsg,tipo,extraInfoFn){
      if(!list.length) return '<div class="empty-st"><i class="ti ti-circle-check"></i><p>'+emptyMsg+'</p></div>';
      return '<div style="display:grid;gap:10px;">'+list.map(function(r,i){
        var lead=_reunRowToLead(r);
        var dAgStr=col(r,['DATA DE AGENDAMENTO','Data de Agendamento','DataAgendamento','Data Agendamento'])||'—';
        return '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">'+
          '<div>'+
            '<div style="font-family:Barlow Condensed,sans-serif;font-size:16px;font-weight:700;">'+lead.nome+'</div>'+
            '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px;">'+
              '<span><i class="ti ti-phone"></i> '+(lead.telefone||'—')+'</span>'+
              '<span><i class="ti ti-calendar"></i> Agendado: '+dAgStr+'</span>'+
              (extraInfoFn?extraInfoFn(r):'')+
            '</div>'+
          '</div>'+
          '<button class="btn btn-reg" onclick="openReativacaoCall(\''+tipo+'\','+i+')"><i class="ti ti-phone"></i> Ligar</button>'+
        '</div>';
      }).join('')+'</div>';
    }

    elNS.innerHTML='<div class="info-note" style="margin-bottom:14px;"><i class="ti ti-info-circle"></i> '+noshows.length+' no-show(s) para reagendar hoje</div>'+
      renderList(noshows,'Nenhum no-show pendente hoje.','noshow');
    elFR.innerHTML='<div class="info-note" style="margin-bottom:14px;"><i class="ti ti-info-circle"></i> '+frios.length+' lead(s) frio(s) elegiveis</div>'+
      renderList(frios,'Nenhum lead frio elegivel no momento.','frio',function(r){
        var d=dataAg(r);var dias=d?Math.floor((Date.now()-d.getTime())/86400000):0;
        return '<span><i class="ti ti-clock"></i> '+dias+' dias</span>';
      });

    // Historico: o que ja foi feito com os leads de recuperacao (reativacoes/ no Firebase)
    if(elHist){
      var telToNome={};
      rows.forEach(function(r){
        var t=(col(r,['TELEFONE','Telefone','telefone'])||'').replace(/\D/g,'');
        if(t&&!telToNome[t]) telToNome[t]=col(r,['CLIENTE','Cliente','cliente'])||'';
      });
      var historico=Object.keys(reativ).map(function(k){
        var rec=reativ[k]||{};
        return {tel:k,nome:telToNome[k]||'(sem nome)',rec:rec};
      }).filter(function(h){return h.rec&&h.rec.ts;})
        .sort(function(a,b){return (b.rec.ts||0)-(a.rec.ts||0);})
        .slice(0,30);
      if(!historico.length){
        elHist.innerHTML='<div class="empty-st"><i class="ti ti-history"></i><p>Nenhuma acao de recuperacao registrada ainda.</p></div>';
      }else{
        elHist.innerHTML='<div class="t-scroll"><table><thead><tr><th>Lead</th><th>Telefone</th><th>Resultado</th><th>Data</th><th>Por</th></tr></thead><tbody>'+
          historico.map(function(h){
            var si=reativacaoStatusInfo(h.rec);
            var dt=h.rec.ts?new Date(h.rec.ts).toLocaleString('pt-BR'):'-';
            return '<tr><td>'+h.nome+'</td><td>'+(h.tel||'')+'</td><td><span class="badge '+si.cls+'">'+si.label+'</span></td><td>'+dt+'</td><td>'+(h.rec.por||'-')+'</td></tr>';
          }).join('')+'</tbody></table></div>';
      }
    }
  }catch(e){
    var em='<div style="color:var(--red);font-size:13px;">Erro ao carregar: '+e.message+'</div>';
    elNS.innerHTML=em;elFR.innerHTML=em;if(elHist)elHist.innerHTML=em;
  }
}

      if(periodStr(d)!==period) return false;
      return isMine(c);
    });

    var total = reunioesF.length;

      return isRealizada(col(r,['STATUS REUNIÃO','STATUS REUNIAO','Status Reuniao','STATUS','Status']));
    }).length;
    var noshow = reunioesF.filter(function(r){

      {l:'No-Show',v:noshow,c:'var(--red)'},
      {l:'Vendas',v:vendas,c:'var(--green)'},

    ];

      html+='<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;">'+
        '<div style="font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">'+c.l+'</div>'+
        '<div style="font-family:var(--font-bn),sans-serif;font-size:32px;color:'+c.c+';">'+c.v+'</div>'+
      '</div>';
    });
    html+='</div>';

    // ---- Funil visual ----
    var etapas=[
      {label:'Agendadas',val:total,cor:'var(--purple3)',icon:'ti-calendar'},
      {label:'Realizadas',val:realizadas,cor:'var(--amber)',icon:'ti-calendar-check'},
      {label:'Vendas',val:vendas,cor:'var(--green)',icon:'ti-trophy'}
    ];
    var maxVal=total||1;
    html+='<div style="display:flex;flex-direction:column;gap:8px;max-width:600px;margin:0 auto;">';
    etapas.forEach(function(e,i){
      var pct=Math.round(e.val/maxVal*100);
      var convPct=i>0&&etapas[i-1].val>0?Math.round(e.val/etapas[i-1].val*100):null;
      var w=Math.max(pct,8);
      html+='<div style="text-align:center;">'+
        (convPct!==null?'<div style="font-family:Barlow Condensed,sans-serif;font-size:12px;color:var(--muted);margin-bottom:4px;">↓ '+convPct+'% de conversão</div>':'')+
        '<div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:2px;">'+
          '<div style="width:'+w+'%;margin:0 auto;background:'+e.cor+';border-radius:8px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;min-width:220px;">'+
            '<div style="display:flex;align-items:center;gap:10px;">'+
              '<i class="ti '+e.icon+'" style="font-size:20px;color:rgba(0,0,0,0.5);"></i>'+
              '<span style="font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;color:rgba(0,0,0,0.7);letter-spacing:1px;text-transform:uppercase;">'+e.label+'</span>'+
            '</div>'+
            '<span style="font-family:var(--font-bn),sans-serif;font-size:28px;color:rgba(0,0,0,0.75);">'+e.val+'</span>'+
          '</div>'+
        '</div>'+
      '</div>';
    });
    html+='</div>';

    // ---- Bottom conversion summary ----
    html+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;">';
    [{l:'Agendada → Realizada',v:total>0?Math.round(realizadas/total*100):0},
     {l:'Realizada → Venda',v:realizadas>0?Math.round(vendas/realizadas*100):0},
     {l:'Agendada → Venda',v:total>0?Math.round(vendas/total*100):0}
    ].forEach(function(t){
      html+='<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;">'+
        '<div style="font-family:Barlow Condensed,sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">'+t.l+'</div>'+
        '<div style="font-family:var(--font-bn),sans-serif;font-size:28px;color:var(--white);">'+t.v+'%</div>'+
      '</div>';
    });
    html+='</div>';

    // ---- Ranking: qual tarefa SDR mais gerou reuniões ----
    var tarefaCount = {};
    Object.values(meetings||{}).forEach(function(m){
      if(m.tarefaOrigem){
        var label = m.tarefaOrigem + (m.tarefaOrigemDia ? ' · ' + m.tarefaOrigemDia : '');
        tarefaCount[label] = (tarefaCount[label]||0) + 1;
      }
    });
    var tarefaRanking = Object.keys(tarefaCount).map(function(k){return{label:k,v:tarefaCount[k]};})
      .sort(function(a,b){return b.v-a.v;});
    var maxTarefa = tarefaRanking.length ? tarefaRanking[0].v : 1;

    html += '<div style="margin-top:20px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;">';
    html += '<div style="font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px;"><i class="ti ti-medal" style="color:var(--purple3);font-size:14px;"></i>Tarefas que mais agendaram reuniões</div>';
    if(tarefaRanking.length === 0){
      html += '<div style="color:var(--muted);font-size:13px;">Ainda sem dados — as próximas reuniões agendadas pelo CRM irão aparecer aqui.</div>';
    } else {
      var medalhas = ['🥇','🥈','🥉'];
      tarefaRanking.slice(0,6).forEach(function(item,i){
        var pct = Math.round(item.v / maxTarefa * 100);
        html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">'+
          '<span style="font-size:16px;width:22px;text-align:center;">'+(medalhas[i]||'&nbsp;&nbsp;')+'</span>'+
          '<div style="flex:1;">'+
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'+
              '<span style="font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;color:var(--white);">'+item.label+'</span>'+
              '<span style="font-family:var(--font-bn),sans-serif;font-size:16px;color:var(--purple3);margin-left:12px;">'+item.v+'</span>'+
            '</div>'+
            '<div style="height:6px;background:rgba(255,255,255,0.06);border-radius:99px;">'+
              '<div style="height:6px;width:'+pct+'%;background:linear-gradient(90deg,var(--purple3),var(--cyan));border-radius:99px;transition:width .4s;"></div>'+
            '</div>'+
          '</div>'+
        '</div>';
      });
    }
    html += '</div>';

    el.innerHTML = html;
  }catch(e){
    el.innerHTML='<div style="color:var(--red);font-size:13px;">Erro ao carregar funil: '+e.message+'</div>';
  }
}

          '<td>'+(m.responsavel||'—')+'</td>'+
          '<td>'+(m.meetLink?'<a href="'+m.meetLink+'" target="_blank" style="color:var(--cyan);font-size:12px;"><i class="ti ti-video"></i> Abrir</a>':'—')+'</td>'+
          '<td style="white-space:nowrap;">'+
            '<button class="btn btn-edit" onclick="abrirEditarReuniao(\''+m.id+'\')" style="font-size:11px;padding:4px 10px;" title="Editar"><i class="ti ti-edit"></i></button>'+

          '</td>'+

async function confirmarReagendamento(mid, forcarNoshow){
  var m=meetings[mid];
  if(!m){alert('Reunião não encontrada');return;}
  var reagCnt=m.reagendamentos||0;
  var tel=(m.tel||'').replace(/\D/g,'');
  var novaData='', novaHora='', meetingDisplay='', meetingISO='';

  if(!forcarNoshow){
    var rdEl=document.getElementById('rg-data');
    var rhEl=document.getElementById('rg-hora');
    novaData=(rdEl&&rdEl.value)||'';
    novaHora=(rhEl&&rhEl.value)||'09:00';
    if(!novaData){alert('Selecione a nova data');return;}
    var dp=novaData.split('-');
    meetingDisplay=dp[2]+'/'+dp[1]+'/'+dp[0]+' '+novaHora;
    // Converte BRT (UTC-3) → UTC para dtISO
    var hh=parseInt(novaHora.split(':')[0],10)+3;
    var mn=novaHora.split(':')[1]||'00';
    var d=new Date(novaData+'T00:00:00Z');
    d.setUTCHours(hh,parseInt(mn,10),0,0);
    meetingISO=d.toISOString();
  }

  var btn=document.getElementById('rg-confirm-btn')||document.querySelector('#modal-reagendar .btn[style*="red"]');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i> Aguarde...';}

  try{
    var resp=await fetch('https://receberlead-471063273836.us-central1.run.app/reagendar',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        secret:'audens2025xk',
        meetingId:mid,
        telefone:tel,
        nome:m.nome||'',
        meetingDisplay:meetingDisplay,
        meetingISO:meetingISO,
        kanbanKey:m.kanbanKey||'',
        responsavel:m.responsavel||'',
        forcarNoshow:forcarNoshow||false
      })
    });
    var data=await resp.json();
    if(data.ok){
      fecharModalReagendar();
      if(data.autoNoshow){
        meetings[mid].status='noshow';
        showSheetToast('⚠️ No-Show automático ('+((reagCnt>=2?reagCnt+1:3))+'º reagendamento)',true);
      } else {
        meetings[mid].status='reagendado';
        if(data.newMeeting){
          meetings[data.newMeeting.id]=data.newMeeting;
        }
        showSheetToast('✅ Reagendado para '+meetingDisplay+' ('+data.reagendamentos+'/2)',false);
      }
      showPage('reunioes');
    } else {
      alert('Erro: '+(data.error||'desconhecido'));
      if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-calendar-check"></i> Confirmar Reagendamento';}
    }
  } catch(e){
    alert('Erro de conexão: '+e.message);
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-calendar-check"></i> Confirmar Reagendamento';}
  }
}

async function enviarReagendamentoWA(telefone, nome, meetingDisplay, kanbanKey, meetingISO){
  var body = { telefone: telefone, nome: nome||'', meetingDisplay: meetingDisplay };
  if(kanbanKey) body.kanbanKey = kanbanKey;
  if(meetingISO) body.meetingISO = meetingISO;
  var resp = await fetch(RECEBERLEAD_URL+'/reagendar?secret='+WEBHOOK_SECRET, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  var r = await resp.json();
  if(!r.ok) throw new Error(r.error||'Erro reagendar');
  return r;
}

async function salvarEdicaoReuniao(mid){
  var m = meetings[mid];
  if(!m) return;
  m.nome = document.getElementById('er-nome').value.trim()||m.nome;
  m.responsavel = document.getElementById('er-closer').value;
  m.status = document.getElementById('er-status').value;
  m.origem = document.getElementById('er-origem').value;

  // Check if date/time changed
  var newDate = document.getElementById('er-data') ? document.getElementById('er-data').value : '';
  var newTime = document.getElementById('er-hora') ? document.getElementById('er-hora').value : '';
  var dtChanged = false;
  var newDtISO = m.dtISO || '';
  var newDtDisplay = m.dtDisplay || '';
  if(newDate && newTime){
    var candidateISO = newDate + 'T' + newTime + ':00';
    if(candidateISO !== (m.dtISO||'')){
      dtChanged = true;
      newDtISO = candidateISO;
      // format DD/MM/YYYY HH:MM
      var dp = newDate.split('-');
      newDtDisplay = dp[2]+'/'+dp[1]+'/'+dp[0]+' '+newTime;
    }
  }
  if(dtChanged){
    m.dtISO = newDtISO;
    m.dtDisplay = newDtDisplay;
  }

  meetings[mid] = m;
  saveAll();
  saveMeetingFB(mid, m);
  cancelarEdicaoReuniao();
  showPage('reunioes');
  showSheetToast('Reunião atualizada!', false);

  // Send reagendamento WA + reset lembretes if time changed and phone available
  if(dtChanged && m.tel){
    try{
      await enviarReagendamentoWA(m.tel, m.nome, newDtDisplay, m.kanbanKey, newDtISO);
      showSheetToast('Mensagem de reagendamento enviada ao cliente.', false);
    }catch(e){
      showSheetToast('Reunião salva, mas erro ao enviar WhatsApp.', true);
    }
  }
}

async function criarReuniaoCalendario(){

async function loadReunioesSheet(){
  var el = document.getElementById('reunioes-sheet-view');
  if(!el) return;
  el.innerHTML = '<div style="padding:20px;color:var(--muted);">Carregando...</div>';
  try{
    var rows = await fetchSheetVals(SHEETS_IDS.reunioes, SHEETS_GIDS.reunioes);
    if(!rows||rows.length<2){el.innerHTML='<div style="padding:20px;color:var(--muted);">Sem dados</div>';return;}
    var h = rows[0].map(function(x){return(x||'').trim();});

    // Filtros
    var filterMonth = (document.getElementById('reun-filter-month')||{}).value||'';
    var filterStart = (document.getElementById('reun-filter-start')||{}).value||'';
    var filterEnd = (document.getElementById('reun-filter-end')||{}).value||'';
    var startDt = filterStart ? new Date(filterStart+'T00:00:00') : null;
    var endDt = filterEnd ? new Date(filterEnd+'T23:59:59') : null;

    // Encontrar coluna de data (DATA DE AGENDAMENTO = col 0)
    var dateColIdx = 0;

    var dataRows = rows.slice(1).filter(function(r){
      if(!r.some(function(c){return c;})) return false;
      var dateStr = (r[dateColIdx]||'').trim();
      if(!dateStr) return true; // sem data, não filtrar
      var d = parseBRDate(dateStr);
      if(!d) return true;
      if(filterMonth && periodStr(d)!==filterMonth) return false;
      if(startDt && d<startDt) return false;
      if(endDt && d>endDt) return false;
      return true;
    });

    var trs = dataRows.map(function(row){
      var st=(row[4]||'').toUpperCase();
      var cor2=st==='REALIZADA'?'var(--green)':st.includes('NO')&&st.includes('SHOW')?'var(--red)':'var(--amber)';
      return '<tr>'+row.slice(0,8).map(function(c,i){
        if(i===4) return '<td><span style="padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:'+cor2+'22;color:'+cor2+';">'+(c||'—')+'</span></td>';
        return '<td style="font-size:12px;">'+(c||'—')+'</td>';
      }).join('')+'</tr>';
    }).join('');

    var countBadge = '<div style="padding:10px 16px;font-family:Barlow Condensed,sans-serif;font-size:12px;color:var(--muted);">'+dataRows.length+' reuniões encontradas</div>';
    el.innerHTML=countBadge+'<div style="overflow-x:auto;"><table><thead><tr>'+h.slice(0,8).map(function(x){return'<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+trs+'</tbody></table></div>';
  }catch(e){el.innerHTML='<div style="padding:20px;color:var(--red);">Erro: '+e.message+'</div>';}
}

async function loadUserPasswords(){
  if(!fbDb) return;
  try{
    var data = await fbGet('userPasswords');
    if(data){
      Object.keys(data).forEach(function(key){
        // Convert back from Firebase key to email
        var email = key.replace(/_/g,function(m,o,s){
          // Try to match emails in USERS
          var match = Object.keys(USERS).find(function(e){
            return e.replace(/[.#$[\]@]/g,'_')===key || e.replace('@','_').replace('.','_')===key;
          });
          return match ? '' : '.';
        });
        // Simpler approach: match by finding the email
        var matchedEmail = Object.keys(USERS).find(function(e){
          return e.replace(/[.@]/g,'_')===key || e.replace('@','_').replace(/\./g,'_')===key;
        });
        if(matchedEmail) USERS[matchedEmail].pw = data[key];
      });
    }
  }catch(e){console.error('loadUserPasswords error',e);}
}

async function importContratosFromSheet(){
  _sheetDataCache={}; _sheetsMeta={};
  var cliRows = await fetchSheetCached(SHEETS_IDS.clientes,SHEETS_GIDS.clientes,'clientes');
  if(!cliRows||cliRows.length<2) return 0;
  var ch = cliRows[0].map(function(h){return(h||'').trim().toUpperCase();});
  var iDataIn = ch.findIndex(function(h){return h.includes('DATA')&&h.includes('IN');});
  var iCliente = ch.findIndex(function(h){return h==='CLIENTE'||h==='EMPRESA';});
  var iValorMes = ch.findIndex(function(h){return(h.includes('VALOR')&&h.includes('MES'))||(h.includes('VALOR')&&h.includes('/'));});
  if(iValorMes<0) iValorMes=ch.findIndex(function(h){return h.includes('VALOR')&&!h.includes('VENDIDO');});
  var iGestor=ch.findIndex(function(h){return h==='GESTOR';});
  var iDataCancel=ch.findIndex(function(h){return h.includes('DATA')&&h.includes('CANCEL');});
  var iMotivo=ch.findIndex(function(h){return h.includes('MOTIVO');});
  var iPlano=ch.findIndex(function(h){return h.includes('PLANO');});
  var iOrigem=ch.findIndex(function(h){return h==='ORIGEM'||h.includes('ORIGEM');});
  var iCloser=ch.findIndex(function(h){return h==='CLOSER'||h.includes('CLOSER');});
  var iSDR=ch.findIndex(function(h){return h==='SDR'||h.includes('SDR')||h.includes('BDR');});
  var iValorV=ch.findIndex(function(h){return h.includes('VALOR')&&h.includes('VENDIDO');});
  function toISO(d){return d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):null;}
  var batch={};
  var count=0;
  cliRows.slice(1).forEach(function(row){
    var cliente=(row[iCliente]||'').trim();
    if(!cliente) return;
    var dataInicio=toISO(parseBRDate(row[iDataIn]||''));
    if(!dataInicio) return;
    var valorMes=parseMoney(row[iValorMes]||'')||0;
    var valorVendido=iValorV>=0?parseMoney(row[iValorV]||'')||0:0;
    var plano=(row[iPlano]||'').trim();
    var pu=plano.toUpperCase();
    var planoDuracao=pu.includes('SEMESTRAL')?6:pu.includes('TRIMESTRAL')?3:pu.includes('ANUAL')?12:1;
    var dataCancelamento=toISO(iDataCancel>=0?parseBRDate(row[iDataCancel]||''):null);
    var key=fbDb.ref('contratos').push().key;
    batch[key]={
      cliente:cliente,
      dataInicio:dataInicio,
      valorMes:valorMes,
      valorVendido:valorVendido||valorMes*planoDuracao,
      planoDuracao:planoDuracao,
      gestor:(row[iGestor]||'').trim(),
      dataCancelamento:dataCancelamento||null,
      motivoCancelamento:(iMotivo>=0?row[iMotivo]||'':'')||null,
      plano:plano,
      origem:(row[iOrigem]||'').trim(),
      closer:(row[iCloser]||'').trim(),
      sdr:(iSDR>=0?row[iSDR]||'':'').trim(),
      ativo:!dataCancelamento,
      importedAt:Date.now()
    };
    count++;
  });
  if(!fbDb) initFirebase();
  _contratosCache=null;
  await fbDb.ref('contratos').update(batch);
  return count;
}

// Get current month string YYYY-MM
function currentMonthStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

// Parse Brazilian date formats: DD/MM/YYYY, DD/mmm./YY, etc.
// parseBRDate duplicate removed

function dateToMonthStr(d){
  if(!d) return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

// ===== CALCULATE CLOSER SALARY (GUSTAVO) =====
async function calcCloserFromSheets(nivelIdx, month){
  var lv = CLOSER_LEVELS[nivelIdx];
  var result = {base: lv.base, minG: lv.minG, reunioes: 0, incentivReun: 0,
    contratos: 0, tipoContrato: 'Mensal', bonusMeta: 0, comissaoUnit: 0,
    comissaoContratos: 0, comissaoVendas25: 0, valorVendido: 0, total: 0,
    loading: false, error: null};
  try{
    // Load reunioes sheet
    var reunRows = await fetchSheetCached(SHEETS_IDS.reunioes, SHEETS_GIDS.reunioes, 'reunioes');
    // Load clientes sheet
    var cliRows = await fetchSheetCached(SHEETS_IDS.clientes, SHEETS_GIDS.clientes, 'clientes');

    if(reunRows && reunRows.length > 1){
      var rh = reunRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      // Reunioes cols: DATA_AG=0, CLIENTE=1, TEL=2, DATA_REAL=3, STATUS=4, SDR=5, CLOSER=6, ORIGEM=7
      var iStatus = rh.findIndex(function(h){return h.includes('STATUS');});
      var iCloser = rh.findIndex(function(h){return h==='CLOSER'||h.includes('CLOSER');});
      var iData = rh.findIndex(function(h){return h.includes('DATA')&&h.includes('AGEND');});
      var iDataReal = rh.findIndex(function(h){return h.includes('DATA')&&(h.includes('REAL')||h.includes('SERA'));});

      reunRows.slice(1).forEach(function(row){
        var closer = (row[iCloser]||'').trim().toUpperCase();
        var status = (row[iStatus]||'').trim().toUpperCase();
        // Use data real ou data agendamento para filtrar por mês
        var dateStr = row[iDataReal]||row[iData]||'';
        var dt = parseBRDate(dateStr);
        var rowMonth = dateToMonthStr(dt);
        if(!rowMonth) return;
        var closerNorm = normCloserName(closer);
        if(closerNorm==='Gustavo' && status==='REALIZADA' && rowMonth===month){
          result.reunioes++;
        }
      });
    }
    result.incentivReun = result.reunioes * 30;

    if(cliRows && cliRows.length > 1){
      var ch = cliRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      // Clientes cols: DATA_INICIO=0, CLIENTE=1, VALOR_MES=2, GESTOR=3, DATA_CANCEL=4, MOTIVO=5,
      //   PLANO=6, ORIGEM=7, CLOSER=8, SDR=9, VALOR_VENDIDO=10, COMISSAO_CLOSER=11
      var iData2 = ch.findIndex(function(h){return h.includes('DATA')&&h.includes('IN');});
      var iCloser2 = ch.findIndex(function(h){return h==='CLOSER'||h.includes('CLOSER');});
      var iPlano = ch.findIndex(function(h){return h.includes('PLANO');});
      var iValorV = ch.findIndex(function(h){return h.includes('VALOR')&&h.includes('VENDIDO');});
      // Find SDR and ORIGEM cols here so we can exclude cold-call-SDR contracts from closer count
      var ciSDR2=ch.findIndex(function(h){return h==='SDR'||h==='BDR'||h==='SDR/BDR'||h.includes('SDR');});
      var ciOri2=ch.findIndex(function(h){return h==='ORIGEM'||h.includes('ORIGEM');});

      cliRows.slice(1).forEach(function(row){
        var closer2 = (row[iCloser2]||'').trim().toUpperCase();
        var dateStr2 = row[iData2]||'';
        var dt2 = parseBRDate(dateStr2);
        var rowMonth2 = dateToMonthStr(dt2);
        if(!rowMonth2) return;
        var closerNorm2 = normCloserName(closer2);
        if(closerNorm2==='Gustavo' && rowMonth2===month){
          // Regra: qualquer contrato de cold call (origem) não conta como closer,
          // Gustavo recebe 25% de MRR independente de quem fez a venda.
          var sdrC2=(ciSDR2>=0?row[ciSDR2]||'':'').trim();
          var oriC2=(ciOri2>=0?row[ciOri2]||'':'').toLowerCase();
          var isColdCall2 = oriC2.includes('cold')||oriC2.includes('call');
          if(isColdCall2){
            result.contratos++; // conta para meta/progressão; comissão vai pelo CC 25%
            return;
          }
          result.contratos++;
          var plano = (row[iPlano]||'').toUpperCase();
          if(plano.includes('TRIMESTRAL')) result.tipoContrato='Trimestral';
          else if(plano.includes('SEMESTRAL')) result.tipoContrato='Semestral';
          else result.tipoContrato='Mensal';
          // Valor vendido
          var vStr = (row[iValorV]||'').replace(/R\$\s*/,'').replace(/\./g,'').replace(',','.').trim();
          var v = parseFloat(vStr)||0;
          result.valorVendido += v;
        }
      });
    }

    // Calculate bonus meta and commission
    // Commission rules per plano de carreira:
    // - Bonus meta: only if contratos >= meta
    // - Commission: fixed R$ per contract, ONLY on contracts ABOVE the meta (threshold = meta+1)
    // - R$30 per REALIZED meeting (reuniao comparecida)
    // - NO % of valor vendido (that's SDR rule, not Closer)
    var meta = lv.meta;
    result.bonusMeta = result.contratos >= meta ? lv.bonusMeta : 0;
    // Comissao only activates after beating meta - applies to contracts above meta
    var acima = Math.max(0, result.contratos - meta);
    // Use most common plano type for commission unit
    var commUnit = result.tipoContrato==='Trimestral'?lv.commTrim:(result.tipoContrato==='Semestral'?lv.commSem:lv.commMens);
    result.comissaoUnit = commUnit;
    result.comissaoContratos = (result.contratos >= meta && acima > 0) ? acima * commUnit : 0;

    // Cold Call: R$30/reunião realizada (SDR=Gustavo, ORIGEM=Cold Call)
    // Comissão de VENDA não se aplica ao cold call — apenas agendamento (R$30/reunião realizada)
    var mrrColdCall=0, reunColdCall=0;
    if(reunRows && reunRows.length>1){
      var rh2=reunRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      var riSDR=rh2.findIndex(function(h){return h.includes('SDR')||h.includes('BDR');});
      var riOri=rh2.findIndex(function(h){return h.includes('ORIGEM');});
      var riSt=rh2.findIndex(function(h){return h.includes('STATUS');});
      var riDt=rh2.findIndex(function(h){return(h.includes('DATA')&&(h.includes('REAL')||h.includes('SERA')))||h.includes('DATA QUE');});
      if(riDt<0) riDt=rh2.findIndex(function(h){return h.includes('DATA')&&h.includes('AGEND');});
      reunRows.slice(1).forEach(function(row){
        var sdrR=(riSDR>=0?row[riSDR]||'':'').trim();
        var oriR=(riOri>=0?row[riOri]||'':'').toLowerCase();
        var stR=(riSt>=0?row[riSt]||'':'').toUpperCase();
        var dtR=riDt>=0?row[riDt]||'':'';
        var monthR=dtR?dateToMonthStr(parseBRDate(dtR)):'';
        if(normCloserName(sdrR)==='Gustavo' && oriR.includes('cold') && isRealizada(stR) && monthR===month){
          reunColdCall++;
        }
      });
    }
    var _ccDebugLines=[];
    if(cliRows && cliRows.length>1){
      var ciValorVendido=ch.findIndex(function(h){return h.includes('VALOR')&&h.includes('VENDIDO');});
      _ccDebugLines.push('Cols: iData2='+iData2+' ciSDR2='+ciSDR2+' ciOri2='+ciOri2+' month='+month);
      _ccDebugLines.push('Cabeçalhos: '+ch.join(' | '));
      cliRows.slice(1).forEach(function(row,_ri){
        var sdrC=(ciSDR2>=0?row[ciSDR2]||'':'').trim();
        var closerC2=(iCloser2>=0?row[iCloser2]||'':'').trim();
        var oriC=(ciOri2>=0?row[ciOri2]||'':'').toLowerCase();
        var dateStr3=row[iData2]||'';
        var dt3=parseBRDate(dateStr3);
        var monthC=dateToMonthStr(dt3);
        var hasGustavoSDR=normCloserName(sdrC)==='Gustavo';
        var hasGustavoCloser=normCloserName(closerC2)==='Gustavo';
        var hasGustavo=hasGustavoSDR||hasGustavoCloser;
        var hasCold=oriC.includes('cold')||oriC.includes('call');
        var hasMonth=monthC===month;
        if(hasGustavo||hasCold){
          _ccDebugLines.push('Linha '+(row[1]||'?')+': sdr="'+sdrC+'" closer="'+closerC2+'" ori="'+oriC+'" mes='+monthC+' G='+hasGustavo+' CC='+hasCold+' M='+hasMonth+' val='+row[2]);
        }
        if(hasCold && hasMonth){
          // SDR-only cold call: NÃO conta como venda do Gustavo (não incrementa contratos)
          // Só acumula mrrColdCall para a comissão de 25% SDR
          // (quando closer=Gustavo, o primeiro loop já contou como venda dele)
          if(hasGustavoSDR || hasGustavoCloser){
            var valorMes=parseMoney(row[2]||'');
            if(!valorMes && ciValorVendido>=0) valorMes=parseMoney(row[ciValorVendido]||'');
            _ccDebugLines.push('→ CC 25%: '+row[1]+' R$'+valorMes);
            mrrColdCall+=valorMes;
          }
        }
      });
      _ccDebugLines.push('TOTAL mrrColdCall='+mrrColdCall);
    }
    result._ccDebug=_ccDebugLines;
    result.mrrColdCall=mrrColdCall;
    result.reunColdCall=reunColdCall;
    result.comissaoColdCall=Math.round(mrrColdCall*0.25); // 25% SDR cold call
    result.incentivColdCall=reunColdCall*30;

    var totalBruto = result.base + result.bonusMeta + result.comissaoContratos + result.incentivReun + result.comissaoColdCall + result.incentivColdCall;
    result.total = Math.max(totalBruto, result.minG);
    result.totalBruto = totalBruto;

  }catch(e){
    result.error = e.message;
  }
  return result;
}

// ===== CALCULATE SDR SALARY (JOÃO) =====
async function calcSDRFromSheets(nivelIdx, month){
  var lv = SDR_LEVELS[nivelIdx];
  var result = {base: lv.base, minG: lv.minG,
    agendamentos: 0, bonusMeta: 0, acelerador: 0,
    reunioesComp: 0, incentivReun: 0,
    trafegoReun: 0,  // só tráfego — base do acelerador
    vendas: 0, comissaoVendas: 0,
    ssReun: 0, ssIncentiv: 0, ssVendas: 0, ssComm: 0, ssTotal: 0,
    total: 0, totalSDR: 0, grandTotal: 0, error: null};
  try{
    var reunRows = await fetchSheetCached(SHEETS_IDS.reunioes, SHEETS_GIDS.reunioes, 'reunioes');
    var cliRows = await fetchSheetCached(SHEETS_IDS.clientes, SHEETS_GIDS.clientes, 'clientes');

    if(reunRows && reunRows.length > 1){
      var rh = reunRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      var iStatus = rh.findIndex(function(h){return h.includes('STATUS');});
      var iSDR = rh.findIndex(function(h){return h.includes('SDR')||h.includes('BDR');});
      var iData = rh.findIndex(function(h){return h.includes('DATA')&&h.includes('AGEND');});
      var iDataReal = rh.findIndex(function(h){return h.includes('DATA')&&(h.includes('REAL')||h.includes('SERA'));});
      var iOrigem = rh.findIndex(function(h){return h.includes('ORIGEM');});

      reunRows.slice(1).forEach(function(row){
        var sdr = (row[iSDR]||'').trim().toUpperCase();
        var status = (row[iStatus]||'').trim().toUpperCase();
        var origem = (row[iOrigem]||'').trim().toUpperCase();
        var dateStr = row[iData]||'';
        var dt = parseBRDate(dateStr);
        var rowMonth = dateToMonthStr(dt);
        var dateRealStr = row[iDataReal]||'';
        var dtReal = parseBRDate(dateRealStr);
        var rowMonthReal = dateToMonthStr(dtReal)||rowMonth;
        if(!rowMonth) return;
        if(!sdr.includes('JOÃO')&&!sdr.includes('JOAO')) return;

        var isSS = origem.includes('SOCIAL');

        // Usa DATA AGENDAMENTO (rowMonth) — mesma lógica do painel SDR/BDR
        // para garantir consistência entre as duas telas
        var isRealiz = status==='REALIZADA' || status==='VENDA';
        if(rowMonth === month && isRealiz){
          result.agendamentos++;           // SS + tráfego → verifica se bateu a meta
          if(!isSS){
            result.reunioesComp++;         // tráfego → incentivo R$12/reunião
            result.trafegoReun++;          // tráfego → base do acelerador (acima da meta)
          }
          if(isSS) result.ssReun++;        // SS → incentivo R$30/reunião
        }
      });
    }

    if(cliRows && cliRows.length > 1){
      var ch = cliRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      var iData2 = ch.findIndex(function(h){return h.includes('DATA')&&h.includes('IN');});
      var iSDR2 = ch.findIndex(function(h){return h.includes('SDR')||h.includes('BDR');});
      var iOrigem2 = ch.findIndex(function(h){return h.includes('ORIGEM');});
      // Para comissão SS usa MRR (VALOR CONTRATO/MÊS), não VALOR VENDIDO (que pode ser total do TCV)
      var iValMes2 = ch.findIndex(function(h){return h.includes('VALOR')&&(h.includes('MÊS')||h.includes('MES'));});
      if(iValMes2<0) iValMes2 = ch.findIndex(function(h){return h.includes('VALOR')&&!h.includes('VENDIDO');});
      var iValorV = ch.findIndex(function(h){return h.includes('VALOR')&&h.includes('VENDIDO');});

      cliRows.slice(1).forEach(function(row){
        var sdr2 = (row[iSDR2]||'').trim().toUpperCase();
        var dateStr2 = row[iData2]||'';
        var dt2 = parseBRDate(dateStr2);
        var rowMonth2 = dateToMonthStr(dt2);
        var origem2 = (row[iOrigem2]||'').trim().toUpperCase();
        if(!rowMonth2||rowMonth2!==month) return;
        // João é sempre o SDR — verifica apenas a coluna SDR
        if(!sdr2.includes('JOÃO')&&!sdr2.includes('JOAO')) return;

        // MRR do contrato: tenta VALOR MÊS primeiro, fallback VALOR VENDIDO
        var mrr = parseMoney(iValMes2>=0?row[iValMes2]||'':'');
        if(!mrr) mrr = parseMoney(iValorV>=0?row[iValorV]||'':'');

        result.vendas++; // Todas as vendas contam para o threshold (SS e não-SS)
        if(origem2.includes('SOCIAL')){
          // Social Selling: comissão de 25% do MRR, sem threshold próprio
          result.ssVendas++;
          result.ssComm += mrr * 0.25;
        }
      });
    }

    // Calculate SDR
    var meta = lv.meta;
    var threshold = lv.threshold;
    // Meta: SS + tráfego juntos
    result.bonusMeta = result.agendamentos >= meta ? lv.bonusMeta : 0;
    // Acelerador: só reuniões de TRÁFEGO acima da meta
    var agenAcima = result.agendamentos >= meta ? Math.max(0, result.trafegoReun - meta) : 0;
    result.acelerador = agenAcima * lv.acel;
    result.incentivReun = result.reunioesComp * lv.incentivReun;
    var vendasEfetivas = Math.max(0, result.vendas - (threshold - 1));
    result.comissaoVendas = vendasEfetivas > 0 ? vendasEfetivas * lv.commVenda : 0;
    result.ssIncentiv = result.ssReun * 30;
    result.ssTotal = result.incentivReun + result.ssIncentiv + result.ssComm;
    var totalBrutoSDR = result.base + result.bonusMeta + result.acelerador + result.comissaoVendas;
    result.totalSDR = totalBrutoSDR;
    result.grandTotal = result.totalSDR + result.ssTotal;

  }catch(e){
    result.error = e.message;
  }
  return result;
}

// ===== CALCULATE CLOSER SALARY FROM FIREBASE =====
async function calcCloserFromFirebase(nivelIdx, month){
  var lv = CLOSER_LEVELS[nivelIdx];
  var result = {base:lv.base,minG:lv.minG,reunioes:0,incentivReun:0,
    contratos:0,tipoContrato:'Mensal',bonusMeta:0,comissaoUnit:0,
    comissaoContratos:0,valorVendido:0,total:0,mrrColdCall:0,
    reunColdCall:0,comissaoColdCall:0,incentivColdCall:0,totalBruto:0,
    loading:false,error:null};
  try{
    // Reuniões realizadas from sheet (still needed for R$30 incentive)
    var reunRows=await fetchSheetCached(SHEETS_IDS.reunioes,SHEETS_GIDS.reunioes,'reunioes');
    if(reunRows&&reunRows.length>1){
      var rh=reunRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      var iStatus=rh.findIndex(function(h){return h.includes('STATUS');});
      var iCloserR=rh.findIndex(function(h){return h==='CLOSER'||h.includes('CLOSER');});
      var iDataReal=rh.findIndex(function(h){return h.includes('DATA')&&(h.includes('REAL')||h.includes('SERA'));});
      var iData=rh.findIndex(function(h){return h.includes('DATA')&&h.includes('AGEND');});
      var iSDR_R=rh.findIndex(function(h){return h.includes('SDR')||h.includes('BDR');});
      var iOri_R=rh.findIndex(function(h){return h.includes('ORIGEM');});
      reunRows.slice(1).forEach(function(row){
        var closer=(row[iCloserR]||'').trim().toUpperCase();
        var status=(row[iStatus]||'').trim().toUpperCase();
        var dateStr=row[iDataReal]||row[iData]||'';
        var dt=parseBRDate(dateStr);
        var rowMonth=dateToMonthStr(dt);
        var sdrR=(iSDR_R>=0?row[iSDR_R]||'':'').trim();
        var oriR=(iOri_R>=0?row[iOri_R]||'':'').toLowerCase();
        if(normCloserName(closer)==='Gustavo'&&status==='REALIZADA'&&rowMonth===month) result.reunioes++;
        if(normCloserName(sdrR)==='Gustavo'&&oriR.includes('cold')&&isRealizada(status)&&rowMonth===month) result.reunColdCall++;
      });
    }
    result.incentivReun=result.reunioes*30;
    result.incentivColdCall=result.reunColdCall*30;

    // Contracts from Firebase
    var contratos=await loadContratos();
    var mrrColdCall=0;
    contratos.forEach(function(c){
      var contMonth=c.dataInicio?c.dataInicio.substring(0,7):null;
      if(!contMonth||contMonth!==month) return;
      var closerC=normCloserName((c.closer||'').trim());
      var sdrC=normCloserName((c.sdr||'').trim());
      var oriC=(c.origem||'').toLowerCase();
      // Qualquer contrato cold call → Gustavo recebe 25% independente de quem fechou
      var isColdCall=oriC.includes('cold')||oriC.includes('call');
      if(isColdCall){
        // Conta venda para meta/progressão se Gustavo foi closer ou SDR
        var sdrCC=(normCloserName((c.sdr||'').trim()));
        if(closerC==='Gustavo'||sdrCC==='Gustavo'){
          result.contratos++;
          // 25% sobre valor do contrato (comissão SDR cold call)
          // NÃO aplica comissão padrão de closer (acima da meta)
          mrrColdCall+=c.valorMes||0;
        }
      } else if(closerC==='Gustavo'){
        result.contratos++;
        var pu=(c.plano||'').toUpperCase();
        if(pu.includes('TRIMESTRAL')) result.tipoContrato='Trimestral';
        else if(pu.includes('SEMESTRAL')) result.tipoContrato='Semestral';
        result.valorVendido+=c.valorVendido||0;
      }
    });
    result.mrrColdCall=mrrColdCall;
    result.comissaoColdCall=Math.round(mrrColdCall*0.25); // 25% SDR cold call

    var meta=lv.meta;
    result.bonusMeta=result.contratos>=meta?lv.bonusMeta:0;
    var acima=Math.max(0,result.contratos-meta);
    var commUnit=result.tipoContrato==='Trimestral'?lv.commTrim:(result.tipoContrato==='Semestral'?lv.commSem:lv.commMens);
    result.comissaoUnit=commUnit;
    result.comissaoContratos=(result.contratos>=meta&&acima>0)?acima*commUnit:0;
    var totalBruto=result.base+result.bonusMeta+result.comissaoContratos+result.incentivReun+result.comissaoColdCall+result.incentivColdCall;
    result.total=Math.max(totalBruto,result.minG);
    result.totalBruto=totalBruto;
  }catch(e){result.error=e.message;}
  return result;
}

// ===== CALCULATE SDR SALARY FROM FIREBASE =====
async function calcSDRFromFirebase(nivelIdx, month){
  var lv=SDR_LEVELS[nivelIdx];
  var pct=(SDR_COMM_PCT[nivelIdx]||10)/100;
  var result={base:lv.base,minG:lv.minG,
    agendamentos:0,bonusMeta:0,acelerador:0,
    reunioesComp:0,incentivReun:0,
    trafegoReun:0,  // só tráfego — base do acelerador
    vendas:0,comissaoVendas:0,
    ssReun:0,ssVendas:0,ssIncentiv:0,ssComm:0,ssTotal:0,
    total:0,totalSDR:0,grandTotal:0,error:null};
  try{
    // Agendamentos still from reunioes sheet
    var reunRows=await fetchSheetCached(SHEETS_IDS.reunioes,SHEETS_GIDS.reunioes,'reunioes');
    if(reunRows&&reunRows.length>1){
      var rh=reunRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      var iStatus=rh.findIndex(function(h){return h.includes('STATUS');});
      var iSDR=rh.findIndex(function(h){return h.includes('SDR')||h.includes('BDR');});
      var iData=rh.findIndex(function(h){return h.includes('DATA')&&h.includes('AGEND');});
      var iDataReal=rh.findIndex(function(h){return h.includes('DATA')&&(h.includes('REAL')||h.includes('SERA'));});
      var iOrigem=rh.findIndex(function(h){return h.includes('ORIGEM');});
      reunRows.slice(1).forEach(function(row){
        var sdr=(row[iSDR]||'').trim().toUpperCase();
        var status=(row[iStatus]||'').trim().toUpperCase();
        var origem=(row[iOrigem]||'').trim().toUpperCase();
        var dateStr=row[iData]||'';
        var dt=parseBRDate(dateStr);
        var rowMonth=dateToMonthStr(dt);
        var dateRealStr=row[iDataReal]||'';
        var dtReal=parseBRDate(dateRealStr);
        var rowMonthReal=dateToMonthStr(dtReal)||rowMonth;
        if(!rowMonth) return;
        if(!sdr.includes('JOÃO')&&!sdr.includes('JOAO')) return;
        var isSS=origem.includes('SOCIAL');
        // Usa DATA AGENDAMENTO (rowMonth) — mesma lógica do painel SDR/BDR
        var isRealiz=status==='REALIZADA'||status==='VENDA';
        if(rowMonth===month&&isRealiz){
          result.agendamentos++;           // SS + tráfego → verifica se bateu a meta
          if(!isSS){
            result.reunioesComp++;         // tráfego → incentivo R$12/reunião
            result.trafegoReun++;          // tráfego → base do acelerador (acima da meta)
          }
          if(isSS) result.ssReun++;        // SS → incentivo R$30/reunião
        }
      });
    }

    // Contracts from Firebase
    var contratos=await loadContratos();
    var _vendaValores=[];
    contratos.forEach(function(c){
      var contMonth=c.dataInicio?c.dataInicio.substring(0,7):null;
      if(!contMonth||contMonth!==month) return;
      // João é sempre o SDR — verifica apenas a coluna sdr
      var sdr=(c.sdr||'').trim().toUpperCase();
      if(!sdr.includes('JOÃO')&&!sdr.includes('JOAO')) return;
      var ori=(c.origem||'').toUpperCase();
      var mrr=c.valorMes||0;
      result.vendas++; // Todas as vendas contam para o threshold (SS e não-SS)
      if(ori.includes('SOCIAL')){
        // Social Selling: comissão de 25% do MRR, sem threshold próprio
        result.ssVendas++;
        result.ssComm+=mrr*0.25;
      } else {
        _vendaValores.push(mrr);
      }
    });

    // Commission: % of valorMes for each non-SS venda above threshold (total vendas inclusive)
    var threshold=lv.threshold;
    if(result.vendas>=threshold){
      var sorted=_vendaValores.slice().sort(function(a,b){return a-b;});
      // acima = all non-SS contracts from threshold onward (SS já têm comissão própria)
      var acima=sorted.slice(Math.max(0,threshold-1-(result.vendas-_vendaValores.length)));
      result.comissaoVendas=Math.round(acima.reduce(function(s,v){return s+v*pct;},0));
    }

    var meta=lv.meta;
    // Meta: SS + tráfego juntos
    result.bonusMeta=result.agendamentos>=meta?lv.bonusMeta:0;
    // Acelerador: só reuniões de TRÁFEGO acima da meta
    var agenAcima=result.agendamentos>=meta?Math.max(0,result.trafegoReun-meta):0;
    result.acelerador=agenAcima*lv.acel;
    result.incentivReun=result.reunioesComp*lv.incentivReun;
    result.ssIncentiv=result.ssReun*30;
    result.ssTotal=result.incentivReun+result.ssIncentiv+result.ssComm;
    var totalBrutoSDR=result.base+result.bonusMeta+result.acelerador+result.comissaoVendas;
    result.totalSDR=totalBrutoSDR;
    result.grandTotal=result.totalSDR+result.ssTotal;
  }catch(e){result.error=e.message;}
  return result;
}

// ===== META PROGRESSION HELPERS =====
function _msLabel(ms){
  var parts=ms.split('-');
  var nomes=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return nomes[parseInt(parts[1])-1]+'/'+parts[0].slice(2);
}
function _lastNMonths(n){
  var result=[];
  var now=new Date();
  for(var i=n-1;i>=0;i--){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    result.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return result;
}
async function calcCloserMetaHistory(nivelIdx){
  var lv=CLOSER_LEVELS[nivelIdx];
  if(!lv||lv.promoMeses===0) return null;
  var meses=_lastNMonths(lv.promoJanela);
  var counts={};
  meses.forEach(function(ms){counts[ms]=0;});
  try{
    var cliRows=await fetchSheetCached(SHEETS_IDS.clientes,SHEETS_GIDS.clientes,'clientes');
    if(cliRows&&cliRows.length>1){
      var ch=cliRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      var iData=ch.findIndex(function(h){return h.includes('DATA')&&h.includes('IN');});
      var iCloser=ch.findIndex(function(h){return h==='CLOSER'||h.includes('CLOSER');});
      var iSDR=ch.findIndex(function(h){return h==='SDR'||h==='BDR'||h.includes('SDR');});
      var iOri=ch.findIndex(function(h){return h==='ORIGEM'||h.includes('ORIGEM');});
      cliRows.slice(1).forEach(function(row){
        var closer=normCloserName((row[iCloser]||'').trim());
        if(closer!=='Gustavo') return;
        var sdr=normCloserName((iSDR>=0?row[iSDR]||'':'').trim());
        var ori=(iOri>=0?row[iOri]||'':'').toLowerCase();
        if(sdr==='Gustavo'&&(ori.includes('cold')||ori.includes('call'))) return;
        var dt=parseBRDate(row[iData]||'');
        var ms=dateToMonthStr(dt);
        if(counts.hasOwnProperty(ms)) counts[ms]++;
      });
    }
  }catch(e){console.warn('metaHistory closer',e);}
  return meses.map(function(ms){var c=counts[ms];return{ms:ms,label:_msLabel(ms),count:c,hit:c>=lv.meta,meta:lv.meta};});
}
async function calcSDRMetaHistory(nivelIdx){
  var lv=SDR_LEVELS[nivelIdx];
  if(!lv||lv.promoMeses===0) return null;
  var meses=_lastNMonths(lv.promoJanela);
  // Exclui meses anteriores ao início do nível atual
  var since=_careerLevelSince.joao||null;
  if(since) meses=meses.filter(function(ms){return ms>=since;});
  var counts={};
  meses.forEach(function(ms){counts[ms]=0;});
  try{
    var reunRows=await fetchSheetCached(SHEETS_IDS.reunioes,SHEETS_GIDS.reunioes,'reunioes');
    if(reunRows&&reunRows.length>1){
      var rh=reunRows[0].map(function(h){return(h||'').trim().toUpperCase();});
      var iSDR=rh.findIndex(function(h){return h.includes('SDR')||h.includes('BDR');});
      var iData=rh.findIndex(function(h){return h.includes('DATA')&&h.includes('AGEND');});
      var iOri=rh.findIndex(function(h){return h.includes('ORIGEM');});
      var iStatus=rh.findIndex(function(h){return h.includes('STATUS');});
      reunRows.slice(1).forEach(function(row){
        var sdr=(row[iSDR]||'').trim().toUpperCase();
        if(!sdr.includes('JOÃO')&&!sdr.includes('JOAO')) return;
        var st=(iStatus>=0?row[iStatus]||'':'').trim().toUpperCase();
        // Só conta realizadas (mesma lógica do salário e do SDR/BDR)
        if(st!=='REALIZADA'&&st!=='VENDA') return;
        var dt=parseBRDate(row[iData]||'');
        var ms=dateToMonthStr(dt);
        if(counts.hasOwnProperty(ms)) counts[ms]++;
      });
    }
  }catch(e){console.warn('metaHistory sdr',e);}
  return meses.map(function(ms){var c=counts[ms];return{ms:ms,label:_msLabel(ms),count:c,hit:c>=lv.meta,meta:lv.meta};});
}
function buildPromoProgressHtml(history,lv,currentMonth){
  if(!history||history.length===0) return '';
  var hitCount=history.filter(function(m){return m.hit;}).length;
  var eligible=hitCount>=lv.promoMeses;
  var badgeCol=eligible?'#4ade80':'var(--amber)';
  var monthsHtml=history.map(function(m){
    var isCurrent=m.ms===currentMonth;
    var pct=Math.min(100,m.meta>0?Math.round(m.count/m.meta*100):0);
    var barCol=m.hit?'#4ade80':'#ef4444';
    return '<div style="text-align:center;flex:1;min-width:54px;padding:8px 6px;background:rgba(0,0,0,'+(isCurrent?'0.4':'0.2')+');border-radius:8px;border:1px solid rgba(255,255,255,'+(isCurrent?'0.15':'0.05')+');">'+
      '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:10px;color:'+(isCurrent?'var(--cyan)':'var(--muted)')+';margin-bottom:4px;font-weight:'+(isCurrent?'700':'400')+';">'+esc(m.label)+(isCurrent?' ◀':'')+'</div>'+
      '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:24px;color:'+(m.hit?'#4ade80':'#ef4444')+';">'+m.count+'</div>'+
      '<div style="font-size:9px;color:var(--muted);margin-bottom:6px;">meta '+m.meta+'</div>'+
      '<div style="height:5px;border-radius:99px;background:rgba(255,255,255,0.08);margin-bottom:5px;">'+
        '<div style="height:100%;border-radius:99px;width:'+pct+'%;background:'+barCol+';"></div>'+
      '</div>'+

  }).join('');
  var remaining=lv.promoMeses-hitCount;

  return '<div class="audens-promo-progress" style="background:rgba(6,182,212,0.05);border:1.5px solid rgba(6,182,212,0.2);border-radius:12px;padding:16px 20px;margin-top:14px;">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:12px;">'+
      '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);">PROGRESSÃO PARA PROMOÇÃO</div>'+
      '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:16px;color:'+badgeCol+';">'+hitCount+'/'+lv.promoMeses+' meses &nbsp;·&nbsp; '+statusText+'</div>'+
    '</div>'+
    '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;color:var(--muted);margin-bottom:10px;">Critério: '+esc(lv.promo)+'</div>'+
    '<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">'+monthsHtml+'</div>'+
  '</div>';
}

// Month selector helper
function monthOptions(selectedMonth){
  var opts = '';
  var now = new Date();
  for(var i=0; i<6; i++){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    var val = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    var label = meses[d.getMonth()]+'/'+d.getFullYear();
    opts += '<option value="'+val+'"'+(val===selectedMonth?' selected':'')+'>'+label+'</option>';
  }
  return opts;
}

  if(lv.promoMeses>0){
    try{
      var hist = await calcSDRMetaHistory(nivelIdx);
      var _oldSP = resEl.querySelector('.audens-promo-progress');
      if(_oldSP) _oldSP.remove();
      resEl.insertAdjacentHTML('beforeend', buildPromoProgressHtml(hist, lv, month));
    }catch(e){console.warn('sdr progression',e);}
  }
}

// Lê contratos direto da planilha Clientes Fechados para exibição na aba
async function _fetchContratosSheet(){
  var rows=await fetchSheetVals(SHEETS_IDS.clientes,SHEETS_GIDS.clientes);
  if(!rows||rows.length<2) return [];
  var h=rows[0].map(function(x){return(x||'').trim().toUpperCase();});
  var iData   =h.findIndex(function(c){return c.includes('DATA')&&c.includes('IN')&&!c.includes('CANCEL');});
  var iCliente=h.findIndex(function(c){return c.includes('CLIENTE');});
  var iValMes =h.findIndex(function(c){return c.includes('VALOR')&&!c.includes('VENDIDO');});
  var iGestor =h.findIndex(function(c){return c.includes('GESTOR');});
  var iDataCan=h.findIndex(function(c){return c.includes('DATA')&&c.includes('CANCEL');});
  var iMotivo =h.findIndex(function(c){return c.includes('MOTIVO');});
  var iPlano  =h.findIndex(function(c){return c.includes('PLANO');});
  var iOrigem =h.findIndex(function(c){return c.includes('ORIGEM');});
  var iCloser =h.findIndex(function(c){return c==='CLOSER'||c.includes('CLOSER');});
  var iSDR    =h.findIndex(function(c){return c.includes('SDR')||c.includes('BDR');});
  var iValVend=h.findIndex(function(c){return c.includes('VALOR')&&c.includes('VENDIDO');});
  return rows.slice(1).map(function(row,idx){
    var rawCancel=(iDataCan>=0?row[iDataCan]||'':'').trim();
    var dataCancelamento=rawCancel?_brDateToISO(rawCancel):'';
    var dataInicio=_brDateToISO((iData>=0?row[iData]||'':'').trim());
    return {
      id:'_sheet_'+idx,
      _fromSheet:true,
      cliente:(iCliente>=0?row[iCliente]||'':''),
      valorMes:parseMoney(iValMes>=0?row[iValMes]||'':''),
      valorVendido:parseMoney(iValVend>=0?row[iValVend]||'':''),
      plano:(iPlano>=0?row[iPlano]||'':''),
      gestor:(iGestor>=0?row[iGestor]||'':''),
      origem:(iOrigem>=0?row[iOrigem]||'':''),
      closer:(iCloser>=0?row[iCloser]||'':''),
      sdr:(iSDR>=0?row[iSDR]||'':''),
      dataInicio:dataInicio,
      dataCancelamento:dataCancelamento,
      motivo:(iMotivo>=0?row[iMotivo]||'':''),
      ativo:!dataCancelamento
    };
  }).filter(function(c){return c.cliente;});
}
function _brDateToISO(s){
  if(!s) return '';
  // Handles "22/06/2026" or "2026-06-22"
  if(s.includes('-')) return s.split('T')[0];
  var p=s.split('/');
  if(p.length===3) return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');
  return '';
}

async function loadContratosPage(){
  var el=document.getElementById('contratos-content');
  if(!el) return;
  try{
    var contratos;
    if(isGcalConnected()){
      contratos=await _fetchContratosSheet();
    } else {
      contratos=await loadContratos(true); // fallback Firebase se desconectado
    }
    el.innerHTML=buildContratosHTML(contratos);
    setTimeout(filtrarContratos,0);
  }catch(e){
    el.innerHTML='<div style="color:var(--red);">Erro: '+esc(e.message)+'</div>';
  }
}

function filtrarContratos(){
  var status=document.getElementById('ct-filtro-status').value;
  var busca=(document.getElementById('ct-busca').value||'').toLowerCase();
  var list=(window._allContratos||[]).filter(function(c){
    var ativo=c.ativo!==false&&!c.dataCancelamento;
    if(status==='ativos'&&!ativo) return false;
    if(status==='cancelados'&&ativo) return false;
    if(busca&&!(c.cliente||'').toLowerCase().includes(busca)) return false;
    return true;
  });
  var _s=window._contratosSort||{field:'dataInicio',dir:-1};
  list.sort(function(a,b){
    var av=a[_s.field],bv=b[_s.field];
    if(_s.field==='valorMes'){ av=av||0; bv=bv||0; return (av-bv)*_s.dir; }
    return ((av||'').toString().localeCompare((bv||'').toString()))*_s.dir;
  });
  var tbody=document.getElementById('ct-tbody');
  if(!tbody) return;
  tbody.innerHTML=list.map(function(c){
    var ativo=c.ativo!==false&&!c.dataCancelamento;
    var stLabel=ativo?'Ativo':'Cancelado';
    var stCol=ativo?'var(--green)':'var(--red)';
    var planoCurto=(c.plano||'').replace(/Plano\s+\d+\s*-?\s*/i,'').replace(/Plano\s+Premium\s*-?\s*/i,'');
    return '<tr style="border-bottom:1px solid rgba(255,255,255,0.05);" id="ct-row-'+c.id+'">'+
      '<td style="padding:10px;font-weight:600;color:var(--white);">'+esc(c.cliente)+'</td>'+
      '<td style="padding:10px;font-size:12px;color:var(--muted);">'+esc(planoCurto||c.plano||'—')+'</td>'+
      '<td style="padding:10px;font-family:\'Bebas Neue\',sans-serif;font-size:16px;color:var(--purple3);text-align:right;">R$'+(c.valorMes||0).toLocaleString('pt-BR')+'</td>'+
      '<td style="padding:10px;font-size:13px;">'+esc(c.closer||'—')+'</td>'+
      '<td style="padding:10px;font-size:13px;">'+esc(c.sdr||'—')+'</td>'+
      '<td style="padding:10px;font-size:12px;color:var(--muted);">'+(c.dataInicio?c.dataInicio.split('-').reverse().join('/'):'—')+'</td>'+
      '<td style="padding:10px;"><span style="font-family:var(--font-bc),sans-serif;font-size:11px;padding:3px 8px;border-radius:6px;background:'+stCol+'22;color:'+stCol+';">'+stLabel+'</span>'+
        (c.dataCancelamento?'<div style="font-size:10px;color:var(--muted);margin-top:2px;">'+(c.dataCancelamento.split('-').reverse().join('/'))+'</div>':'')+
      '</td>'+
      '<td style="padding:10px;white-space:nowrap;">'+
        (c._fromSheet?'<span style="font-size:10px;color:var(--muted);font-family:var(--font-bc),sans-serif;">Planilha</span>':(
          '<button class="btn btn-edit" onclick="abrirModalContrato(\''+c.id+'\')" title="Editar"><i class="ti ti-edit"></i></button>'+
          (ativo?' <button class="btn btn-outline" style="color:var(--red);border-color:rgba(239,68,68,0.4);font-size:11px;padding:5px 10px;" onclick="abrirModalCancelar(\''+c.id+'\')" title="Cancelar"><i class="ti ti-x"></i></button>':'')
        ))+

  }).join('');

function ctAutoValor(){
  var plano=(document.getElementById('ct-plano').value||'').toUpperCase();
  var dur=plano.includes('SEMESTRAL')?6:plano.includes('TRIMESTRAL')?3:1;
  var mrr=parseFloat(document.getElementById('ct-valorMes').value)||0;
  if(mrr) document.getElementById('ct-valorVendido').value=Math.round(mrr*dur);
}

  var modal=document.getElementById('modal-contrato');
  if(!modal) return;
  modal.style.display='flex';
  document.getElementById('ct-id').value=id||'';
  document.getElementById('modal-ct-title').textContent=id?'Editar Contrato':'Novo Contrato';

      document.getElementById('ct-valorVendido').value=c.valorVendido||'';

      document.getElementById('ct-closer').value=c.closer||'';
      document.getElementById('ct-sdr').value=c.sdr||'';

    document.getElementById('ct-cliente').value='';
    document.getElementById('ct-dataInicio').value=new Date().toISOString().split('T')[0];
    document.getElementById('ct-valorMes').value='';

}

async function salvarContrato(){
  var id=document.getElementById('ct-id').value||null;
  var plano=document.getElementById('ct-plano').value;
  var pu=plano.toUpperCase();
  var planoDuracao=pu.includes('SEMESTRAL')?6:pu.includes('TRIMESTRAL')?3:1;
  var valorMes=parseFloat(document.getElementById('ct-valorMes').value)||0;
  var valorVendido=parseFloat(document.getElementById('ct-valorVendido').value)||valorMes*planoDuracao;
  var data={
    cliente:document.getElementById('ct-cliente').value.trim(),
    dataInicio:document.getElementById('ct-dataInicio').value,
    plano:plano,
    planoDuracao:planoDuracao,
    valorMes:valorMes,
    valorVendido:valorVendido,
    gestor:document.getElementById('ct-gestor').value,
    origem:document.getElementById('ct-origem').value,
    closer:document.getElementById('ct-closer').value.trim(),
    sdr:document.getElementById('ct-sdr').value.trim(),
    ativo:true
  };
  if(!data.cliente||!data.dataInicio||!data.valorMes){
    showSheetToast('Preencha cliente, data e valor.',true); return;
  }
  try{
    await saveContrato(id,data);
    fecharModalContrato();
    showSheetToast(id?'Contrato atualizado!':'Contrato criado!',false);
    await loadContratosPage();
  }catch(e){ showSheetToast('Erro: '+e.message,true); }
}

function abrirModalCancelar(id){
  var modal=document.getElementById('modal-cancelar-ct');
  if(!modal) return;
  modal.style.display='flex';
  document.getElementById('cancel-ct-id').value=id;
  document.getElementById('cancel-ct-data').value=new Date().toISOString().split('T')[0];
}
function fecharModalCancelar(){
  var m=document.getElementById('modal-cancelar-ct');
  if(m) m.style.display='none';
}
async function confirmarCancelamento(){
  var id=document.getElementById('cancel-ct-id').value;
  var data=document.getElementById('cancel-ct-data').value;
  var motivo=document.getElementById('cancel-ct-motivo').value;
  if(!id||!data){ showSheetToast('Preencha a data.',true); return; }
  try{
    await cancelarContrato(id,motivo,data);
    fecharModalCancelar();
    showSheetToast('Contrato cancelado.',false);
    await loadContratosPage();
  }catch(e){ showSheetToast('Erro: '+e.message,true); }
}

function runImportContratos(reImport){
  // Mostra modal de confirmação próprio (confirm() não funciona em Electron)
  var msg=reImport
    ?'Isso apagará os dados existentes e reimportará tudo da planilha. Confirma?'
    :'Importar todos os contratos da planilha Clientes Fechados para o Firebase?';
  var modalHtml='<div id="modal-import-confirm" style="position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:99999;display:flex;align-items:center;justify-content:center;">'+
    '<div style="background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:28px;width:min(400px,90vw);" onclick="event.stopPropagation()">'+
      '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:20px;margin-bottom:12px;"><i class="ti ti-download" style="color:var(--amber);"></i> Importar Contratos</div>'+
      '<div style="font-family:var(--font-bc),sans-serif;font-size:14px;color:var(--muted);margin-bottom:20px;">'+esc(msg)+'</div>'+
      '<div style="display:flex;gap:10px;">'+
        '<button class="btn btn-outline" style="flex:1;" onclick="document.getElementById(\'modal-import-confirm\').remove()">Cancelar</button>'+
        '<button class="btn btn-primary" style="flex:1;" onclick="document.getElementById(\'modal-import-confirm\').remove();_execImport('+!!reImport+')">Importar</button>'+
      '</div>'+
    '</div>'+
  '</div>';
  document.body.insertAdjacentHTML('beforeend',modalHtml);
}

async function _execImport(reImport){
  showSheetToast('Importando contratos da planilha...',false);
  try{
    if(!isGcalConnected()){
      showSheetToast('Google desconectado. Reconecte em Configurações → Google Calendar.',true);
      return;
    }
    if(reImport){
      await fbDb.ref('contratos').remove();
      _contratosCache=null;
    }
    var count=await importContratosFromSheet();
    if(count===0){
      showSheetToast('Nenhum contrato encontrado na planilha. Verifique as colunas.',true);
    } else {
      showSheetToast(count+' contratos importados com sucesso!',false);
    }
    await loadContratosPage();
  }catch(e){
    console.error('Import error',e);
    showSheetToast('Erro ao importar: '+e.message,true);
  }
}

window.addEventListener('load', function(){
  initFirebase();
  // Check token validity on load
  setTimeout(function(){
    if(gcalToken && gcalToken.expires_at && Date.now() > gcalToken.expires_at){
      gcalToken = null;
      localStorage.removeItem('audens_gcal_token');
      console.log('Expired Google token cleared');
    }
  }, 2000);
});
</script>
