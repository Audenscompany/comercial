  var val=input.value.trim();if(!val){alert('Cole a URL da planilha.');return;}
  var parsed=parseSheetUrl(val);
  if(!parsed||!parsed.id){alert('URL invalida.');return;}
  SHEETS_IDS[type]=parsed.id;SHEETS_GIDS[type]=parsed.gid;
  _sheetsMeta={};saveAll();showPage('config');
  alert('Planilha salva!\nID: '+parsed.id+'\ngid: '+parsed.gid);
}

async function fetchSheetVals(sheetId,gid){
  if(!isGcalConnected()) throw new Error('Token do Google expirado. Reconecte em Configurações.');
  try{
    // Step 1: get sheet title from GID
    if(!_sheetsMeta[sheetId+'_fetched']){
      var mr=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'?fields=sheets.properties',
        {headers:{'Authorization':'Bearer '+gcalToken.access_token}});
      var mm=await mr.json();
      if(mm.sheets){
        mm.sheets.forEach(function(s){_sheetsMeta[sheetId+'_'+s.properties.sheetId]=s.properties.title;});
        _sheetsMeta[sheetId+'_fetched']=true;
      }
    }
    var tabName=_sheetsMeta[sheetId+'_'+gid];
    // Fallback: first sheet
    if(!tabName){
      var keys=Object.keys(_sheetsMeta).filter(function(k){return k.startsWith(sheetId+'_')&&k!==sheetId+'_fetched';});
      if(keys.length>0) tabName=_sheetsMeta[keys[0]];
    }
    if(!tabName) tabName='Sheet1';
    // Step 2: fetch values by tab name
    var r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(tabName),
      {headers:{'Authorization':'Bearer '+gcalToken.access_token}});
    var d=await r.json();
    // Step 3: if tab name failed (400), try fetching first sheet by omitting range
    if(d.error){
      console.warn('fetchSheetVals fallback for',sheetId,'gid',gid,'tabName',tabName,'err',d.error.message);
      var r2=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/A1:ZZ10000',
        {headers:{'Authorization':'Bearer '+gcalToken.access_token}});
      d=await r2.json();
    }
    if(d.error){throw new Error('Planilha (gid='+gid+'): '+JSON.stringify(d.error.message||d.error));}
    return d.values||[];
  }catch(e){console.error('fetchSheetVals error',sheetId,gid,e);throw e;}
}
function rawToObjs(raw){
  if(!raw||raw.length<2)return{headers:[],rows:[]};
  var h=raw[0].map(function(x){return(x||'').trim();});
  var rows=raw.slice(1).map(function(row){
    var o={};h.forEach(function(k,i){o[k]=(row[i]||'').trim();});return o;
  }).filter(function(r){return Object.values(r).some(function(v){return v;});});
  return{headers:h,rows:rows};
}

async function appendSheetRow(sheetId, gid, values, lastCol){
  if(!isGcalConnected()){
    showSheetToast('ERRO: Google nao conectado.',true);
    return false;
  }
  try{
    // Step 1: get spreadsheet info to find tab name by gid
    var metaUrl='https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'?fields=sheets.properties';
    var mr=await fetch(metaUrl,{headers:{'Authorization':'Bearer '+gcalToken.access_token}});
    var mm=await mr.json();
    if(mm.error){
      // Token might lack spreadsheets scope - try to write directly with tab name
      showSheetToast('ERRO meta: '+mm.error.message+' (codigo:'+mm.error.code+')',true);
      return false;
    }
    // Find tab name matching gid
    var tabName=null;
    if(mm.sheets){
      for(var i=0;i<mm.sheets.length;i++){
        var sp=mm.sheets[i].properties;
        if(sp.sheetId===gid||sp.sheetId===parseInt(gid)){tabName=sp.title;break;}
      }
      // fallback: look for tab named Ligação or Ligacao
      if(!tabName){
        for(var i=0;i<mm.sheets.length;i++){
          var t=mm.sheets[i].properties.title;
          if(t.toLowerCase().includes('liga')){tabName=t;break;}
        }
      }
      // last fallback: list all tabs in error
      if(!tabName){
        var allTabs=mm.sheets.map(function(s){return s.properties.title+'('+s.properties.sheetId+')'}).join(', ');
        showSheetToast('ERRO: Aba nao encontrada. Abas disponiveis: '+allTabs,true);
        return false;
      }
    }
    // Cacheia o nome da aba para uso posterior em updateSheetCell
    _sheetTabNameCache[String(gid)]=tabName;
    // Step 2: append row
    var range=tabName+'!A:'+(lastCol||'H');
    console.log('[appendSheetRow] range=',range,' values=',JSON.stringify(values));
    var appendUrl='https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(range)+':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS';
    var resp=await fetch(appendUrl,{
      method:'POST',
      headers:{'Authorization':'Bearer '+gcalToken.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({values:[values]})
    });
    var result=await resp.json();
    console.log('[appendSheetRow] result=',JSON.stringify(result));
    if(result.error){
      showSheetToast('ERRO ao gravar: '+result.error.message+' | Status: '+resp.status,true);
      return false;
    }
    // Extrai o número da linha inserida do updatedRange (ex: "Reuniões!A11:H11" → 11)
    var rowNum=0;
    var updInfo='';
    if(result.updates&&result.updates.updatedRange){
      var rm=result.updates.updatedRange.match(/(\d+)/);
      if(rm)rowNum=parseInt(rm[1]);
      updInfo=' | '+result.updates.updatedRange+' ('+result.updates.updatedColumns+' cols)';
    }
    showSheetToast('Gravado na planilha!'+updInfo,false);
    return rowNum||true; // rowNum (int > 0) se conseguiu extrair, true (fallback truthy) caso contrário
  }catch(e){
    showSheetToast('ERRO excecao: '+e.message,true);
    return false;
  }
}

// Atualiza uma célula específica da planilha via Sheets API PUT (values.update)
// sheetId: ID da planilha | gid: ID da aba (número) | rowNum: número da linha (1-based)
// colLetter: letra da coluna ('E', 'A', etc.) | value: valor a escrever
async function updateSheetCell(sheetId, gid, rowNum, colLetter, value){
  if(!isGcalConnected()||!rowNum) return false;
  try{
    var tabName=_sheetTabNameCache[String(gid)];
    if(!tabName){
      // Re-busca metadata se não tiver no cache
      var mr=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'?fields=sheets.properties',
        {headers:{'Authorization':'Bearer '+gcalToken.access_token}});
      var mm=await mr.json();
      if(mm.error) return false;
      for(var i=0;i<(mm.sheets||[]).length;i++){
        var sp=mm.sheets[i].properties;
        if(sp.sheetId===gid||sp.sheetId===parseInt(gid)){tabName=sp.title;break;}
      }
      if(!tabName) return false;
      _sheetTabNameCache[String(gid)]=tabName;
    }
    var cellRef=tabName+'!'+colLetter+rowNum;
    var url='https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(cellRef)+'?valueInputOption=USER_ENTERED';
    var resp=await fetch(url,{method:'PUT',
      headers:{'Authorization':'Bearer '+gcalToken.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({range:cellRef,majorDimension:'ROWS',values:[[value]]})
    });
    var r=await resp.json();
    return !r.error;
  }catch(e){ console.error('updateSheetCell error',e); return false; }
}

// Transforma meetings (Firebase) em linhas compatíveis com col()
// Status derivado de meetings.status + followups[id].resultado
function meetingsToReunioesRows(){
  return Object.values(meetings).filter(function(m){ return !m._hidden; }).map(function(m){
    var bookTs = m.scheduledAt || Date.now();
    var bd = new Date(bookTs);
    var bookDateStr = bd.getDate()+'/'+(bd.getMonth()+1)+'/'+bd.getFullYear();
    var tel = (m.tel||'').replace(/\D/g,'');
    var fu = followups[m.id];
    var statusStr;
    // Prioriza followup (fonte de verdade) sobre m.status que pode estar desatualizado
    if(fu){
      if(fu.resultado==='noshow'||fu.comparecimento==='nao') statusStr='NO-SHOW';
      else if(fu.resultado==='venda') statusStr='VENDA';
      else statusStr='REALIZADA'; // retorno, perdida, sim = reunião aconteceu
    } else if(m.status==='noshow'){
      statusStr='NO-SHOW';
    } else if(m.status==='done'){
      statusStr='REALIZADA';
    } else if(m.status==='reagendado'){
      statusStr='REAGENDADO';
    } else {
      statusStr='AGENDADA';
    }
    var kanbanEntry = m.kanbanKey ? kanbanData[m.kanbanKey] : null;
    var empresa = (kanbanEntry&&kanbanEntry.empresa)||m.empresa||'';
    var cidade = (kanbanEntry&&kanbanEntry.cidade)||m.cidade||'';
    var orig = m.origem||(kanbanEntry&&kanbanEntry.origem)||'Tráfego';
    var sdr = m.sdrName||m.sdr||m.criador||'';
    return {
      'DATA':bookDateStr,'Data':bookDateStr,'data':bookDateStr,
      'DATA DE AGENDAMENTO':bookDateStr,'Data de Agendamento':bookDateStr,
      'DataAgendamento':bookDateStr,'Data Agendamento':bookDateStr,
      'CLIENTE':m.nome||'','Cliente':m.nome||'','cliente':m.nome||'',
      'NOME':m.nome||'','Nome':m.nome||'',
      'TELEFONE':tel,'Telefone':tel,'telefone':tel,
      'STATUS REUNIÃO':statusStr,'STATUS REUNIAO':statusStr,
      'Status Reuniao':statusStr,'STATUS':statusStr,'Status':statusStr,
      'SDR':sdr,'SDR/BDR':sdr,'BDR':sdr,'Sdr':sdr,
      'CLOSER':(m.responsavel||'').toUpperCase(),'Closer':(m.responsavel||'').toUpperCase(),'closer':(m.responsavel||'').toUpperCase(),
      'ORIGEM':orig,'Origem':orig,'origem':orig,
      'EMPRESA':empresa,'Empresa':empresa,'empresa':empresa,
      'CIDADE':cidade,'Cidade':cidade,'cidade':cidade
    };
  });
}

// Converte lista de meetings (Firebase) em linhas de reunioes
function _meetingObjsToRows(arr){
  return arr.map(function(m){
    // Usa dtISO (data real da reunião) em vez de scheduledAt (timestamp de criação)
    var meetingTs=m.dtISO?(new Date(m.dtISO)).getTime():(m.scheduledAt||Date.now());
    var bd=new Date(meetingTs);
    var ds=bd.getDate()+'/'+(bd.getMonth()+1)+'/'+bd.getFullYear();
    var tel=(m.tel||'').replace(/\D/g,'');
    var fu=followups[m.id];
    var st;
    if(fu){
      if(fu.resultado==='noshow'||fu.comparecimento==='nao') st='NO-SHOW';
      else if(fu.resultado==='venda') st='VENDA';
      else st='REALIZADA';
    } else if(m.status==='noshow') st='NO-SHOW';
    else if(m.status==='done') st='REALIZADA';
    else if(m.status==='reagendado') st='REAGENDADO';
    else st='AGENDADA';
    var ke=m.kanbanKey?kanbanData[m.kanbanKey]:null;
    var orig=m.origem||(ke&&ke.origem)||'Tráfego';
    var sdr=m.sdrName||m.sdr||m.criador||'';
    var closer=(m.closerName||m.closer||'').trim();
    return {
      'DATA':ds,'Data':ds,'data':ds,
      'DATA DE AGENDAMENTO':ds,'Data de Agendamento':ds,'DataAgendamento':ds,'Data Agendamento':ds,
      'CLIENTE':m.nome||'','Cliente':m.nome||'','cliente':m.nome||'',
      'NOME':m.nome||'','Nome':m.nome||'',
      'STATUS REUNIÃO':st,'STATUS REUNIAO':st,'Status Reuniao':st,'STATUS':st,'Status':st,
      'CLOSER':closer,'Closer':closer,'closer':closer,
      'SDR/BDR':sdr,'SDR':sdr,'Sdr':sdr,
      'ORIGEM':orig,'Origem':orig,'origem':orig,
      'Telefone':tel,'TELEFONE':tel,'telefone':tel,
      '_fbOnly':true
    };
  });
}

// Híbrido: Google Sheets como fonte primária (dados completos), Firebase complementa com entradas novas
async function loadDataHybrid(){
  var [leadsRaw, reunioesRaw, clientesRaw] = await Promise.all([
    fetchSheetVals(SHEETS_IDS.leads, SHEETS_GIDS.leads),
    fetchSheetVals(SHEETS_IDS.reunioes, SHEETS_GIDS.reunioes),
    fetchSheetVals(SHEETS_IDS.clientes, SHEETS_GIDS.clientes)
  ]);
  var sheetLeads=rawToObjs(leadsRaw).rows;
  var sheetReuni=rawToObjs(reunioesRaw).rows;

  // Leads do Firebase que não estão na planilha (match por telefone)
  var sheetTels=new Set(sheetLeads.map(function(l){
    return (col(l,['Telefone','TELEFONE','telefone'])||'').replace(/\D/g,'');
  }).filter(Boolean));
  var fbExtraLeads=kanbanToLeadsRows().filter(function(l){
    var t=(col(l,['Telefone','TELEFONE','telefone'])||'').replace(/\D/g,'');
    return t&&!sheetTels.has(t);
  });

  // Mapa tel+dia → status derivado do Firebase (followups são a fonte de verdade para status)
  // Isso resolve o problema de reuniões na planilha com status desatualizado
  var fbStatusByKey={};
  Object.values(meetings).forEach(function(m){
    if(m._hidden) return;
    var tel=(m.tel||'').replace(/\D/g,'');
    if(!tel) return;
    var bd=new Date(m.dtISO||(m.scheduledAt||Date.now()));
    var dk=tel+'_'+bd.getFullYear()+'-'+bd.getMonth()+'-'+bd.getDate();
    var fu=followups[m.id];
    var st;
    if(fu){
      if(fu.resultado==='noshow'||fu.comparecimento==='nao') st='NO-SHOW';
      else if(fu.resultado==='venda') st='VENDA';
      else st='REALIZADA';
    } else if(m.status==='noshow') st='NO-SHOW';
    else if(m.status==='done') st='REALIZADA';
    else if(m.status==='reagendado') st='REAGENDADO';
    // Só sobrescreve se Firebase tem um status definitivo (não AGENDADA)
    // Agendada = sem followup = não sabemos ainda, deixa a planilha falar
    if(st&&st!=='AGENDADA') fbStatusByKey[dk]=st;
  });

  // Enriquece reuniões da planilha com status do Firebase quando disponível
  sheetReuni=sheetReuni.map(function(r){
    var tel=(col(r,['Telefone','TELEFONE','telefone'])||'').replace(/\D/g,'');
    var d=parseBRDate(col(r,['DATA DE AGENDAMENTO','Data de Agendamento','DataAgendamento','Data Agendamento'])||'');
    if(!tel||!d) return r;
    var dk=tel+'_'+d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
    var fbSt=fbStatusByKey[dk];
    if(!fbSt) return r; // sem match no Firebase, usa planilha como está
    var enriched=Object.assign({},r);
    // Sobrescreve todas as variações do campo status com o valor do Firebase
    enriched['STATUS REUNIÃO']=fbSt;
    enriched['STATUS REUNIAO']=fbSt;
    enriched['Status Reuniao']=fbSt;
    enriched['STATUS']=fbSt;
    enriched['Status']=fbSt;
    return enriched;
  });

  // Chaves de deduplicação das reuniões já na planilha: telefone + dia (ex: "5511999_2026-6-3")
  // Isso evita contar duas vezes uma reunião que está no Firebase E na planilha
  var sheetReunKeys=new Set(sheetReuni.map(function(r){
    var tel=(col(r,['Telefone','TELEFONE','telefone'])||'').replace(/\D/g,'');
    var d=parseBRDate(col(r,['DATA DE AGENDAMENTO','Data de Agendamento','DataAgendamento','Data Agendamento'])||'');
    if(!tel||!d) return null;
    return tel+'_'+d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
  }).filter(Boolean));

  // Reuniões do Firebase: só inclui se não tem sheetRow E não é duplicata por tel+dia
  // _retorno:true = reunião de retorno, não conta como nova reunião para métricas SDR
  var fbExtraReuni=_meetingObjsToRows(
    Object.values(meetings).filter(function(m){
      if(m._hidden) return false;
      if(m._retorno) return false; // retorno não conta como nova reunião
      if(m.sheetRow) return false; // já tem linha na planilha
      // Deduplicação por telefone + dia: não inclui se já existe na planilha
      var tel=(m.tel||'').replace(/\D/g,'');
      if(tel){
        // Usa dtISO (data real da reunião) para deduplicação, igual à planilha
        var bd=new Date(m.dtISO||(m.scheduledAt||Date.now()));
        var dk=tel+'_'+bd.getFullYear()+'-'+bd.getMonth()+'-'+bd.getDate();
        if(sheetReunKeys.has(dk)) return false;
      }
      return true;
    })
  );

  // Telefones das reuniões que já estão na planilha (para diagnóstico de duplicatas)
  var sheetReunTels=new Set(sheetReuni.map(function(r){
    return (col(r,['Telefone','TELEFONE','telefone'])||'').replace(/\D/g,'');
  }).filter(Boolean));
  return {
    leads: {rows: sheetLeads.concat(fbExtraLeads)},
    reunioes: {rows: sheetReuni.concat(fbExtraReuni), sheetTels: sheetReunTels},
    clientes: rawToObjs(clientesRaw)
  };
}
async function createGcalEvent(meeting){
  if(!isGcalConnected()){
    var start=new Date(meeting.dtISO);
    var end=new Date(start.getTime()+3600000);
    function gcalFmt(d){return d.toISOString().replace(/[-:]/g,'').replace('.000','');}
    var guests=meeting.guestEmail?'&add='+encodeURIComponent(meeting.guestEmail):'';
    var url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Reuniao Audens - '+meeting.nome)+'&dates='+gcalFmt(start)+'/'+gcalFmt(end)+guests;
    window.open(url,'_blank');
    return{success:false,fallback:true};
  }
  var start=new Date(meeting.dtISO);
  var end=new Date(start.getTime()+3600000);
  var body={
    summary:'Reuniao Audens - '+meeting.nome,
    description:'Responsavel: '+meeting.responsavel+'\nLead: '+meeting.nome+'\nTel: '+meeting.tel,
    start:{dateTime:start.toISOString(),timeZone:'America/Sao_Paulo'},
    end:{dateTime:end.toISOString(),timeZone:'America/Sao_Paulo'},
    conferenceData:{createRequest:{requestId:'audens-'+meeting.id,conferenceSolutionKey:{type:'hangoutsMeet'}}},
    attendees:meeting.guestEmail?[{email:meeting.guestEmail}]:[]
  };
  try{
    var resp=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events?conferenceDataVersion=1',{
      method:'POST',headers:{'Authorization':'Bearer '+gcalToken.access_token,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(!resp.ok){var err=await resp.json();return{success:false,error:err};}
    var data=await resp.json();
    var meetLink=data.conferenceData&&data.conferenceData.entryPoints&&data.conferenceData.entryPoints.find(function(e){return e.entryPointType==='video';});
    return{success:true,eventId:data.id,meetLink:meetLink?meetLink.uri:'',htmlLink:data.htmlLink};
  }catch(e){return{success:false,error:e.message};}
}

// ===== HELPERS =====
// Retorna o status real de uma reunião cruzando com followups,
// corrigindo registros antigos onde meetings[id].status ficou como 'pending'
// mesmo após o resultado ter sido lançado.
function getMeetingStatus(m){
  var st = m.status || 'pending';
  if(st === 'pending' && followups[m.id]){
    var fu = followups[m.id];
    st = fu.resultado === 'noshow' ? 'noshow' : 'done';
  }
  return st;
}

// Normaliza dtDisplay: converte "YYYY-MM-DD HH:MM" para "DD/MM/YYYY HH:MM"
// Reuniões criadas pelo form manual tinham o valor raw do input de data (ISO)
function normalizeDtDisplay(s){
  if(!s) return s;
  // Detecta "YYYY-MM-DD HH:MM" (input de data bruto)
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}:\d{2})$/);
  if(m) return m[3]+'/'+m[2]+'/'+m[1]+' '+m[4];
  // Detecta "YYYY-MM-DD" sem hora
  var m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m2) return m2[3]+'/'+m2[2]+'/'+m2[1];
  return s;
}

/// Sync planilha Reuniões → Firebase: atualiza m.status para cada reunião com base
// no STATUS da planilha. Roda uma única vez por sessão.
// Usa sheetRow para matching preciso; fallback por phone/nome.
var _syncedReunioesFB = false;
var _syncRetryCount = 0;
async function syncReunioesFBFromSheet(){
  if(_syncedReunioesFB) return;
  // Aguarda meetings e Google auth estarem prontos
  if(!Object.keys(meetings).length || !isGcalConnected() || !SHEETS_IDS.reunioes){
    if(_syncRetryCount < 10){
      _syncRetryCount++;
      setTimeout(syncReunioesFBFromSheet, 3000);
    }
    return;
  }
  _syncedReunioesFB = true; // flag somente após confirmar pré-requisitos
  try{
    var raw = await fetchSheetVals(SHEETS_IDS.reunioes, SHEETS_GIDS.reunioes);
    if(!raw||raw.length<2){ console.warn('[CRM] Sync: planilha de reuniões vazia'); return; }
    var h = raw[0].map(function(x){return(x||'').trim().toUpperCase();});
    var iTel    = h.findIndex(function(x){return x.includes('TEL')||x.includes('FONE');});
    var iStatus = h.findIndex(function(x){return x.includes('STATUS');});
    var iNome   = h.findIndex(function(x){return x.includes('CLIENTE')||x==='NOME'||x.includes('NOME');});
    if(iStatus<0){ console.warn('[CRM] Sync: coluna STATUS não encontrada'); return; }

    // Índice por sheetRow (mais preciso) + fallback por tel e nome
    var rowMeetMap={}, telMeetMap={}, nomeMeetMap={};
    Object.values(meetings).forEach(function(m){
      if(m.sheetRow) rowMeetMap[m.sheetRow]=m;
      var tel=(m.tel||'').replace(/\D/g,'');
      ['slice(-9)','slice(-8)','toString()'].forEach(function(_){
        var k=tel.length>=9?tel.slice(-9):tel.length>=8?tel.slice(-8):tel;
        if(k) telMeetMap[k]=m;
      });
      var nome=(m.nome||'').trim().toLowerCase();
      if(nome) nomeMeetMap[nome]=m;
    });

    var updated=0, skipped=0;
    raw.slice(1).forEach(function(row, ri){
      var sheetRowNum = ri+2; // row 1=header, data starts at 2
      var stSheet=(row[iStatus]||'').toUpperCase().trim();
      if(!stSheet) return;

      // 1) Match por sheetRow (mais confiável)
      var m = rowMeetMap[sheetRowNum];
      // 2) Fallback: telefone (últimos 9 ou 8 dígitos)
      if(!m && iTel>=0){
        var tel=(row[iTel]||'').replace(/\D/g,'');
        m = telMeetMap[tel.slice(-9)] || telMeetMap[tel.slice(-8)] || null;
      }
      // 3) Fallback: nome
      if(!m && iNome>=0){
        var nome=(row[iNome]||'').trim().toLowerCase();
        m = nomeMeetMap[nome] || null;
      }
      if(!m){ skipped++; return; }

      var newSt = (stSheet==='NO-SHOW'||stSheet==='NO SHOW'||stSheet==='NOSHOW') ? 'noshow'
               : (stSheet==='AGENDADA'||stSheet==='PENDENTE') ? 'pending'
               : (stSheet==='REAGENDADO') ? 'reagendado'
               : 'done';
      if(m.status !== newSt){
        meetings[m.id].status = newSt;
        saveMeetingFB(m.id, meetings[m.id]);
        updated++;
      }
    });
    console.log('[CRM] Sync planilha→Firebase concluído: '+updated+' atualizados, '+skipped+' sem match.');
  }catch(e){ console.error('[CRM] syncReunioesFBFromSheet error', e); _syncedReunioesFB=false; }
}

// Migração em background: corrige no Firebase meetings com status 'pending'
// que já têm followup registrado (bug pré-fix de 15/06/2026).
// Roda uma única vez após os dados do Firebase carregarem.
var _migratedStatuses = false;
function migrateStaleStatuses(){
  if(_migratedStatuses) return;
  _migratedStatuses = true;
  var fixed = 0;
  Object.values(meetings).forEach(function(m){
    if((m.status==='pending'||!m.status) && followups[m.id]){
      var fu = followups[m.id];
      var newSt = fu.resultado==='noshow' ? 'noshow' : 'done';
      meetings[m.id].status = newSt;
      saveMeetingFB(m.id, meetings[m.id]);
      fixed++;
    }
  });
  if(fixed > 0) console.log('[CRM] Corrigidos '+fixed+' status de reuniões no Firebase.');
}

function getPendingFollowups(){
  return Object.values(meetings).filter(function(m){
    var _st=getMeetingStatus(m);
    return _st!=='done'&&_st!=='noshow'&&_st!=='reagendado'&&!followups[m.id]&&
      Date.now()>new Date(m.dtISO).getTime()+MEETING_DURATION_MS&&
      m.responsavel===CU.closer;
  });
}
function calcStats(df){
  var rows=Object.values(calls);if(df)rows=rows.filter(function(r){return r.data===df;});
  var t=rows.length,at=rows.filter(function(r){return r.at==='sim';}).length;
  var re=Object.values(meetings).filter(function(m){return !m._retorno&&(df?calls[m.tel]&&calls[m.tel].data===df:true);}).length;
  var ve=Object.values(followups).filter(function(f){return f.venda==='sim';}).length;
  return{total:t,atendidas:at,reunioes:re,vendas:ve,
    pAt:t?Math.round(at/t*100):0,pRe:at?Math.round(re/at*100):0,pVe:re?Math.round(ve/re*100):0};
}
function calcRevenue(){return Object.values(followups).filter(function(f){return f.venda==='sim';}).reduce(function(s,f){return s+(parseFloat(f.mensalidade)||0);},0);}
function getCallsThisMonth(){
  var mo=new Date(),moStr=String(mo.getMonth()+1).padStart(2,'0')+'/'+mo.getFullYear();
  return Object.values(calls).filter(function(c){if(!c.data)return false;var p=c.data.split('/');return p[1]+'/'+p[2]===moStr;}).length;
}
function getWorkdaysPassed(){
  var now=new Date(),y=now.getFullYear(),mo=now.getMonth(),today=now.getDate(),hols=allHolidays(y),count=0;
  for(var d=1;d<=today;d++){var dobj=new Date(y,mo,d),dow=dobj.getDay();if(dow===0||dow===6)continue;
    var mm=String(mo+1).padStart(2,'0'),dd=String(d).padStart(2,'0');if(hols[mm+'-'+dd])continue;count++;}
  return count;
}
function getWorkdaysInMonth(){
  var now=new Date(),y=now.getFullYear(),mo=now.getMonth(),hols=allHolidays(y),count=0,total=new Date(y,mo+1,0).getDate();
  for(var d=1;d<=total;d++){var dobj=new Date(y,mo,d),dow=dobj.getDay();if(dow===0||dow===6)continue;
    var mm=String(mo+1).padStart(2,'0'),dd=String(d).padStart(2,'0');if(hols[mm+'-'+dd])continue;count++;}
  return count;
}

function calcBonusForCloser(closerName){
  var comps=Object.values(followups).filter(function(f){var m=meetings[f.meetingId];return m&&m.responsavel===closerName&&f.comparecimento==='sim';}).length;
  var vendas=Object.values(followups).filter(function(f){var m=meetings[f.meetingId];return m&&m.responsavel===closerName&&f.venda==='sim';});
  var bonusV=vendas.reduce(function(s,f){return s+(parseFloat(f.mensalidade)||0)*BONUS_VENDA_PCT;},0);
  return{comparecimentos:comps,vendas:vendas.length,bonusComp:comps*BONUS_COMP,bonusVendas:bonusV,total:comps*BONUS_COMP+bonusV,detalhe:vendas};
}
function getDailyKey(){
  var user = CU ? CU.name.toLowerCase().replace(/\s+/g,'_') : 'default';
  return todayStr()+'_'+user;
}
function getDailyLeads(){
  var key=getDailyKey();
  if(_dailyMap[key])return _dailyMap[key];
  // Fallback: chave antiga sem usuário (migração)
  var oldKey=todayStr();
  if(_dailyMap[oldKey]){
    _dailyMap[key]=_dailyMap[oldKey];
    delete _dailyMap[oldKey];
    saveAll();
    return _dailyMap[key];
  }
  // Fallback 2: reconstruir do histórico de calls de hoje
  // Se o usuário já fez ligações hoje, reconstruir a lista a partir do calls
  var hoje=todayStr();
  var callsHoje=Object.values(calls).filter(function(c){return c.data===hoje;});
  if(callsHoje.length>0){
    // Montar lista com os leads que já foram ligados hoje + completar com novos se necessário
    var telsHoje=callsHoje.map(function(c){return c.tel;});
    var leadsHoje=telsHoje.map(function(tel){
      return allLeads.find(function(l){return l.telefone===tel;})||{telefone:tel,nome:calls[tel]?calls[tel].nome:'',data:hoje};
    }).filter(Boolean);
    // Completar até 50 se ainda não chegou
    if(leadsHoje.length<50){
      var usedSet=new Set(telsHoje.concat(Object.keys(calls)));
      var extra=allLeads.filter(function(l){return !usedSet.has(l.telefone);}).sort(function(){return Math.random()-.5;}).slice(0,50-leadsHoje.length);
      leadsHoje=leadsHoje.concat(extra);
    }
    _dailyMap[key]=leadsHoje;saveAll();return leadsHoje;
  }
  if(!checkDay(new Date()).ok)return null;
  var used=new Set(Object.keys(calls));
  var returns=allLeads.filter(function(l){return l._requeue&&!used.has(l.telefone);});
  var fresh=allLeads.filter(function(l){return !l._requeue&&!used.has(l.telefone);}).sort(function(){return Math.random()-.5;});
  var batch=fresh.slice(0,50-returns.length).concat(returns).slice(0,50);
  if(!batch.length)return[];
  _dailyMap[key]=batch;saveAll();return batch;
}

var _leadsLoading=false;
function reloadLeads(){
  loadLeadsFB().then(function(ok){
    if(ok){showPage('ligar');}
    else{loadLeadsFromSheets().then(function(){showPage('ligar');});}
  });

async function loadLeadsFromSheets(){
  if(_leadsLoading)return;
  if(!isGcalConnected())return;
  _leadsLoading=true;
  try{
    var raw=await fetchSheetVals(SHEETS_IDS.leads, SHEETS_GIDS.leads);
    if(!raw||raw.length<2){_leadsLoading=false;return;}
    var headers=raw[0].map(function(h){return(h||'').trim();});
    // Find column indices - leads sheet: Data|Nome|Faturamento|Telefone|Fonte|Campanha|Posicionamento|Conjunto|Ad
    function fi(opts){
      for(var i=0;i<opts.length;i++){
        var idx=headers.findIndex(function(h){return h.toLowerCase().includes(opts[i].toLowerCase());});
        if(idx>=0)return idx;
      }
      return -1;
    }
    var iNome=fi(['nome','name','cliente','lead']);
    var iTel=fi(['telefone','tel','phone','celular','whatsapp','fone']);
    var iFat=fi(['faturamento','fat','receita']);
    var iFonte=fi(['fonte','source','origem']);
    var iData=fi(['data','date']);
    if(iNome<0||iTel<0){_leadsLoading=false;return;}
    var loaded=[];
    var seen=new Set();
    raw.slice(1).forEach(function(row){
      var nome=(row[iNome]||'').trim();
      var tel=(row[iTel]||'').replace(/\D/g,'');
      if(!nome||!tel||seen.has(tel))return;
      seen.add(tel);
      loaded.push({
        nome:nome,
        telefone:tel,
        cidade:'',
        faturamento:iFat>=0?(row[iFat]||''):'',
        _source:iFonte>=0?(row[iFonte]||''):'Sheets',
        _data:iData>=0?(row[iData]||''):''
      });
    });
    if(loaded.length>0){
      // Merge with existing — don't duplicate
      var existingTels=new Set(allLeads.map(function(l){return(l.telefone||'').replace(/\D/g,'');}));
      var newOnes=loaded.filter(function(l){return !existingTels.has(l.telefone);});
      allLeads=allLeads.concat(newOnes);
      _dailyMap={};// reset daily so new leads can be picked
      saveAll();
    }
  }catch(e){console.error('loadLeadsFromSheets error',e);}
  _leadsLoading=false;
}

function parseCSVText(text,filename){
  var lines=text.split('\n').filter(function(l){return l.trim();});
  if(lines.length<2)return{leads:[],error:'Arquivo vazio: '+filename};
  var rawH=lines[0].split(',').map(function(h){return h.trim().toLowerCase().replace(/['"]/g,'').replace(/\s+/g,'_');});
  function fc(arr,opts){return opts.find(function(o){return arr.includes(o);})||null;}
  var nc=fc(rawH,['nome','name','cliente','lead','contato']);
  var tc=fc(rawH,['telefone','tel','phone','celular','whatsapp','fone']);
  var cc=fc(rawH,['cidade','city','municipio']);
  var fac=fc(rawH,['faturamento','receita','revenue','fat','renda']);
  if(!nc||!tc)return{leads:[],error:'Sem colunas nome/telefone: '+filename};
  var parsed=lines.slice(1).map(function(line){
    var cols=line.split(',').map(function(c){return c.trim().replace(/^["']|["']$/g,'');});
    var o={};rawH.forEach(function(h,i){o[h]=cols[i]||'';});
    return{nome:o[nc]||'',telefone:o[tc]||'',cidade:cc?o[cc]||'':'',faturamento:fac?o[fac]||'':'',_source:filename.replace('.csv','').slice(0,20)};
  }).filter(function(r){return r.nome&&r.telefone;});
  return{leads:parsed,error:null};
}
function handleCSV(e){
  var files=Array.from(e.target.files);if(!files.length)return;
  var log=document.getElementById('import-log');
  log.innerHTML='<div style="margin-top:12px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;color:var(--muted);">Processando '+files.length+' arquivo(s)...</div>';
  var pending=files.length,allParsed=[];
  files.forEach(function(file){
    var r=new FileReader();
    r.onload=function(ev){
      var result=parseCSVText(ev.target.result,file.name);
      allParsed.push({filename:file.name,leads:result.leads,error:result.error});
      pending--;if(pending===0)mergeAndSave(allParsed,log);
    };
    r.readAsText(file,'UTF-8');
  });
  e.target.value='';
}
function mergeAndSave(allParsed,log){
  var seen=new Set(allLeads.map(function(l){return(l.telefone||'').replace(/\D/g,'');}));
  var totalNew=0,totalDups=0,logRows='';
  allParsed.forEach(function(p){
    if(p.error){logRows+='<div style="color:var(--red);">X '+p.error+'</div>';return;}
    var fileNew=0,fileDups=0;
    p.leads.forEach(function(lead){
      var norm=(lead.telefone||'').replace(/\D/g,'');
      if(!norm||seen.has(norm)){fileDups++;totalDups++;return;}
      seen.add(norm);allLeads.push(lead);fileNew++;totalNew++;
    });
    logRows+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">'+
      '<i class="ti ti-file-check" style="color:var(--green);"></i>'+
      '<span style="color:var(--white);font-weight:600;">'+p.filename+'</span>'+
      '<span class="badge b-green">+'+fileNew+'</span>'+(fileDups?'<span class="badge b-muted">'+fileDups+' dupl.</span>':'')+
    '</div>';
  });
  _dailyMap={};saveAll();
  log.innerHTML='<div style="margin-top:14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;">'+
    logRows+'<div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;">'+
    '<span style="color:var(--green);">+'+totalNew+' adicionados</span> · '+
    '<span style="color:var(--muted);">'+totalDups+' dupl.</span> · '+
    '<span style="color:var(--purple3);">Total: '+allLeads.length+'</span></div></div>';
  // Auto-sync para Firebase: todos os outros usuários (ex: Gustavo) recebem a base atualizada
  if(totalNew > 0){ syncLeadsToFB(); }
  setTimeout(function(){showPage('leads');},1800);
}

async function confirmarAssinatura(id){
  var nome=document.getElementById('sign-nome').value.trim();

  if(btn){btn.disabled=true;btn.textContent='Assinando...';}
  var ip='';
  try{
    var r=await fetch('https://api.ipify.org?format=json');
    var j=await r.json();
    ip=j.ip||'';
  }catch(e){}
  var signData={status:'assinado',signerName:nome,signerCpf:cpf,signedAt:Date.now(),ip:ip,userAgent:navigator.userAgent};
  try{
    await fbSet('assinaturas/'+id,Object.assign({},window._signData,signData));

  renderSignedView(id,window._signData);
}

async function asaasSync(btn){
  if(!asaasApiKey){alert('Configure a API Key do Asaas primeiro nas Configurações.');return;}
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i> Sincronizando...';}
  try{
    var period=_finPeriod||getCurrentPeriod();
    var r=await fetch(RECEBERLEAD_URL+'/asaas-sync?secret='+WEBHOOK_SECRET,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({apiKey:asaasApiKey,env:asaasEnv,period:period})
    });
    var data=await r.json();
    if(data.ok){
      showSheetToast('✅ '+data.total+' pagamento(s) importados do Asaas!');
      loadFinanceiroData();
    }else{
      showSheetToast('❌ Erro ao sincronizar: '+(data.error||'erro desconhecido'),true);
    }
  }catch(e){
    console.error('asaasSync error',e);
    showSheetToast('❌ Erro ao conectar com o servidor',true);
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-refresh"></i> Sync Asaas';}
  }
}
// ---- Realtime listeners for Financeiro (WhatsApp bot updates) ----
var _finRealtimeRefs=[];
var _finReloadTimer=null;
function startFinanceiroListeners(){
  loadFinanceiroData();
  // Attach realtime listeners so WhatsApp-processed comprovantes appear instantly
  if(_finRealtimeRefs.length) return; // already attached
  // Debounced reload — prevents 50+ simultaneous calls during extrato import
  var reload=function(){
    if(!(document.getElementById('content')&&document.getElementById('content').getAttribute('data-page')==='financeiro')) return;
    if(_finReloadTimer) clearTimeout(_finReloadTimer);
    _finReloadTimer=setTimeout(function(){ _finReloadTimer=null; loadFinanceiroData(); },800);
  };
  var refSaidas=fbDb.ref('financeiro/saidas');
  var refEntradas=fbDb.ref('financeiro/entradas_manuais');
  var refRecebimentos=fbDb.ref('financeiro/recebimentos');
  var refBot=fbDb.ref('financeiro/bot_state');
  refSaidas.on('child_added',reload);
  refSaidas.on('child_changed',reload);
  refSaidas.on('child_removed',reload);
  refEntradas.on('child_added',reload);
  refEntradas.on('child_removed',reload);
  refRecebimentos.on('child_added',reload);
  refRecebimentos.on('child_changed',reload);
  // bot_state listener: show toast when a new pending entry arrives from WhatsApp
  refBot.on('value',function(snap){
    var val=snap.val();
    if(val&&val.pendingKey){
      showSheetToast('📱 Comprovante recebido via WhatsApp! Confirme no chat.');
    }
  });
  _finRealtimeRefs=[
    {ref:refSaidas,events:['child_added','child_changed','child_removed'],cb:reload},
    {ref:refEntradas,events:['child_added','child_removed'],cb:reload},
    {ref:refRecebimentos,events:['child_added','child_changed'],cb:reload}
  ];
}
function stopFinanceiroListeners(){
  _finRealtimeRefs.forEach(function(r){
    r.events.forEach(function(ev){r.ref.off(ev,r.cb);});
  });
  fbDb.ref('financeiro/bot_state').off('value');
  _finRealtimeRefs=[];
}
// ---- Dashboard Comercial realtime listeners ----
var _dashRealtimeRefs=[];
var _dashReloadTimer=null;
var _dashRefreshInterval=null;
var _dashFocusReload=null;
function startDashComListeners(){
  if(_dashRealtimeRefs.length) return;
  var reload=function(){
    var pg=document.getElementById('content');
    if(!(pg&&pg.getAttribute('data-page')==='dashcom')) return;
    if(_dashReloadTimer) clearTimeout(_dashReloadTimer);
    _dashReloadTimer=setTimeout(function(){ _dashReloadTimer=null; refreshDashCom(); },1500);
  };
  // Firebase listeners (kanban, meetings, followups)
  var refs=[
    {ref:fbDb.ref('kanban'),events:['child_added','child_changed','child_removed']},
    {ref:fbDb.ref('meetings'),events:['child_added','child_changed','child_removed']},
    {ref:fbDb.ref('followups'),events:['child_added','child_changed']}
  ];
  refs.forEach(function(r){ r.events.forEach(function(ev){ r.ref.on(ev,reload); }); });
  _dashRealtimeRefs=refs;
  // Refresh ao focar janela (pega mudanças na planilha Google Sheets)
  _dashFocusReload=function(){ reload(); };
  window.addEventListener('focus',_dashFocusReload);
  // Refresh automático a cada 3 minutos
  _dashRefreshInterval=setInterval(function(){
    var pg=document.getElementById('content');
    if(pg&&pg.getAttribute('data-page')==='dashcom') refreshDashCom();
  },3*60*1000);
}
function stopDashComListeners(){
  _dashRealtimeRefs.forEach(function(r){
    r.events.forEach(function(ev){ r.ref.off(ev); });
  });
  _dashRealtimeRefs=[];
  if(_dashReloadTimer){ clearTimeout(_dashReloadTimer); _dashReloadTimer=null; }
  if(_dashFocusReload){ window.removeEventListener('focus',_dashFocusReload); _dashFocusReload=null; }
  if(_dashRefreshInterval){ clearInterval(_dashRefreshInterval); _dashRefreshInterval=null; }
}

async function loadFinanceiroData(){
  if(!_finPeriod) _finPeriod=getCurrentPeriod();
  var period=_finPeriod;
  var pp=period.split('/');
  var month=parseInt(pp[0]);
  var year=parseInt(pp[1]);
  var firstISO=year+'-'+String(month).padStart(2,'0')+'-01';
  var lastDayNum=new Date(year,month,0).getDate();
  var lastISO=year+'-'+String(month).padStart(2,'0')+'-'+String(lastDayNum).padStart(2,'0');
  var firstDate=new Date(firstISO+'T00:00:00');
  var lastDate=new Date(lastISO+'T23:59:59');
  // Busca tudo do Firebase (inclui recebimentos Asaas já sincronizados)
  var [clientesRaw,saidasRaw,entradasRaw,recebimentosRaw]=await Promise.all([
    fbGet('clientes'),
    fbGet('financeiro/saidas'),
    fbGet('financeiro/entradas_manuais'),
    fbGet('financeiro/recebimentos')
  ]);
  // Pagamentos Asaas do mês filtrados do Firebase
  var confStatuses=['CONFIRMED','RECEIVED','RECEIVED_IN_CASH'];
  var asaasPagamentos=Object.values(recebimentosRaw||{}).filter(function(p){
    var d=p.paymentDate||p.dueDate||'';
    return d>=firstISO&&d<=lastISO&&confStatuses.includes(p.status);
  });
  var clientes=Object.values(clientesRaw||{});
  var todasSaidas=Object.entries(saidasRaw||{}).map(function(e){return Object.assign({_id:e[0]},e[1]);});
  var todasEntradas=Object.entries(entradasRaw||{}).map(function(e){return Object.assign({_id:e[0]},e[1]);});
  // Contratos ativos no mês selecionado
  // Usa dataInicio se preenchido; senão usa createdAt como data de início
  function finInicioDate(c){
    if(c.dataInicio){return new Date(c.dataInicio+'T00:00:00');}
    if(c.createdAt){var d=new Date(c.createdAt);return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
    return null;
  }
  var ativos=clientes.filter(function(c){
    var inicio=finInicioDate(c);
    if(!inicio) return false;
    var meses=c.duracaoMeses||12;
    var fim=new Date(inicio.getFullYear(),inicio.getMonth()+meses,inicio.getDate());
    return inicio<=lastDate && fim>firstDate;
  });
  var mrr=ativos.reduce(function(s,c){
    var meses=c.duracaoMeses||12;
    var v=c.tipoValor==='tcv'
      ? (c.valorContrato/(meses||1))
      : (c.valorMensalidade||0);
    return s+v;
  },0);
  // Saídas confirmadas do mês
  var saidasMes=todasSaidas.filter(function(s){return s.data>=firstISO&&s.data<=lastISO&&s.status==='confirmado';});
  var totalDespesas=saidasMes.reduce(function(s,e){return s+(parseFloat(e.valor)||0);},0);
  // Saídas pendentes do mês (para destaque)
  var saidasPend=todasSaidas.filter(function(s){return s.data>=firstISO&&s.data<=lastISO&&s.status==='pendente';});
  // Entradas manuais do mês
  var entradasMes=todasEntradas.filter(function(e){return e.data>=firstISO&&e.data<=lastISO;});
  var totalEntradas=entradasMes.reduce(function(s,e){return s+(parseFloat(e.valor)||0);},0);
  // Caixa total acumulado (all-time)
  var totalEntradasAllTime=todasEntradas.reduce(function(s,e){return s+(parseFloat(e.valor)||0);},0);
  var totalSaidasAllTime=todasSaidas.filter(function(s){return s.status==='confirmado';}).reduce(function(s,e){return s+(parseFloat(e.valor)||0);},0);
  var caixaTotal=totalEntradasAllTime-totalSaidasAllTime;
  var totalAsaas=asaasPagamentos.reduce(function(s,p){return s+(parseFloat(p.value)||0);},0);
  // Receita = apenas Asaas recebido + entradas manuais (MRR/contratos excluídos do caixa)
  var totalReceita=totalAsaas+totalEntradas;
  var lucro=totalReceita-totalDespesas;
  // Atualiza KPIs
  var kpis=document.getElementById('fin-kpis');
  if(kpis){
    kpis.innerHTML=
      finKpiCard('Receita do Mês','R$ '+fmtMoeda(totalReceita),'var(--green)',(totalAsaas?'Asaas R$ '+fmtMoeda(totalAsaas):'')+(totalEntradas?(totalAsaas?' · ':'')+'Manual R$ '+fmtMoeda(totalEntradas):'')+((!totalAsaas&&!totalEntradas)?'Nenhum recebimento registrado':''),'ti-trending-up')+
      finKpiCard('Recebido Asaas','R$ '+fmtMoeda(totalAsaas),asaasApiKey?'var(--cyan)':'var(--muted)',asaasPagamentos.length+' pagamento(s) confirmado(s)','ti-cash')+
      finKpiCard('Despesas','R$ '+fmtMoeda(totalDespesas),'var(--red)',saidasMes.length+' confirmada(s)'+(saidasPend.length?' · '+saidasPend.length+' pendente(s)':''),'ti-trending-down')+
      finKpiCard('Lucro Estimado','R$ '+fmtMoeda(lucro),lucro>=0?'var(--purple3)':'var(--red)','Receita R$ '+fmtMoeda(totalReceita)+' − Despesas R$ '+fmtMoeda(totalDespesas),'ti-report-money');
  }
  // Despesas por categoria
  var catTotals={};
  saidasMes.forEach(function(s){
    var cat=s.categoria||'Outros';
    catTotals[cat]=(catTotals[cat]||0)+(parseFloat(s.valor)||0);
  });
  var catHTML='';
  if(Object.keys(catTotals).length){
    catHTML='<div class="cb" style="margin-bottom:16px;">'+
      '<div class="cb-hd"><div class="cb-title"><i class="ti ti-chart-pie" style="color:var(--red);margin-right:6px;"></i>Despesas por Categoria — '+finMesLabelCurto(period)+'</div></div>'+
      '<div style="padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;">'+
      Object.entries(catTotals).sort(function(a,b){return b[1]-a[1];}).map(function(e){
        var pct=totalDespesas?Math.round(e[1]/totalDespesas*100):0;
        return '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;">'+
          '<div style="font-family:Barlow Condensed,sans-serif;font-size:11px;color:var(--muted);margin-bottom:4px;">'+esc(e[0])+'</div>'+
          '<div style="font-size:20px;font-family:Barlow Condensed,sans-serif;font-weight:700;color:var(--red);">R$ '+fmtMoeda(e[1])+'</div>'+
          '<div style="margin-top:6px;background:rgba(255,255,255,0.07);border-radius:4px;height:4px;overflow:hidden;">'+
            '<div style="height:100%;background:var(--red);width:'+pct+'%;border-radius:4px;transition:width .4s;"></div>'+
          '</div>'+
          '<div style="font-size:10px;color:var(--muted);font-family:Barlow Condensed,sans-serif;margin-top:3px;">'+pct+'% do total</div>'+
        '</div>';
      }).join('')+
      '</div>'+
    '</div>';
  }
  // Monta tabela de lançamentos (MRR/contratos excluídos — apenas Asaas e manuais)
  var allTx=[];
  entradasMes.forEach(function(e){
    allTx.push({data:e.data,tipo:'entrada',valor:parseFloat(e.valor)||0,descricao:e.descricao||'Entrada manual',cat:e.categoria||'Manual',status:'confirmado',_id:e._id,_src:'entrada'});
  });
  asaasPagamentos.forEach(function(p){
    var dt=p.paymentDate||p.dueDate||firstISO;
    var nomeCli=p.customerName||_asaasCustomerMap[p.customerId||p.customer]||'';
    var desc=nomeCli?(nomeCli+(p.description?' — '+p.description:'')):( p.description||'Pagamento Asaas');
    allTx.push({data:dt,tipo:'entrada',valor:parseFloat(p.value)||0,descricao:desc,cat:'Asaas',status:'asaas',_src:'asaas'});
  });
  saidasMes.forEach(function(s){
    allTx.push({data:s.data,tipo:'saida',valor:parseFloat(s.valor)||0,descricao:s.descricao||'Despesa',cat:s.categoria||'Outros',status:'confirmado',_id:s._id,_src:'saida'});
  });
  saidasPend.forEach(function(s){
    allTx.push({data:s.data,tipo:'saida',valor:parseFloat(s.valor)||0,descricao:s.descricao||'Despesa',cat:s.categoria||'Outros',status:'pendente',_id:s._id,_src:'saida'});
  });
  allTx.sort(function(a,b){return (b.data||'').localeCompare(a.data||'');});
  // Collect IDs of saída rows for bulk-delete
  var saidaIds=[];
  var txRows=allTx.map(function(t,idx){
    var valorHtml=t.tipo==='entrada'
      ?'<span style="color:var(--green);font-weight:700;font-family:Barlow Condensed,sans-serif;">+ R$ '+fmtMoeda(t.valor)+'</span>'
      :'<span style="color:var(--red);font-weight:700;font-family:Barlow Condensed,sans-serif;">− R$ '+fmtMoeda(t.valor)+'</span>';
    var badge=t.status==='mrr'
      ?'<span class="badge" style="background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.3);">Recorrente</span>'
      :t.status==='asaas'
        ?'<span class="badge" style="background:rgba(6,182,212,0.15);color:var(--cyan);border:1px solid rgba(6,182,212,0.3);">Asaas</span>'
        :t.status==='confirmado'
          ?'<span class="badge b-green">Confirmado</span>'
          :'<span class="badge b-amber">Pendente</span>';
    var actions='';
    var chk='<td></td>';
    if(t._src==='saida'&&t._id){
      saidaIds.push(t._id);
      chk='<td><input type="checkbox" class="fin-chk" data-id="'+t._id+'" onchange="finUpdateBulkBar()" style="width:15px;height:15px;accent-color:var(--purple);cursor:pointer;"></td>';
      if(t.status==='pendente') actions='<button class="btn btn-outline" style="padding:3px 8px;font-size:11px;margin-right:4px;" onclick="finConfirmarSaida(\''+t._id+'\',this)" title="Confirmar"><i class="ti ti-check"></i></button>';
      actions+='<button class="btn btn-outline" style="padding:3px 8px;font-size:11px;margin-right:4px;" onclick="finEditarLancamento(\'saidas\',\''+t._id+'\')" title="Editar"><i class="ti ti-pencil"></i></button>';
      actions+='<button class="btn btn-outline" style="padding:3px 8px;font-size:11px;color:var(--red);border-color:rgba(239,68,68,0.3);" onclick="finDeletarLancamento(\'saidas\',\''+t._id+'\')" title="Excluir"><i class="ti ti-trash"></i></button>';
    }
    if(t._src==='entrada'&&t._id){
      actions='<button class="btn btn-outline" style="padding:3px 8px;font-size:11px;margin-right:4px;" onclick="finEditarLancamento(\'entradas_manuais\',\''+t._id+'\')" title="Editar"><i class="ti ti-pencil"></i></button>';
      actions+='<button class="btn btn-outline" style="padding:3px 8px;font-size:11px;color:var(--red);border-color:rgba(239,68,68,0.3);" onclick="finDeletarLancamento(\'entradas_manuais\',\''+t._id+'\')" title="Excluir"><i class="ti ti-trash"></i></button>';
    }
    var dataFmt=t.data?t.data.split('-').reverse().join('/'):'';
    return '<tr>'+
      chk+
      '<td style="color:var(--muted);font-size:12px;">'+dataFmt+'</td>'+
      '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+esc(t.descricao)+'">'+esc(t.descricao)+'</td>'+
      '<td><span style="font-size:11px;color:var(--muted);">'+esc(t.cat)+'</span></td>'+
      '<td>'+valorHtml+'</td>'+
      '<td>'+badge+'</td>'+
      '<td style="text-align:right;">'+actions+'</td>'+
    '</tr>';
  }).join('');
  var hasSaidas=saidaIds.length>0;
  var bulkBar=hasSaidas
    ?'<div id="fin-bulk-bar" style="display:none;align-items:center;gap:10px;padding:8px 16px;background:rgba(123,47,255,0.08);border-top:1px solid var(--border);">'+

        '<button class="btn btn-outline" style="padding:4px 12px;font-size:12px;color:var(--muted);" onclick="finDeselecionarTodos()"><i class="ti ti-x"></i> Cancelar</button>'+
      '</div>'
    :'';
  var selectAllChk=hasSaidas
    ?'<th><input type="checkbox" id="fin-chk-all" title="Selecionar todas as saídas" onchange="finSelecionarTodos(this.checked)" style="width:15px;height:15px;accent-color:var(--purple);cursor:pointer;"></th>'
    :'<th></th>';
  var txTable='<div class="cb">'+
    '<div class="cb-hd"><div class="cb-title"><i class="ti ti-list" style="color:var(--cyan);margin-right:6px;"></i>Lançamentos de '+finMesLabel(period)+'</div></div>'+
    (allTx.length
      ?'<div class="t-scroll"><table><thead><tr>'+selectAllChk+'<th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>'+txRows+'</tbody></table></div>'+bulkBar
      :'<div style="padding:48px;text-align:center;color:var(--muted);">'+
          '<i class="ti ti-inbox" style="font-size:32px;display:block;margin-bottom:8px;"></i>'+
          'Nenhum lançamento em '+finMesLabel(period)+'.'+
          '<br><small style="font-size:11px;">Use os botões "Despesa" ou "Entrada Manual" para lançar.</small>'+
        '</div>')+
  '</div>';
  var body=document.getElementById('fin-body');
  if(body) body.innerHTML=catHTML+txTable;
}

function lancAtualizaTaxa(){
  var valor=parseFloat(document.getElementById('lanc-valor')&&document.getElementById('lanc-valor').value)||0;
  var pct=parseFloat(document.getElementById('lanc-taxa-pct')&&document.getElementById('lanc-taxa-pct').value)||0;
  var prev=document.getElementById('lanc-taxa-preview');
  if(!prev) return;
  if(pct>0&&valor>0){
    var taxa=Math.round(valor*pct)/100;
    prev.textContent='− R$ '+fmtMoeda(taxa)+' de taxa';
  } else {
    prev.textContent='';
  }
}
async function finSalvarLancamento(){
  var tipo=document.getElementById('lanc-tipo').value;
  var valor=parseFloat(document.getElementById('lanc-valor').value)||0;
  var data=document.getElementById('lanc-data').value;
  var descricao=(document.getElementById('lanc-descricao').value||'').trim();
  var categoriaEl=document.getElementById('lanc-categoria');
  var categoria=categoriaEl?categoriaEl.value:'Manual';
  var taxaPctEl=document.getElementById('lanc-taxa-pct');
  var taxaPct=taxaPctEl?parseFloat(taxaPctEl.value)||0:0;
  if(!valor||valor<=0){alert('Informe um valor válido.');return;}
  if(!data){alert('Informe a data.');return;}
  var btn=document.getElementById('btn-salvar-lanc');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  var path=tipo==='saida'?'financeiro/saidas':'financeiro/entradas_manuais';
  var obj={data:data,valor:valor,descricao:descricao||'Entrada manual',categoria:categoria,criadoPor:(CU&&CU.name)||'gestor',createdAt:Date.now()};
  if(tipo==='saida') obj.status='confirmado';
  await fbPush(path,obj);
  // Se entrada com taxa, cria saída automática em Taxas Bancárias
  if(tipo==='entrada'&&taxaPct>0){
    var taxaValor=Math.round(valor*taxaPct)/100;
    if(taxaValor>0){
      await fbPush('financeiro/saidas',{
        data:data,
        valor:taxaValor,
        descricao:'Taxa '+(descricao||'entrada')+'  ('+taxaPct+'%)',
        categoria:'Taxas Bancárias',
        status:'confirmado',
        criadoPor:(CU&&CU.name)||'gestor',
        createdAt:Date.now(),
        _autoTaxa:true
      });
    }
  }
  closeModal('modal-lancamento');
  var msg=tipo==='saida'?'Despesa lançada!':'Entrada lançada!'+(taxaPct>0?' + taxa criada como saída.':'');
  showSheetToast(msg);
  loadFinanceiroData();
}

function extratoFileLoad(input){
  var f=input.files[0];
  if(!f) return;
  var reader=new FileReader();
  reader.onload=function(e){ var ta=document.getElementById('extrato-csv'); if(ta) ta.value=e.target.result; };
  reader.readAsText(f,'UTF-8');
}

function autoGuessExtratoCategoria(desc, valor){
  var cat=valor<0?'Outros':'Receita Cliente';
  var dl=(desc||'').toLowerCase();
  // Marketing
  if(dl.includes('facebook')||dl.includes('facebk')||dl.includes('facebk*')||dl.includes('meta ')||dl.includes('meta*')) cat='Marketing';
  if(dl.includes('google ads')||dl.includes('dl *google')||dl.includes('google ads')) cat='Marketing';
  // Infraestrutura / SaaS
  if(dl.includes('anthropic')||dl.includes('claude sub')||dl.includes('openai')||dl.includes('chatgpt')) cat='Infraestrutura';
  if(dl.includes('z-api')||dl.includes('sellflux')||dl.includes('clicksign')||dl.includes('criativivo')) cat='Infraestrutura';
  if(dl.includes('aws')||dl.includes('digitalocean')||dl.includes('servidor')||dl.includes('google cloud')) cat='Infraestrutura';
  if(dl.includes('cemig')||dl.includes('sabesp')||dl.includes('copasa')||dl.includes('light ')) cat='Infraestrutura';
  // Transporte
  if(dl.includes('uber')||dl.includes('uber do brasil')||dl.includes('99 tecnologia')||dl.includes('99tec')||dl.includes('cabify')||dl.includes('taxi')) cat='Transporte';
  // Alimentação
  if(dl.includes('padaria')||dl.includes('lanchonete')||dl.includes('panificadora')||dl.includes('ponto certo')) cat='Padaria';
  if(dl.includes('supermercado')||dl.includes('bh comercio')||dl.includes('mercado')||dl.includes('atacado')||dl.includes('mart ')||dl.includes('carrefour')||dl.includes('atacadao')) cat='Supermercado';
  // Outros
  if(dl.includes('limpeza')||dl.includes('faxina')) cat='Limpeza';
  if(dl.includes('aluguel')||dl.includes('locação')||dl.includes('locacao')||dl.includes('imobiliaria')) cat='Aluguel';
  if(dl.includes('salário')||dl.includes('salario')) cat=valor<0?'Equipe':'Receita Cliente';
  if(dl.includes('pró-labore')||dl.includes('pro labore')||dl.includes('prolabore')) cat='Pró-Labore';
  if(dl.includes('iof')||dl.includes('tarifa bancaria')||dl.includes('tarifa')) cat='Taxas Bancárias';
  if(dl.includes('imposto')||dl.includes('simples nacional')||dl.includes('dasn')||dl.includes('darf')) cat='Impostos';
  if(dl.includes('fornecedor')) cat='Fornecedores';
  // Receitas (valores positivos)
  if(valor>0){
    if(dl.includes('pix recebido')||dl.includes('transferencia recebida')||dl.includes('recebido')) cat='Receita Cliente';
    if(dl.includes('asaas')||dl.includes('infinitepay')||dl.includes('pagarme')||dl.includes('stone')||dl.includes('cielo')) cat='Receita Cliente';
  }
  return cat;
}

// Parser específico para extrato InfinitePay / CloudWalk (formato tabela com Data por seção)
function parseInfinitePayPDF(allLines){
  var ptMonths={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
  function parsePtDate(s){
    var m=(s||'').match(/(\d{1,2})\s+(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\.?,?\s+(\d{4})/i);
    if(!m) return '';
    var mon=ptMonths[m[2].toLowerCase().substring(0,3)];
    return mon?(m[3]+'-'+String(mon).padStart(2,'0')+'-'+m[1].padStart(2,'0')):'';
  }
  // Matches: [optional date prefix] HH:MM Type Name&Detail -Value
  var TX_RE=/(\d{2}:\d{2})\s+(Cartão|Pix|Boleto|TED|DOC|Transferência)\s+(.*?)\s+(-\d{1,3}(?:\.\d{3})*,\d{2}|-\d+,\d{2})$/i;
  var PT_DATE_RE=/\d{1,2}\s+(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\.?,?\s+\d{4}/i;
  var rows=[];
  var currentDate='';
  var seenTx={}; // deduplication: same date+time+valor = mesma transação
  allLines.forEach(function(line){
    var l=line.trim();
    if(!l) return;
    // Update current date whenever a date is found in the line
    var dm=l.match(PT_DATE_RE);
    if(dm){var pd=parsePtDate(l);if(pd) currentDate=pd;}
    // Try to match as transaction line
    var tm=l.match(TX_RE);
    if(!tm) return;
    var valor=parseExtratoValor(tm[4]);
    if(valor===null) return;
    // Deduplicate: (data + horário + valor) é único por transação
    var txKey=currentDate+'|'+tm[1]+'|'+tm[4];
    if(seenTx[txKey]) return;
    seenTx[txKey]=true;
    var desc=tm[3].trim();
    // Pix transactions: Nome column also starts with "Pix " — remove duplicate
    desc=desc.replace(/^Pix\s+/i,'');
    // Remove known detail suffixes at end
    desc=desc.replace(/\s+(Enviado|Recebido|audenscompany|Pagamento efetuado|Pagamento)\s*$/i,'').trim();
    if(!desc) desc='Transação';
    // Extrato = só saídas. Valores positivos (estornos/entradas) ficam desmarcados
    rows.push({data:currentDate,descricao:desc,valor:valor,sel:valor<0,categoria:autoGuessExtratoCategoria(desc,valor)});
  });
  return rows;
}

async function extratoPDFLoad(input){
  var f=input.files[0];
  if(!f) return;
  var statusEl=document.getElementById('extrato-pdf-status');
  var msgEl=document.getElementById('extrato-pdf-msg');
  function setMsg(m){if(msgEl)msgEl.textContent=m;if(statusEl){statusEl.style.display='flex';}}
  function hideStatus(){if(statusEl)statusEl.style.display='none';}
  setMsg('Carregando leitor de PDF...');
  try{
    // Load PDF.js from CDN if not already loaded
    if(!window.pdfjsLib){
      await new Promise(function(resolve,reject){
        var s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        s.onload=resolve; s.onerror=reject;
        document.head.appendChild(s);
      });
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    setMsg('Lendo o PDF...');
    var buf=await f.arrayBuffer();
    var pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
    setMsg('Extraindo texto ('+pdf.numPages+' página(s))...');
    // Extract text items with positions for each page
    var allLines=[];
    for(var p=1;p<=pdf.numPages;p++){
      var page=await pdf.getPage(p);
      var tc=await page.getTextContent();
      // Group items by y-position (rounded to 3px tolerance)
      var lineMap={};
      tc.items.forEach(function(item){
        if(!item.str.trim()) return;
        var y=Math.round(item.transform[5]/3)*3;
        if(!lineMap[y]) lineMap[y]=[];
        lineMap[y].push({x:item.transform[4],str:item.str});
      });
      // Sort lines top-to-bottom (y desc in PDF coords = top first)
      Object.keys(lineMap).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){
        var line=lineMap[y].sort(function(a,b){return a.x-b.x;}).map(function(i){return i.str;}).join(' ');
        allLines.push(line.trim());
      });
    }
    // Parse lines looking for date + value patterns
    var dateRe=/\b(\d{2}\/\d{2}\/\d{4})\b/;
    var valorRe=/([-+]?\s*R?\$?\s*\d{1,3}(?:\.\d{3})*,\d{2}|[-+]?\s*\d{1,3}(?:\.\d{3})*,\d{2})/;
    _extratoRows=[];
    allLines.forEach(function(line,idx){
      var dm=line.match(dateRe);
      var vm=line.match(valorRe);
      if(!dm||!vm) return;
      var dataStr=parseExtratoData(dm[1]);
      var valor=parseExtratoValor(vm[1]);
      if(valor===null||valor===0) return;
      // Description = line minus the date and value tokens
      var desc=line.replace(dm[0],'').replace(vm[1],'').replace(/\s{2,}/g,' ').trim();
      if(!desc) desc='Transação PDF';
      _extratoRows.push({idx:idx,data:dataStr,descricao:desc,valor:valor,sel:true,categoria:autoGuessExtratoCategoria(desc,valor)});
    });
    // Detect format and parse
    var fullText=allLines.join(' ');
    if(fullText.includes('Tipo de transação')||fullText.includes('tipo de transação')||fullText.includes('InfinitePay')||fullText.includes('infinitepay')){
      _extratoRows=parseInfinitePayPDF(allLines);
    } else {
      // Generic: look for lines with DD/MM/YYYY date + value
      var dateRe2=/\b(\d{2}\/\d{2}\/\d{4})\b/;
      var valorRe2=/([-+]?\s*R?\$?\s*\d{1,3}(?:\.\d{3})*,\d{2}|[-+]?\s*\d{1,3}(?:\.\d{3})*,\d{2})/;
      _extratoRows=[];
      allLines.forEach(function(line,idx){
        var dm2=line.match(dateRe2);
        var vm2=line.match(valorRe2);
        if(!dm2||!vm2) return;
        var dataStr=parseExtratoData(dm2[1]);
        var valor=parseExtratoValor(vm2[1]);
        if(valor===null||valor===0) return;
        var desc=line.replace(dm2[0],'').replace(vm2[1],'').replace(/\s{2,}/g,' ').trim();
        if(!desc) desc='Transação PDF';
        _extratoRows.push({idx:idx,data:dataStr,descricao:desc,valor:valor,sel:true,categoria:autoGuessExtratoCategoria(desc,valor)});
      });
    }
    hideStatus();
    if(!_extratoRows.length){
      alert('Não foi possível extrair transações deste PDF.\n\nDica: tente exportar o extrato como CSV no seu banco e usar a opção de upload CSV.');
      return;
    }
    // Go directly to table step
    renderExtratoTable();
    document.getElementById('extrato-step1').style.display='none';
    var s2=document.getElementById('extrato-step2');
    s2.style.display='flex';
    s2.style.flexDirection='column';
    showSheetToast(_extratoRows.length+' transação(ões) extraída(s) do PDF');
  }catch(e){
    hideStatus();
    alert('Erro ao ler PDF: '+e.message+'\n\nCertifique-se de que o PDF não é uma imagem escaneada (precisa ter texto selecionável).');
  }
}

function parseExtratoValor(s){
  if(!s) return null;
  s=s.trim().replace(/^"+|"+$/g,''); // remove surrounding quotes
  // Remove R$, spaces
  s=s.replace(/R\$\s*/g,'').replace(/\s/g,'');
  var neg=s.startsWith('-');
  s=s.replace(/^[+-]/,'');
  // Brazilian format: dots as thousands, comma as decimal → "1.488,27"
  if(s.indexOf(',')!==-1){
    s=s.replace(/\./g,'').replace(',','.');
  } else {
    s=s.replace(/,/g,'');
  }
  var v=parseFloat(s);
  return isNaN(v)?null:(neg?-v:v);
}

function parseExtratoData(s){
  if(!s) return '';
  s=s.trim().replace(/^"+|"+$/g,'');
  // DD/MM/YYYY or DD-MM-YYYY → YYYY-MM-DD
  var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    var d=m[1].padStart(2,'0'),mo=m[2].padStart(2,'0'),y=m[3].length===2?'20'+m[3]:m[3];
    return y+'-'+mo+'-'+d;
  }
  // Already YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  return '';
}

// Proper CSV parser that handles quoted fields containing commas/newlines
function parseCSVLine(line, sep){
  var cols=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){inQ=!inQ;}
    else if(ch===sep&&!inQ){cols.push(cur.replace(/^"+|"+$/g,'').trim());cur='';}
    else{cur+=ch;}
  }
  cols.push(cur.replace(/^"+|"+$/g,'').trim());
  return cols;
}

// Known column name aliases (lowercase)
var _COL_DATA=['data','date','dt','data da transação'];
var _COL_DESC=['nome','descrição','description','descricao','historico','histórico','estabelecimento','lançamento','lancamento'];
var _COL_VALOR=['valor','value','amount','montante'];
var _COL_DETALHE=['detalhe','detail','tipo','tipo de transação'];

function detectColMap(headers){
  // Returns {dataIdx, descIdx, valorIdx, detalheIdx}
  var map={dataIdx:-1,descIdx:-1,valorIdx:-1,detalheIdx:-1};
  headers.forEach(function(h,i){
    var hl=h.toLowerCase().trim();
    if(map.dataIdx===-1 && _COL_DATA.some(function(k){return hl.includes(k);})) map.dataIdx=i;
    if(map.descIdx===-1 && _COL_DESC.some(function(k){return hl.includes(k);})) map.descIdx=i;
    if(map.valorIdx===-1 && _COL_VALOR.some(function(k){return hl===k||hl.includes(k);})) map.valorIdx=i;
    if(map.detalheIdx===-1 && _COL_DETALHE.some(function(k){return hl.includes(k);})) map.detalheIdx=i;
  });
  return map;
}

function processarExtrato(){
  var raw=(document.getElementById('extrato-csv').value||'').trim();
  if(!raw){ alert('Cole o extrato antes de processar.'); return; }
  var lines=raw.split(/\r?\n/).filter(function(l){return l.trim();});
  // Detect separator: semicolon takes priority; comma if no semicolons
  var sep=raw.indexOf(';')!==-1?';':',';
  _extratoRows=[];

  // Detect header row
  var startLine=0;
  var colMap={dataIdx:-1,descIdx:-1,valorIdx:-1,detalheIdx:-1};
  var firstCols=parseCSVLine(lines[0],sep);
  var isHeader=firstCols.some(function(c){
    var cl=c.toLowerCase();
    return _COL_DATA.concat(_COL_DESC,_COL_VALOR).some(function(k){return cl.includes(k);});
  });
  if(isHeader){
    colMap=detectColMap(firstCols);
    startLine=1;
  }

  lines.slice(startLine).forEach(function(line,idx){
    if(!line.trim()) return;
    var cols=parseCSVLine(line,sep);
    if(cols.length<2) return;

    var dataStr='',desc='',valorStr='',tipoStr='';

    if(colMap.valorIdx!==-1){
      // Use detected column map
      dataStr=colMap.dataIdx!==-1?parseExtratoData(cols[colMap.dataIdx]):'';
      valorStr=colMap.valorIdx!==-1?(cols[colMap.valorIdx]||''):'';
      // Build description: Nome + Detalhe (Mercado Pago style)
      var nomeStr=colMap.descIdx!==-1?(cols[colMap.descIdx]||''):'';
      var detStr=colMap.detalheIdx!==-1?(cols[colMap.detalheIdx]||''):'';
      desc=[nomeStr,detStr].filter(function(s){return s&&s.toLowerCase()!=='enviado'&&s.toLowerCase()!=='recebido'&&s!==nomeStr.split(' ')[0];}).join(' — ');
      if(!desc) desc=nomeStr||detStr;
    } else {
      // Fallback: heuristic detection
      var d0=parseExtratoData(cols[0]);
      if(d0){ dataStr=d0; desc=cols[1]||''; valorStr=cols[cols.length-1]||''; }
      else{ dataStr=''; desc=cols[0]||''; valorStr=cols[cols.length-1]||''; }
    }

    var valor=parseExtratoValor(valorStr);
    if(valor===null) return;
    var cat=autoGuessExtratoCategoria(desc.trim(), valor);
    // Extrato = só saídas. Positivos (estornos) ficam desmarcados por padrão
    _extratoRows.push({ idx:startLine+idx, data:dataStr, descricao:desc.trim(), valor:valor, sel:valor<0, categoria:cat });
  });

  if(!_extratoRows.length){ alert('Nenhuma linha válida encontrada.\n\nFormatos aceitos:\n• Mercado Pago CSV (Data,Hora,Tipo,Nome,Detalhe,Valor)\n• Simples (Data;Descrição;Valor)'); return; }
  renderExtratoTable();
  document.getElementById('extrato-step1').style.display='none';
  var s2=document.getElementById('extrato-step2');
  s2.style.display='flex';
  s2.style.flexDirection='column';
}

function renderExtratoTable(){
  var rows=_extratoRows.map(function(r,i){
    var isSaida=r.valor<0;
    var valFmt=(isSaida?'− ':'+ ')+'R$ '+fmtMoeda(Math.abs(r.valor));
    var valColor=isSaida?'var(--red)':'var(--green)';
    var catOptsRow=FIN_CATS.map(function(c){return '<option value="'+c+'"'+(c===r.categoria?' selected':'')+'>'+c+'</option>';}).join('');
    var catSel='<select onchange="_extratoRows['+i+'].categoria=this.value" style="background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--white);font-size:12px;outline:none;">'+catOptsRow+'</select>';
    var dataFmt=r.data?r.data.split('-').reverse().join('/'):'—';
    return '<tr style="opacity:'+(r.sel?'1':'0.4')+';">'+
      '<td style="width:36px;text-align:center;"><input type="checkbox" '+(r.sel?'checked':'')+' onchange="_extratoRows['+i+'].sel=this.checked;renderExtratoTable();" style="accent-color:var(--purple);"></td>'+
      '<td style="color:var(--muted);font-size:12px;white-space:nowrap;">'+dataFmt+'</td>'+
      '<td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;" title="'+esc(r.descricao)+'">'+esc(r.descricao)+'</td>'+
      '<td style="font-weight:700;color:'+valColor+';font-family:Barlow Condensed,sans-serif;white-space:nowrap;">'+valFmt+'</td>'+
      '<td>'+catSel+'</td>'+
    '</tr>';
  }).join('');
  var selecionadas=_extratoRows.filter(function(r){return r.sel;}).length;
  var wrap=document.getElementById('extrato-table-wrap');
  if(wrap) wrap.innerHTML='<div class="t-scroll"><table><thead><tr>'+
    '<th style="width:36px;"></th><th>Data</th><th>Descrição</th><th>Valor</th><th>Segmento/Categoria</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  var cnt=document.getElementById('extrato-count');
  if(cnt) cnt.textContent=selecionadas+' de '+_extratoRows.length+' linhas selecionadas';
}

async function salvarExtrato(){
  // Extrato = apenas saídas. Entradas sempre vêm do Asaas ou lançamento manual.
  var selecionadas=_extratoRows.filter(function(r){return r.sel;});
  if(!selecionadas.length){ alert('Selecione ao menos uma linha.'); return; }
  var btn=document.querySelector('#modal-extrato .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  var today=new Date().toISOString().split('T')[0];
  var erros=0;
  for(var i=0;i<selecionadas.length;i++){
    var s=selecionadas[i];
    try{
      await fbPush('financeiro/saidas',{
        data:s.data||today, valor:Math.abs(s.valor), descricao:s.descricao||'Importado extrato',
        categoria:s.categoria||'Outros', status:'confirmado',
        criadoPor:(CU&&CU.name)||'gestor', createdAt:Date.now(), _importado:true
      });
    }catch(e){erros++;}
  }
  closeModal('modal-extrato');
  showSheetToast(selecionadas.length+' saída(s) importada(s)'+(erros?' ('+erros+' erros)':'')+'!',erros>0);
  loadFinanceiroData();
}

async function finDeletarLancamento(tipo,id){

async function loadAssinaturas(){
  var el=document.getElementById('assinaturas-body');
  if(!el) return;
  try{
    var data=await fbGet('assinaturas')||{};
    var ids=Object.keys(data);
    if(!ids.length){
      el.innerHTML='<div class="empty-st"><i class="ti ti-signature"></i><p>Nenhum contrato enviado para assinatura ainda.</p></div>';
      return;
    }
    ids.sort(function(a,b){return (data[b].createdAt||0)-(data[a].createdAt||0);});
    var rows=ids.map(function(id){
      var r=data[id];
      var statusBadge = r.status==='assinado'
        ? '<span class="badge b-green">Assinado'+(r.signedAt?(' em '+new Date(r.signedAt).toLocaleDateString('pt-BR')):'')+'</span>'
        : '<span class="badge b-amber">Pendente</span>';

      var pagBadge = r.asaasStatus ? asaasStatusBadge(r.asaasStatus) : '<span style="color:var(--muted);font-size:12px;">-</span>';
      var asaasBtn = !r.asaasStatus
        ? '<button class="btn" style="padding:4px 10px;font-size:12px;background:rgba(139,92,246,0.15);color:var(--purple3);border:1px solid rgba(139,92,246,0.3);" onclick="abrirModalAsaasAssinatura(\''+id+'\')" title="Criar cobrança no Asaas"><i class="ti ti-credit-card"></i> Asaas</button>'
        : '';
      return '<tr>'+
        '<td>'+esc(r.cliente||'-')+'</td>'+
        '<td>'+esc(r.telefone||'-')+'</td>'+
        '<td>'+esc(r.contratoNome||'-')+'</td>'+
        '<td>'+statusBadge+'</td>'+
        '<td>'+pagBadge+'</td>'+
        '<td>'+criado+'</td>'+
        '<td>'+(r.pdfUrl?('<a href="'+r.pdfUrl+'" target="_blank" class="btn btn-outline" style="padding:4px 10px;font-size:12px;"><i class="ti ti-file-text"></i> PDF</a>'):'-')+'</td>'+

      '</tr>';

  }catch(e){
    el.innerHTML='<div style="color:var(--red);font-size:13px;">Erro ao carregar: '+e.message+'</div>';
  }
}

function copiarLinkAssinatura(id,btn){
  var txt=signLinkFor(id);
  function done(){
    var orig=btn.innerHTML;
    btn.innerHTML='<i class="ti ti-check"></i> Copiado!';
    setTimeout(function(){btn.innerHTML=orig;},1200);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(done);
  }else{
    var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);done();
  }
}

var _callLeadSource='daily',_reativacaoLeads=[];
function _getCallLeads(){return _callLeadSource==='reativacao'?(_reativacaoLeads||[]):(getDailyLeads()||[]);}
function reativacaoKey(tel){return(tel||'').replace(/\D/g,'')||'sem_tel';}
function reativacaoVisible(reativ,tel){
  var rec=reativ?reativ[reativacaoKey(tel)]:null;
  if(!rec) return true;
  if(rec.status==='agendou') return false;
  if(rec.status==='retorno'){
    if(!rec.retornoData) return true;
    return Date.now()>=new Date(rec.retornoData+'T00:00:00').getTime();
  }
  var dias=(Date.now()-(rec.ts||0))/86400000;
  if(rec.status==='nao-atendeu') return dias>=7;
  if(rec.status==='sem-interesse') return dias>=60;
  return true;
}
async function saveReativacaoStatus(tel,status,extra){
  try{ await fbSet('reativacoes/'+reativacaoKey(tel),Object.assign({status:status,ts:Date.now(),por:(CU?CU.name:'')},extra||{})); }catch(e){}
}

async function saveCallFinalAsync(){
  var dl=_getCallLeads(),l=dl[_curCallIdx];
  var fromReativacao=_callLeadSource==='reativacao';
  calls[l.telefone]={nome:l.nome,tel:l.telefone,cidade:l.cidade||'',faturamento:l.faturamento||'',data:todayStr(),at:_callData.at,obs:_callData.obs||''};
  var mid='m_'+Date.now();
  var _tuSDR=getUltimaTarefaSDR(null, l.telefone);
  var meeting={id:mid,tel:l.telefone,nome:l.nome,dtISO:_callData.meetingISO,dtDisplay:_callData.meetingDisplay,
    status:'pending',responsavel:_callData.responsavel,guestEmail:_callData.guestEmail||'',faturamentoLead:_callData.faturamento||'',

    tarefaOrigem:_tuSDR?_tuSDR.tipo:'',tarefaOrigemDia:_tuSDR?'Dia '+_tuSDR.dia:''};
  if(fromReativacao){meeting.origem='Recuperacao';}else{meeting.origem='COLDCALL';}
  meetings[mid]=meeting;saveAll();saveMeetingFB(mid,meeting);
  // Grava ligação + reunião no Google Sheets
  saveLigacaoFB(l, _callData, _callData.meetingDisplay||'');
  var btn=document.querySelector('#mc-body .btn-primary');
  if(btn){btn.textContent='Criando...';btn.disabled=true;}
  var result=await createGcalEvent(meeting);
  if(result.success){
    meetings[mid].gcalEventId=result.eventId;meetings[mid].meetLink=result.meetLink;meetings[mid].gcalLink=result.htmlLink;
    saveAll();saveMeetingFB(mid,meetings[mid]);
  }
  // Dispara confirmacao WA APÓS Google Calendar (para incluir o meetLink na mensagem)
  enviarConfirmacaoReuniaoWA(l.telefone, l.nome, _callData.meetingDisplay, _callData.responsavel, (result.success?result.meetLink:null));
  if(fromReativacao){
    await saveReativacaoStatus(l.telefone,'agendou');
    // Registra a nova reuniao na planilha de Reunioes (Origem = Recuperacao) e salva sheetRow
    try{
      var _shRowR=await appendSheetRow(SHEETS_IDS.reunioes, SHEETS_GIDS.reunioes,
        [todayStr(), l.nome, l.telefone, _callData.meetingDisplay||'', 'AGENDADA', ((CU&&CU.closer)||'João').toUpperCase(), (_callData.responsavel||'').toUpperCase(), 'RECUPERAÇÃO']);
      if(_shRowR&&typeof _shRowR==='number'){meetings[mid].sheetRow=_shRowR;saveMeetingFB(mid,meetings[mid]);}
    }catch(e){}
    closeModal('modal-call');_callLeadSource='daily';showPage('reativacao');
    if(result.success) setTimeout(function(){alert('Evento criado!\nMeet: '+(result.meetLink||'(gerado pelo Google)'));},200);
    return;
  }
  // Registra a reuniao agendada via Cold Call (Leads de Hoje) na planilha de Reunioes e salva sheetRow
  try{
    var _shRowC=await appendSheetRow(SHEETS_IDS.reunioes, SHEETS_GIDS.reunioes,
      [todayStr(), l.nome, l.telefone, _callData.meetingDisplay||'', 'AGENDADA', ((CU&&CU.closer)||'').toUpperCase(), (_callData.responsavel||'').toUpperCase(), 'COLDCALL']);
    if(_shRowC&&typeof _shRowC==='number'){meetings[mid].sheetRow=_shRowC;saveMeetingFB(mid,meetings[mid]);}
  }catch(e){}
  if(result.success){
    closeModal('modal-call');showPage('ligar');
    setTimeout(function(){alert('Evento criado!\nMeet: '+(result.meetLink||'(gerado pelo Google)'));},200);
  }else{closeModal('modal-call');showPage('ligar');}
}
async function saveCallFinal(){
  var dl=_getCallLeads(),l=dl[_curCallIdx];
  calls[l.telefone]={nome:l.nome,tel:l.telefone,cidade:l.cidade||'',faturamento:l.faturamento||'',data:todayStr(),at:_callData.at,obs:_callData.obs||''};

      sdrName:((CU&&CU.closer)||'').toUpperCase(),scheduledAt:Date.now(),origem:'COLDCALL',
      tarefaOrigem:_tuSDR2?_tuSDR2.tipo:'',tarefaOrigemDia:_tuSDR2?'Dia '+_tuSDR2.dia:''};
    meetings[mid2]=mtg2;

    enviarConfirmacaoReuniaoWA(l.telefone, l.nome, _callData.meetingDisplay, _callData.responsavel);
    // Registra a reuniao agendada via Cold Call (Leads de Hoje) na planilha de Reunioes e salva sheetRow
    try{
      var _shRowF=await appendSheetRow(SHEETS_IDS.reunioes, SHEETS_GIDS.reunioes,
        [todayStr(), l.nome, l.telefone, _callData.meetingDisplay||'', 'AGENDADA', ((CU&&CU.closer)||'').toUpperCase(), (_callData.responsavel||'').toUpperCase(), 'COLDCALL']);
      if(_shRowF&&typeof _shRowF==='number'){meetings[mid2].sheetRow=_shRowF;saveMeetingFB(mid2,meetings[mid2]);}
    }catch(e){}
  }
  saveAll();
  saveLigacaoFB(l, _callData, _callData.meetingDisplay||'');
  saveCallFB(l.telefone, {nome:l.nome,tel:l.telefone,cidade:l.cidade||'',faturamento:l.faturamento||'',data:todayStr(),at:_callData.at,obs:_callData.obs||''});
  if(_callLeadSource==='reativacao'){
    await saveReativacaoStatus(l.telefone,'sem-interesse');
    closeModal('modal-call');_callLeadSource='daily';showPage('reativacao');return;
  }
  closeModal('modal-call');showPage('ligar');
}
function updateStepDots4(step){

    el.textContent=n<step?'v':String(n);
  });
}

function updateBonusPreview(){
  var prev=document.getElementById('fu-bonus-preview');
  if(!prev)return;
  var tipo=document.getElementById('fu-tipo-valor');
  var mens=calcMensalidadeBase();
  if(tipo&&tipo.value==='mmr'){
    prev.innerHTML='Bonus de venda: $'+(mens*BONUS_VENDA_PCT).toFixed(2)+' ('+Math.round(BONUS_VENDA_PCT*100)+'% da mensalidade)';
  } else {

// Valor mensal usado como base para o bonus de venda: a mensalidade informada (MMR)
// ou o valor total do contrato dividido pela duracao (TCV)
function calcMensalidadeBase(){
  var tipo=document.getElementById('fu-tipo-valor');
  if(tipo&&tipo.value==='mmr'){
    var mensEl=document.getElementById('fu-mensalidade');
    return mensEl?(parseFloat(mensEl.value)||0):0;
  }
  var contratoEl=document.getElementById('fu-contrato');
  var duracaoEl=document.getElementById('fu-duracao');
  var contrato=contratoEl?(parseFloat(contratoEl.value)||0):0;
  var duracao=duracaoEl?(parseFloat(duracaoEl.value)||0):0;
  return duracao>0?(contrato/duracao):0;
}
